name: MediasInRes
options:
  bundleIdPrefix: com.diam0ndnex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MediasInRes:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Content
        buildPhase: resources
    dependencies:
      - target: VokabelWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.mediasinres
        PRODUCT_NAME: MediasInRes
        INFOPLIST_KEY_CFBundleDisplayName: "Medias in Res"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VokabelWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Models.swift
      - path: Content
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Vokabel des Tages
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diam0ndnex.mediasinres.widget
        PRODUCT_NAME: VokabelWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
