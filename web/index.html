"vgl. devastieren (= völlig zerstören)","pos":"Verb"},{"la":"numerus","forms":"numeri m.","de":"Zahl, Anzahl","note":"Nummer; vgl. Numerus clausus","pos":"Nomen"},{"la":"privatus/a/um","forms":"","de":"privat","note":"frz. privé, ital. privato, span. privado","pos":"Adjektiv"},{"la":"publicus/a/um","forms":"","de":"öffentlich","note":"engl. public; vgl. publizieren (= veröffentlichen)","pos":"Adjektiv"},{"la":"fama","forms":"famae f.","de":"1) Gerücht; 2) Ruf","note":"ital. + span. fama; vgl. famos (= großartig)","pos":"Nomen"},{"la":"fama erat","forms":"","de":"es gab das Gerücht","note":"esse kann auch „es gibt“ bedeuten!","pos":"Sonstiges"},{"la":"magnitudo","forms":"magnitudinis f.","de":"Größe","note":"frz. magnitude","pos":"Nomen"},{"la":"ornare","forms":"orno 1, -avi, -atum","de":"schmücken","note":"ital. ornare; vgl. Ornament (= Verzierung)","pos":"Verb"},{"la":"postea (Adv.)","forms":"","de":"später","note":"↔ post (+ Akk.)","pos":"Adverb"},{"la":"appellare","forms":"appello 1, -avi, -atum","de":"1) nennen; 2) rufen","note":"frz. appeler; vgl. Appell (= Aufruf)","pos":"Verb"},{"la":"cupidus/a/um","forms":"(+ Gen.)","de":"gierig (nach)","note":"vgl. cupiditas, -atis","pos":"Adjektiv"},{"la":"cupidus gloriae","forms":"","de":"gierig nach Ruhm","note":"","pos":"Sonstiges"},{"la":"condere","forms":"condo 3, condidi, conditum","de":"gründen","note":"vgl. ab urbe condita (a. u. c.)","pos":"Verb"},{"la":"usque ad (+ Akk.)","forms":"","de":"bis zu","note":"","pos":"Präposition"},{"la":"iussu","forms":"","de":"auf Befehl","note":"vgl. iubere, iussi, iussum","pos":"Sonstiges"},{"la":"Christiani","forms":"Christianorum m.","de":"die Christen","note":"frz. chrétiens, ital. cristiani, span. cristianos","pos":"Nomen"},{"la":"crimen","forms":"criminis n.","de":"1) Verbrechen; 2) Vorwurf","note":"engl. crime, frz. crime, ital. crimine, span. crimen; vgl. Kriminalität, kriminell","pos":"Nomen"},{"la":"accusare","forms":"accuso 1, -avi, -atum","de":"anklagen","note":"engl. to accuse, frz. accuser, ital. accusare","pos":"Verb"},{"la":"quasi","forms":"","de":"gleichsam (als), wie","note":"↔ ital. quasi, span. casi = „fast“!","pos":"Sonstiges"}],"grammar":[{"title":"Konjunktiv im Hauptsatz","blocks":[{"type":"text","text":"Im Gegensatz zum Konjunktiv im Gliedsatz (ut-Sätze, cum-Sätze, indirekte Fragesätze), wo der Konjunktiv ein Zeitverhältnis zum Ausdruck bringt, drückt der Konjunktiv im Hauptsatz a) einen Wunsch, b) eine Möglichkeit oder c) eine Unmöglichkeit aus. Er muss daher übersetzt werden!"},{"type":"table","headers":["","Merkmal","Bedeutung + Übersetzung","Beispiel"],"rows":[["Konj. Präsens","-a- (außer a-Konj.: -e-): amem, moneam, mittam, capiam, audiam","Wunsch/Optativus: „soll“, „möge“; deutscher Konjunktiv 1","Audiatur et(iam) altera pars. = „Es soll/möge auch die andere Seite gehört werden.“"],["Konj. Imperfekt","Infinitiv Präsens aktiv vor der Endung: amarem, monerem, mitterem","Unmöglichkeit/Irrealis Gegenwart: „würde“; deutscher Konjunktiv 2","Si sanus essem, ad te venirem. = „Wenn ich gesund wäre, würde ich zu dir kommen.“"],["Konj. Perfekt","Aktiv: -erim, -eris … -erint; Passiv: PPP + sim, sis … sint","Verbot/Prohibitivus (ne + 2.P.): als verneinter Imperativ","Ne me tetigeris! = „Berühr mich nicht!“ (= Noli me tangere!)"],["Konj. Plusquamperfekt","Aktiv: -issem, -isses … -issent; Passiv: PPP + essem, esses …","Unmöglichkeit/Irrealis der Vergangenheit: „wäre/hätte“ + Mittelwort der Vergangenheit","Si tacuisses, philosophus mansisses. = „Wenn du geschwiegen hättest, wärest du ein Philosoph geblieben.“"]]}]},{"title":"Konditionalsätze (Bedingungssätze)","blocks":[{"type":"text","text":"Bedingungssätze werden mit si („wenn“, „falls“) oder nisi („wenn nicht“, „falls nicht“) eingeleitet. Steht in ihnen ein Konjunktiv, muss er übersetzt werden, und zwar nach den Regeln des Konjunktivs im Hauptsatz:"},{"type":"list","items":["si + Konj. Imperfekt (Irrealis der Gegenwart: eine Situation kann jetzt unmöglich eintreten): „würde“ oder Konj. 2: Si Iulia Quintum amaret, ille felix esset. = „Wenn Julia Quintus lieben würde (liebte), wäre jener glücklich.“ (→ aber Julia liebt Quintus nicht)","si + Konj. Plqpf. (Irrealis der Vergangenheit: eine Situation konnte früher unmöglich eintreten): „wäre / hätte“ (+ Mittelwort der Vght.): Si Iulia Quintum amavisset, ille felix fuisset. = „Wenn Julia Quintus geliebt hätte, wäre jener glücklich gewesen.“ (→ aber Julia hat Quintus nicht geliebt)"]}]},{"title":"Übersicht: Konjunktivübersetzung","blocks":[{"type":"table","headers":["Der lateinische Konjunktiv …","wo?"],"rows":[["muss übersetzt werden","in Hauptsätzen; in Konditionalsätzen"],["kann übersetzt werden","in ut-Sätzen (Ausnahme: Folge-ut „sodass“); in indirekten Fragesätzen"],["darf nicht übersetzt werden","in cum-Sätzen; in Folge-ut-Sätzen („sodass“)"]]}]}]},{"number":27,"title":"De martyrio sancti Petri","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"sanctus/a/um","forms":"","de":"heilig","note":"engl. saint, frz. saint; vgl. Sankt Stefan (etc.)","pos":"Adjektiv"},{"la":"cultus","forms":"cultus m.","de":"Verehrung","note":"vgl. Kult (= religiöse Verehrung)","pos":"Nomen"},{"la":"dubitare","forms":"dubito 1, -avi, -atum","de":"1) zögern; 2) zweifeln","note":"engl. to doubt, ital. dubitare, span. dudar","pos":"Verb"},{"la":"commovere","forms":"commoveo 2, commovi, commotum","de":"1) (heftig) bewegen; 2) veranlassen","note":"vgl. movere","pos":"Verb"},{"la":"fuga","forms":"fugae f.","de":"Flucht","note":"vgl. fugere; Refugium (= Zufluchtsort), Zentrifuge","pos":"Nomen"},{"la":"proximus/a/um","forms":"","de":"der nächste","note":"frz. prochain, ital. prossimo, span. próximo","pos":"Adjektiv"},{"la":"repente (Adv.)","forms":"","de":"plötzlich","note":"= subito; span. de repente","pos":"Adverb"},{"la":"obviam (Adv.)","forms":"","de":"entgegen","note":"","pos":"Adverb"},{"la":"videtur (+ Inf.)","forms":"","de":"er/sie/es scheint","note":"(NCI, siehe Grammatica)","pos":"Sonstiges"},{"la":"dominus","forms":"domini m.","de":"Herr","note":"vgl. dominieren","pos":"Nomen"},{"la":"quo","forms":"","de":"wohin","note":"↔ eo","pos":"Sonstiges"},{"la":"vadere","forms":"vado 3, –","de":"gehen","note":"vgl. Invasion (= kriegerischer Einmarsch)","pos":"Verb"},{"la":"dicitur (+ Inf.)","forms":"","de":"er/sie/es soll (angeblich)","note":"(NCI, siehe Grammatica)","pos":"Sonstiges"},{"la":"lacrima","forms":"lacrimae f.","de":"Träne","note":"frz. larme, ital. lacrima","pos":"Nomen"},{"la":"referre","forms":"refero, rettuli, relatum","de":"1) zurückbringen; 2) berichten","note":"vgl. referieren, Referent","pos":"Verb"},{"la":"sic","forms":"","de":"so","note":"= ita, tam","pos":"Sonstiges"},{"la":"salus","forms":"salutis f.","de":"1) Heil, Rettung; 2) Gruß","note":"vgl. salutieren; Salut!","pos":"Nomen"},{"la":"mundus","forms":"mundi m.","de":"Welt","note":"frz. monde, ital. mondo, span. mundo; vgl. Minimundus","pos":"Nomen"},{"la":"dignus/a/um","forms":"(+ Abl.)","de":"würdig (+ Gen.)","note":"ital. degno, frz. digne, span. digno; vgl. engl. dignity","pos":"Adjektiv"}],"grammar":[{"title":"Infinitiv Präsens passiv","blocks":[{"type":"text","text":"Der Infinitiv Präsens passiv endet bei der a-, e- und i-Konjugation auf -ri, bei den übrigen auf -i:"},{"type":"table","headers":["a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj."],"rows":[["amari „geliebt zu werden“","moneri „ermahnt zu werden“","mitti „geschickt zu werden“","audiri „gehört zu werden“","capi „gefangen zu werden“"]]}]},{"title":"Partizip Futur und Infinitiv Futur aktiv","blocks":[{"type":"text","text":"Im Lateinischen gibt es auch ein Partizip Futur. Es wird vom PPP gebildet, wobei die Endung -us/a/um durch -urus/a/um ersetzt wird: amatus/a/um → amaturus/a/um, monitus/a/um → moniturus/a/um, missus/a/um → missurus/a/um (etc.)"},{"type":"text","text":"Verwendet wird das Partizip Futur vor allem in Kombination mit esse zur Bildung des Infinitivs Futur aktiv: amaturum esse, moniturum esse, dicturum esse."},{"type":"text","text":"Der Infinitiv Futur aktiv kommt fast nur im ACI vor. Wie beim Infinitiv Perfekt passiv muss dabei die Endung des Partizips mit dem Subjektsakkusativ übereingestimmt werden:"},{"type":"list","items":["Quintus amicos mox venturos esse sperat. = „Quintus hofft, dass die Freunde bald kommen werden.“","Quintus amicas mox venturas esse sperat. = „Quintus hofft, dass die Freundinnen bald kommen werden.“"]}]},{"title":"Überblick: alle Infinitive","blocks":[{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj."],"rows":[["Präsens aktiv","amare","monere","mittere","audire","capere"],["Präsens passiv","amari","moneri","mitti","audiri","capi"],["Perfekt aktiv","amavisse","monuisse","misisse","audivisse","cepisse"],["Perfekt passiv","amatum esse","monitum esse","missum esse","auditum esse","captum esse"],["Futur aktiv","amaturum esse","moniturum esse","missurum esse","auditurum esse","capturum esse"]]},{"type":"note","text":"Der Infinitiv Präsens ist gleichzeitig (→ Handlung zugleich mit der Haupthandlung). Der Infinitiv Perfekt ist vorzeitig (→ Handlung vor der Haupthandlung). Der Infinitiv Futur ist nachzeitig (→ Handlung nach der Haupthandlung)."}]},{"title":"Nominativus cum infinitivo (NCI)","blocks":[{"type":"text","text":"Bei einigen Verba steht im Passiv der NCI, die Verbindung eines Nominativs mit einem Infinitiv:"},{"type":"list","items":["dicitur / dicuntur + NCI = „er/sie/es soll“ (Sg.) / „sie sollen“ (Pl.); „man sagt, dass er/sie/es …“","videtur / videntur + NCI = „er/sie/es scheint“ (Sg.) / „sie scheinen“ (Pl.); „es scheint, dass er/sie/es …“"]},{"type":"text","text":"Beispiele:"},{"type":"list","items":["Christus respondisse dicitur. = 1) „Christus soll geantwortet haben.“ 2) „Man sagt, dass Christus geantwortet hat.“","Christus ei obviam venire videbatur. = 1) „Christus schien ihm entgegenzukommen.“ 2) „Es schien, dass Christus ihm entgegenkam.“"]}]},{"title":"Dativ des Interesses (Dativus commodi)","blocks":[{"type":"text","text":"Wenn ein Dativ ausdrückt, wofür oder für wen etwas geschieht, wird er mit „für“ übersetzt:"},{"type":"list","items":["Fugere Petro difficile non erat. = „Zu flüchten war für Petrus nicht schwer.“","Non scholae, sed vitae discimus. = „Nicht für die Schule, sondern fürs Leben lernen wir.“"]}]}]},{"number":28,"title":"De Marco Aurelio","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"dividere","forms":"divido 3, divisi, divisum","de":"trennen, teilen","note":"engl. to divide; vgl. dividieren, Division","pos":"Verb"},{"la":"transire","forms":"transeo, transii, transitum","de":"überqueren, hinübergehen","note":"aus: trans + ire; vgl. Transitverkehr","pos":"Verb"},{"la":"gens","forms":"gentis f.","de":"Volk","note":"frz. gens, ital. + span. gente (= Leute); ↔ genus, -eris n.","pos":"Nomen"},{"la":"traducere","forms":"traduco 3, traduxi, traductum","de":"hinüberführen","note":"aus: trans + ducere","pos":"Verb"},{"la":"adhuc (Adv.)","forms":"","de":"bis jetzt; bisher","note":"","pos":"Adverb"},{"la":"felix (m./f./n.)","forms":"felicis (2.F.)","de":"glücklich, erfolgreich","note":"ital. felice, span. feliz; vgl. frz. félicité","pos":"Adjektiv"},{"la":"fortuna","forms":"fortunae f.","de":"1) Glück; 2) Schicksal","note":"engl. + frz. fortune, ital. + span. fortuna","pos":"Nomen"},{"la":"eques","forms":"equitis m.","de":"Reiter; Ritter","note":"↔ equus, -i","pos":"Nomen"},{"la":"campus","forms":"campi m.","de":"Feld","note":"frz. champ; vgl. Camping, der Uni-Campus","pos":"Nomen"},{"la":"aestas","forms":"aestatis f.","de":"Sommer","note":"frz. été, ital. estate; ↔ aetas, -atis f.","pos":"Nomen"},{"la":"deesse","forms":"desum, dees, defui, –","de":"fehlen","note":"wörtl.: „weg sein“","pos":"Sonstiges"},{"la":"fessus/a/um","forms":"","de":"erschöpft, müde","note":"","pos":"Adjektiv"},{"la":"vix (Adv.)","forms":"","de":"kaum","note":"","pos":"Adverb"},{"la":"ullus/a/um","forms":"ullius (2.F.), ulli (3.F.)","de":"irgendein(e)","note":"↔ nullus","pos":"Adjektiv"},{"la":"spes","forms":"spei f.","de":"Hoffnung","note":"frz. espoir, ital. speranza, span. esperanza; vgl. sperare","pos":"Nomen"},{"la":"rogare","forms":"rogo 1, -avi, -atum","de":"1) bitten; 2) fragen","note":"vgl. interrogare","pos":"Verb"},{"la":"divinus/a/um","forms":"","de":"göttlich","note":"engl. divine, frz. divin, ital. + span. divino; vgl. Diva","pos":"Adjektiv"},{"la":"ecce!","forms":"","de":"siehe!","note":"","pos":"Sonstiges"},{"la":"miraculum","forms":"miraculi n.","de":"Wunder","note":"engl. miracle; vgl. Mirakel, Miraculix (Zauberer!)","pos":"Nomen"},{"la":"accidere","forms":"accido 3, accidi, –","de":"geschehen","note":"vgl. engl. accident","pos":"Verb"}],"grammar":[{"title":"Partizip Präsens aktiv (PPA)","blocks":[{"type":"text","text":"Das Partizip Präsens (erstes Mittelwort) wird vom Präsensstamm gebildet und ist an der Silbe -ns (1.F. Sg.) bzw. -nt- (übrige Fälle) zu erkennen. Es dekliniert wie die Mischstämme:"},{"type":"table","headers":["Fall","Sg. m. + f.","Sg. n.","Pl. m. + f.","Pl. n."],"rows":[["1/5","amans","amans","amantes","amantia"],["2","amantis","amantis","amantium","amantium"],["3","amanti","amanti","amantibus","amantibus"],["4","amantem","amans","amantes","amantia"],["6","amante","amante","amantibus","amantibus"]]},{"type":"text","text":"Ebenso: monens, -entis; mittens, -entis; audiens, -entis; capiens, -entis; PPA von ire: iens, euntis."},{"type":"text","text":"Übersetzung: Das Partizip Präsens ist aktiv und gleichzeitig: amans = „liebend“ (= „einer, der liebt“); „ein Liebender“."},{"type":"text","text":"Verwendung:"},{"type":"list","items":["als Adjektiv: Christiani orantes = „die betenden Christen“","als Nomen: orantes = „die Betenden“","als Participium coniunctum (siehe unten)"]}]},{"title":"Participium coniunctum (PC)","blocks":[{"type":"text","text":"Unter dem Participium coniunctum („verbundenes Partizip“) versteht man ein Partizip, das"},{"type":"list","items":["mit einem Nomen übereingestimmt ist,","nicht unmittelbar neben diesem Nomen steht, sondern eine Sperrung (= Klammer) bildet."]},{"type":"text","text":"Da die wörtliche Übersetzung in solchen Fällen meist nicht wirklich „deutsch“ klingt, musst du eine solche Sperrung auflösen, und zwar am besten in einen Relativsatz:"},{"type":"list","items":["Christiani ad deum suum orantes e periculis servati sunt. = (Die Christen, zu ihrem Gott betend, wurden aus Gefahren gerettet. =) „Die Christen, die zu ihrem Gott beteten, wurden aus Gefahren gerettet.“"]},{"type":"text","text":"Der Relativsatz ist die einfachste Möglichkeit, ein Participium coniunctum zu übersetzen. Weitere Möglichkeiten: mit „als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional) oder als Hauptsatz mit „und“ (beiordnend)."},{"type":"text","text":"Bei der Übersetzung von Sperrungen musst du auf die Art des Partizips achten:"},{"type":"table","headers":["","Merkmal","Eigenschaften","Beispiel"],"rows":[["Partizip Präsens (PPA)","-ns, -ntis (3. Dekl.)","aktiv + gleichzeitig","amans = „einer, der liebt“"],["Partizip Perfekt (PPP)","-tus/-sus (a/o-Dekl.)","passiv + vorzeitig","amatus/a/um = „einer, der geliebt worden ist“"],["Partizip Futur (PFA)","-urus (a/o-Dekl.)","aktiv + nachzeitig","amaturus/a/um = „einer, der lieben wird“"]]},{"type":"list","items":["PPA (→ gleichzeitig): Im Relativsatz steht dieselbe Zeit wie im übergeordneten Satz (Beispiel siehe oben).","PPP (→ vorzeitig): Die Zeit im Relativsatz liegt eine Zeitstufe vor der Zeit im übergeordneten Satz: Romani ab hostibus inclusi (PPP) magno in periculo erant. (Imperfekt) = „Die Römer, die von den Feinden eingeschlossen worden waren (Plqpf.), befanden sich in großer Gefahr.“","PFA (→ nachzeitig): Das Futurpartizip kommt nur selten als PC vor; es bezeichnet dann den Zweck einer Handlung (finale Bedeutung) und wird mit „um zu …“ übersetzt: Marcus Aurelius Danuvium transiit Germanos victurus. = „Mark Aurel überquerte die Donau, um die Germanen zu besiegen.“"]}]}]},{"number":29,"title":"De Constantino victore","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"victor","forms":"victoris m.","de":"siegreich; Sieger","note":"vgl. Viktor; ↔ victoria, -ae","pos":"Nomen"},{"la":"civilis/e","forms":"","de":"bürgerlich; Bürger-","note":"vgl. zivil; engl. + frz. civil, ital. civile, span. civil","pos":"Adjektiv"},{"la":"metuere","forms":"metuo 3, metui, –","de":"fürchten","note":"vgl. metus, -us","pos":"Verb"},{"la":"oraculum","forms":"oraculi n.","de":"Orakel(spruch)","note":"frz. oracle, ital. oracolo, span. oráculo","pos":"Nomen"},{"la":"extra (+ Akk.)","forms":"","de":"außerhalb","note":"vgl. E.T. (= Extraterrestris), das Extra, extravagant","pos":"Präposition"},{"la":"uterque, utraque, utrumque","forms":"utriusque (2.F.), utrique (3.F.)","de":"jeder von beiden, beide","note":"Pronominale Deklination","pos":"Sonstiges"},{"la":"notus/a/um","forms":"","de":"bekannt","note":"↔ ignotus/a/um","pos":"Adjektiv"},{"la":"signum","forms":"signi n.","de":"Zeichen","note":"engl. sign, frz. signe; vgl. Signal, signieren","pos":"Nomen"},{"la":"scribere","forms":"scribo 3, scripsi, scriptum","de":"schreiben","note":"frz. écrire, ital. scrivere, span. escribir; vgl. Skriptum, Manuskript","pos":"Verb"},{"la":"prope (+ Akk.)","forms":"","de":"nahe bei","note":"vgl. ap-propinquare","pos":"Präposition"},{"la":"pons","forms":"pontis m.","de":"Brücke","note":"vgl. Pontifex maximus (= der Papst)","pos":"Nomen"},{"la":"plebs","forms":"plebis f.","de":"(niedriges) Volk","note":"vgl. Plebiszit (= Volksabstimmung)","pos":"Nomen"},{"la":"causa","forms":"causae f.","de":"Grund, Ursache","note":"vgl. Kausalsatz (= Begründungssatz)","pos":"Nomen"},{"la":"qua de causa","forms":"","de":"1) deshalb; 2) weshalb","note":"wörtl.: „aus welchem Grund“","pos":"Sonstiges"},{"la":"consulere","forms":"consulo 3, consului, consultum","de":"befragen, um Rat fragen","note":"vgl. konsultieren, Konsul (= „Berater“)","pos":"Verb"},{"la":"nuntiare","forms":"nuntio 1, -avi, -atum","de":"melden","note":"vgl. nuntius, -i","pos":"Verb"},{"la":"hodie (Adv.)","forms":"","de":"heute","note":"aus: hoc + die","pos":"Adverb"},{"la":"adducere","forms":"adduco 3, adduxi, adductum","de":"1) hinführen; 2) veranlassen","note":"vgl. adductus/a/um","pos":"Verb"},{"la":"studium","forms":"studii n.","de":"Eifer, Begeisterung","note":"vgl. Studium; vgl. studere","pos":"Nomen"},{"la":"premere","forms":"premo 3, pressi, pressum","de":"1) drücken; 2) bedrängen","note":"vgl. pressen; frz. presser; vgl. engl. pressure","pos":"Verb"},{"la":"pellere","forms":"pello 3, pepuli, pulsum","de":"schlagen, stoßen","note":"vgl. Puls; vgl. expellere","pos":"Verb"}],"grammar":[{"title":"Ablativus absolutus (Abl. abs.)","blocks":[{"type":"text","text":"Der Ablativus absolutus (Abl. abs., „losgelöster Ablativ“) besteht a) aus einem Nomen oder Pronomen im Ablativ und b) einem damit übereingestimmten Partizip (Präsens oder Perfekt)."},{"type":"text","text":"Diese Wortgruppe darf nicht wörtlich übersetzt werden, sondern muss zu einem Gliedsatz (meist einem Temporalsatz) umgeformt werden. Dabei gelten folgende Faustregeln:"},{"type":"list","items":["PARTIZIP PRÄSENS (PPA): gleichzeitig (+ aktiv) – „während“: Constantino ipso pugnante Maxentius Romam relinquere metuit. = „Während Konstantin selbst kämpfte, scheute sich Maxentius, Rom zu verlassen.“","PARTIZIP PERFEKT (PPP): vorzeitig (+ passiv) – „nachdem“: Ponte interrupto Maxentius Tiberim transire non potuit. = „Nachdem die Brücke eingerissen worden war, konnte Maxentius den Tiber nicht überqueren.“"]},{"type":"text","text":"Vorgangsweise beim Übersetzen:"},{"type":"list","items":["1) Suche zu jedem Partizip das Bezugswort (steht meist davor) und unterstreiche die beiden Wörter: z. B.: Libro in schola lecto discipuli dormiverunt.","2) Wenn die beiden Wörter im Ablativ stehen, handelt es sich um einen Abl. abs. → keine wörtliche Übersetzung! (falls anderer Fall → Participium coniunctum)","3) Bestimme die Art des Partizips und verwandle die unterstrichene Wortgruppe in einen Temporalsatz (PPA → „während“ + aktiv, PPP → „nachdem“ + passiv): z. B.: „Nachdem das Buch in der Schule gelesen worden war, schliefen die Schüler ein.“","4) Wenn der Satz passiv nicht „deutsch“ klingt, verwandle ihn in einen aktiven Satz: z. B.: „Nachdem sie das Buch in der Schule gelesen hatten, schliefen die Schüler ein.“"]},{"type":"note","text":"Statt eines Nomens kann im Abl. abs. auch ein Pronomen stehen: Quo (= hoc) viso Maxentius fugit. = „Nachdem das gesehen worden war, floh Maxentius.“ (besser aktiv: „Nachdem er das gesehen hatte, …“)"}]},{"title":"Zusammenfassung: Participium coniunctum und Ablativus absolutus","blocks":[{"type":"table","headers":["","Participium coniunctum","Ablativus absolutus"],"rows":[["besteht aus","Nomen + Partizip","Nomen + Partizip"],["steht im","1. bis 6. Fall (im Ablativ nur nach Präpositionen)","6. Fall (ohne Präposition)"],["Erstübersetzung","„der/die/das“ (Relativsatz)","„während“ bei PPA; „nachdem“ bei PPP"],["Weitere Übersetzungsmöglichkeiten","„als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional)","„als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional)"]]},{"type":"note","text":"Participium coniunctum und Ablativus absolutus sind sogenannte „satzwertige Konstruktionen“ (sK). Diese Partizip-Konstruktionen sind im Lateinischen nur Satzteile, werden im Deutschen aber als Gliedsätze wiedergegeben. Weitere satzwertige Konstruktionen sind die Infinitivkonstruktionen ACI und NCI, die im Deutschen als „dass“-Sätze, also ebenfalls als Gliedsätze, übersetzt werden."}]}]},{"number":30,"title":"De beneficio sancti Martini","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"beneficium","forms":"beneficii n.","de":"Wohltat","note":"vgl. Benefizveranstaltung; aus: bene + facere","pos":"Nomen"},{"la":"hiems","forms":"hiemis f.","de":"Winter","note":"","pos":"Nomen"},{"la":"pauper (m./f./n.)","forms":"pauperis (2.F.)","de":"arm","note":"frz. pauvre, ital. povero, span. pobre","pos":"Adjektiv"},{"la":"vestis","forms":"vestis f.","de":"Gewand","note":"ital. vestiti; vgl. Weste, Transvestit, Investitur","pos":"Nomen"},{"la":"pati (D)","forms":"patior M, passus sum","de":"1) ertragen; 2) erleiden","note":"vgl. passiv, Patient, Passion (= Leidensgeschichte)","pos":"Verb"},{"la":"misericordia","forms":"misericordiae f.","de":"Mitleid","note":"ital. misericordia; vgl. miser","pos":"Nomen"},{"la":"nudus/a/um","forms":"","de":"nackt","note":"frz. nu, ital. nudo, span. desnudo; vgl. Nudist","pos":"Adjektiv"},{"la":"reliquus/a/um","forms":"","de":"übrig","note":"↔ relictus (PPP von relinquere)","pos":"Adjektiv"},{"la":"similis/e","forms":"","de":"ähnlich","note":"engl. similar, ital. simile, frz. similaire, span. similar; vgl. As-similation („Anpassung“)","pos":"Adjektiv"},{"la":"militaris/e","forms":"","de":"militärisch, Militär-","note":"↔ miles, -itis","pos":"Adjektiv"},{"la":"alter/era/erum","forms":"alterius (2.F.), alteri (3.F.)","de":"der andere (von zweien)","note":"vgl. Alternative, das Alter Ego (= zweites Ich), Altruismus (= Selbstlosigkeit)","pos":"Adjektiv"},{"la":"alter – alter","forms":"","de":"der eine – der andere","note":"","pos":"Sonstiges"},{"la":"mens","forms":"mentis f.","de":"Geist, Verstand, Sinn","note":"vgl. mental, Mentalität (= Geisteshaltung)","pos":"Nomen"},{"la":"sanus/a/um","forms":"","de":"gesund; vernünftig","note":"engl. sane; vgl. Sanitäter; SPA","pos":"Adjektiv"},{"la":"queri (D)","forms":"queror 3, questus sum","de":"klagen","note":"↔ quaerere, quaesivi, quaesitum","pos":"Verb"},{"la":"humanus/a/um","forms":"","de":"menschlich","note":"engl. human, frz. humain; vgl. Humanbiologie","pos":"Adjektiv"},{"la":"possidere","forms":"possideo 2, possedi, possessum","de":"besitzen","note":"engl. to possess; vgl. Possessivpronomen (= besitzanzeigendes Fürwort, z. B. „mein“ etc.)","pos":"Verb"},{"la":"sequi (D)","forms":"sequor 3, secutus sum","de":"folgen","note":"vgl. Sequenz (= Abfolge); Con-secutio temporum","pos":"Verb"},{"la":"sequor te (Akk.!)","forms":"","de":"ich folge dir (Dativ!)","note":"","pos":"Sonstiges"},{"la":"tegere","forms":"tego 3, texi, tectum","de":"bedecken","note":"vgl. Toga (= Körperbedeckung!)","pos":"Verb"},{"la":"loqui (D)","forms":"loquor 3, locutus sum","de":"sprechen","note":"vgl. eloquent (= redegewandt)","pos":"Verb"},{"la":"vereri (D)","forms":"vereor 2, veritus sum","de":"1) fürchten; 2) sich scheuen","note":"vereri = timere / metuere","pos":"Verb"},{"la":"quidquid","forms":"","de":"was auch immer; alles was","note":"","pos":"Sonstiges"},{"la":"hortari (D)","forms":"hortor 1, hortatus sum","de":"auffordern, ermuntern","note":"","pos":"Verb"},{"la":"servire","forms":"servio 4, -ivi, -itum","de":"dienen","note":"frz. + span. servir; vgl. servieren; ↔ servare","pos":"Verb"}],"grammar":[{"title":"Deponentia","blocks":[{"type":"text","text":"Deponentia sind Verba mit passiver Form, aber aktiver Bedeutung. Der Name Deponentia kommt vom Verbum deponere („ablegen“), da man meinte, diese Wörter hätten ihre aktiven Formen (bzw. passiven Bedeutungen) abgelegt. Entstanden sind Deponentia aus dem sogenannten „Medium“, einem Mittelding zwischen Aktiv und Passiv."},{"type":"tip","text":"Ob ein Wort ein Deponens ist, kann man nicht „erraten“, sondern muss man lernen! Im Wörterbuch erkennst du ein Deponens daran, dass der Infinitiv nicht aktiv (auf -re), sondern passiv (auf -ri oder -i) angegeben ist (z. B. hortari 1, hortatus sum)! Deponentia gibt es übrigens von allen Konjugationen."},{"type":"text","text":"Am Beispiel von loqui (konsonantische Konjugation):"},{"type":"table","headers":["Präsens","Form passiv!","Übersetzung aktiv!"],"rows":[["Sg. 1.P.","loquor","„ich spreche“"],["Sg. 2.P.","loqueris","„du sprichst“"],["Sg. 3.P.","loquitur","„er/sie spricht“"],["Pl. 1.P.","loquimur","„wir sprechen“"],["Pl. 2.P.","loquimini","„ihr sprecht“"],["Pl. 3.P.","loquuntur","„sie sprechen“"],["Sonstige Formen","Form","Übersetzung"],["Infinitiv Präsens","loqui","„(zu) sprechen“"],["Infinitiv Perfekt","locutum esse","„gesprochen (zu) haben“"],["Infinitiv Futur","locuturum esse","(„sprechen werden“)"],["Partizip Präsens","loquens, -entis","„sprechend“"],["Partizip Perfekt","locutus/a/um","(„gesprochen habend“)"],["Partizip Futur","locuturus/a/um","(„sprechen werdend“)"],["Imperativ Sg.","loquere!","„sprich!“"],["Imperativ Pl.","loquimini!","„sprecht!“"]]},{"type":"note","text":"Der Imperativ Plural (loquimini!) ist identisch mit der 2.P. Pl. Präsens (loquimini = „ihr sprecht“)."}]},{"title":"Gerund","blocks":[{"type":"text","text":"Das Gerund erkennt man an der Buchstabengruppe -nd-. Je nachdem, ob das Gerund mit einem Nomen übereingestimmt ist oder nicht, spricht man von Gerundium oder Gerundivum:"},{"type":"list","items":["nicht übereingestimmt (= Nomen) → Gerundium (Deklination wie pensum, -i n.)","übereingestimmt (= Adjektiv) → Gerundivum („Gerundivum pro gerundio“, Deklination wie bonus/a/um)"]},{"type":"table","headers":["Fall","Gerundium (Nomen!)","Gerundivum (Adjektiv!)"],"rows":[["1.F.","(legere = „das Lesen“; „zu lesen“)","(legere = „das Lesen“; „zu lesen“)"],["2.F.","a) legendi = „des Lesens“ / „zu lesen“; b) legendi causa = „um zu lesen“","libri legendi = („des Buchlesens“), „ein Buch zu lesen“; libri legendi causa = „um ein Buch zu lesen“"],["3.F.","(im Dativ kommt das Gerund kaum vor)","(im Dativ kommt das Gerund kaum vor)"],["4.F.","ad legendum = „um zu lesen“","ad librum legendum = „um ein Buch zu lesen“"],["6.F.","a) legendo = „durch das Lesen“; b) in legendo = „beim Lesen“","libro legendo = „durch das Lesen eines Buches“; in libro legendo = „beim Lesen eines Buches“"]]},{"type":"text","text":"Im Gegensatz zum Gerundium kommt das Gerundiv in allen drei Geschlechtern und auch im Plural vor: ad libros legendos (= librorum legendorum causa) = „um die Bücher zu lesen“."}]},{"title":"„müssen“-Gerundiv (prädikatives Gerundiv)","blocks":[{"type":"text","text":"Tritt ein Gerundiv kombiniert mit einer Form von esse auf, hat es eine gänzlich andere Bedeutung als oben: Es drückt aus, dass etwas gemacht werden muss. Als Erstübersetzung kannst du aber, so wie oben, den Infinitiv („zu“) wählen, danach forme den Satz zu einem „müssen“-Satz um:"},{"type":"list","items":["Mihi hic liber legendus est. = (Mir ist dieses Buch zu lesen. →) „Ich muss dieses Buch lesen.“","Mihi legendum est. = (Mir ist zu lesen. →) „Ich muss lesen.“","Mihi legendum non est. = (Mir ist nicht zu lesen. →) „Ich darf nicht lesen.“ (vgl. engl. I must not read.)"]},{"type":"note","text":"Der Dativ, der beim prädikativen Gerundiv angibt, wer etwas tun muss, heißt Dativus auctoris (Dativ der handelnden Person). Er wird im Deutschen zum Nominativ (Subjekt) des Satzes!"}]}]}];

const dayKey = d => { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); };
const INTERVAL = { 1: 0, 2: 1, 3: 3, 4: 7, 5: 14 };

  s.lastSeen = Date.now();
  if (ok) { s.right++; s.box = Math.min(Math.max(s.box, 1) + 1, 5); } else { s.wrong++; s.box = 1; s.lastWrong = Date.now(); }

const isDue = v => { const s = st(v); if (!s.box || !s.lastSeen) return false; return Date.now() - s.lastSeen >= INTERVAL[s.box] * 864e5 - 36e5; };
const dueCount = () => ALL.filter(isDue).length;

function norm(s) {
  let t = s.toLowerCase().replace(/[0-9]\)/g, " ");
  for (const j of ["er/sie/es ", "er/sie ", "(", ")", "!", "?", "„", "“", '"', ".", "…", "(zu)", "sich "]) t = t.split(j).join(" ");
  return t.replace(/\s+/g, " ").trim();
}
const meanings = s => s.replace(/ \/ /g, ",").split(/[,;]/).map(norm).filter(Boolean);
function lev(a, b) { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = [...Array(n + 1).keys()];
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; }

  const i = norm(input); if (!i) return false;
  for (const o of [...meanings(target), norm(target)]) { if (o === i) return true;
    if (P.s.tolerant && lev(o, i) <= (o.length > 7 ? 2 : o.length > 4 ? 1 : 0)) return true; }

let tab = "lessons"; const stacks = {};
const mainEl = document.getElementById("main");
function current() { const s = stacks[tab]; return s[s.length - 1]; }
function render() {
  const v = current(); const s = stacks[tab];
  if (mainEl.cleanup) { try { mainEl.cleanup(); } catch (e) {} mainEl.cleanup = null; }
  document.getElementById("title").textContent = s.length > 1 ? v.title : "";

}
function push(title, fn) { current().scroll = window.scrollY; stacks[tab].push({ title, fn }); render(); }
function replace(title, fn) { stacks[tab][stacks[tab].length - 1] = { title, fn }; render(); }
function pop() { if (stacks[tab].length > 1) { stacks[tab].pop(); render(); } }
function switchTab(t) { if (t === tab && stacks[t].length > 1) { stacks[t] = stacks[t].slice(0, 1); } else current().scroll = window.scrollY; tab = t; render(); }

for (const [k, , ] of TABS) stacks[k] = [{ title: ROOTS[k][0], fn: ROOTS[k][1] }];

    ["🏛️", "Halbzeit", "Lektion 1–15 zu 80 %", rng(1, 15)], ["🌿", "Veni, vidi, vici", "Alle 30 Lektionen zu 80 %", rng(1, 30)],
    ["🎓", "Summa cum laude", "Schularbeit mit Note 1", bestGrade === 1], ["⚡", "Blitzmerker", "30 richtige in einer Blitzrunde", best >= 30]];
  return `<div class="tiny" style="padding:12px 14px 0">${B.filter(b => b[3]).length} von ${B.length} freigeschaltet</div><div class="badges">${B.map(([i, t, d, on]) => `<div class="badge ${on ? "on" : ""}"><div class="c">${i}</div><b>${t}</b><div class="tiny">${d}</div></div>`).join("")}</div>`;
}

// ---------- Einstellungen ----------
function settingsTab(el) {
  const s = P.s;
  el.innerHTML = `<div class="ghead">Üben</div><div class="group">
      <label class="row"><div class="grow">Eintippen-Modus anzeigen</div><input type="checkbox" id="typ" ${s.typing ? "checked" : ""}></label>
      ${s.typing ? `<label class="row"><div class="grow">Tolerante Prüfung</div><input type="checkbox" id="tol" ${s.tolerant ? "checked" : ""}></label>` : ""}
      <label class="row"><div class="grow">Vibration (Android)</div><input type="checkbox" id="snd" ${s.sound ? "checked" : ""}></label></div>
    <div class="gfoot">Standardmäßig wird alles durch Antippen geübt. Tolerant: kleine Tippfehler und eine von mehreren Bedeutungen zählen als richtig.</div>
    <div class="ghead">Tagesziel</div><div class="group"><div class="row"><div class="grow">${s.goal} Fragen pro Tag</div><button class="btn" id="gm">−</button><button class="btn" id="gp">+</button></div></div>
    <div class="ghead">Auf den Home-Bildschirm</div><div class="group"><div class="row" style="display:block">
      <b>iPhone (Safari):</b> Teilen-Knopf <span class="pill">⬆︎</span> → „Zum Home-Bildschirm“.<br><b>Android (Chrome):</b> Menü ⋮ → „App installieren“ bzw. „Zum Startbildschirm hinzufügen“.<br><span class="sub">Dann startet die App im Vollbild mit eigenem Icon.</span></div></div>
    <div class="ghead">Backup</div><div class="group">
      <div class="row link" id="exp"><div class="grow">Fortschritt sichern (Text kopieren)</div></div>
      <div class="row link" id="imp"><div class="grow">Fortschritt wiederherstellen</div></div></div>
    <div class="gfoot">Der Fortschritt wird nur in diesem Browser gespeichert. Sichere ihn ab und zu, z. B. in einer Notiz.</div>
    <div class="group"><div class="row link" id="reset" style="color:var(--red)"><div class="grow">Gesamten Fortschritt löschen</div></div></div>
    <div class="sub center">Lern-App zum Lateinbuch „Medias in Res!“ (Lektion 1–30). Nur für den privaten Gebrauch.</div>`;
  const re = () => { save(); render(); };
  el.querySelector("#typ").onchange = e => { s.typing = e.target.checked; re(); };
  const tol = el.querySelector("#tol"); if (tol) tol.onchange = e => { s.tolerant = e.target.checked; re(); };
  el.querySelector("#snd").onchange = e => { s.sound = e.target.checked; re(); };
  el.querySelector("#gm").onclick = () => { s.goal = Math.max(10, s.goal - 10); re(); };
  el.querySelector("#gp").onclick = () => { s.goal = Math.min(200, s.goal + 10); re(); };
  el.querySelector("#exp").onclick = () => push("Fortschritt sichern", e => {
    const txt = JSON.stringify(P);
    e.innerHTML = `<p class="sub">Kopiere diesen Text und bewahre ihn auf (z. B. in Notizen).</p><textarea id="t" rows="10" style="width:100%" readonly>${esc(txt)}</textarea>
      <div class="btns"><button class="btn primary" id="cp">Kopieren</button><a class="btn" id="dl" download="MediasInRes-Fortschritt.json">Als Datei</a></div><p id="m" class="sub"></p>`;
    const dl = e.querySelector("#dl");
    if (/claude/.test(location.host) || window.self !== window.top) dl.remove();
    else try { dl.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); } catch (x) {}
    e.querySelector("#cp").onclick = async () => { try { await navigator.clipboard.writeText(txt); e.querySelector("#m").textContent = "Kopiert ✅"; } catch (x) { const t = e.querySelector("#t"); t.focus(); t.select(); e.querySelector("#m").textContent = "Text ist markiert – jetzt kopieren."; } };
  });
  el.querySelector("#imp").onclick = () => push("Wiederherstellen", e => {
    e.innerHTML = `<p class="sub">Füge den gesicherten Text ein oder wähle die Datei.</p><textarea id="t" rows="8" style="width:100%"></textarea>
      <input type="file" id="f" accept=".json,application/json,text/plain" style="margin:10px 0"><button class="btn primary full" id="go">Wiederherstellen</button><p id="m" class="sub"></p>`;
    e.querySelector("#f").onchange = ev => { const f = ev.target.files[0]; if (f) f.text().then(t => e.querySelector("#t").value = t); };
    e.querySelector("#go").onclick = () => { try { const d = JSON.parse(e.querySelector("#t").value); if (!d || typeof d !== "object" || !d.items) throw 0;
      P = Object.assign(structuredClone(DEFAULTS), d); P.s = Object.assign(structuredClone(DEFAULTS.s), d.s || {}); save(); e.querySelector("#m").textContent = "Fortschritt wiederhergestellt ✅"; drawTabs(); }
      catch (x) { e.querySelector("#m").textContent = "Der Text konnte nicht gelesen werden."; } };
  });
  el.querySelector("#reset").onclick = () => confirmSheet("Wirklich alles löschen?", "Dein gesamter Lernfortschritt geht verloren.", "Löschen", () => { const keep = P.s; P = structuredClone(DEFAULTS); P.s = keep; save(); render(); });
}

// ---------- Dialoge ----------
function sheet(html, bind) { const r = document.getElementById("modal-root"); r.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; bind(r, () => r.innerHTML = ""); }
function confirmSheet(t, d, ok, fn) { sheet(`<h2 style="margin-top:0">${esc(t)}</h2><p class="sub">${esc(d)}</p><div class="btns"><button class="btn" id="c">Abbrechen</button><button class="btn red" id="o">${esc(ok)}</button></div>`,
  (r, close) => { r.querySelector("#c").onclick = close; r.querySelector("#o").onclick = () => { close(); fn(); }; }); }
function onboarding() {
  sheet(`<div class="center"><img src="${ICON}" alt="" style="width:84px;height:84px;border-radius:19px"><h1 style="margin:10px 0 4px">Salve! 👋</h1><p>Alles aus „Medias in Res!“ – Lektion 1 bis 30 – zum Lernen und Wiederholen.</p></div>
    ${[["📖", "Lektionen", "Vokabeln und Grammatik jeder Lektion."], ["🧠", "Üben", "Wähle z. B. Lektion 5–10: Karteikarten, Quiz, Hören, Formen oder Schularbeit."], ["📅", "Täglich wiederholen", "Die App merkt sich, was du kannst, und zeigt fällige Wörter."], ["📲", "Wie eine App", "iPhone: Teilen ⬆︎ → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“."]]
      .map(([i, t, d]) => `<div style="display:flex;gap:14px;margin:14px 0"><div style="font-size:26px">${i}</div><div><b>${t}</b><div class="sub">${d}</div></div></div>`).join("")}
    <button class="btn primary full" id="go">Los geht’s – medias in res!</button>`, (r, close) => r.querySelector("#go").onclick = () => { P.s.onboarded = true; save(); close(); });
}

// ---------- Start ----------
render();
if (!P.s.onboarded) onboarding();
try { if (speechSynthesis) speechSynthesis.getVoices(); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.host)) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
