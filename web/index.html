raße)","Sachfeld = inhaltlich zusammenhängende Wörter verschiedener Wortarten (z. B. Sachfeld „Verkehr“: Auto, parken, Ampel, stauen, Straße)"]},{"type":"task","q":"Nenne die Wortfamilie zum Stamm cup-.","a":"cupere (Verb), cupidus (Adjektiv), cupiditas (Nomen)."}]},{"title":"L26–30 · Metapher","blocks":[{"type":"text","text":"Eine Metapher ist ein bildlicher Ausdruck: Ein Wort wird im übertragenen Sinn verwendet („die Uhr geht falsch“)."},{"type":"table","headers":["Wort","eigentliche Bedeutung","übertragene Bedeutung"],"rows":[["tollere","etwas aufheben (vom Boden)","ein Gesetz aufheben = beseitigen"],["gravis","schwer (an Gewicht)","schwer (an Bedeutung) = schwerwiegend"],["adducere","jemanden hinführen (an einen Ort)","jemanden zu einer Handlung hinführen = veranlassen"]]},{"type":"task","q":"Welcher Satz ist metaphorisch? a) Du wirkst heute völlig zerstört. – Die Römer zerstörten die Stadt. b) Hannibal konnte Rom nicht erobern. – Quintus würde Julia gerne erobern. c) Dieses Wissen bringt mir nichts. – Mami bringt mir einen Kakao.","a":"metaphorisch sind „völlig zerstört“, „Julia erobern“ und „bringt mir nichts“."}]},{"title":"L26–30 · Ein Wort – viele Bedeutungen: auctor","blocks":[{"type":"text","text":"Im Nomen auctor, -oris steckt das Verb augere, auxi, auctum („vermehren“, „vergrößern“). auctor bezeichnet also eine Person, die hinter etwas steckt bzw. für etwas verantwortlich ist („Urheber“)."},{"type":"table","headers":["Ausdruck","Bedeutung"],"rows":[["auctor sceleris","Anstifter / Urheber des Verbrechens"],["auctor famae","Urheber des Gerüchts"],["auctor huius libri","Verfasser (Autor) dieses Buches"],["auctor urbis","Gründer der Stadt"]]}]}]},{"id":"repet","icon":"🔁","title":"Repetitiones","sub":"Wiederholungsübungen zu Lektion 1–30 mit Lösungen (S. 142 ff.)","grammar":[{"title":"Repetitiones zu Lektion 1–5","blocks":[{"type":"task","q":"I. Bestimme Fall und Zahl und übersetze: 1. aquam, 2. spectacula, 3. oculorum, 4. feminae, 5. gladii","a":"1. aquam: 4.F. Sg. – das Wasser (Akk.); 2. spectacula: 1./4./5.F. Pl. – die Schauspiele; 3. oculorum: 2.F. Pl. – der Augen; 4. feminae: 2./3.F. Sg. – der Frau / 1./5.F. Pl. – die Frauen, Frauen!; 5. gladii: 2.F. Sg. – des Schwertes / 1./5.F. Pl. – die Schwerter"},{"type":"task","q":"II. Setze die Verba richtig ein: 1. Quid ___, pueri? – Templum novum ___. (spectare) 2. Quis post Iuliam ___? – Gaius Quintusque post Iuliam ___. (sedere) 3. Cur ___, Quinte? – ___, quod pensum non habeo. (gaudere) 4. Placetne vobis puellas ___? – Libenter puellas ___. (terrere) 5. Ubi amicas ___, puellae? – In foro amicas ___. (exspectare)","a":"1. spectatis – spectamus; 2. sedet – sedent; 3. gaudes – gaudeo; 4. terrere – terremus; 5. exspectatis – exspectamus"},{"type":"task","q":"III. Ergänze die Endungen und übersetze: Claudia cum amic__ (Pl.) ad schol__ properat. Ante schol__ Iulia iam amicam exspectat. Numquam sine amic__ (Sg.) in aedifici__ intrat. Tum magister multum de vir__ clar__ narrat. Discipuli iam diu in schol__ sunt. Postremo a schol__ domum properare licet. Post schol__ otium discipulos exspectat. Aliis cum magn__ gaudi__ spectacula vident, aliis diu per Rom__ pulch__ ambulare placet.","a":"amicis – scholam – scholam – amica – aedificium – viris claris – schola – schola – scholam – magno gaudio – Romam pulchram.\nÜbersetzung: Claudia eilt mit den Freundinnen zur Schule. Vor der Schule erwartet Julia schon die Freundin. Niemals geht sie ohne Freundin in das Gebäude. Dann erzählt der Lehrer viel über berühmte Männer. Die Schüler sind schon lange in der Schule. Schließlich dürfen sie von der Schule nach Hause eilen. Nach der Schule erwartet die Schüler die Freizeit. Die einen sehen mit großer Freude Schauspiele, den anderen gefällt es, lange durch das schöne Rom zu spazieren."},{"type":"task","q":"IV. Ergänze Imperative und Vokative: 1. Proper__ ad scholam, Quint__ et Iuli__! 2. Narr__ nobis de viris claris, Gai__! 3. Pugn__ pro vita vestra, vir__! 4. Respond__ magistro, Claud__! 5. Monstr__ nobis aedificia clara, amic__! (Sg.) 6. Laud__ discipulos tuos, magist__! 7. Gaud__ et rid__, puer__! (Pl.)","a":"1. Properate, Quinte et Iulia! (Eilt zur Schule!) 2. Narra, Gai! (Erzähl uns …!) 3. Pugnate, viri! (Kämpft für euer Leben, Männer!) 4. Responde, Claudia! (Antworte dem Lehrer!) 5. Monstra, amice/amica! (Zeig uns berühmte Gebäude!) 6. Lauda, magister! (Lobe deine Schüler!) 7. Gaudete et ridete, pueri! (Freut euch und lacht, Buben!)"},{"type":"task","q":"V. De nova amica Quinti – übersetze: Quintus cum puella pulchra per vias Romae ambulat. Tum Gaius amicum videt clamatque: „Salve, Quinte! Ambulatisne ad forum? Certe mihi vobiscum ambulare licet!“ Nunc Gaius amicum interrogat: „Quis est haec (diese) puella?“ „Haec puella est Corinna, amica mea“, Quintus inquit. „Nonne Corinna puella pulchra est?“ Gaius puellam spectat respondetque: „Certe Corinna puella pulchra est, sed cunctae (alle) amicae tuae mihi placent.“ Verba Gaii puellam minime delectant. „Cur Gaius dicit (sagt) ‚cunctae‘?“, Corinna clamat. „Num multas amicas habes, Quinte?“ „Minime, solum te amo. Aliae puellae mihi non placent!“ Sed Corinna Gaium quoque interrogat: „Responde, Gai: Habetne Quintus alias amicas?“ „Non habet. Claudia Iuliaque amicae Quinti non sunt. Etiam Cornelia Quinto non placet et Lydia …“ „Nunc Gaio nobiscum ambulare non iam (nicht mehr) licet – habet enim (nämlich) multa pensa!“, Quintus iratus clamat et cum Corinna ad forum properat.","a":"Quintus spaziert mit einem schönen Mädchen durch die Straßen Roms. Da sieht Gaius den Freund und ruft: „Sei gegrüßt, Quintus! Spaziert ihr zum Forum? Sicherlich darf ich mit euch spazieren!“ Nun fragt Gaius den Freund: „Wer ist dieses Mädchen?“ „Dieses Mädchen ist Corinna, meine Freundin“, sagt Quintus. „Ist Corinna nicht ein schönes Mädchen?“ Gaius betrachtet das Mädchen und antwortet: „Sicherlich ist Corinna ein schönes Mädchen, aber alle deine Freundinnen gefallen mir.“ Die Worte des Gaius erfreuen das Mädchen ganz und gar nicht. „Warum sagt Gaius ‚alle‘?“, ruft Corinna. „Hast du etwa viele Freundinnen, Quintus?“ „Keineswegs, ich liebe nur dich. Andere Mädchen gefallen mir nicht!“ Aber Corinna fragt auch Gaius: „Antworte, Gaius: Hat Quintus andere Freundinnen?“ „Er hat keine. Claudia und Julia sind keine Freundinnen des Quintus. Auch Cornelia gefällt Quintus nicht, und Lydia …“ „Jetzt darf Gaius nicht mehr mit uns spazieren – er hat nämlich viele Aufgaben!“, ruft Quintus zornig und eilt mit Corinna zum Forum."},{"type":"task","q":"VI. Übersetze – suus mit „sein“ oder „ihr“? 1. Discipuli magistro pensa sua monstrant. 2. Puellae Gaium et magistrum suum in foro vident. 3. Discipuli saepe de schola et magistro suo narrant. 4. Gaius iam diu Iuliam et amicam suam exspectat. 5. Iulia et Claudia amicos suos exspectant. 6. Claudia cum Gaio et amica sua per forum ambulat.","a":"1. Die Schüler zeigen dem Lehrer ihre Aufgaben. 2. Die Mädchen sehen Gaius und ihren Lehrer auf dem Forum. 3. Die Schüler erzählen oft von der Schule und ihrem Lehrer. 4. Gaius erwartet schon lange Julia und seine Freundin. 5. Julia und Claudia erwarten ihre Freunde. 6. Claudia spaziert mit Gaius und ihrer Freundin über das Forum."},{"type":"task","q":"VII. Setze die Pronomina ein: 1. Nonne spectacula ___ delectant? (tu) 2. Cur magister ___ non laudat? (ego) 3. Narra ___ de ___! (ego/tu) 4. Cur statuae deorum ___ non placent? (tu) 5. Amici ___ Romam pulchram monstrant. (nos)","a":"1. te; 2. me; 3. mihi – te; 4. tibi; 5. nobis"},{"type":"task","q":"VIII. Welches Wort passt nicht dazu – und warum? 1. puella, monstra, aqua, vita 2. nos, nobiscum, nostris, nobis 3. deas, feminas, linguas, donas 4. delecto, animo, cogito, narro 5. vita, copia, gaudia, statua 6. terris, terres, terrae, terra","a":"1. monstra (Imperativ, die anderen sind Nomina); 2. nostris (Possessivpronomen, die anderen Personalpronomina); 3. donas (Verb, die anderen Nomina im Akk. Pl.); 4. animo (Nomen, die anderen Verben in der 1.P. Sg.); 5. gaudia (Neutrum Plural, die anderen a-Deklination Sg.); 6. terres (Verb „du erschreckst“, die anderen Formen von terra)"},{"type":"task","q":"IX. Übersetze ins Lateinische: 1. Claudia zeigt dem Lehrer ihre Aufgabe. 2. Quintus hat seine Aufgabe nicht bei sich. 3. Der Lehrer fragt: „Warum arbeitest du nicht, Quintus?“ 4. Der Bub antwortet: „Ich liebe es zu arbeiten. Unsere Aufgaben erfreuen mich.“ 5. Die Mädchen lachen über die Worte des Buben. 6. Der Lehrer gibt (dat) nun Quintus viele Aufgaben. 7. „Sicher sind dir die Aufgaben eine große Freude!“","a":"1. Claudia magistro pensum suum monstrat. 2. Quintus pensum suum secum non habet. 3. Magister interrogat: „Cur non laboras, Quinte?“ 4. Puer respondet: „Laborare amo. Pensa nostra me delectant.“ 5. Puellae verbis pueri rident (de verbis pueri rident). 6. Magister nunc Quinto multa pensa dat. 7. „Certe pensa tibi magnum gaudium sunt!“"},{"type":"task","q":"X. Kreuze an: 1. Quis est primus magister discipulorum Romanorum? (grammaticus, rhetor, litterator, professor) 2. Ubi gladiatores pugnant? (in circo, in theatro, in thermis, in amphitheatro) 3. Quid Romani in theatris plerumque spectant? (comoedias, gladiatores, tragoedias, puellas nudas) 4. Quid in foro Romano non est? (basilica, templum, curia, theatrum)","a":"1. litterator (Elementarlehrer); 2. in amphitheatro; 3. comoedias (Komödien); 4. theatrum"},{"type":"task","q":"XI. Rätsel – setze die Formen ein: 1. schau an! 2. den Freundinnen 3. du kämpfst 4. (zu) arbeiten 5. ihr freut euch 6. das andere 7. wir haben 8. die Buben (Akk.)","a":"1. specta; 2. amicis; 3. pugnas; 4. laborare; 5. gaudetis; 6. aliud; 7. habemus; 8. pueros"}]},{"title":"Repetitiones zu Lektion 6–10","blocks":[{"type":"task","q":"I. Ordne die Adjektiva bzw. Pronomina zu: 1. virtute 2. vocum 3. militibus 4. imperatorem 5. timore 6. hostis 7. parti 8. vocem – a) ceteris b) magna c) magnae d) magno e) multarum f) nostrum g) sui h) tuam","a":"1. virtute magna; 2. vocum multarum; 3. militibus ceteris; 4. imperatorem nostrum; 5. timore magno; 6. hostis sui; 7. parti magnae; 8. vocem tuam"},{"type":"task","q":"II. Setze die Wortpaare ein und übersetze (ein Paar bleibt übrig): 1. Manlius, vir ___, Gallos Capitolio prohibere potest. 2. Quod Romani multos milites occidunt, hostes cum ___ fugiunt. 3. Dum foro appropinquamus, clamorem ___ audimus. 4. Copiae hostium nocte castra expugnant et ___ occidunt. 5. Neque imperatori neque ___ in castris manere placet. 6. Scipio quoque virtutem ___ laudat. 7. ___ discipulorum otium placet.","a":"1. magna virtute – Manlius, ein Mann von großer Tapferkeit, kann die Gallier vom Kapitol fernhalten. 2. magno timore – Weil die Römer viele Soldaten töten, fliehen die Feinde mit großer Angst. 3. multarum vocum – Während wir uns dem Forum nähern, hören wir das Geschrei vieler Stimmen. 4. imperatorem nostrum – Die Truppen der Feinde erobern in der Nacht das Lager und töten unseren Feldherrn. 5. ceteris militibus – Weder dem Feldherrn noch den übrigen Soldaten gefällt es, im Lager zu bleiben. 6. hostis sui – Auch Scipio lobt die Tapferkeit seines Feindes. 7. Magnae parti – Einem großen Teil der Schüler gefällt die Freizeit. (Übrig bleibt: vocem tuam.)"},{"type":"task","q":"III. Setze ein und übersetze: amant – contenditis – dicit – interrogat – mane – monstrare – placet – potest – spectare – venire. Quintus Alexandrum, amicum Graecum, ___: „Placetne tibi mecum in circum ___?“ Alexander autem respondet: „Amicus equorum non sum.“ Quintus nunc dicit: „Multi homines, quamquam equos non ___, tamen in circo sunt. Nam ibi non solum equos, sed etiam multas puellas pulchras ___ potes.“ Ita Alexander paulo post ad Lydiam ___: „Hora decima Quintus mihi circum ___ in animo habet.“ – „Bene!“, Lydia inquit. „Ego quoque libenter tecum venio, Quinte!“ – „Pulchrum ibi non est!“, Alexander clamat, „___ domi! Clamor multorum hominum tibi certe non ___.“ – „Si ibi pulchrum non est, cur vos in circum ___?“, Lydia interrogat. „Vobiscum venire certe necesse est!“ Ita Alexander, quod amicam circo prohibere non ___, cum Quinto et Lydia in circum properat.","a":"interrogat – venire – amant – spectare – dicit – monstrare – mane – placet – contenditis – potest.\nÜbersetzung: Quintus fragt Alexander, den griechischen Freund: „Gefällt es dir, mit mir in den Zirkus zu kommen?“ Alexander aber antwortet: „Ich bin kein Freund von Pferden.“ Quintus sagt nun: „Viele Menschen sind im Zirkus, obwohl sie Pferde nicht lieben. Denn dort kannst du nicht nur Pferde, sondern auch viele schöne Mädchen anschauen.“ So sagt Alexander wenig später zu Lydia: „Um die zehnte Stunde hat Quintus vor, mir den Zirkus zu zeigen.“ – „Gut!“, sagt Lydia. „Auch ich komme gern mit dir, Quintus!“ – „Dort ist es nicht schön!“, ruft Alexander, „bleib zu Hause! Das Geschrei vieler Menschen gefällt dir sicher nicht.“ – „Wenn es dort nicht schön ist, warum eilt ihr in den Zirkus?“, fragt Lydia. „Mit euch zu kommen ist sicher notwendig!“ So eilt Alexander, weil er die Freundin nicht vom Zirkus fernhalten kann, mit Quintus und Lydia in den Zirkus."},{"type":"task","q":"IV. De Carthagine – übersetze: Regi Tyri duo liberi sunt, Dido et Pygmalion. Post mortem regis populus Pygmalionem regem facit. Sychaeus, vir summo honore, Didonem in matrimonium ducit. Sed paulo post Pygmalion Sychaeum, cui (dem) magna copia auri (Gold) est, occidit. Itaque Dido magno in timore est et cum multis aliis hominibus e patria in Africam ad alium regem fugit, ubi urbem novam aedificare in animo habet. Rex autem de consilio hominum alienorum audit et Didoni terram non donat. Itaque Dido, femina summa prudentia (Klugheit), ad regem dicit: „Donasne nobis terram, quae (die) corio taurino (Rinderhaut) tegi (bedeckt werden) potest?“ Rex respondet: „Terram tam parvam vobis libenter dono!“ Deinde autem Dido corium taurinum in tenues (dünne) partes secat (schneidet). Quod ita corium taurinum magnam partem terrae continet (einschließen), Dido auxilio ceterorum hominum Carthaginem, magnificam urbem, aedificare potest.","a":"Der König von Tyrus hat zwei Kinder, Dido und Pygmalion. Nach dem Tod des Königs macht das Volk Pygmalion zum König. Sychaeus, ein Mann von höchstem Ansehen, heiratet Dido. Aber wenig später tötet Pygmalion Sychaeus, der eine große Menge Gold besitzt. Deshalb ist Dido in großer Angst und flieht mit vielen anderen Menschen aus der Heimat nach Afrika zu einem anderen König, wo sie eine neue Stadt zu bauen vorhat. Der König aber hört vom Plan der fremden Menschen und schenkt Dido kein Land. Deshalb sagt Dido, eine Frau von größter Klugheit, zum König: „Schenkst du uns so viel Land, wie von einer Rinderhaut bedeckt werden kann?“ Der König antwortet: „So kleines Land schenke ich euch gern!“ Danach aber schneidet Dido die Rinderhaut in dünne Teile (Streifen). Weil die Rinderhaut so einen großen Teil des Landes einschließt, kann Dido mit Hilfe der übrigen Menschen Karthago, eine prächtige Stadt, bauen."},{"type":"task","q":"V. Rätsel zur Konjugation – waagrecht: 1. ich sehe 4. du siehst 5. sag! 7. sie sieht 10. sie kommen 11. ich komme 12. du bist; senkrecht: 1. ihr seht 2. (zu) sagen 3. (zu) sein 4. du kommst 6. ihr kommt 8. du sagst 9. ich sage. Die Lösung ist ein berühmter Römer, dessen Name übersetzt „Kichererbse“ heißt.","a":"Waagrecht: video, vides, dic, videt, veniunt, venio, es. Senkrecht: videtis, dicere, esse, venis, venitis, dicis, dico. Lösung: CICERO (cicer = Kichererbse)."},{"type":"task","q":"VI. Kreuze an: 1. Quis est pater Romuli? (Remus, Mars, Iuppiter, Numitor) 2. Quis Hannibalem vincit? (Alexander, Scipio, Dido, Caesar) 3. Quot reges Romae regnant? (quattuor, septem, decem, centum) 4. Quis est primus rex Romanorum? (Tarquinius, Amulius, Romulus, Procas)","a":"1. Mars; 2. Scipio; 3. septem (sieben Könige); 4. Romulus"},{"type":"task","q":"VII. Welche lateinischen Wörter stecken dahinter? 1. Marinade 2. Honorar 3. Triangel 4. renovieren 5. Armee 6. Partei","a":"1. mare (Meer – urspr. Salzwasser-Lake); 2. honor (Ehre); 3. tres (drei) + angulus (Winkel); 4. novus (neu) mit re- (wieder); 5. arma (Waffen); 6. pars (Teil)"},{"type":"task","q":"VIII. De Romulo – setze die Endungen ein und übersetze: Amulius Romulum et Remum, fili__ Rheae Silviae, in flum__ exponit (aussetzen). Sed pastores (Hirten) liber__ vident et secum domum portant. Ita pueri diu apud pastores habit__. Multis annis post Romulus Remusque pastores relinqu__. Arma cap__ et Amulium occidunt. Deinde oppidum novum aedific__ in animo habent. Dum autem Romulus vallum (Wall) oppid__ nov__ aedificat, Remus venit et de vall__ parv__ ridet. Itaque Romulus iratus Remum gladi__ necat. Quod in oppid__ nov__ feminae non sunt, Romulus consilium capit: Sabinos in oppid__ su__ invitat. Dum autem spectacul__ pulchr__ exspectant, Romani filias Sabinorum rap__. Ita Romulus Romanis femin__ parat. Sabini autem irati in patriam contendunt et filias arm__ liberare constituunt. Itaque paulo post milit__ Sabinorum ad urb__ veniunt. Quod autem viri Romani puell__ placent, Sabini et Romani pac__ faciunt. Romulus deinde diu magna iustitia regn__. Post mult__ ann__ autem, dum orationem ad milit__ suos habet, subito magn__ nube (Wolke) ex oculis hominum evanescit (verschwindet). Paulo post Romulus non iam inter homines, sed apud deos est.","a":"filios – flumen – liberos – habitant – relinquunt – capiunt – aedificare – oppidi novi – vallo parvo – gladio – oppido novo – oppidum suum – spectacula pulchra – rapiunt – feminas – armis – milites – urbem – puellis – pacem – regnat – multos annos – milites – magna.\nÜbersetzung: Amulius setzt Romulus und Remus, die Söhne der Rhea Silvia, im Fluss aus. Aber Hirten sehen die Kinder und tragen sie mit sich nach Hause. So wohnen die Buben lange bei den Hirten. Viele Jahre später verlassen Romulus und Remus die Hirten. Sie ergreifen die Waffen und töten Amulius. Dann haben sie vor, eine neue Stadt zu bauen. Während Romulus aber den Wall der neuen Stadt baut, kommt Remus und lacht über den kleinen Wall. Deshalb tötet Romulus zornig Remus mit dem Schwert. Weil in der neuen Stadt keine Frauen sind, fasst Romulus einen Plan: Er lädt die Sabiner in seine Stadt ein. Während sie aber schöne Schauspiele erwarten, rauben die Römer die Töchter der Sabiner. So verschafft Romulus den Römern Frauen. Die Sabiner aber eilen zornig in die Heimat und beschließen, die Töchter mit Waffen zu befreien. Deshalb kommen wenig später die Soldaten der Sabiner zur Stadt. Weil aber den Mädchen die römischen Männer gefallen, schließen Sabiner und Römer Frieden. Romulus regiert danach lange mit großer Gerechtigkeit. Nach vielen Jahren aber verschwindet er, während er eine Rede an seine Soldaten hält, plötzlich in einer großen Wolke aus den Augen der Menschen. Wenig später ist Romulus nicht mehr unter den Menschen, sondern bei den Göttern.\n? „puell__ placent“: Dativ Plural puellis („den Mädchen gefallen die Männer“)."}]},{"title":"Repetitiones zu Lektion 11–15","blocks":[{"type":"task","q":"I. Verbinde die Pronomina mit den passenden Nomina und übersetze: 1. quoddam 2. eandem 3. illius 4. hac 5. ipsis 6. quo 7. illi 8. eae 9. hos 10. eorundem – a) metu b) virgines c) dies d) domum e) adulescenti f) re g) carminum h) animal i) periculi j) parentibus","a":"1. quoddam animal – ein gewisses Tier; 2. eandem domum – dasselbe Haus; 3. illius periculi – jener Gefahr; 4. hac re – durch diese Sache; 5. ipsis parentibus – den Eltern selbst; 6. quo metu – durch welche Furcht; 7. illi adulescenti – jenem jungen Mann; 8. eae virgines – diese Mädchen; 9. hos dies – diese Tage; 10. eorundem carminum – derselben Lieder"},{"type":"task","q":"II. Setze idem, eadem, idem richtig ein, ordne die Relativsätze zu und übersetze: 1. Quidam homines semper ___ oppida petunt, … 2. Gaius ___ die multos amicos invitavit, … 3. Quintus pulchritudinem Iuliae ___ verbis laudat, … 4. Liberi iam multas horas ___ carmen canunt, … 5. Ibi venit ___ puella, … 6. Amici ___ nave domum navigaverunt, … – a) qua venerant b) quibus Claudiam laudare solet c) quae iam saepe spectaverunt d) quam iam in foro vidimus e) quo parentes urbem reliquerunt f) quod magister eos docuit","a":"1. eadem – c: Manche Menschen suchen immer dieselben Städte auf, die sie schon oft angeschaut haben. 2. eodem – e: Gaius lud an demselben Tag viele Freunde ein, an dem die Eltern die Stadt verlassen hatten. 3. eisdem (iisdem) – b: Quintus lobt die Schönheit Julias mit denselben Worten, mit denen er Claudia zu loben pflegt. 4. idem – f: Die Kinder singen schon viele Stunden dasselbe Lied, das der Lehrer sie gelehrt hat. 5. eadem – d: Dort kommt dasselbe Mädchen, das wir schon auf dem Forum gesehen haben. 6. eadem – a: Die Freunde segelten mit demselben Schiff nach Hause, mit dem sie gekommen waren."},{"type":"task","q":"III. Übersetze (quam und quod können auch anders verwendet werden!): 1. Audivistisne iam de facinore, quod Tantalus commisit? 2. Quod facinus ille amicus deorum commisit? 3. Tantalus illud facinus commisit, quod prudentiam deorum probare (auf die Probe stellen) constituerat. 4. Quam improbum hoc facinus fuit! 5. Quam poenam Tantalus solvere debet? 6. Quod Tantalus tam improbum facinus commiserat, poena, quam di ei dederunt, magna erat.","a":"1. Habt ihr schon von der Untat gehört, die Tantalus begangen hat? (Relativpronomen) 2. Welche Untat hat jener Freund der Götter begangen? (Fragepronomen) 3. Tantalus beging jene Untat, weil er beschlossen hatte, die Klugheit der Götter auf die Probe zu stellen. (Konjunktion „weil“) 4. Wie schlecht war diese Untat! (Ausruf „wie“) 5. Welche Strafe muss Tantalus verbüßen? (Fragepronomen) 6. Weil Tantalus eine so schlechte Untat begangen hatte, war die Strafe, die die Götter ihm gaben, groß."},{"type":"task","q":"IV. Setze ins Imperfekt, Perfekt und Plusquamperfekt und übersetze die letzte Form: 1. quaerit 2. neglegitis 3. do 4. reddimus 5. sunt","a":"1. quaerebat, quaesivit, quaesiverat – er hatte gesucht; 2. neglegebatis, neglexistis, neglexeratis – ihr hattet missachtet; 3. dabam, dedi, dederam – ich hatte gegeben; 4. reddebamus, reddidimus, reddideramus – wir hatten zurückgegeben; 5. erant, fuerunt, fuerant – sie waren gewesen"},{"type":"task","q":"V. Hercules quoque Tartarum petit – übersetze: Non solum Orpheo, sed etiam Herculi ante mortem Tartarum (Unterwelt) intrare licuit. Nam ille vir magnae virtutis duodecim opera, quae ei Eurystheus rex imperaverat, conficere debuit. Postquam Hercules iam nonnulla animalia summa magnitudine interfecit, Eurystheus ei hoc quoque imperavit: „Descende (steig hinab) in Tartarum et apporta (bring herbei) Cerberum canem!“ Ille canis, cui tria capita sunt, ad portam Tartari mortuos custodit (bewacht). Ita nemo Tartarum relinquere potest. Hercules, qui ne hoc quidem periculum timebat, paruit atque Tartarum petivit. Ibi a Plutone petivit: „Da mihi Cerberum! Eum ad Eurystheum portare debeo!“ Is respondit: „Cerberum tibi dare non possum. Si autem illum sine armis superare potes, Cerberum tecum ducere tibi licet.“ Et Hercules, postquam diu summa vi cum illo cane pugnavit, eum manibus superavit et ad Eurystheum portavit. Quod is autem Cerberum maxime timebat, Hercules illum paulo post Plutoni reddidit.","a":"Nicht nur Orpheus, sondern auch Herkules war es erlaubt, vor dem Tod den Tartarus zu betreten. Denn jener Mann von großer Tapferkeit musste zwölf Arbeiten vollbringen, die König Eurystheus ihm befohlen hatte. Nachdem Herkules schon einige Tiere von gewaltiger Größe getötet hatte, befahl ihm Eurystheus auch dies: „Steig in den Tartarus hinab und bring den Hund Cerberus herbei!“ Jener Hund, der drei Köpfe hat, bewacht am Tor des Tartarus die Toten. So kann niemand den Tartarus verlassen. Herkules, der nicht einmal diese Gefahr fürchtete, gehorchte und begab sich in den Tartarus. Dort bat er Pluto: „Gib mir Cerberus! Ich muss ihn zu Eurystheus tragen!“ Dieser antwortete: „Ich kann dir Cerberus nicht geben. Wenn du ihn aber ohne Waffen besiegen kannst, darfst du Cerberus mit dir führen.“ Und Herkules besiegte ihn, nachdem er lange mit größter Kraft mit jenem Hund gekämpft hatte, mit den Händen und trug ihn zu Eurystheus. Weil dieser aber Cerberus sehr fürchtete, gab Herkules ihn wenig später Pluto zurück."},{"type":"task","q":"VI. Setze die Interrogativpronomina ein (cui – qua – quae – quae – quas – quem – quis – quid – quo – quos) und übersetze den Brief: Iulia Claudiae salutem (Gruß) dicit. Certe gaudes, quod tibi nunc cum parentibus in insulis Graecis esse licet. ___ nostrum iter in Graeciam facere non placet? ___ ad mare ludere et templa clara spectare non delectat? ___ insulas visistis (besichtigt)? ___ insula tibi maxime placuit? In ___ insula nunc estis? ___ ibi facitis? ___ montes ascenditis? ___ oppida spectatis? ___ vobis aedificia clara monstrat? Suntne ibi adulescentes pulchri? Cum ___ nocte ambulare soles? Certe non solum cum parentibus! Te iam exspecto! Certe multum narrare potes.","a":"Cui – Quem – Quas – Quae – qua – Quid – Quos – Quae – Quis – quo.\nÜbersetzung: Julia grüßt Claudia. Sicher freust du dich, dass du jetzt mit den Eltern auf den griechischen Inseln sein darfst. Wem von uns gefällt es nicht, eine Reise nach Griechenland zu machen? Wen erfreut es nicht, am Meer zu spielen und berühmte Tempel anzuschauen? Welche Inseln habt ihr besichtigt? Welche Insel hat dir am meisten gefallen? Auf welcher Insel seid ihr jetzt? Was macht ihr dort? Welche Berge besteigt ihr? Welche Städte schaut ihr an? Wer zeigt euch berühmte Gebäude? Gibt es dort schöne junge Männer? Mit wem pflegst du in der Nacht spazieren zu gehen? Sicher nicht nur mit den Eltern! Ich erwarte dich schon! Sicher kannst du viel erzählen."},{"type":"task","q":"VII. Übungssätze zur Kasuslehre – übersetze: 1. Quis amicorum me hac cura liberat? 2. Ne magnis quidem poenis magister illos pueros facinoribus prohibere potest. 3. Magister nos semper pensis huius generis delectat. 4. Nemo adulescentium Iuliam, virginem et magnae pulchritudinis et summae prudentiae, non amat. 5. Cui vestrum hoc die pulchro in schola esse placet? 6. Illum virum, cui uxor summo honore est, iam saepe cum quibusdam puellis vidimus.","a":"1. Wer von den Freunden befreit mich von dieser Sorge? (Ablativ der Trennung) 2. Nicht einmal mit großen Strafen kann der Lehrer jene Buben von Untaten abhalten. 3. Der Lehrer erfreut uns immer mit Aufgaben dieser Art. (Genitiv der Art) 4. Keiner der jungen Männer liebt Julia nicht, ein Mädchen von großer Schönheit und höchster Klugheit. (Genitiv/Ablativ der Eigenschaft) 5. Wem von euch gefällt es, an diesem schönen Tag in der Schule zu sein? (Zeitablativ) 6. Jenen Mann, dessen Frau höchstes Ansehen genießt (Dativus possessivus), haben wir schon oft mit gewissen Mädchen gesehen."},{"type":"task","q":"VIII. Worum handelt es sich? 1. Pönale (Endspiel, Filmfestival, Strafsumme, Haarfett) 2. Diäten – 2 Möglichkeiten (Taggelder, fremde Währungen, Vorwürfe, Ernährungsvorschriften) 3. Auditorium (Wagnis, Prophezeiung, Zuhörerschaft, Hoheitsgebiet) 4. Akklamation (Beschwerde, Anpassung, Zuruf, Eingewöhnung)","a":"1. Strafsumme (poena); 2. Taggelder (dies) und Ernährungsvorschriften; 3. Zuhörerschaft (audire); 4. Zuruf (clamare)"},{"type":"task","q":"IX. Rätsel (Nominativ Sg., außer bei Pluralwörtern) – waagrecht: 1. Ii in scholam venire debent, si facinus commisisti. 5. Romani multos eorum habebant, nos unum habemus. 7. Duodecim earum dies apud Romanos habebat. 9. Ea post vitam nos exspectat. 11. Iis videmus. 14. Ea iter per mare facimus. 15. Ea milites semper secum habent. 16. Ibi multa templa sunt. Senkrecht: 1. Eam solvimus, si scelus commisimus. 2. Ea post diem venit. 3. Tres et quattuor sunt … 4. Eam tolerare debemus, si diu nihil bibimus. 6. Eo in aedificio liberi ante meridiem esse solent. 8. Per eam domum intramus. 10. Ea est uxor regis. 12. Is meridie summo in caelo est. 13. Id discipuli post meridiem sine magno gaudio faciunt.","a":"Waagrecht: 1. parentes; 5. deus; 7. hora; 9. mors; 11. oculi; 14. navis; 15. arma; 16. forum. Senkrecht: 1. poena; 2. nox; 3. septem; 4. sitis; 6. schola; 8. porta; 10. regina; 12. sol; 13. pensum. Lösungswort (vermutlich): DELIRASNE? – „Spinnst du?“"}]},{"title":"Repetitiones zu Lektion 16–20","blocks":[{"type":"task","q":"I. Bilde zu claudunt die fehlenden Formen (gleiche Person): Präsens, Futur, Imperfekt, Perfekt – aktiv und passiv","a":"Aktiv: claudunt – claudent – claudebant – clauserunt. Passiv: clauduntur – claudentur – claudebantur – clausi (-ae, -a) sunt."},{"type":"task","q":"II. Ergänze die fehlenden passiven bzw. aktiven Formen: 1. ponebant – ? 2. ? – invitata es 3. tetigeramus – ? 4. ? – defendemini 5. auxit – ? 6. ? – coacti sumus 7. punis – ? 8. ? – victus eram 9. abstulit – ? 10. ? – timeberis","a":"1. ponebantur; 2. invitavisti; 3. tacti (-ae) eramus; 4. defendetis; 5. auctus (-a, -um) est; 6. coegimus; 7. puniris; 8. viceram; 9. ablatus (-a, -um) est; 10. timebis"},{"type":"task","q":"III. Stimme die Adjektiva mit den Nomina überein und setze sie in Komparativ und Superlativ: 1. proeliis (atrox) 2. verbi (acer) 3. pensum (facilis) 4. rem (parvus) 5. classi (magnus)","a":"1. proeliis atrocibus – atrocioribus – atrocissimis; 2. verbi acris – acrioris – acerrimi; 3. pensum facile – facilius – facillimum; 4. rem parvam – minorem – minimam; 5. classi magnae – maiori – maximae"},{"type":"task","q":"IV. Ordne zu und übersetze: prudentem – clara – novae – peius – breves – atrocium – honestis – improbus – fortiori – breviore → 1. die 2. iudicium 3. civis 4. legis 5. senatoribus 6. exercitui 7. rerum 8. virum 9. litteras 10. oratio","a":"1. die breviore – an einem kürzeren Tag; 2. iudicium peius – ein schlechteres Urteil; 3. civis improbus – ein schlechter Bürger; 4. legis novae – des neuen Gesetzes; 5. senatoribus honestis – den ehrenhaften Senatoren; 6. exercitui fortiori – dem tapfereren Heer; 7. rerum atrocium – der grässlichen Dinge; 8. virum prudentem – den klugen Mann; 9. litteras breves – einen kurzen Brief (kurze Briefe); 10. oratio clara – eine berühmte Rede"},{"type":"task","q":"V. Rätsel mit ire und ferre – waagrecht: 1. ihr wart gegangen 2. ich trug (Perf.) 4. ihr gingt (Perf.) 8. ich gehe 9. wir gingen (Perf.) 11. er ging (Imperf.) 12. ich trug (Imperf.) 13. du gehst 14. ihr trugt (Perf.) 16. sie gehen 17. sie trug (Perf.); senkrecht: 1. ihr geht 2. du hattest getragen 3. wir waren gegangen 5. du gingst (Imperf.) 6. wir trugen (Perf.) 7. ich ging (Perf.) 10. geht! 12. tragt! 15. sie ging (Perf.). Lösung: der antike Name von Saragossa.","a":"Waagrecht: ieratis, tuli, istis (iistis), eo, iimus, ibat, ferebam, is, tulistis, eunt, tulit. Senkrecht: itis, tuleras, ieramus, ibas, tulimus, ii, ite, ferte, iit. Lösung: CAESARAUGUSTA (Caesar-Augusta)."},{"type":"task","q":"VI. Was kann qui, quae, quod alles bedeuten? Übersetze: Qui orator clarior erat quam Cicero? Qui dum consul est, rem publicam servavit, quae erat summo in periculo. Nam Catilinam, qui consules interficere constituerat, Romam relinquere coegit. In senatu, qui ab eo ipso convocatus erat, hanc orationem habuit: „Quod scelus a te commissum non est, Catilina? Omnia, quae fecisti, vidimus. Quam improba facinora tua sunt! Consilia quoque, quae cum sociis tuis improbissimis cepisti, nobis ignota non sunt. Libera rem publicam, quam sceleribus tuis iam diu terrebas, timore magno!“ Ita Catilina sponte sua Romam reliquit et se ad copias suas recepit, quae ante urbem coactae erant.","a":"Welcher Redner war berühmter als Cicero? (Fragepronomen) Dieser rettete, während er Konsul war, den Staat, der in höchster Gefahr war. (relativer Anschluss; Relativpronomen) Denn er zwang Catilina, der beschlossen hatte, die Konsuln zu töten, Rom zu verlassen. Im Senat, der von ihm selbst einberufen worden war, hielt er diese Rede: „Welches Verbrechen ist von dir nicht begangen worden, Catilina? (Fragepronomen) Alles, was du getan hast, haben wir gesehen. Wie schlecht sind deine Untaten! (Ausruf) Auch die Pläne, die du mit deinen ganz schlechten Gefährten gefasst hast, sind uns nicht unbekannt. Befreie den Staat, den du schon lange mit deinen Verbrechen erschreckt hast, von großer Furcht!“ So verließ Catilina freiwillig Rom und zog sich zu seinen Truppen zurück, die vor der Stadt versammelt worden waren."},{"type":"task","q":"VII. Bilde das PPP, stimme es mit dem Nomen überein und übersetze (Bsp.: amica amata – die geliebte Freundin): 1. socios (vocare) 2. civem (defendere) 3. nationis (vincere) 4. animali (occidere) 5. librum (reddere) 6. carminum (audire) 7. virgini (iuvare) 8. facinora (committere)","a":"1. socios vocatos – die gerufenen Gefährten; 2. civem defensum – den verteidigten Bürger; 3. nationis victae – des besiegten Volkes; 4. animali occiso – dem getöteten Tier; 5. librum redditum – das zurückgegebene Buch; 6. carminum auditorum – der gehörten Lieder; 7. virgini iutae – dem unterstützten Mädchen; 8. facinora commissa – die begangenen Untaten"},{"type":"task","q":"VIII. Setze ins Passiv und übersetze (Bsp.: Magister discipulos laudat → Discipuli a magistro laudantur): 1. Pueri amicum servant. 2. Rex consilium prudentius cepit. 3. Galli urbem expugnaverant. 4. Imperator milites fortissimos convocavit. 5. Puellae nos iam exspectant. 6. Pater te certe puniet.","a":"1. Amicus a pueris servatur. – Der Freund wird von den Buben gerettet. 2. Consilium prudentius a rege captum est. – Ein klügerer Plan wurde vom König gefasst. 3. Urbs a Gallis expugnata erat. – Die Stadt war von den Galliern erobert worden. 4. Milites fortissimi ab imperatore convocati sunt. – Die tapfersten Soldaten wurden vom Feldherrn zusammengerufen. 5. A puellis iam exspectamur. – Wir werden von den Mädchen schon erwartet. 6. A patre certe punieris. – Du wirst vom Vater sicher bestraft werden."},{"type":"task","q":"IX. Übungstext zur Kasuslehre – übersetze: Cui discipulorum horae Latinae non maxime placent? Nemo nostrum horas Latinas non amat. Nihil nos horis Latinis prohibere potest. Horae Latinae enim omnium horarum pulcherrimae sunt. Magister noster, vir summae prudentiae, nos semper pulchris libris Latinis delectat. Post meridiem quoque et nocte, cum nobis otium est, libenter libros Latinos legimus.","a":"Wem von den Schülern gefallen die Lateinstunden nicht sehr? Niemand von uns liebt die Lateinstunden nicht. Nichts kann uns von den Lateinstunden fernhalten. Die Lateinstunden sind nämlich die schönsten von allen Stunden. Unser Lehrer, ein Mann von höchster Klugheit, erfreut uns immer mit schönen lateinischen Büchern. Auch am Nachmittag und in der Nacht, wenn wir Freizeit haben, lesen wir gern lateinische Bücher."},{"type":"task","q":"X. Jeder Satz hat einen inhaltlichen Fehler – stelle ihn richtig: 1. Catilina, qui multa artificia pulcherrima e Sicilia abstulerat, oratione Ciceronis adductus ex urbe fugere constituit. 2. Cleopatra, postquam eius copiae apud Actium oppidum victae sunt, se ipsam gladio necavit. 3. Populus Romanus, quem Hannibal maxime timebat, magno cum metu clamavit: „Hannibal ante portas!“ 4. Quod iis uxores non erant, Sabini feminas rapere constituerunt. 5. Caesar, qui paucis annis omnes fere civitates Germanorum vicerat, legiones suas in patriam duxit. 6. Sisyphus, cuius carmina pulcherrima erant, uxorem in Tartaro quaerebat.","a":"1. Nicht Catilina, sondern Verres raubte die Kunstwerke aus Sizilien (Catilina floh wegen Ciceros Rede). 2. Cleopatra tötete sich nicht mit dem Schwert, sondern mit (dem Biss) einer Schlange. 3. Umgekehrt: Das römische Volk fürchtete Hannibal sehr (qui Hannibalem maxime timebat). 4. Nicht die Sabiner, sondern die Römer raubten die Frauen. 5. Caesar besiegte fast alle Stämme der Gallier, nicht der Germanen. 6. Nicht Sisyphus, sondern Orpheus (der schöne Lieder sang) suchte seine Frau im Tartarus."},{"type":"task","q":"XI. Setze ein (cui – eam – hoc – ille – illius – istas – quendam) und übersetze: Caesar, ___ imperator clarissimus, priusquam bellum in Gallia gessit, a senatu in Hispaniam provinciam missus erat. Dum iter per montes in ___ provinciam facit, cum nonnullis sociis ad vicum (Dorf) ___ minimum venit, ubi pauci homines vivebant. Unus e sociis, ___ Caesaris cupiditas potestatis ignota non erat, risit dixitque: „Vide, Caesar, ___ domus miserrimas! Incolae ___ vici cura potestatis honorumque certe non afficiuntur.“ Cui Caesar ___ respondit: „Malo (ich will lieber) in eo vico primus esse quam Romae secundus.“","a":"ille – eam – quendam – cui – istas – illius – hoc.\nÜbersetzung: Caesar, jener hochberühmte Feldherr, war, bevor er in Gallien Krieg führte, vom Senat in die Provinz Hispanien geschickt worden. Während er über die Berge in diese Provinz reiste, kam er mit einigen Gefährten zu einem gewissen sehr kleinen Dorf, wo wenige Menschen lebten. Einer der Gefährten, dem Caesars Gier nach Macht nicht unbekannt war, lachte und sagte: „Sieh, Caesar, diese ganz elenden Häuser da! Die Bewohner jenes Dorfes werden sicher nicht von der Sorge um Macht und Ehren erfasst.“ Ihm antwortete Caesar dies: „Ich will lieber in diesem Dorf der Erste sein als in Rom der Zweite.“"}]},{"title":"Repetitiones zu Lektion 21–25","blocks":[{"type":"task","q":"I. Bilde Adverbia und setze beide Formen in Komparativ und Superlativ: 1. clarus 2. acer 3. facilis 4. malus","a":"1. clarus – clare; clarior/clarius (Adv. clarius); clarissimus (Adv. clarissime). 2. acer – acriter; acrior/acrius (Adv. acrius); acerrimus (Adv. acerrime). 3. facilis – facile; facilior/facilius (Adv. facilius); facillimus (Adv. facillime). 4. malus – male; peior/peius (Adv. peius); pessimus (Adv. pessime)."},{"type":"task","q":"II. Adjektiv oder Adverb? Übersetze (manche Formen können beides sein): acerrimis – altius – celeribus – magnifice – diligenter – dulciora – crudeliter – facilius – forte – breve – firmiores – laetissimam – honestissimum – noviores – nobiliori – peius – pulchre – veros – difficillimi","a":"Nur Adjektiv: acerrimis (den heftigsten), celeribus (den schnellen), dulciora (süßere), breve (kurz, n.), firmiores (stärkere), laetissimam (die fröhlichste), honestissimum (den/das ehrenhafteste), noviores (neuere), nobiliori (dem vornehmeren), veros (die wahren), difficillimi (des schwierigsten / die schwierigsten). Nur Adverb: magnifice (prächtig), diligenter (sorgfältig), crudeliter (grausam), pulchre (schön). Beides: altius (höher), facilius (leichter), peius (schlechter), forte (Adv. „zufällig“ / Adj. n. „tapfer“)."},{"type":"task","q":"III. Setze ins Futur, Imperfekt, Perfekt und Plusquamperfekt: 1. orat 2. ponuntur 3. adsumus 4. vis","a":"1. orabit – orabat – oravit – oraverat; 2. ponentur – ponebantur – positi sunt – positi erant; 3. aderimus – aderamus – adfuimus – adfueramus; 4. voles – volebas – voluisti – volueras"},{"type":"task","q":"IV. Setze in den Konjunktiv Präsens, Imperfekt, Perfekt, Plusquamperfekt (Aktiv und Passiv): 1. mandat 2. laeditis","a":"1. Aktiv: mandet – mandaret – mandaverit – mandavisset; Passiv: mandetur – mandaretur – mandatus sit – mandatus esset. 2. Aktiv: laedatis – laederetis – laeseritis – laesissetis; Passiv: laedamini – laederemini – laesi sitis – laesi essetis."},{"type":"task","q":"V. Übersetze: 1. ut dixi 2. ut dicerem 3. cum crederemus 4. ut postulatum est 5. cum apparent 6. cum promissum sit 7. ut prosit 8. cum certarent 9. ne erres 10. cum caesi essent 11. ut speraveras 12. cum nollemus","a":"1. wie ich gesagt habe; 2. dass/damit/sodass ich sagte; 3. als/weil/obwohl wir glaubten; 4. wie gefordert worden ist; 5. (immer) wenn sie erscheinen; 6. weil/obwohl es versprochen worden ist; 7. damit/dass es nützt; 8. als/weil sie stritten; 9. damit du dich nicht irrst; 10. als/nachdem sie getötet worden waren; 11. wie du gehofft hattest; 12. als/weil/obwohl wir nicht wollten"},{"type":"task","q":"VI. Übersetze: 1. Graeci, cum moenia Troiae decem annos frustra oppugnavissent, iam de victoria dubitabant. 2. Ne Graeci sine Helena in patriam redirent, Ulixes consilium prudens cepit. 3. Ulixes viris imperavit, ut equum ingentem aedificarent. 4. Deinde Graeci, ut apud quosdam poetas legimus, hunc equum ante moenia posuerunt. 5. Cum Graeci litus reliquissent, Troiani equum spectabant. 6. A viro quodam, quem Graeci solum reliquerant, quaesiverunt, cur ille equus hic positus esset. 7. Deinde Troiani, cum illud artificium donum deorum putarent, equum in arcem traxerunt. 8. Nos scimus, quomodo Troia deinde expugnata sit.","a":"1. Weil die Griechen die Mauern Trojas zehn Jahre vergeblich bestürmt hatten, zweifelten sie schon am Sieg. 2. Damit die Griechen nicht ohne Helena in die Heimat zurückkehrten, fasste Odysseus einen klugen Plan. 3. Odysseus befahl den Männern, ein riesiges Pferd zu bauen. 4. Dann stellten die Griechen, wie wir bei gewissen Dichtern lesen, dieses Pferd vor die Mauern. 5. Als die Griechen den Strand verlassen hatten, betrachteten die Trojaner das Pferd. 6. Sie fragten einen gewissen Mann, den die Griechen allein zurückgelassen hatten, warum jenes Pferd hier aufgestellt worden sei. 7. Dann zogen die Trojaner das Pferd in die Burg, weil sie jenes Kunstwerk für ein Geschenk der Götter hielten. 8. Wir wissen, wie Troja dann erobert wurde."},{"type":"task","q":"VII. Bilde die Partizipien, setze sie richtig ein und übersetze: 1. Apollo virgini ___ (amare) donum maximum promisit. 2. Illa, cum rem ___ (promittere) accepisset, deum celeriter reliquit. 3. „Donum sine usu ___ (sperare) erit“, deus iratus dixit. 4. Dum Paris mulierem ___ (rapere) domum ducit, Cassandra Troianos iterum ac iterum de periculo monuit. 5. At homines ab ea ___ (monere) eius verbis credere noluerunt.","a":"1. amatae – Apollo versprach dem geliebten Mädchen ein sehr großes Geschenk. 2. promissam – Als jene die versprochene Sache erhalten hatte, verließ sie den Gott schnell. 3. speratum – „Das erhoffte Geschenk wird ohne Nutzen sein“, sagte der Gott zornig. 4. raptam – Während Paris die geraubte Frau nach Hause führt, warnte Kassandra die Trojaner immer wieder vor der Gefahr. 5. moniti – Aber die von ihr gewarnten Menschen wollten ihren Worten nicht glauben."},{"type":"task","q":"VIII. Bilde Infinitiv Präsens aktiv, Perfekt aktiv und Perfekt passiv: 1. augeo 2. tollo 3. punio 4. rapio","a":"1. augere – auxisse – auctum esse; 2. tollere – sustulisse – sublatum esse; 3. punire – punivisse – punitum esse; 4. rapere – rapuisse – raptum esse"},{"type":"task","q":"IX. Bestimme Subjektsakkusativ und Infinitiv und übersetze: 1. Magister discipulos sibi de feriis (Ferien) suis narrare iubet. 2. Quintus se feriis cum nonnullis puellis pulcherrimis convenisse narrat. 3. Gaius dicit se multum discere voluisse, sed semper ab amicis prohibitum esse. 4. Claudia dicit se summo gaudio ad insulas Graecas navigavisse. 5. Iulia se clam cum amico novo iter ad mare fecisse non narrat. 6. Se otio maxime delectatos esse complures discipuli dicunt. 7. Nemo autem discipulorum magistro dicit se scholam et magistros iam magno cum gaudio exspectavisse. 8. Plurimos discipulos ferias tempus pulcherrimum putare constat.","a":"1. discipulos – narrare: Der Lehrer lässt die Schüler ihm von ihren Ferien erzählen. 2. se – convenisse: Quintus erzählt, dass er sich in den Ferien mit einigen sehr schönen Mädchen getroffen habe. 3. se – voluisse / prohibitum esse: Gaius sagt, er habe viel lernen wollen, sei aber immer von den Freunden daran gehindert worden. 4. se – navigavisse: Claudia sagt, sie sei mit größter Freude zu den griechischen Inseln gesegelt. 5. se – fecisse: Julia erzählt nicht, dass sie heimlich mit einem neuen Freund eine Reise ans Meer gemacht hat. 6. se – delectatos esse: Mehrere Schüler sagen, dass sie sich an der Freizeit sehr erfreut hätten. 7. se – exspectavisse: Keiner der Schüler aber sagt dem Lehrer, dass er die Schule und die Lehrer schon mit großer Freude erwartet habe. 8. discipulos – putare: Es steht fest, dass die meisten Schüler die Ferien für die schönste Zeit halten."},{"type":"task","q":"X. Forme zu einem ACI um (achte auf die Zeit!): 1. Daedalus videt: „Filius mortuus est.“ 2. Theseus audit: „Minotaurus liberos interficit.“ 3. Constat: „Cleopatra se ipsam necavit.“ 4. Troiani putant: „Graeci domum navigant.“ 5. Legimus: „Galli a Caesaris copiis victi sunt.“ 6. Orpheus intellegit: „Uxorem iterum amisi.“","a":"1. Daedalus videt filium mortuum esse. 2. Theseus audit Minotaurum liberos interficere. 3. Constat Cleopatram se ipsam necavisse. 4. Troiani putant Graecos domum navigare. 5. Legimus Gallos a Caesaris copiis victos esse. 6. Orpheus intellegit se uxorem iterum amisisse."},{"type":"task","q":"XI. Ergänze die Endungen und übersetze: Penelopa, uxor Ulixis, multos annos maritum amat__ exspectare debuit. Saepe, cum de mortibus quorundam virorum fort__ audivisset, metu magn__ affecta est. Speraba__ deos Ulixem adiuvare. Post decem annos magno cum gaudi__ a nuntiis audivit Troiam tandem expugnat__ esse. Iidem dixerunt Ulixem cum ceter__ Graec__ navem ascendisse, ut patriam peteret. Penelopa maxime gaudebat, sed tamen Ulixes non redi__. Itaque nuntios ad alios reg__ Graecos, qui interea domum redi__, misit. Nemo autem Ulixem post illud bellum atro__ viderat. Plurimi homin__ Ulixem interfectum esse putabant. Itaque multi viri apud Penelopam conven__, qui hanc feminam pulchram et divit__ in matrimonium ducere volebant. At fides illius mulier__ maxima erat. Nemo ei persuadere potuit Ulixem mortu__ esse.","a":"amatum – fortium – magno – Sperabat – gaudio – expugnatam – ceteris Graecis – rediit – reges – redierant – atrox – homines – convenerunt – divitem – mulieris – mortuum.\nÜbersetzung: Penelope, die Frau des Odysseus, musste viele Jahre ihren geliebten Ehemann erwarten. Oft wurde sie von großer Angst erfüllt, wenn sie vom Tod gewisser tapferer Männer gehört hatte. Sie hoffte, dass die Götter Odysseus helfen. Nach zehn Jahren hörte sie mit großer Freude von Boten, dass Troja endlich erobert worden sei. Dieselben sagten, Odysseus habe mit den übrigen Griechen ein Schiff bestiegen, um in die Heimat zu fahren. Penelope freute sich sehr, aber dennoch kehrte Odysseus nicht zurück. Deshalb schickte sie Boten zu anderen griechischen Königen, die inzwischen nach Hause zurückgekehrt waren. Niemand aber hatte Odysseus nach jenem schrecklichen Krieg gesehen. Die meisten Menschen glaubten, Odysseus sei getötet worden. Deshalb kamen viele Männer bei Penelope zusammen, die diese schöne und reiche Frau heiraten wollten. Aber die Treue jener Frau war sehr groß. Niemand konnte sie überzeugen, dass Odysseus tot sei."},{"type":"task","q":"XII. Fremdwörter aus Perfektpartizipien – waagrecht: 3. Tatsachen (Pl.) 5. Satzungen (Pl.) 7. anvertrautes Geld 9. Auftrag (meist an Politiker) 11. jemand, der in Rechtsstreitigkeiten herbeigerufen wird 12. Auszug aus pflanzlichen Stoffen 13. Anweisung, welche Arzneien man nehmen soll; senkrecht: 1. Forderung 2. Angabe, wann ein Schriftstück herausgegeben wurde 4. etwas (meist Süßes) Zubereitetes 6. Sichtvermerk im Reisepass 8. etwas Zurückgelassenes 10. schriftlicher Beschluss. Lösung: lateinischer Name von Preußen.","a":"Waagrecht: Fakten (factum), Statuten (statutum), Kredit (creditum), Mandat (mandatum), Advokat (advocatus), Extrakt (extractum), Rezept (receptum). Senkrecht: Postulat (postulatum), Datum (datum), Konfekt (confectum), Visum (visum), Relikt (relictum), Dekret (decretum). Lösung: BORUSSIA."}]},{"title":"Repetitiones zu Lektion 26–30","blocks":[{"type":"task","q":"I. Setze in alle Zeiten (Präsens, Imperfekt, Futur, Perfekt, Plusquamperfekt): 1. accusamus 2. scis 3. sunt 4. veretur","a":"1. accusamus – accusabamus – accusabimus – accusavimus – accusaveramus; 2. scis – sciebas – scies – scivisti – sciveras; 3. sunt – erant – erunt – fuerunt – fuerant; 4. veretur – verebatur – verebitur – veritus (-a) est – veritus (-a) erat"},{"type":"task","q":"II. Deponens oder echtes Passiv? Ordne und übersetze: hortamini – superamini – traditur – ornatum – referetur – dubitatur – rogari – metuebamur – sequi – locuti sunt – queruntur – quaeruntur – passa erat – divisum est – sequor – ducor – iuvaris – loquere","a":"Deponens: hortamini (ihr fordert auf / fordert auf!), sequi (folgen), locuti sunt (sie haben gesprochen), queruntur (sie klagen), passa erat (sie hatte erlitten), sequor (ich folge), loquere (sprich!). Echtes Passiv: superamini (ihr werdet besiegt), traditur (es wird überliefert), ornatum (geschmückt), referetur (es wird berichtet werden), dubitatur (es wird gezweifelt), rogari (gefragt werden), metuebamur (wir wurden gefürchtet), quaeruntur (sie werden gesucht), divisum est (es ist geteilt worden), ducor (ich werde geführt), iuvaris (du wirst unterstützt)."},{"type":"task","q":"III. Bilde alle Infinitive, die Imperative und die Partizipien: 1. nuntio 2. scribo 3. tollo 4. patior","a":"1. nuntiare, nuntiari, nuntiavisse, nuntiatum esse, nuntiaturum esse; nuntia! nuntiate!; nuntians, nuntiatus, nuntiaturus. 2. scribere, scribi, scripsisse, scriptum esse, scripturum esse; scribe! scribite!; scribens, scriptus, scripturus. 3. tollere, tolli, sustulisse, sublatum esse, sublaturum esse; tolle! tollite!; tollens, sublatus, sublaturus. 4. pati, passum esse, passurum esse; patere! patimini!; patiens, passus, passurus."},{"type":"task","q":"IV. Subjektsakkusativ und Infinitiv – übersetze (Zeitverhältnis!): 1. Nero princeps artem suam etiam a dis amari putabat. 2. Romam incendio maximo vastatam esse constat. 3. Nero urbem a Christianis incensam esse dixit. 4. Cives Neronem ipsum Romam incendisse dixerunt. 5. Cives Romani in amphitheatro Christianos a bestiis interfici viderunt. 6. Scimus Petrum quoque eo tempore interisse.","a":"1. artem – amari (gleichzeitig): Kaiser Nero glaubte, dass seine Kunst auch von den Göttern geliebt werde. 2. Romam – vastatam esse (vorzeitig): Es steht fest, dass Rom durch einen sehr großen Brand verwüstet worden ist. 3. urbem – incensam esse: Nero sagte, die Stadt sei von den Christen angezündet worden. 4. Neronem – incendisse: Die Bürger sagten, Nero selbst habe Rom angezündet. 5. Christianos – interfici (gleichzeitig): Die römischen Bürger sahen, wie die Christen im Amphitheater von wilden Tieren getötet wurden. 6. Petrum – interisse: Wir wissen, dass auch Petrus zu dieser Zeit umgekommen ist."},{"type":"task","q":"V. Partizipien und Bezugswörter – übersetze: 1. Discipuli magno cum gaudio magistrum novos libros Latinos ferentem conspiciunt. 2. Nihil enim pulchrius est quam libros lingua Latina scriptos legere. 3. At libros ante nonnullos dies a magistro acceptos iam legerunt. 4. Nam discipulis linguam Latinam maxime amantibus eos libros non solum in schola, sed etiam domi legere placebat.","a":"1. magistrum – ferentem: Die Schüler erblicken mit großer Freude den Lehrer, der neue lateinische Bücher bringt. 2. libros – scriptos: Nichts ist nämlich schöner, als Bücher zu lesen, die in lateinischer Sprache geschrieben sind. 3. libros – acceptos: Aber die Bücher, die sie vor einigen Tagen vom Lehrer bekommen hatten, haben sie schon gelesen. 4. discipulis – amantibus: Denn den Schülern, die die lateinische Sprache sehr lieben, gefiel es, diese Bücher nicht nur in der Schule, sondern auch zu Hause zu lesen."},{"type":"task","q":"VI. Ordne den richtigen Ablativus absolutus zu und übersetze: 1. … Petrus deo gratias agens in urbem redire constituit. 2. … equus in oppidum trahitur. 3. … Maxentius metu mortis commotus Romam relinquere verebatur. 4. … subito miraculum accidisse dicitur. 5. … Graeci hostes vincere non possunt. 6. … princeps Christianos comprehendi ac puniri iussit. 7. … Ulixes decem annos patria prohibetur. 8. … Spartacus cum copiis Romanis pugnare non dubitavit. 9. … Galli Capitolium ascendere coeperunt. – a) Achille proeliis abstinente b) Christo viso c) Militibus sitim vix tolerantibus d) Multis servis coactis e) Oraculo consulto f) Romanis dormientibus g) Troia occupata h) Urbe incendio vastata i) Verbis Cassandrae neglectis","a":"1. b – Nachdem er Christus gesehen hatte, beschloss Petrus, Gott dankend, in die Stadt zurückzukehren. 2. i – Weil die Worte Kassandras missachtet wurden, wird das Pferd in die Stadt gezogen. 3. e – Nachdem er das Orakel befragt hatte, scheute sich Maxentius, von Todesangst bewegt, Rom zu verlassen. 4. c – Als die Soldaten den Durst kaum ertrugen, soll plötzlich ein Wunder geschehen sein. 5. a – Weil Achill sich von den Kämpfen fernhält, können die Griechen die Feinde nicht besiegen. 6. h – Nachdem die Stadt durch einen Brand verwüstet worden war, ließ der Kaiser die Christen ergreifen und bestrafen. 7. g – Nach der Einnahme Trojas wird Odysseus zehn Jahre von der Heimat ferngehalten. 8. d – Nachdem er viele Sklaven versammelt hatte, zögerte Spartacus nicht, mit den römischen Truppen zu kämpfen. 9. f – Während die Römer schliefen, begannen die Gallier, das Kapitol hinaufzusteigen."},{"type":"task","q":"VII. Partizipien: Ablativus absolutus oder Participium coniunctum? Übersetze: Troiani equum magnum consilio Ulixis in litore relictum invenerunt et locuti sunt: „Hoc artificium a Graecis summa arte confectum certe donum deorum est.“ At Cassandra res futuras videns iterum et iterum hortabatur: „Ne hunc equum perniciem (Untergang) nostram secum ferentem in oppidum traxeritis!“ Tamen Troiani verbis Cassandrae numquam credentes equum per portam traxerunt. Equo in arce posito Troiani victoriam diu celebrabant. Nocte autem Troianis bene dormientibus Graeci cum armis in illo equo inclusi magnam caedem commiserunt. Deinde oppidum tam diu frustra oppugnatum incenderunt deleveruntque.","a":"PC: equum … relictum, artificium … confectum, Cassandra … videns, equum … ferentem, Troiani … credentes, Graeci … inclusi, oppidum … oppugnatum. Abl. abs.: Equo … posito, Troianis … dormientibus.\nÜbersetzung: Die Trojaner fanden das große Pferd, das nach dem Plan des Odysseus am Strand zurückgelassen worden war, und sagten: „Dieses Kunstwerk, das von den Griechen mit höchster Kunst angefertigt wurde, ist sicher ein Geschenk der Götter.“ Aber Kassandra, die die Zukunft sah, mahnte immer wieder: „Zieht dieses Pferd, das unseren Untergang mit sich bringt, nicht in die Stadt!“ Dennoch zogen die Trojaner, die den Worten Kassandras niemals glaubten, das Pferd durch das Tor. Nachdem das Pferd in der Burg aufgestellt worden war, feierten die Trojaner lange den Sieg. In der Nacht aber, während die Trojaner tief schliefen, richteten die Griechen, die mit Waffen in jenem Pferd eingeschlossen waren, ein großes Blutbad an. Dann zündeten sie die Stadt, die so lange vergeblich belagert worden war, an und zerstörten sie."},{"type":"task","q":"VIII. Setze in die Konjunktive Präsens, Imperfekt, Perfekt, Plusquamperfekt und übersetze (beim Konj. Perfekt ergänze ein ne): 1. sumitis 2. venitis 3. fles 4. vereris","a":"1. sumatis (ihr sollt nehmen) – sumeretis (ihr würdet nehmen) – ne sumpseritis (nehmt nicht!) – sumpsissetis (ihr hättet genommen); 2. veniatis (ihr sollt kommen) – veniretis (ihr würdet kommen) – ne veneritis (kommt nicht!) – venissetis (ihr wärt gekommen); 3. fleas (du sollst weinen) – fleres (du würdest weinen) – ne fleveris (weine nicht!) – flevisses (du hättest geweint); 4. verearis (du sollst fürchten) – vererere (du würdest fürchten) – ne veritus sis (fürchte nicht!) – veritus esses (du hättest gefürchtet)"},{"type":"task","q":"IX. Übersetze – achte auf die Konjunktive: 1. Graeci putabant: „Nisi Achilles proeliis abstineret, hostes certe vinceremus.“ 2. Ut liberam rem publicam servarent, Cassius et Brutus statuerunt: „Iulius Caesar occidatur!“ 3. Daedalus filium suum monuit: „Ne altius ad solem ascenderis!“ 4. Troiani, cum equum ingentem spectavissent, clamabant: „Hoc artificium in arce ponatur!“ 5. Si Troiani verbis Cassandrae credidissent, oppidum expugnatum non esset. 6. Cum tres deae certarent, Iuppiter decrevit: „Paris iudicet et pulcherrimam deligat!“ 7. Theseus, cum navem ascenderet, ad parentes liberorum delectorum locutus est: „Ne questi sitis! Mox vobis liberi vestri reddentur.“ 8. Ne ipse auctor incendii putaretur, Nero constituit: „Christiani, cum Romam incenderint, comprehendantur et puniantur!“","a":"1. Die Griechen glaubten: „Wenn Achill sich nicht von den Kämpfen fernhielte, würden wir die Feinde sicher besiegen.“ (Irrealis der Gegenwart) 2. Um den Staat frei zu erhalten, beschlossen Cassius und Brutus: „Julius Caesar soll getötet werden!“ (Iussiv) 3. Daedalus ermahnte seinen Sohn: „Steig nicht zu hoch zur Sonne hinauf!“ (Prohibitiv) 4. Als die Trojaner das riesige Pferd betrachtet hatten, riefen sie: „Dieses Kunstwerk soll in der Burg aufgestellt werden!“ 5. Wenn die Trojaner den Worten Kassandras geglaubt hätten, wäre die Stadt nicht erobert worden. (Irrealis der Vergangenheit) 6. Als drei Göttinnen stritten, entschied Jupiter: „Paris soll urteilen und die Schönste auswählen!“ 7. Als Theseus das Schiff bestieg, sprach er zu den Eltern der ausgewählten Kinder: „Klagt nicht! Bald werden euch eure Kinder zurückgegeben werden.“ 8. Damit er nicht selbst für den Urheber des Brandes gehalten würde, beschloss Nero: „Die Christen sollen, weil sie Rom angezündet haben, ergriffen und bestraft werden!“"},{"type":"task","q":"X. Übersetze: 1. studium discendi 2. in discendo 3. ad discendum 4. discendi causa 5. studium linguae Graecae discendae 6. linguis alienis discendis 7. ad multa discenda 8. in his verbis discendis 9. Nunc est discendum. 10. Lingua Latina discenda est. 11. Discipulis multum discendum est. 12. Cur mihi lingua Graeca discenda non est? 13. Scimus nobis multas res difficiles discendas esse.","a":"1. der Eifer zu lernen (Lerneifer); 2. beim Lernen; 3. zum Lernen; 4. um zu lernen; 5. der Eifer, die griechische Sprache zu lernen; 6. durch das Lernen fremder Sprachen; 7. um vieles zu lernen; 8. beim Lernen dieser Wörter; 9. Jetzt muss gelernt werden. 10. Die lateinische Sprache muss gelernt werden. 11. Die Schüler müssen viel lernen. 12. Warum muss ich die griechische Sprache nicht lernen? 13. Wir wissen, dass wir viele schwierige Dinge lernen müssen."},{"type":"task","q":"XI. Gerundium, Gerundivkonstruktion oder „müssen“-Gerundiv? Übersetze: 1. Capite vertendo Orpheus uxorem amatam iterum amisit. 2. Cum Polyphemus viros inclusisset, Ulixi consilium prudens capiendum erat. 3. Octavianus a senatu in Aegyptum missus est ad Antonium vincendum. 4. Daedalo Creta insula diu relinquenda non erat. 5. Cum Petrus comprehensus esset, nonnulli amici advenerunt illius viri liberandi causa. 6. Veste sua dividenda Martinus virum pauperem adiuvit. 7. Cum Graecis spes Troiae expugnandae non iam esset, Ulixes equum aedificari iussit. 8. Temporibus Marci Aurelii imperatoris Christiani orando exercitum Romanum servaverunt. 9. Romanis saepe cum populis alienis bellum gerendum erat. 10. In Troia oppugnanda multi viri fortissimi laesi aut occisi sunt.","a":"1. Gerundivkonstruktion: Durch das Umwenden des Kopfes verlor Orpheus die geliebte Frau erneut. 2. „müssen“-Gerundiv: Als Polyphem die Männer eingeschlossen hatte, musste Odysseus einen klugen Plan fassen. 3. Gerundivkonstruktion: Octavian wurde vom Senat nach Ägypten geschickt, um Antonius zu besiegen. 4. „müssen“-Gerundiv: Daedalus konnte (durfte) die Insel Kreta lange nicht verlassen. 5. Gerundivkonstruktion: Als Petrus ergriffen worden war, kamen einige Freunde, um jenen Mann zu befreien. 6. Gerundivkonstruktion: Durch das Teilen seines Mantels half Martin dem armen Mann. 7. Gerundivkonstruktion: Als die Griechen keine Hoffnung mehr hatten, Troja zu erobern, ließ Odysseus ein Pferd bauen. 8. Gerundium: Zur Zeit des Kaisers Mark Aurel retteten die Christen durch Beten das römische Heer. 9. „müssen“-Gerundiv: Die Römer mussten oft mit fremden Völkern Krieg führen. 10. Gerundivkonstruktion: Bei der Belagerung Trojas wurden viele sehr tapfere Männer verletzt oder getötet."},{"type":"task","q":"XII. Rumores malos non dicam – übersetze: Dominus quidam laetus ex oppido alieno redibat, cum subito servum suum sibi obviam ire vidit. Ne ille, ut mos eius erat, sibi aliquos (irgendwelche) rumores (Gerüchte) narraret, dominus eum hortatus est: „Ne mihi rumores malos dixeris!“ Ille respondit: „Non dicam rumores malos, sed noster canis parvus interiit.“ Dominus de ea re minime dolens tamen interrogavit, quomodo canis interisset. Statim servus narravit: „Mulus (Maultier) noster territus est et, cum fugeret, sub pedibus suis canem occidit.“ Cum dominus ex eo quaesivisset, quid mulo accidisset, servus respondit eum in puteum (Brunnen) cecidisse et interisse. Dominus tum maiore cura commotus scire voluit, qua de causa mulus territus esset. Servus rettulit: „Filius tuus de solario (Balkon) cecidit – ita, ut necaretur, et ea re territus est mulus.“ Deinde dominus, cum rogavisset, quid uxor ageret, accepit eam dolore filii mortui ipsam interisse. Postremo dominus interrogavit, quis nunc domum custodiret (bewachen). Servus dixit: „Nemo, quia domus et, quidquid in ea erat, combusta (eingeäschert) sunt. Eadem enim nocte, qua uxor tua interiit, serva, quae vigilabat (wachte) pro ea, oblita (vergaß) est candelam (Kerze) in thalamo (Schlafzimmer), et ita tota domus flammis deleta est.“","a":"Ein gewisser Herr kehrte fröhlich aus einer fremden Stadt zurück, als er plötzlich sah, dass sein Sklave ihm entgegenkam. Damit jener ihm nicht, wie es seine Gewohnheit war, irgendwelche Gerüchte erzähle, ermahnte ihn der Herr: „Erzähl mir keine schlechten Gerüchte!“ Jener antwortete: „Ich werde keine schlechten Gerüchte erzählen, aber unser kleiner Hund ist gestorben.“ Der Herr, der darüber keineswegs traurig war, fragte dennoch, wie der Hund gestorben sei. Sofort erzählte der Sklave: „Unser Maultier ist erschreckt worden und hat, als es floh, den Hund unter seinen Füßen getötet.“ Als der Herr ihn gefragt hatte, was dem Maultier zugestoßen sei, antwortete der Sklave, es sei in den Brunnen gefallen und umgekommen. Da wollte der Herr, von größerer Sorge bewegt, wissen, aus welchem Grund das Maultier erschreckt worden sei. Der Sklave berichtete: „Dein Sohn ist vom Balkon gefallen – so, dass er getötet wurde, und dadurch ist das Maultier erschreckt worden.“ Als der Herr dann gefragt hatte, was seine Frau mache, erfuhr er, dass sie selbst aus Schmerz über den toten Sohn gestorben sei. Schließlich fragte der Herr, wer jetzt das Haus bewache. Der Sklave sagte: „Niemand, weil das Haus und alles, was darin war, eingeäschert worden sind. In derselben Nacht nämlich, in der deine Frau starb, vergaß die Sklavin, die bei ihr wachte, die Kerze im Schlafzimmer, und so wurde das ganze Haus von den Flammen zerstört.“"}]}]},{"id":"lekt","icon":"📜","title":"Autorenlektüre","sub":"Originaltexte von Cäsar bis Marco Polo – mit Vokabelhilfen und Übersetzung (S. 156 ff.)","grammar":[{"title":"I.1 A – Die Völker Galliens (Caesar, Bellum Gallicum 1,1)","blocks":[{"type":"text","text":"Im 4. Jh. v. Chr. waren die Gallier tief nach Italien vorgedrungen und hatten sogar Rom belagert. Im 1. Jh. v. Chr. eroberten die Römer unter Cäsar 58–51 v. Chr. ganz Gallien. Die beste (wenn auch nicht objektive) Quelle ist Cäsars Kriegsbericht „Commentarii de bello Gallico“. Der Anfang ist eine der berühmtesten Stellen der lateinischen Literatur:"},{"type":"text","text":"Gallia est omnis divisa in partes tres. Quarum unam incolunt Belgae, aliam Aquitani, tertiam (ii), qui ipsorum lingua Celtae, nostra (lingua) Galli appellantur. Hi omnes lingua, institutis, legibus inter se differunt. (…) Horum omnium fortissimi sunt Belgae, propterea quod a cultu atque humanitate provinciae longissime absunt, minimeque ad eos mercatores saepe commeant atque ea, quae ad effeminandos animos pertinent, important, proximique sunt Germanis, qui trans Rhenum incolunt, quibuscum continenter bellum gerunt. Qua de causa Helvetii quoque reliquos Gallos virtute praecedunt, quod fere cotidianis proeliis cum Germanis contendunt, cum aut suis finibus eos prohibent aut ipsi in eorum finibus bellum gerunt."},{"type":"gloss","text":"institutum, -i: „Brauch“; differre: „sich unterscheiden“; cultus, -us: „Kultur“; humanitas, -atis f.: „Zivilisation“; provincia: die römische Provinz in Südgallien (Provence); minime … saepe: „ganz selten“; commeare = venire; pertinere ad: „dienen zu“; effeminare: „verweichlichen“; continenter: „ununterbrochen“; praecedere = superare."},{"type":"task","q":"Übersetze den Text.","a":"Gallien ist als Ganzes in drei Teile geteilt. Den einen davon bewohnen die Belger, den anderen die Aquitanier, den dritten die, die in ihrer eigenen Sprache Kelten, in unserer Gallier genannt werden. Diese alle unterscheiden sich untereinander in Sprache, Bräuchen und Gesetzen. Von diesen allen sind die Belger die tapfersten, weil sie von der Kultur und Zivilisation der Provinz am weitesten entfernt sind, Kaufleute ganz selten zu ihnen kommen und das einführen, was zur Verweichlichung der Gemüter dient, und weil sie den Germanen am nächsten sind, die jenseits des Rheins wohnen und mit denen sie ununterbrochen Krieg führen. Aus diesem Grund übertreffen auch die Helvetier die übrigen Gallier an Tapferkeit, weil sie fast täglich mit den Germanen kämpfen, indem sie sie entweder von ihrem Gebiet fernhalten oder selbst in deren Gebiet Krieg führen."}]},{"title":"I.1 B – Die Sitten der Gallier (Caesar, Bellum Gallicum 6,13)","blocks":[{"type":"text","text":"Cäsar beschreibt auch die Lebensweise der Gallier. Eine besondere Rolle spielen die ursprünglich aus Britannien kommenden Druiden."},{"type":"text","text":"Druides rebus divinis intersunt, sacrificia publica ac privata procurant, religiones interpretantur. Ad hos magnus adulescentium numerus disciplinae causa concurrit, magnoque hi sunt apud eos honore. Nam fere de omnibus controversiis publicis privatisque constituunt, et, si quod est commissum facinus, si caedes facta (est), si de hereditate, de finibus controversia est, iidem decernunt, praemia poenasque constituunt. Si qui aut privatus aut populus eorum decreto non stetit, (eum) sacrificiis interdicunt. Haec poena apud eos est gravissima."},{"type":"gloss","text":"res divinae: „Kulthandlungen“; sacrificium: „Opfer“; procurare: „durchführen“; religio, -onis f.: „religiöse Lehre“; disciplina: „Unterricht“; hereditas, -atis f.: „Erbschaft“; praemium: hier „Entschädigung“; stare: hier „sich fügen“; interdicere (+ Abl.): „ausschließen (von)“."},{"type":"task","q":"Übersetze den Text.","a":"Die Druiden nehmen an den Kulthandlungen teil, führen die öffentlichen und privaten Opfer durch und legen die religiösen Lehren aus. Zu ihnen strömt eine große Zahl junger Männer, um unterrichtet zu werden, und sie stehen bei ihnen in großem Ansehen. Denn sie entscheiden über fast alle öffentlichen und privaten Streitigkeiten, und wenn ein Verbrechen begangen worden ist, wenn ein Mord geschehen ist, wenn es Streit um eine Erbschaft oder um Grenzen gibt, entscheiden ebenfalls sie und setzen Entschädigungen und Strafen fest. Wenn sich jemand, eine Privatperson oder ein Volk, ihrem Beschluss nicht fügt, schließen sie ihn von den Opfern aus. Diese Strafe ist bei ihnen die schwerste."}]},{"title":"I.1 C – Cäsars entscheidender Sieg (Caesar, Bellum Gallicum 7,88 f.)","blocks":[{"type":"text","text":"53 v. Chr. kommt es zum gesamtgallischen Aufstand unter dem Arvernerfürsten Vercingetorix. In der Schlacht bei Alesia (52 v. Chr.) besiegt Cäsar trotz zahlenmäßiger Unterlegenheit die Gallier entscheidend."},{"type":"text","text":"Hostes terga vertunt; fugientibus equites occurrunt. Fit magna caedes. Signa militaria LXXIV ad Caesarem referuntur: Pauci ex tanto numero se incolumes in castra recipiunt. Fit protinus hac re audita ex castris Gallorum fuga."},{"type":"text","text":"Am folgenden Tag beruft Vercingetorix eine Versammlung ein. Er erklärt, dass er den Krieg nicht aus Eigeninteresse, sondern wegen der gemeinsamen Freiheit begonnen habe; er stelle sich zur Verfügung – sei es, dass man die Römer durch seinen Tod zufriedenstellen, sei es, dass man ihn lebendig ausliefern wolle."},{"type":"text","text":"Mittuntur de his rebus ad Caesarem legati. Iubet arma tradi, principes produci. Ipse in munitione pro castris consedit. Eo duces producuntur. Vercingetorix deditur, arma proiciuntur."},{"type":"gloss","text":"terga vertunt = fugiunt; signum militare: „Feldzeichen“; incolumis/e: „unverletzt“; protinus = statim; de: hier „wegen“; munitio, -onis f.: „Schutzwall“; pro (+ Abl.): hier „vor“; proicere: „hinwerfen“."},{"type":"task","q":"Übersetze den Text.","a":"Die Feinde wenden sich zur Flucht; den Fliehenden kommen die Reiter entgegen. Es geschieht ein großes Gemetzel. 74 Feldzeichen werden zu Cäsar gebracht: Nur wenige aus so großer Zahl ziehen sich unverletzt ins Lager zurück. Sofort, nachdem man dies gehört hat, beginnt aus dem Lager der Gallier die Flucht. – Wegen dieser Dinge werden Gesandte zu Cäsar geschickt. Er befiehlt, die Waffen auszuliefern und die Anführer vorzuführen. Er selbst setzt sich auf dem Schutzwall vor dem Lager nieder. Dorthin werden die Anführer geführt. Vercingetorix wird ausgeliefert, die Waffen werden hingeworfen."}]},{"title":"Info: Romanisierung","blocks":[{"type":"text","text":"Unter Romanisierung versteht man die Übernahme der römischen Kultur durch andere Völker. Mit der Ausweitung des Imperiums verbreitete sich in den eroberten Ländern die römische Zivilisation (Straßen, Städtebau, Wohnbau, Rechtsprechung, Bräuche) – nicht zuletzt, weil viele ehemalige Soldaten (Veteranen) in den neuen Provinzen sesshaft wurden. Im Buch zeigt ein Asterix-Comic witzig das „Einsickern“ lateinischer Wörter ins Gallische (Forum, Auditorium, Ultimatum, Aquarium …) – ähnlich wie heute englische Fremdwörter ins Deutsche kommen."}]},{"title":"I.2 A – Cäsars Rheinübergang (Orosius 6,8,23 – 6,9,1)","blocks":[{"type":"text","text":"Den Germanen gegenüber waren die Römer bei Weitem nicht so erfolgreich wie gegen die Gallier. Als Cäsar im Gallienkrieg auch gegen germanische Truppen kämpfen musste, die den Galliern zu Hilfe gekommen waren, beschloss er, energisch gegen sie vorzugehen. Er legte als Erster die Rhein-Donau-Grenze als Trennungslinie zwischen Galliern und Germanen fest."},{"type":"text","text":"Caesar Germanos, qui Rhenum cum immensis copiis transmiserant et totas Gallias subicere sibi parabant, usque ad internecionem cecidit. Quorum fuisse numerum ad CXL milia ferunt. Tunc Caesar in Germaniam facto ponte transgreditur, Ubios obsidione liberat; Suebos, maximam et ferocissimam gentem, quorum esse centum pagos et populos multi prodiderunt, totamque Germaniam adventu suo terret; mox in Galliam rescisso ponte cedit."},{"type":"gloss","text":"transmittere: „überschreiten“; parare: hier „vorhaben“; caedere: hier „besiegen“; ferunt (+ ACI): „man sagt, dass“; Ubii: die Ubier (mit Cäsar verbündet); prodere, prodidi: „berichten“; rescindere, -scidi, -scissum: „abreißen“."},{"type":"task","q":"Übersetze den Text.","a":"Cäsar besiegte die Germanen, die mit gewaltigen Truppen den Rhein überschritten hatten und vorhatten, sich ganz Gallien zu unterwerfen, bis zur völligen Vernichtung. Ihre Zahl soll bis zu 140 000 betragen haben. Dann überschreitet Cäsar auf einer gebauten Brücke den Rhein nach Germanien und befreit die Ubier von der Belagerung; die Sueben, den größten und wildesten Stamm, von dem viele berichtet haben, er habe hundert Gaue und Völkerschaften, und ganz Germanien erschreckt er durch seine Ankunft; bald zieht er sich nach Gallien zurück und lässt die Brücke abreißen."}]},{"title":"I.2 B – Die Sitten der Germanen (Caesar, Bellum Gallicum 6,21/23)","blocks":[{"type":"text","text":"Cäsar beschreibt auch die Lebensweise der Germanen und hebt ihr kriegerisches Wesen und ihre Sittenstrenge hervor."},{"type":"text","text":"Vita omnis in venationibus atque in studiis rei militaris consistit; a parvulis labori ac duritiae student. (Ii,) qui diutissime impuberes permanserunt, maximam inter suos ferunt laudem: (Putant) hoc ali staturam, ali vires, nervosque confirmari putant. Ante annum vero vicesimum feminae notitiam habuisse in turpissimis habent rebus. Cuius rei nulla est occultatio, quod et promiscue in fluminibus perluuntur et pellibus aut parvis renonum tegimentis utuntur magna corporis parte nuda. […] Civitatibus maxima laus est quam latissime circum se vastatis finibus solitudines habere."},{"type":"gloss","text":"venatio: „Jagd“; studium rei militaris: „kriegerischer Eifer“; a parvulis: „von frühester Jugend an“; impubes: „unberührt, keusch“; ferunt = accipiunt; alere, alui: passiv „gefördert werden“; in turpissimis habere rebus: „zu den schlimmsten Dingen zählen“; cuius rei: „dafür“; perluere: passiv „baden“; reno, -onis m.: „Pelz“; magna … parte nuda (Abl. abs.): „während der Großteil … nackt ist“; quam (+ Superlativ): „möglichst“."},{"type":"task","q":"Übersetze den Text.","a":"Ihr ganzes Leben besteht aus Jagden und kriegerischem Eifer; von frühester Jugend an bemühen sie sich um Mühe und Abhärtung. Wer am längsten keusch geblieben ist, erhält bei den Seinen das größte Lob: Sie glauben, dadurch werde der Wuchs gefördert, die Kräfte gestärkt und die Muskeln gefestigt. Vor dem zwanzigsten Lebensjahr aber Kenntnis von einer Frau gehabt zu haben, zählen sie zu den schändlichsten Dingen. Dafür gibt es kein Verbergen, weil sie gemeinsam in den Flüssen baden und Felle oder kleine Pelzumhänge verwenden, wobei der Großteil des Körpers nackt ist. […] Für die Stämme ist es der größte Ruhm, möglichst weit um sich herum das Land verwüstet zu haben und Einöden zu besitzen."}]},{"title":"I.2 C – Die Schlacht im Teutoburger Wald (Florus 2,30)","blocks":[{"type":"text","text":"Im Jahr 9 n. Chr. erleiden die Römer eine ihrer schlimmsten Niederlagen: Drei Legionen unter Quintilius Varus werden vom Germanenfürsten Arminius überfallen und aufgerieben. Augustus soll gerufen haben: „Varus, gib mir meine Legionen zurück!“"},{"type":"text","text":"Sed difficilius est provincias obtinere quam facere; viribus parantur, iure retinentur. Igitur breve fuit id gaudium. Nam Germani victi magis quam domiti erant. Sub imperatore Druso mores nostros magis quam arma suspiciebant. Postquam ille mortuus est, Vari Quintili libidinem ac superbiam haud secus quam saevitiam odisse coeperunt. At illi, ubi togas et saeviora armis iura viderunt, duce Arminio arma corripiunt; (Varum) improvidum et nihil tale metuentem ex improviso adorti sunt et, cum ille (eos) ad tribunal citaret, undique invadunt; castra rapiuntur, tres legiones opprimuntur. Nihil illa caede per paludes perque silvas crudelius (fuit), nihil insultatione barbarorum intolerantius. Aliis oculos, aliis manus amputabant, unius os sutum (est), recisa prius lingua. Quam in manu tenens barbarus „Tandem“ ait, „vipera, sibilare desisti!“"},{"type":"gloss","text":"gaudium: die Freude der Römer über die neue Provinz; suspicere: „achten, respektieren“; libido, -inis f.: „Willkür“; haud secus: „genauso“; saeviora armis iura: „Gesetze, die schlimmer als die Waffen sind“; duce Arminio: „unter Führung des Arminius“; improvidus: „ahnungslos“; ex improviso: „aus heiterem Himmel“; ad tribunal citare: „zu Gericht rufen“; illa caede / insultatione: Ablative des Vergleichs („als …“); suere, sui, sutum: „zunähen“; recidere, -cidi, -cisum: „herausschneiden“; vipera: „Schlange“; sibilare: „zischen“."},{"type":"task","q":"Übersetze den Text.","a":"Aber es ist schwieriger, Provinzen zu behalten, als sie zu schaffen; sie werden mit Gewalt gewonnen, durch Recht festgehalten. Daher war jene Freude kurz. Denn die Germanen waren eher besiegt als gezähmt. Unter dem Feldherrn Drusus achteten sie eher unsere Sitten als unsere Waffen. Nachdem dieser gestorben war, begannen sie die Willkür und den Hochmut des Quintilius Varus genauso zu hassen wie seine Grausamkeit. Als jene aber die Togen und Gesetze sahen, die schlimmer waren als die Waffen, griffen sie unter Führung des Arminius zu den Waffen; sie überfielen Varus, der ahnungslos war und nichts dergleichen fürchtete, aus heiterem Himmel, und während er sie zu Gericht rief, griffen sie von allen Seiten an; das Lager wird erobert, drei Legionen werden überwältigt. Nichts war grausamer als jenes Gemetzel in den Sümpfen und Wäldern, nichts unerträglicher als der Hohn der Barbaren. Den einen stachen sie die Augen aus, anderen hackten sie die Hände ab, einem wurde der Mund zugenäht, nachdem vorher die Zunge herausgeschnitten worden war. Diese hielt ein Barbar in der Hand und sagte: „Endlich hast du aufgehört zu zischen, du Schlange!“"}]},{"title":"I.2 Arbeitsaufgaben (Römer und Germanen)","blocks":[{"type":"task","q":"A: Finde im Text verwandte lateinische Wörter zu: a) liberal, b) multiplizieren, c) populär, d) Terror, e) Zentimeter.","a":"a) liberat; b) multi; c) populos; d) terret; e) centum"},{"type":"task","q":"A: Richtig oder falsch? a) Cäsar hatte vor, ganz Gallien zu unterwerfen. b) Das germanische Heer bestand aus ca. einer Million Soldaten. c) Cäsar ließ eine Brücke errichten und kam so nach Germanien. d) Die Sueben waren das größte Volk der Germanen. e) Die Ankunft Cäsars erschreckte auch die Sueben.","a":"a) falsch – die Germanen wollten Gallien unterwerfen (Germanos, qui … subicere sibi parabant); b) falsch – rund 140 000; c) richtig; d) richtig (maximam gentem); e) richtig"},{"type":"task","q":"B: Richtig oder falsch? Bei den Germanen war geschlechtliche Frühreife hoch angesehen. – Gemeinsames Baden von Männern und Frauen war üblich. – Beim Baden wurde eine Art Fell-Bikini getragen. – Die Germanen waren darauf aus, immer Nachbarn um sich zu haben.","a":"falsch (wer am längsten keusch blieb, wurde gelobt) – richtig (promiscue perluuntur) – falsch (Felle oder kleine Pelze, der Großteil des Körpers blieb nackt) – falsch (sie wollten möglichst weit verwüstetes, leeres Land um sich)"},{"type":"task","q":"B: Wie übersetzt man a) qui (Z. 2) und b) et (Z. 5 f.)?","a":"a) „die“ (diejenigen, die …); b) „sowohl“ (et … et = sowohl … als auch)"},{"type":"task","q":"C: Nenne drei Antithesen im ersten Absatz.","a":"difficilius obtinere – facere; viribus parantur – iure retinentur; victi – domiti (bzw. mores – arma)"},{"type":"task","q":"C: Nenne fünf Begriffe aus dem Sachfeld „Krieg“.","a":"z. B. arma, castra, legiones, caedes, imperator (dux, viribus, adorti sunt, opprimuntur)"}]},{"title":"Info: Die Römer in Deutschland","blocks":[{"type":"text","text":"Nach den erfolglosen Versuchen, Germanien ganz zu erobern, sicherten die Römer die Rheingrenze und errichteten zwei Provinzen: Germania superior und Germania inferior. Auch hier kam es zur Romanisierung: Soldaten und Veteranen, Handwerker und Kaufleute ließen sich nieder; nach römischem Vorbild entstanden Straßen, Gutshöfe, Dörfer und Städte mit Theatern, Tempeln, Thermen und Wasserleitungen."},{"type":"task","q":"Welche modernen Städte sind aus Mogontiacum, Colonia Claudia Ara Agrippinensium und Augusta Treverorum entstanden?","a":"Mainz, Köln und Trier."}]},{"title":"I.3 A – Cäsars Strafexpedition (Historia Brittonum 19 f.)","blocks":[{"type":"text","text":"Während seines Krieges in Gallien brach Julius Cäsar auch zweimal zu einer Expedition nach Britannien auf."},{"type":"text","text":"Romani ad Brittannos miserunt legatos, ut obsides et censum acciperent ab illis, sicut accipiebant ab universis regionibus et insulis. Brittanni autem, cum essent tyranni et tumidi, legationem Romanorum contempserunt. Tunc Iulius Caesar iratus est valde et venit ad Brittanniam cum sexaginta ciulis et tenuit in ostium Tamesis; in quo naufragium perpessae sunt naves illius, dum ipse pugnabat apud Dolobellum, qui erat proconsul regis Brittannici; et Iulius reversus est sine victoria caesis militibus et fractis navibus. Et iterum post spatium trium annorum venit cum magno exercitu trecentisque ciulis et pervenit usque ad ostium fluminis, quod vocatur Tamesis. Et ibi (Romani) inierunt bellum et multi de equis militibusque suis ceciderunt, quia supra dictus proconsul posuerat sudes ferreos in vada fluminis. Discrimen magnum fuit militibus Romanorum haec ars invisibilis, et discesserunt sine pace in illa vice. Gestum est bellum tertio prope locum, qui dicitur Trinovantum; et accepit Iulius imperium Brittannicae gentis XLVII annis ante nativitatem Christi."},{"type":"gloss","text":"census, -us m.: „Steuern, Abgaben“; tumidus: „hochmütig“; contemnere, -tempsi:
