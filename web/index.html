<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --accent:#9a1c22; --accent2:#e8be5c; --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73;
  --line:rgba(60,60,67,.18); --green:#2e9d4f; --red:#d4372c; --orange:#e8891c; --blue:#2f6fdc;
  --purple:#7d4bd6; --teal:#1a9c9c; --indigo:#4c55c9;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--accent:#e8be5c;--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989f;--line:rgba(235,235,245,.18)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
#top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:calc(var(--safe-top) + 8px) 16px 8px;display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:.5px solid var(--line)}
#top h1{font-size:17px;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .side{width:80px}
#back{background:none;border:0;color:var(--accent);font-size:17px;padding:4px 0;text-align:left;cursor:pointer}
main{padding:12px 16px calc(90px + var(--safe-bottom));max-width:760px;margin:0 auto}
.big-title{font-size:32px;font-weight:800;margin:8px 0 12px}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding:6px 0 calc(6px + var(--safe-bottom));z-index:6}
nav#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;position:relative}
nav#tabs button.on{color:var(--accent)}
nav#tabs .ico{font-size:22px;line-height:1}
.tbadge{position:absolute;top:-2px;left:52%;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 22px}
.ghead{font-size:13px;color:var(--muted);text-transform:uppercase;margin:0 16px 6px;letter-spacing:.02em}
.gfoot{font-size:13px;color:var(--muted);margin:-16px 16px 22px}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:.5px solid var(--line);min-height:44px}
.row:last-child{border-bottom:0}
.row.link{cursor:pointer}
.row.link:after{content:"›";color:var(--muted);font-size:22px;margin-left:auto;padding-left:8px}
.row .grow{flex:1;min-width:0}
.sub{font-size:13px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}
.hl{font-weight:600}
.mode-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;flex:none}
.ring{width:40px;height:40px;flex:none}
.seg{display:flex;background:rgba(118,118,128,.12);border-radius:9px;padding:2px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:6px 4px;border-radius:7px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
select,input[type=text],input[type=number],textarea{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--text)}
input[type=text]{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:rgba(118,118,128,.14);min-height:44px}
.btn.primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#1c1c1e}}
.btn.green{background:var(--green);color:#fff}.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .btn{flex:1}
.card{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.prompt{font-size:32px;font-weight:800;line-height:1.15;word-break:break-word}
.prompt.long{font-size:21px}
.hint{color:var(--muted);font-weight:600;margin-top:8px}
.expl{color:var(--muted);font-size:14px;margin-top:10px}
.cat{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{border:0;border-radius:12px;padding:13px 14px;background:var(--card);font-size:17px;text-align:center;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);min-height:50px}
.opt.right{background:var(--green);color:#fff}.opt.wrong{background:var(--red);color:#fff}.opt.dim{opacity:.5}
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px}
.callout{border-radius:10px;padding:10px 12px;margin:8px 0}
.callout b{display:block;font-size:12px}
.tip{background:rgba(46,157,79,.12)}.tip b{color:var(--green)}
.nb{background:rgba(232,137,28,.13)}.nb b{color:var(--orange)}
.tblwrap{overflow-x:auto;background:rgba(118,118,128,.1);border-radius:10px;margin:8px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:15px}
th{font-size:12px;color:var(--muted);text-align:left;padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:.5px solid var(--line);white-space:nowrap;font-style:italic}
td:first-child{font-style:normal;font-weight:600}
.gsec h3{margin:20px 0 6px;font-size:20px}
.gsec ul{margin:6px 0;padding-left:22px}
.dots{display:inline-flex;gap:2px;margin-left:6px}.dots i{width:5px;height:5px;border-radius:50%;background:rgba(118,118,128,.3);display:block}.dots i.on{background:var(--green)}
.star{color:var(--orange)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:0;border-radius:10px;padding:10px 6px;min-height:58px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:15px;cursor:pointer}
.tile.sel{outline:3px solid var(--orange)}.tile.bad{background:var(--red);color:#fff}.tile.gone{visibility:hidden}
.stats3{display:flex}.stats3>div{flex:1;text-align:center;padding:10px 4px}.stats3 .v{font-size:24px;font-weight:800}
.bar{height:6px;border-radius:3px;background:rgba(118,118,128,.2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--green)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:10px 16px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars span.b{display:block;background:var(--blue);border-radius:4px;margin:2px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;padding:14px}
.badge{text-align:center;font-size:12px}.badge .c{width:48px;height:48px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(118,118,128,.15)}
.badge.on .c{background:linear-gradient(135deg,#f0a63a,#e2711d)}.badge:not(.on){opacity:.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);border-radius:18px 18px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px 22px calc(24px + var(--safe-bottom))}
.center{text-align:center}
.flash{position:relative;touch-action:pan-y;transition:transform .15s}
.hidecell{border:0;border-radius:6px;background:rgba(118,118,128,.18);min-width:60px;padding:4px 8px;cursor:pointer;font-style:normal}
.search{position:sticky;top:calc(var(--safe-top) + 56px);z-index:3;padding:4px 0 10px;background:var(--bg)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:rgba(118,118,128,.15);color:var(--muted)}

"use strict";
const LESSONS = [{"number":1,"title":"De schola","unit":"Römischer Alltag","klasse":5,"vocab":[{"la":"schola f.","forms":"scholae","de":"Schule","note":"engl. school, ital. scuola, span. escuela","pos":"Nomen"},{"la":"hic (Adv.)","forms":"","de":"hier","note":"","pos":"Adverb"},{"la":"sedet","forms":"sedi, sessum","de":"er/sie/es sitzt","note":"vgl. Sediment (= Ablagerung), Re-sidenz (= Wohnsitz)","pos":"Verb"},{"la":"amica f.","forms":"amicae","de":"Freundin","note":"frz. amie, ital. amica, span. amiga","pos":"Nomen"},{"la":"meus/a/um","forms":"","de":"mein","note":"besitzanzeigendes Fürwort (Possessivpronomen)","pos":"Adjektiv"},{"la":"est","forms":"","de":"er/sie/es ist","note":"frz. est, ital. è, span. es","pos":"Sonstiges"},{"la":"discipula f.","forms":"discipulae","de":"Schülerin","note":"","pos":"Nomen"},{"la":"bonus/a/um","forms":"","de":"gut","note":"frz. bon, ital. buono, span. bueno; vgl. Bona-Öl; der Bonus","pos":"Adjektiv"},{"la":"semper (Adv.)","forms":"","de":"immer","note":"ital. sempre, span. siempre; vgl. Semperit = „Es/Er geht immer“","pos":"Adverb"},{"la":"sunt","forms":"fui, –","de":"sie sind","note":"frz. sont, ital. sono, span. son","pos":"Verb"},{"la":"et","forms":"","de":"und","note":"frz. et, ital. e","pos":"Sonstiges"},{"la":"amicus m.","forms":"amici","de":"Freund","note":"frz. ami, ital. amico, span. amigo","pos":"Nomen"},{"la":"sed","forms":"","de":"1) aber; 2) sondern","note":"","pos":"Sonstiges"},{"la":"discipulus m.","forms":"discipuli","de":"Schüler","note":"","pos":"Nomen"},{"la":"malus/a/um","forms":"","de":"schlecht","note":"span. malo/a; vgl. Bonus-Malus-System","pos":"Adjektiv"},{"la":"laetus/a/um","forms":"","de":"froh, fröhlich","note":"ital. lieto; vgl. die Vornamen Laetitia und Letizia","pos":"Adjektiv"},{"la":"saepe (Adv.)","forms":"","de":"oft","note":"","pos":"Adverb"},{"la":"ridet","forms":"risi, risum","de":"er/sie/es lacht","note":"frz. rire, ital. ridere, span. reír; engl. ridiculous","pos":"Verb"},{"la":"cur?","forms":"","de":"warum?","note":"","pos":"Sonstiges"},{"la":"nunc (Adv.)","forms":"","de":"jetzt, nun","note":"vgl. engl. now","pos":"Adverb"},{"la":"non","forms":"","de":"nicht","note":"frz. + ital. non, span. no","pos":"Sonstiges"},{"la":"pensum n.","forms":"pensi","de":"Aufgabe","note":"vgl. das Arbeitspensum","pos":"Nomen"},{"la":"magnus/a/um","forms":"","de":"groß","note":"vgl. Magnum (Eis; Schusswaffe)","pos":"Adjektiv"},{"la":"itaque","forms":"","de":"deshalb, daher","note":"","pos":"Sonstiges"},{"la":"gaudet","forms":"gavisus sum","de":"er/sie/es freut sich","note":"vgl. die Gaudi (= Spaß)","pos":"Verb"},{"la":"diu (Adv.)","forms":"","de":"lange","note":"","pos":"Adverb"},{"la":"laborat","forms":"laboravi, laboratum","de":"er/sie/es arbeitet","note":"vgl. engl. lab(o)ur; das Labor","pos":"Verb"},{"la":"libenter (Adv.)","forms":"","de":"gern","note":"","pos":"Adverb"},{"la":"interrogat","forms":"interrogavi, -atum","de":"er/sie/es fragt","note":"vgl. engl. interrogation mark (= Fragezeichen)","pos":"Verb"},{"la":"respondet","forms":"respondi, responsum","de":"er/sie/es antwortet","note":"ital. rispondere; vgl. Kor-respondenz (= Briefwechsel)","pos":"Verb"},{"la":"tum (= tunc)","forms":"","de":"dann, damals","note":"","pos":"Sonstiges"},{"la":"clamat","forms":"clamavi, clamatum","de":"er/sie/es ruft, schreit","note":"ital. chiamare, span. llamar; vgl. re-klamieren, Re-klame","pos":"Verb"},{"la":"laudat","forms":"laudavi, laudatum","de":"er/sie/es lobt","note":"vgl. Laudatio (= Lobrede)","pos":"Verb"}],"vocabNote":"Die Formen in der zweiten Spalte (Nomina: 2. Fall Sg.; Verba: Perfekt) brauchst du einstweilen nicht zu lernen, da du sie erst in späteren Kapiteln kennenlernen wirst. Wenn du sie allerdings schon jetzt mitlernst, sparst du dir später die Mühe!","grammar":[{"title":"Allgemeines","blocks":[{"type":"text","text":"Es gibt im Lateinischen keine Artikel:"},{"type":"list","items":["discipulus = „der/ein Schüler“","discipula = „die/eine Schülerin“"]},{"type":"text","text":"Persönliche Fürwörter werden oft nicht geschrieben:"},{"type":"list","items":["sedet = „er/sie/es sitzt“","sedent = „sie sitzen“"]},{"type":"tip","text":"Die wichtigsten Informationen stecken also in der lateinischen Wortendung!"}]},{"title":"Nomina (Namenwörter)","blocks":[{"type":"text","text":"Lateinische Nomina (auch „Substantiva“ genannt) werden nach ihrer Nominativendung in verschiedene Deklinationsklassen eingeteilt. Praktischerweise kannst du aus der Deklinationsklasse meistens das Geschlecht des Wortes ableiten:"},{"type":"table","headers":["","a-Deklination feminin (f.)","o-Deklination maskulin (m.)","o-Deklination neutrum (n.)"],"rows":[["Sg. 1.F.","amica „die Freundin“","amicus „der Freund“","pensum „die Aufgabe“"],["Pl. 1.F.","amicae „die Freundinnen“","amici „die Freunde“","pensa „die Aufgaben“"]]},{"type":"note","text":"Nota bene! Die Endung -a ist leider doppeldeutig: amica → 1. Fall Sg. feminin; pensa → 1. Fall Pl. eines neutralen Wortes (1. Fall Sg.: pensum!)"},{"type":"tip","text":"Du solltest dir also den 1.F. Sg. (= die Form, die im Vocabularium steht) gut einprägen!"}]},{"title":"Adjektiva (Eigenschaftswörter)","blocks":[{"type":"text","text":"Lateinische Adjektiva passen sich an die Nomina, auf die sie sich beziehen, in Fall, Zahl und Geschlecht an:"},{"type":"list","items":["discipulus bonus = „der gute Schüler“ (→ maskulin)","discipula bona = „die gute Schülerin“ (→ feminin)","pensum magnum = „die große Aufgabe“ (→ neutrum)"]},{"type":"text","text":"Adjektiva werden daher im Vokabelverzeichnis immer mit drei Endungen angegeben: magnus/a/um (= magnus 3)"},{"type":"table","headers":["","maskulin (m.)","feminin (f.)","neutrum (n.)"],"rows":[["Sg. 1.F.","magnus","magna","magnum"],["Pl. 1.F.","magni","magnae","magna"]]}]},{"title":"Verba (Zeitwörter)","blocks":[{"type":"text","text":"Lateinische Verba bestehen aus Stamm und Personalendung (z. B. clama-t, sede-t). Der Endlaut des Stammes bestimmt, zu welcher Konjugationsklasse das Verbum gehört:"},{"type":"list","items":["Stamm auf -a → a-Konjugation","Stamm auf -e → e-Konjugation"]},{"type":"text","text":"Die Endung für die 3.P. Sg. lautet -t, jene für die 3.P. Pl. -nt:"},{"type":"table","headers":["","a-Konjugation","e-Konjugation"],"rows":[["Sg. 3.P.","clama-t „er/sie/es ruft“","sede-t „er/sie/es sitzt“"],["Pl. 3.P.","clama-nt „sie rufen“","sede-nt „sie sitzen“"]]}]}]},{"number":2,"title":"Quid grammaticus docet?","unit":"Römischer Alltag","klasse":5,"vocab":[{"la":"quid?","forms":"","de":"was?","note":"","pos":"Sonstiges"},{"la":"docet","forms":"docui, doctum","de":"er/sie/es lehrt, unterrichtet","note":"vgl. dozieren, Dozent (= Hochschullehrer)","pos":"Verb"},{"la":"ubi?","forms":"","de":"wo?","note":"","pos":"Sonstiges"},{"la":"iam","forms":"","de":"schon","note":"span. ya","pos":"Sonstiges"},{"la":"exspectat","forms":"exspectavi, -atum","de":"er/sie/es erwartet","note":"engl. to expect","pos":"Verb"},{"la":"intrat","forms":"intravi, intratum","de":"er/sie/es tritt ein, betritt","note":"engl. to enter, frz. entrer, ital. entrare, span. entrar","pos":"Verb"},{"la":"salve!/salvete!","forms":"","de":"sei/seid gegrüßt!","note":"ital. salve","pos":"Sonstiges"},{"la":"magister m.","forms":"magistri","de":"Lehrer","note":"frz. maître; vgl. Maestro (= Dirigent)","pos":"Nomen"},{"la":"amat","forms":"amavi, amatum","de":"er/sie/es liebt","note":"vgl. Amateur (= „Liebhaber“, ↔ Profi)","pos":"Verb"},{"la":"non solum – sed etiam","forms":"","de":"nicht nur – sondern auch","note":"","pos":"Sonstiges"},{"la":"etiam","forms":"","de":"auch, sogar","note":"↔ iam","pos":"Sonstiges"},{"la":"lingua f.","forms":"linguae","de":"1) Zunge; 2) Sprache","note":"engl. language, frz. langue, ital. lingua","pos":"Nomen"},{"la":"Latinus/a/um","forms":"(Adjektiv!)","de":"lateinisch","note":"","pos":"Adjektiv"},{"la":"Graecus/a/um","forms":"(Adjektiv!)","de":"griechisch","note":"engl. Greek, Greece, span. griego","pos":"Adjektiv"},{"la":"liber m.","forms":"libri","de":"Buch","note":"ital. + span. libro; vgl. engl. library (= Bibliothek)","pos":"Nomen"},{"la":"quam","forms":"","de":"wie","note":"","pos":"Sonstiges"},{"la":"pulcher/chra/chrum","forms":"","de":"schön, hübsch","note":"","pos":"Adjektiv"},{"la":"verbum n.","forms":"verbi","de":"Wort","note":"vgl. verbal (= durch Worte)","pos":"Nomen"},{"la":"secum","forms":"","de":"mit sich, bei sich","note":"","pos":"Sonstiges"},{"la":"cogitat","forms":"cogitavi, cogitatum","de":"er/sie/es denkt","note":"","pos":"Verb"},{"la":"puer m.","forms":"pueri","de":"Bub","note":"pueril (= kindlich)","pos":"Nomen"},{"la":"puella f.","forms":"puellae","de":"Mädchen","note":"","pos":"Nomen"},{"la":"quod","forms":"","de":"weil","note":"↔ quid","pos":"Sonstiges"},{"la":"quis?","forms":"","de":"wer?","note":"","pos":"Sonstiges"},{"la":"habet","forms":"habui, habitum","de":"er/sie/es hat","note":"engl. to have, frz. avoir, ital. avere, span. haber","pos":"Verb"},{"la":"spectat","forms":"spectavi, -atum","de":"er/sie/es schaut an, er/sie/es betrachtet","note":"vgl. Spektakel, spektakulär; engl. spectator (= Zuschauer)","pos":"Verb"},{"la":"oculus m.","forms":"oculi","de":"Auge","note":"vgl. Mon-okel (= Einglas), Okular","pos":"Nomen"},{"la":"tuus/a/um","forms":"","de":"dein","note":"ital. tuo, span. tu","pos":"Adjektiv"},{"la":"monet","forms":"monui, monitum","de":"er/sie/es (er)mahnt","note":"vgl. Monitor (= elektronisches Anzeigegerät)","pos":"Verb"},{"la":"iratus/a/um","forms":"","de":"zornig, erzürnt","note":"","pos":"Adjektiv"}],"grammar":[{"title":"Wörter auf -er","blocks":[{"type":"text","text":"Unter den männlichen Nomina der o-Deklination gibt es nicht nur solche auf -us, sondern auch einige auf -er:"},{"type":"list","items":["magister = „der Lehrer“","puer = „der Bub“"]},{"type":"text","text":"Auch unter den Adjektiva haben einige in der männlichen Form die Endung -er statt -us:"},{"type":"list","items":["pulcher (m.), pulchra (f.), pulchrum (n.) = „schön“"]},{"type":"text","text":"Abgesehen vom 1.F. Sg. deklinieren diese Wörter so wie die übrigen Wörter der o-Deklination (amicus bzw. magnus/a/um)."}]},{"title":"Akkusativ (4. Fall)","blocks":[{"type":"text","text":"Der Akkusativ hat folgendes „Erkennungszeichen“:"},{"type":"list","items":["Sg. → -m","Pl. → -s (m. + f.) bzw. -a (n.)"]},{"type":"text","text":"Nach dem Akkusativ fragt man mit „WEN?“ oder „WAS?“: Quintus Iuliam spectat. = „Quintus betrachtet Julia.“ (WEN betrachtet er?)"},{"type":"table","headers":["","a-Dekl. (f.)","o-Dekl. (m.)","o-Dekl. (m.)","o-Dekl. (m.)","o-Dekl. (n.)"],"rows":[["Sg. 1.F.","amica","amicus","magister","puer","pensum"],["Sg. 4.F.","amicam","amicum","magistrum","puerum","pensum"],["Pl. 1.F.","amicae","amici","magistri","pueri","pensa"],["Pl. 4.F.","amicas","amicos","magistros","pueros","pensa"]]},{"type":"text","text":"Der Unterschied zwischen magister und puer besteht darin, dass bei puer in allen Fällen das -e- erhalten bleibt, während es bei magister verschwindet."},{"type":"note","text":"1) Die Endung -um kann Akkusativ Sg. sein, bei neutralen Wörtern aber auch Nominativ Sg.: amicum → 4. F. von amicus = „den Freund“; pensum → 1. F. von pensum = „die Aufgabe“ (z. B.: macht mir großen Spaß) oder 4. F. = „die Aufgabe“ (z. B.: mache ich nicht)."},{"type":"note","text":"2) Bei neutralen Wörtern sind Nominativ und Akkusativ immer gleich! Nom. und Akk. Plural enden bei allen Neutra auf -a."}]},{"title":"Adjektiva (Eigenschaftswörter)","blocks":[{"type":"text","text":"Die Adjektiva haben im Akkusativ dieselben Endungen wie die Nomina:"},{"type":"table","headers":["","m.","f.","n."],"rows":[["Sg. 1.F.","bonus","bona","bonum"],["Sg. 4.F.","bonum","bonam","bonum"],["Pl. 1.F.","boni","bonae","bona"],["Pl. 4.F.","bonos","bonas","bona"]]},{"type":"text","text":"Ebenso dekliniert: 1. F.: pulcher, pulchra, pulchrum → 4. F.: pulchrum, pulchram, pulchrum (etc.)"}]}]},{"number":3,"title":"Quam pulchra Roma est!","unit":"Römischer Alltag","klasse":5,"vocab":[{"la":"Roma f.","forms":"Romae","de":"Rom","note":"","pos":"Nomen"},{"la":"per (Präp. + Akk.)","forms":"","de":"durch","note":"vgl. perforieren (= durchlöchern), per … (Mail, Post etc.)","pos":"Präposition"},{"la":"via f.","forms":"viae","de":"Weg, Straße","note":"ital. via, span. vía; vgl. Viadukt (= Brücke über ein Tal)","pos":"Nomen"},{"la":"ambulo, -as","forms":"ambulavi, ambulatum","de":"gehen, spazieren","note":"vgl. Ambulatorium, Ambulanz","pos":"Verb"},{"la":"multi/ae/a (Plural)","forms":"","de":"viele","note":"vgl. Multivitaminsaft, Multitasking, Multitalent","pos":"Adjektiv"},{"la":"multum (n. Sg.)","forms":"","de":"viel","note":"ital. molto","pos":"Nomen"},{"la":"aedificium n.","forms":"aedificii","de":"Gebäude","note":"ital. + span. edificio","pos":"Nomen"},{"la":"video, -es","forms":"vidi, visum","de":"sehen","note":"ital. vedere; vgl. das Video, Videorekorder","pos":"Verb"},{"la":"-que","forms":"","de":"und","note":"z. B. Quintus Gaiusque = Quintus et Gaius","pos":"Sonstiges"},{"la":"clarus/a/um","forms":"","de":"1) berühmt; 2) hell","note":"vgl. klar; Clara (= „die Berühmte“)","pos":"Adjektiv"},{"la":"monstro, -as","forms":"monstravi, monstratum","de":"zeigen","note":"vgl. Monstranz (= Behälter, in dem die Hostie gezeigt wird)","pos":"Verb"},{"la":"spectaculum n.","forms":"spectaculi","de":"Schauspiel","note":"vgl. Spektakel; ↔ spectat","pos":"Nomen"},{"la":"ibi","forms":"","de":"dort","note":"↔ ubi","pos":"Sonstiges"},{"la":"statua f.","forms":"statuae","de":"Statue","note":"ital. statua, span. estatua","pos":"Nomen"},{"la":"vir m.","forms":"viri","de":"Mann","note":"vgl. Triumvirat (= Dreimännerbund); viril (= männlich)","pos":"Nomen"},{"la":"-ne","forms":"","de":"(Fragepartikel, unübersetzt)","note":"z. B. Amasne Iuliam? = „Liebst du Julia?“","pos":"Sonstiges"},{"la":"certe (Adv.)","forms":"","de":"sicherlich","note":"ital. certo, span. cierto, engl. certainly","pos":"Adverb"},{"la":"forum n.","forms":"fori","de":"Forum; Marktplatz","note":"vgl. Forensik = Gerichtsmedizin (das Gericht tagte am Forum!)","pos":"Nomen"},{"la":"Romanus/a/um","forms":"","de":"römisch","note":"engl. Roman; vgl. Romanisierung","pos":"Adjektiv"},{"la":"templum n.","forms":"templi","de":"Tempel","note":"frz. temple, ital. tempio, span. templo","pos":"Nomen"},{"la":"tam","forms":"","de":"so","note":"↔ tum","pos":"Sonstiges"},{"la":"deus m.","forms":"dei","de":"Gott","note":"frz. dieu, ital. dio, span. dios","pos":"Nomen"},{"la":"dea f.","forms":"deae","de":"Göttin","note":"frz. déesse, ital. dea, span. diosa","pos":"Nomen"},{"la":"ante (Präp. + Akk.)","forms":"","de":"vor","note":"vgl. Antipasto (= Vorspeise), antizipieren (= vorwegnehmen)","pos":"Präposition"},{"la":"post (Präp. + Akk.)","forms":"","de":"nach; hinter","note":"vgl. post mortem (= „nach dem Tod“)","pos":"Präposition"},{"la":"solum (Adv.)","forms":"","de":"nur","note":"ital. solo, span. sólo; vgl. non solum – sed etiam","pos":"Adverb"},{"la":"ad (Präp. + Akk.)","forms":"","de":"zu, an, bei","note":"","pos":"Präposition"}],"grammar":[{"title":"Konjugation","blocks":[{"type":"text","text":"Da im Lateinischen persönliche Fürwörter nur selten geschrieben werden, sagt die Endung aus, um welche Person es sich handelt. Die folgenden Endungen gelten für alle Konjugationen im Präsensstamm (= Präsens, Futur, Imperfekt):"},{"type":"table","headers":["","Singular","Plural"],"rows":[["1.P.","-o (→ ich)","-mus (→ wir)"],["2.P.","-s (→ du)","-tis (→ ihr)"],["3.P.","-t (→ er/sie/es)","-nt (→ sie)"]]},{"type":"text","text":"Bei einigen Zeiten und Verben lautet die 1.P. Sg. auch -m."},{"type":"text","text":"Durch das Anfügen dieser Personalendungen an den Stamm ergeben sich für das Präsens folgende Konjugationsmuster:"},{"type":"table","headers":["","a-Konjugation","e-Konjugation"],"rows":[["Sg. 1.P.","amo „ich liebe“","mone-o „ich mahne“"],["Sg. 2.P.","ama-s „du liebst“","mone-s „du mahnst“"],["Sg. 3.P.","ama-t „er/sie liebt“","mone-t „er/sie mahnt“"],["Pl. 1.P.","ama-mus „wir lieben“","mone-mus „wir mahnen“"],["Pl. 2.P.","ama-tis „ihr liebt“","mone-tis „ihr mahnt“"],["Pl. 3.P.","ama-nt „sie lieben“","mone-nt „sie mahnen“"]]},{"type":"text","text":"amo ist entstanden aus ama-o."}]},{"title":"Imperativ (Befehlsform)","blocks":[{"type":"text","text":"Der Imperativ ist die Befehlsform. Sie besteht im Singular aus dem reinen, also endungslosen Stamm, im Plural aus dem Stamm + -te:"},{"type":"table","headers":["","a-Konjugation","e-Konjugation"],"rows":[["Sg.","specta! „schau!“","responde! „antworte!“"],["Pl.","specta-te! „schaut!“","responde-te! „antwortet!“"]]}]},{"title":"Vokativ (5. Fall, Anredefall)","blocks":[{"type":"text","text":"Im Lateinischen gibt es einen eigenen Fall für die direkte Anrede: den Vokativ („Ruf-Fall“). Er sieht in der Regel aus wie der Nominativ."},{"type":"list","items":["Specta, amica! = „Schau, Freundin!“","Spectate, amici! = „Schaut, Freunde!“"]},{"type":"text","text":"Ausnahmen im Singular:"},{"type":"list","items":["Maskuline Wörter der o-Deklination auf -us → Vokativ Sg. auf -e (z. B.: amice! = „Freund!“)","Nomina auf -ius → Vokativ Sg. auf -i (z. B.: Gai! = „Gaius!“)"]},{"type":"table","headers":["Sg.","Iulia","Quintus","Gaius","vir"],"rows":[["1.F.","Iulia","Quintus","Gaius","vir"],["5.F.","Iulia!","Quinte!","Gai!","vir!"]]},{"type":"text","text":"Im Plural gilt die Regel ausnahmslos: 5. F. = 1. F."},{"type":"tip","text":"Einen Vokativ erkennst du am Beistrich davor und/oder am Ruf- bzw. Fragezeichen danach!"},{"type":"tip","text":"Da der Vokativ der Anredefall ist, darfst du im Deutschen keinen Artikel davor setzen!"}]}]},{"number":4,"title":"De spectaculis","unit":"Römischer Alltag","klasse":5,"vocab":[{"la":"de (Präp. + Abl.)","forms":"","de":"1) von (… herab); 2) über","note":"frz. de, ital. di, span. de","pos":"Präposition"},{"la":"cum (Präp. + Abl.)","forms":"","de":"mit","note":"ital. + span. con","pos":"Präposition"},{"la":"sine (Präp. + Abl.)","forms":"","de":"ohne","note":"frz. sans, ital. senza, span. sin","pos":"Präposition"},{"la":"femina","forms":"feminae f.","de":"Frau","note":"vgl. Feministin, feminin","pos":"Nomen"},{"la":"gaudium","forms":"gaudii n.","de":"Freude","note":"vgl. „a Mordsgaudi“ (= ein riesiger Spaß)","pos":"Nomen"},{"la":"narro, -as","forms":"narravi, narratum","de":"erzählen","note":"span. narrar; vgl. engl. narrator","pos":"Verb"},{"la":"Romani (Pl.)","forms":"Romanorum m.","de":"die Römer","note":"engl. the Romans („die Römer“)","pos":"Nomen"},{"la":"copia","forms":"copiae f.","de":"Menge, Vorrat","note":"ital. + span. copia; vgl. Kopie","pos":"Nomen"},{"la":"e / ex (Präp. + Abl.)","forms":"","de":"aus, von","note":"(siehe Grammatica)","pos":"Präposition"},{"la":"terra","forms":"terrae f.","de":"Land; Erde","note":"vgl. Terrarium, Terrasse, Parterre (= Erdgeschoß)","pos":"Nomen"},{"la":"alienus/a/um","forms":"","de":"fremd","note":"vgl. Aliens (= die Außerirdischen/Fremden)","pos":"Adjektiv"},{"la":"pugno, -as","forms":"pugnavi, -atum","de":"kämpfen","note":"","pos":"Verb"},{"la":"neco, -as","forms":"necavi, -atum","de":"töten","note":"","pos":"Verb"},{"la":"placeo, -es","forms":"placui, -itum","de":"gefallen","note":"frz. plaire, ital. piacere","pos":"Verb"},{"la":"novus/a/um","forms":"","de":"neu","note":"vgl. re-novieren (= erneuern), In-novation","pos":"Adjektiv"},{"la":"alius/a/ud","forms":"","de":"ein anderer","note":"↔ alienus/a/um","pos":"Adjektiv"},{"la":"alius – alius","forms":"","de":"der eine – der andere","note":"z. B. alius interrogat, alius respondet","pos":"Sonstiges"},{"la":"gladius","forms":"gladii m.","de":"Schwert","note":"vgl. Gladiator (= „Schwertkämpfer“), Gladiole","pos":"Nomen"},{"la":"postremo (Adv.)","forms":"","de":"schließlich, endlich","note":"","pos":"Adverb"},{"la":"supero, -as","forms":"superavi, superatum","de":"1) besiegen; 2) übertreffen","note":"","pos":"Verb"},{"la":"si","forms":"","de":"wenn, falls","note":"span. si, ital. se","pos":"Sonstiges"},{"la":"bene (Adv.)","forms":"","de":"gut","note":"frz. bien, ital. bene, span. bien; vgl. Benefizkonzert","pos":"Adverb"},{"la":"vita","forms":"vitae f.","de":"Leben","note":"ital. vita, span. vida; vgl. Vitamine; vital (= lebendig)","pos":"Nomen"},{"la":"dono, -as","forms":"donavi, donatum","de":"schenken","note":"","pos":"Verb"},{"la":"pro (Präp. + Abl.)","forms":"","de":"für","note":"Pro und Kontra (= Für und Wider)","pos":"Präposition"},{"la":"suus/a/um","forms":"","de":"sein, ihr","note":"Possessivpronomen; ital. suo, span. su","pos":"Adjektiv"},{"la":"a / ab (Präp. + Abl.)","forms":"","de":"von","note":"(siehe Grammatica)","pos":"Präposition"},{"la":"prae (Präp. + Abl.)","forms":"","de":"vor","note":"vgl. Präposition (= Vorwort)","pos":"Präposition"},{"la":"neque (= nec)","forms":"","de":"und nicht","note":"","pos":"Sonstiges"}],"vocabNote":"Ab dieser Lektion findest du in der zweiten Spalte der Vokabel bei den Nomina immer den Genetiv und das Geschlecht angegeben. Beides musst du ab jetzt unbedingt mitlernen.","grammar":[{"title":"Nomina der a-/o-Deklination","blocks":[{"type":"table","headers":["Fall","Frage","a-Dekl. f.","o-Dekl. m.","o-Dekl. m.","o-Dekl. m.","o-Dekl. n."],"rows":[["Sg. 1","Wer?/Was?","amica","amicus","magister","puer","templum"],["Sg. 2","Wessen?","amicae","amici","magistri","pueri","templi"],["Sg. 3","Wem?","amicae","amico","magistro","puero","templo"],["Sg. 4","Wen?/Was?","amicam","amicum","magistrum","puerum","templum"],["Sg. 5","(Anrede)","amica!","amice!","magister!","puer!","templum!"],["Sg. 6","(z. B. cum)","amicā","amico","magistro","puero","templo"],["Pl. 1","Wer?/Was?","amicae","amici","magistri","pueri","templa"],["Pl. 2","Wessen?","amicarum","amicorum","magistrorum","puerorum","templorum"],["Pl. 3","Wem?","amicis","amicis","magistris","pueris","templis"],["Pl. 4","Wen?/Was?","amicas","amicos","magistros","pueros","templa"],["Pl. 5","(Anrede)","amicae!","amici!","magistri!","pueri!","templa!"],["Pl. 6","(z. B. cum)","amicis","amicis","magistris","pueris","templis"]]},{"type":"text","text":"Der 6. Fall (Ablativ) steht nach bestimmten Präpositionen (siehe unten) und auf bestimmte Fragen."},{"type":"text","text":"Da manche Endungen mehrere unterschiedliche Fälle bezeichnen (z. B. -ae = 2. + 3. Fall Sg., 1. + 5. Fall Pl.), musst du beim Übersetzen nach den Fällen fragen:"},{"type":"list","items":["Quintus Lydiae forum monstrat. = „Quintus (WER? → 1.F.) zeigt Lydia (WEM? → 3.F.) das Forum (WEN?/WAS? → 4.F.).“"]}]},{"title":"Adjektiva der a-/o-Deklination","blocks":[{"type":"text","text":"Analog zu amicus, amica und templum wandeln auch Adjektiva wie bonus/a/um (= bonus 3) ab:"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","bonus","bona","bonum","boni","bonae","bona"],["2","boni","bonae","boni","bonorum","bonarum","bonorum"],["3","bono","bonae","bono","bonis","bonis","bonis"],["4","bonum","bonam","bonum","bonos","bonas","bona"],["5","bone!","bona!","bonum!","boni!","bonae!","bona!"],["6","bono","bonā","bono","bonis","bonis","bonis"]]},{"type":"text","text":"Genauso deklinieren Adjektiva auf -er: 1.F. pulcher, pulchra, pulchrum, 2.F. pulchri, pulchrae, pulchri etc. (5.F. Sg. m. pulcher!)"}]},{"title":"Präpositionen (Vorwörter)","blocks":[{"type":"text","text":"A) Präpositionen mit Ablativ:"},{"type":"list","items":["a / ab = „von“","e / ex = „aus“, „von“","de = „von (… herab)“; „über“","cum = „mit“","sine = „ohne“","pro = „für“","prae = „vor“"]},{"type":"text","text":"B) Präpositionen mit Akkusativ: Nach allen anderen Präpositionen steht der Akkusativ – z. B. nach ante („vor“), post („hinter“), ad („zu“, „an“, „bei“), per („durch“)."},{"type":"note","text":"ab und ex stehen vor Vokalen (Selbstlauten), z. B. ex (ab) amphitheatro (vgl. im Englischen: an apple); a und e stehen vor Konsonanten (Mitlauten), z. B. e (a) templo (vgl. im Englischen: a banana)."}]}]},{"number":5,"title":"De thermis","unit":"Römischer Alltag","klasse":5,"vocab":[{"la":"mihi / tibi / sibi (Dativ)","forms":"","de":"mir / dir / sich","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"me / te / se (Akkusativ)","forms":"","de":"mich / dich / sich","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"delectare","forms":"delecto 1, -avi, -atum","de":"(jemanden) erfreuen","note":"sich an etwas delektieren (= erfreuen)","pos":"Verb"},{"la":"nonne?","forms":"","de":"nicht?","note":"aus: non-ne? (Frage)","pos":"Sonstiges"},{"la":"ego / tu","forms":"","de":"ich / du","note":"(siehe Grammatica); vgl. Egoist","pos":"Sonstiges"},{"la":"Graeci (Pl.)","forms":"Graecorum m.","de":"die Griechen","note":"↔ Graecus/a/um","pos":"Nomen"},{"la":"ita","forms":"","de":"so","note":"ita est = „ja“ (wörtlich?)","pos":"Sonstiges"},{"la":"inquit","forms":"","de":"er/sie sagt(e)","note":"(in die direkte Rede eingeschoben)","pos":"Sonstiges"},{"la":"num?","forms":"","de":"etwa?","note":"z. B. Num rides? = „Lachst du etwa?“","pos":"Sonstiges"},{"la":"vester/tra/trum","forms":"","de":"euer, eure","note":"frz. vôtre, ital. vostro/a","pos":"Adjektiv"},{"la":"quoque (nachgestellt)","forms":"","de":"auch","note":"z. B. etiam tu = tu quoque","pos":"Sonstiges"},{"la":"nobis / vobis (Dativ)","forms":"","de":"uns / euch","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"noster/tra/trum","forms":"","de":"unser, unsere","note":"frz. nôtre; vgl. Pater noster","pos":"Adjektiv"},{"la":"in (+ Abl.)","forms":"(Frage WO?)","de":"in, auf","note":"in aedificio (WO?) = „im Gebäude“","pos":"Präposition"},{"la":"animus","forms":"animi m.","de":"1) Sinn, Geist; 2) Mut","note":"vgl. animieren (= „anregen“)","pos":"Nomen"},{"la":"in animo habere","forms":"","de":"vorhaben","note":"wörtl.: „im Sinn haben“","pos":"Sonstiges"},{"la":"nos / vos (Nom. + Akk.)","forms":"","de":"wir; uns / ihr; euch","note":"(siehe Grammatica)","pos":"Präposition"},{"la":"quis nostrum","forms":"","de":"wer von uns","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"quis vestrum","forms":"","de":"wer von euch","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"nobiscum / vobiscum","forms":"","de":"mit uns / mit euch","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"in (+ Akk.)","forms":"(Frage WOHIN?)","de":"in, nach; gegen","note":"in aedificium (WOHIN?) = „ins Gebäude“","pos":"Präposition"},{"la":"manere","forms":"maneo 2, mansi, mansum","de":"bleiben","note":"vgl. permanent (= dauerhaft)","pos":"Verb"},{"la":"properare","forms":"propero 1, -avi, -atum","de":"eilen","note":"","pos":"Verb"},{"la":"aqua","forms":"aquae f.","de":"Wasser","note":"ital. acqua, span. agua; vgl. Aquarium","pos":"Nomen"},{"la":"iterum (Adv.)","forms":"","de":"wieder(um)","note":"(Eselsbrücke: „iterum = wiederum“)","pos":"Adverb"},{"la":"minime (Adv.)","forms":"","de":"keineswegs; nein","note":"vgl. minimal (= sehr klein, sehr gering)","pos":"Adverb"},{"la":"licet (nur 3.P. Sg.)","forms":"licuit","de":"es ist erlaubt, es ist möglich","note":"vgl. die Lizenz (= Erlaubnis, Berechtigung)","pos":"Verb"},{"la":"otium","forms":"otii n.","de":"Freizeit, Erholung, Muße","note":"ital. ozio, span. ocio","pos":"Nomen"},{"la":"sub (+ Akk.)","forms":"(Frage WOHIN?)","de":"unter (… hin)","note":"vgl. Subvention (= finanzielle Hilfe)","pos":"Präposition"},{"la":"sub (+ Abl.)","forms":"(Frage WO?)","de":"unter","note":"vgl. engl. subway, submarine","pos":"Präposition"},{"la":"terrere","forms":"terreo 2, terrui, territum","de":"(jemanden) erschrecken","note":"vgl. jemanden terrorisieren, Terrorist","pos":"Verb"}],"vocabNote":"Ab dieser Lektion findest du in der ersten Spalte bei Verben immer die Nennform (Infinitiv) angegeben. In der zweiten Spalte steht zunächst die 1. Person sowie die Konjugationsklasse, zu der das Verb gehört (unbedingt mitlernen!). Bei den übrigen Formen handelt es sich um das Perfekt, das erst ab Lec. 14 auf dem Programm steht.","grammar":[{"title":"Personalpronomina (Persönliche Fürwörter)","blocks":[{"type":"table","headers":["Fall","1. Person","2. Person","3. Person (Reflexivpronomen)"],"rows":[["Sg. 1","ego „ich“","tu „du“","–"],["Sg. 2","mei „meiner“","tui „deiner“","sui „seiner“, „ihrer“"],["Sg. 3","mihi „mir“","tibi „dir“","sibi „sich“"],["Sg. 4","me „mich“","te „dich“","se „sich“"],["Sg. 6","a me „von mir“; mecum „mit mir“","a te „von dir“; tecum „mit dir“","a se „von sich“; secum „mit sich“"],["Pl. 1","nos „wir“","vos „ihr“","–"],["Pl. 2","nostri „unser“; nostrum „von uns“","vestri „euer“; vestrum „von euch“","sui „ihrer“"],["Pl. 3","nobis „uns“","vobis „euch“","sibi „sich“"],["Pl. 4","nos „uns“","vos „euch“","se „sich“"],["Pl. 6","a nobis „von uns“; nobiscum „mit uns“","a vobis „von euch“; vobiscum „mit euch“","a se „von sich“; secum „mit sich“"]]},{"type":"list","items":["Die Nominative des Personalpronomens werden nur bei besonderer Betonung geschrieben: Ego Iuliam amo, tu Claudiam. = „Ich liebe Julia, du (liebst) Claudia.“","mei, tui, sui, nostri, vestri sind die (sehr selten vorkommenden) Objektsgenetive: memor sum tui = „ich gedenke deiner (= ich denke an dich)“","nostrum und vestrum sind die (häufiger vorkommenden) Teilungsgenetive (Genetivus partitivus): quis vestrum? = „wer von euch?“, multi nostrum = „viele von uns“"]}]},{"title":"Possessivpronomina (Besitzanzeigende Fürwörter)","blocks":[{"type":"text","text":"Sie deklinieren wie Adjektiva:"},{"type":"table","headers":["","1. Person","2. Person","3. Person"],"rows":[["Sg.","meus/a/um „mein(e)“","tuus/a/um „dein(e)“","suus/a/um „sein(e)“ / „ihr(e)“"],["Pl.","noster/tra/trum „unser(e)“","vester/tra/trum „euer/eure“","suus/a/um „ihr(e)“"]]},{"type":"text","text":"suus/a/um ist reflexiv (rückbezüglich), d. h. es bezieht sich immer auf das Subjekt des Satzes und wird dementsprechend mit „sein“ oder „ihr“ übersetzt:"},{"type":"list","items":["Quintus amicam suam amat. = „Quintus liebt seine Freundin.“","Claudia amicam suam amat. = „Claudia liebt ihre Freundin.“","Quintus et Claudia amicos suos amant. = „Quintus und Claudia lieben ihre Freunde.“"]}]},{"title":"Präpositionen mit Akkusativ oder Ablativ","blocks":[{"type":"text","text":"Die Präpositionen in und sub stehen entweder mit Akkusativ oder Ablativ. Dementsprechend musst du bei ihnen (im Gegensatz zu allen anderen Präpositionen!) fragen:"},{"type":"list","items":["in + Akk. / sub + Akk. → Frage: WOHIN? (der Akkusativ gibt eine RICHTUNG an)","in + Abl. / sub + Abl. → Frage: WO? (der Ablativ gibt einen PUNKT an)"]},{"type":"text","text":"Beispiele:"},{"type":"list","items":["in aquam saltat = „er springt ins Wasser“ (Akk. → WOHIN?)","in aqua sedent = „sie sitzen im Wasser“ (Abl. → WO?)"]}]},{"title":"Infinitiv (Nennform)","blocks":[{"type":"text","text":"Der Infinitiv Präsens aktiv ist an der Endung -re zu erkennen:"},{"type":"table","headers":["","a-Konjugation","e-Konjugation"],"rows":[["Infinitiv","amā-re „(zu) lieben“","monē-re „(zu) mahnen“"]]}]}]},{"number":6,"title":"De Romulo et Remo","unit":"Die römische Frühzeit","klasse":5,"vocab":[{"la":"filia","forms":"filiae f.","de":"Tochter","note":"vgl. Filiale (= Tochterunternehmen)","pos":"Nomen"},{"la":"tamen","forms":"","de":"dennoch, trotzdem","note":"↔ tam","pos":"Sonstiges"},{"la":"duo/duae/duo","forms":"","de":"zwei","note":"ital. due, span. dos; vgl. Duett, Duo","pos":"Adjektiv"},{"la":"filius","forms":"filii m.","de":"Sohn","note":"frz. fils, ital. figlio","pos":"Nomen"},{"la":"parvus/a/um","forms":"","de":"klein","note":"↔ magnus","pos":"Adjektiv"},{"la":"paulo post","forms":"","de":"wenig später","note":"","pos":"Sonstiges"},{"la":"post (nach Abl.)","forms":"","de":"später","note":"↔ post + Akk.","pos":"Sonstiges"},{"la":"appropinquare","forms":"appropinquo 1, -avi, -atum","de":"sich nähern","note":"engl. to approach","pos":"Verb"},{"la":"liberi (Pl.)","forms":"liberorum m.","de":"die Kinder","note":"↔ libri, librorum","pos":"Nomen"},{"la":"autem","forms":"","de":"aber","note":"immer nachgestellt: ego autem = sed ego („aber ich“)","pos":"Sonstiges"},{"la":"deinde","forms":"","de":"dann","note":"","pos":"Sonstiges"},{"la":"portare","forms":"porto 1, portavi, -atum","de":"tragen, bringen","note":"frz. porter, ital. portare; vgl. trans-portieren, ap-portieren („heranbringen“)","pos":"Verb"},{"la":"annus","forms":"anni m.","de":"Jahr","note":"frz. an, ital. anno, span. año; vgl. Annalen (= Jahrbücher)","pos":"Nomen"},{"la":"oppidum","forms":"oppidi n.","de":"Stadt","note":"","pos":"Nomen"},{"la":"aedificare","forms":"aedifico 1, -avi, -atum","de":"erbauen","note":"frz. édifier, ital. edificare; vgl. aedificium","pos":"Verb"},{"la":"regnare","forms":"regno 1, regnavi, -atum","de":"herrschen, regieren","note":"frz. régner, ital. regnare, span. reinar, engl. to reign","pos":"Verb"},{"la":"posse","forms":"possum, potui, –","de":"können","note":"(siehe Grammatica); vgl. engl. possible","pos":"Verb"},{"la":"sex","forms":"","de":"sechs","note":"vgl. Sextett","pos":"Sonstiges"},{"la":"duodecim","forms":"","de":"zwölf","note":"ital. dodici; vgl. das Dutzend (= zwölf Stück)","pos":"Sonstiges"},{"la":"dis = deis","forms":"(3./6.F. Pl. m.)","de":"den Göttern","note":"","pos":"Nomen"},{"la":"di = dei (= dii)","forms":"(1.F. Pl. m.)","de":"die Götter","note":"","pos":"Nomen"},{"la":"gratus/a/um","forms":"","de":"1) dankbar; 2) lieb, angenehm","note":"ital. grato","pos":"Adjektiv"},{"la":"esse","forms":"sum, fui, –","de":"(zu) sein","note":"(siehe Grammatica)","pos":"Verb"},{"la":"auxilium","forms":"auxilii n.","de":"Hilfe","note":"span. auxilio; vgl. engl. auxiliary verbs (= Hilfszeitwörter)","pos":"Nomen"},{"la":"nonnulli/ae/a (Pl.)","forms":"","de":"einige","note":"","pos":"Adjektiv"},{"la":"magnificus/a/um","forms":"","de":"großartig, prächtig","note":"frz. magnifique, ital. magnifico, span. magnífico","pos":"Adjektiv"},{"la":"trans (+ Akk.)","forms":"","de":"über; jenseits von","note":"vgl. Transit, Transfer, Transformator; „Transdanubien“","pos":"Präposition"}],"grammar":[{"title":"esse („sein“) und posse („können“)","blocks":[{"type":"text","text":"Die Verba esse und posse werden unregelmäßig abgewandelt, weisen aber viele Parallelen zueinander auf: posse („können“) ist nämlich eine Zusammensetzung aus potis („fähig“) + esse („sein“)."},{"type":"table","headers":["","esse","posse"],"rows":[["Sg. 1.P.","sum „ich bin“","possum „ich kann“"],["Sg. 2.P.","es „du bist“","potes „du kannst“"],["Sg. 3.P.","est „er/sie/es ist“","potest „er/sie/es kann“"],["Pl. 1.P.","sumus „wir sind“","possumus „wir können“"],["Pl. 2.P.","estis „ihr seid“","potestis „ihr könnt“"],["Pl. 3.P.","sunt „sie sind“","possunt „sie können“"],["Infinitiv","esse „(zu) sein“","posse „(zu) können“"],["Imperativ Sg.","es! „sei!“","–"],["Imperativ Pl.","este! „seid!“","–"]]},{"type":"note","text":"In einigen Formen von posse hat sich die Silbe pot- zu pos- verändert, und zwar immer dort, wo die nachfolgende Silbe mit s beginnt (sum, sumus, sunt). Man nennt diese Anpassung eines Buchstaben an den folgenden Assimilation: pot-sumus → pos-sumus; ad-portare → ap-portare."},{"type":"tip","text":"Wenn du bei den Formen von posse die Silbe pos- bzw. pot- weglässt, erhältst du die zugrunde liegende Form von esse!"}]},{"title":"Dativ des Besitzers (Dativus possessivus)","blocks":[{"type":"text","text":"Eine Eigenheit des Lateinischen ist der Dativ des Besitzers (Dativus possessivus). Ihn darf man nicht wörtlich übersetzen, sondern man muss ihn zu einem „haben“-Satz umformen:"},{"type":"list","items":["Rheae Silviae duo filii sunt. = (Der Rhea Silvia sind zwei Söhne. →) „Rhea Silvia hat zwei Söhne.“","Mihi amica pulchra est. = (Mir ist eine hübsche Freundin. →) „Ich habe eine hübsche Freundin.“"]}]},{"title":"Mittelsablativ (Ablativus instrumenti)","blocks":[{"type":"text","text":"Der Ablativ steht im Lateinischen nicht nur nach bestimmten Präpositionen, sondern auch auf bestimmte Fragen. Die häufigste lautet „WOMIT?“ / „WODURCH?“. Ein solcher Ablativ heißt Mittelsablativ (Ablativus instrumenti), da er das Mittel angibt, mithilfe dessen etwas gemacht wird."},{"type":"text","text":"Übersetzung: „mit“, „durch“:"},{"type":"list","items":["Romulus Remum gladio necat. = „Romulus tötet Remus mit dem Schwert.“"]},{"type":"tip","text":"DINGE und SACHBEGRIFFE stehen im Ablativ meistens ohne, PERSONEN meist mit Präposition: „mit dem Freund“ = cum amico (→ Person!); „mit dem Schwert“ = gladio (→ Sache!)"}]}]},{"number":7,"title":"De Romanis et Sabinis","unit":"Die römische Frühzeit","klasse":5,"vocab":[{"la":"venire","forms":"venio 4, veni, ventum","de":"kommen","note":"frz. venir, ital. venire, span. venir","pos":"Verb"},{"la":"habitare","forms":"habito 1, -avi, -atum","de":"wohnen; bewohnen","note":"frz. habiter, ital. abitare, span. habitar","pos":"Verb"},{"la":"ut","forms":"","de":"1) wie; 2) als","note":"","pos":"Sonstiges"},{"la":"apud (+ Akk.)","forms":"","de":"bei","note":"","pos":"Präposition"},{"la":"legere","forms":"lego 3, legi, lectum","de":"lesen","note":"ital. leggere; vgl. Lektüre, Legende","pos":"Verb"},{"la":"consilium","forms":"consilii n.","de":"Plan, Beschluss; Rat","note":"frz. conseil, ital. consiglio, span. consejo","pos":"Nomen"},{"la":"capere","forms":"capio M, cepi, captum","de":"1) fassen, ergreifen; 2) fangen; 3) nehmen","note":"ital. capire; vgl. kapern, kapieren (= verstehen)","pos":"Verb"},{"la":"nuntius","forms":"nuntii m.","de":"Bote; Nachricht","note":"vgl. Nuntius (= päpstlicher Botschafter)","pos":"Nomen"},{"la":"populus","forms":"populi m.","de":"Volk","note":"vgl. populär (= beim Volk beliebt), Populismus","pos":"Nomen"},{"la":"mittere","forms":"mitto 3, misi, missum","de":"schicken","note":"vgl. Missionar (= einer, der ausgeschickt wurde)","pos":"Verb"},{"la":"dicere","forms":"dico 3, dixi, dictum","de":"1) sagen; 2) nennen","note":"vgl. Diktat; Diktion (= Ausdrucksweise)","pos":"Verb"},{"la":"parare","forms":"paro 1, paravi, -atum","de":"1) vorbereiten, bereiten; 2) erwerben","note":"vgl. etwas parat haben (= etwas vorbereitet haben)","pos":"Verb"},{"la":"audire","forms":"audio 4, audivi, -itum","de":"hören","note":"vgl. Audio-Datei, Audienz; Auditorium (= Hörsaal)","pos":"Verb"},{"la":"nam","forms":"","de":"denn, nämlich","note":"","pos":"Sonstiges"},{"la":"dum (+ Präsens)","forms":"","de":"während","note":"","pos":"Sonstiges"},{"la":"subito (Adv.)","forms":"","de":"plötzlich","note":"↔ ital. subito = „sofort“!","pos":"Adverb"},{"la":"rapere","forms":"rapio M, rapui, raptum","de":"rauben","note":"frz. ravir, ital. rapire","pos":"Verb"},{"la":"domum","forms":"","de":"nach Hause","note":"","pos":"Sonstiges"},{"la":"arma (Pl.)","forms":"armorum n.","de":"Waffen","note":"frz. arme, ital. + span. arma; vgl. Armee, Alarm (aus „Ad arma!“ = „Zu den Waffen“), Armada","pos":"Nomen"},{"la":"adiuvare","forms":"adiuvo 1, -iuvi, -iutum","de":"unterstützen, helfen","note":"vgl. Adjutant (= Hilfsoffizier eines Kommandanten)","pos":"Verb"},{"la":"relinquere","forms":"relinquo 3, reliqui, relictum","de":"1) verlassen; 2) zurücklassen","note":"vgl. Reliquien (= Überreste von Heiligen), Relikt (= Überbleibsel)","pos":"Verb"},{"la":"domi","forms":"","de":"zu Hause","note":"↔ domum","pos":"Sonstiges"},{"la":"iniuria","forms":"iniuriae f.","de":"Unrecht","note":"","pos":"Nomen"},{"la":"tolerare","forms":"tolero 1, -avi, -atum","de":"ertragen","note":"vgl. tolerant sein (= nachsichtig sein)","pos":"Verb"},{"la":"bellum","forms":"belli n.","de":"Krieg","note":"vgl. Rebellion, Duell (duellum = bellum)","pos":"Nomen"},{"la":"bellum gerere","forms":"gero 3, gessi, gestum","de":"Krieg führen","note":"","pos":"Verb"},{"la":"inter (+ Akk.)","forms":"","de":"zwischen","note":"vgl. international, Intercity-Zug, Intervall, interaktiv","pos":"Präposition"},{"la":"contendere","forms":"contendo 3, -tendi, -tentum","de":"1) eilen; 2) kämpfen","note":"Grundbedeutung: „die Kräfte anspannen“","pos":"Verb"},{"la":"necesse est","forms":"","de":"es ist notwendig","note":"engl. necessary; vgl. das Necessaire (= Behälter mit Reisebedarf)","pos":"Sonstiges"}],"grammar":[{"title":"Konjugationen","blocks":[{"type":"text","text":"Neben der a- und e-Konjugation gibt es noch drei weitere Konjugationsklassen, die sich allerdings nur in wenigen Details voneinander unterscheiden. Wie a- und e-Konjugation sind auch sie nach dem Auslaut ihres Stammes benannt:"},{"type":"list","items":["konsonantische Konjugation → Stamm endet auf einen Konsonanten (Mitlaut)","i-Konjugation → Stamm endet auf langes i","Mischkonjugation → Stamm endet auf kurzes i („Misch“, weil die Formen teils nach der konsonantischen, teils nach der i-Konjugation gebildet werden)"]},{"type":"text","text":"Da bei der konsonantischen Konjugation der Stamm auf einen Mitlaut endet, tritt als Bindeglied zwischen Stamm und Endung ein sogenannter Bindevokal, der meistens -i- lautet: mitt-i-s (Stamm – Bindevokal – Endung)."},{"type":"text","text":"An den Stamm werden bei allen Konjugationen dieselben Personalendungen angefügt:"},{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj."],"rows":[["Sg. 1.P.","amo","habe-o","mitt-o","audi-o","capi-o"],["Sg. 2.P.","ama-s","habe-s","mitt-i-s","audi-s","capi-s"],["Sg. 3.P.","ama-t","habe-t","mitt-i-t","audi-t","capi-t"],["Pl. 1.P.","ama-mus","habe-mus","mitt-i-mus","audi-mus","capi-mus"],["Pl. 2.P.","ama-tis","habe-tis","mitt-i-tis","audi-tis","capi-tis"],["Pl. 3.P.","ama-nt","habe-nt","mitt-u-nt","audi-u-nt","capi-u-nt"],["Infinitiv","amā-re","habē-re","mitt-e-re","audī-re","cape-re"],["Imperativ Sg.","ama!","habe!","mitt-e!","audi!","cape!"],["Imperativ Pl.","amā-te!","habē-te!","mitt-i-te!","audī-te!","capi-te!"]]},{"type":"text","text":"Ausnahmen beim Imperativ: dic! („sag!“) und duc! („führ!“)."},{"type":"note","text":"Zu welcher Konjugationsklasse ein Verbum gehört, erkennst du nicht an der 1. Person Sg. oder am Infinitiv alleine, sondern erst aus der Kombination von Infinitiv Präsens und 1. Person Sg."},{"type":"list","items":["-are, -o → a-Konjugation (Abkürzung: -are 1): z. B. amare 1","-ēre, -eo → e-Konjugation (Abkürzung: -ēre 2): z. B. habēre 2","-ere, -o → konsonantische Konjugation (Abkürzung: -ere 3): z. B. mittere 3","-ire, -io → i-Konjugation (Abkürzung: -ire 4): z. B. audire 4","-ere, -io → Mischkonjugation (Abkürzung: -ere M): z. B. capere M"]},{"type":"tip","text":"Um bei den Verba auf -ere (e-, konsonantische und Mischkonjugation) die Konjugationszugehörigkeit deutlich zu machen, ist bei diesen Infinitiven im Vocabularium jeweils der Akzent angegeben (-ére → e-Konjugation, -ere → Misch- oder konsonantische Konjugation)."}]}]},{"number":8,"title":"De Lucretia","unit":"Die römische Frühzeit","klasse":5,"vocab":[{"la":"tres (m./f.)","forms":"tria (n.)","de":"drei","note":"frz. trois, ital. tre, span. tres; vgl. Triathlon, Triumvirat (= Dreimännerbund)","pos":"Adjektiv"},{"la":"hora","forms":"horae f.","de":"Stunde","note":"engl. hour, frz. heure, ital. ora, span. hora","pos":"Nomen"},{"la":"facere","forms":"facio M, feci, factum","de":"tun, machen","note":"frz. faire, ital. fare","pos":"Verb"},{"la":"neque – neque","forms":"(= nec – nec)","de":"weder – noch","note":"vgl. neque","pos":"Sonstiges"},{"la":"dormire","forms":"dormio 4, -ivi, -itum","de":"schlafen","note":"frz. dormir, ital. dormire, span. dormir","pos":"Verb"},{"la":"solus/a/um","forms":"2.F. solius, 3.F. soli","de":"allein","note":"ital. + span. solo/a; vgl. Solo, Solist","pos":"Adjektiv"},{"la":"duo/duae/duo","forms":"","de":"zwei","note":"(siehe Grammatica); ital. due; vgl. Duett, Duo","pos":"Adjektiv"},{"la":"unus/a/um","forms":"2.F. unius, 3.F. uni","de":"1) ein; 2) einzig","note":"frz. un, ital. uno, span. un; Unikat (= Einzelstück)","pos":"Adjektiv"},{"la":"primus/a/um","forms":"","de":"der erste","note":"ital. primo; vgl. Primel, Primar, Primat, prima, primär","pos":"Adjektiv"},{"la":"castra (Pl.)","forms":"castrorum n.","de":"das Lager (Sg.)","note":"vgl. Kastell (= kleines Lager), engl. castle","pos":"Nomen"},{"la":"resistere","forms":"resisto 3, restiti, –","de":"sich widersetzen, Widerstand leisten","note":"engl. to resist; vgl. resistent (= widerstandsfähig)","pos":"Verb"},{"la":"committere","forms":"committo 3, commisi, commissum","de":"begehen (ein Verbrechen); beginnen (einen Krieg)","note":"engl. to commit (a crime)","pos":"Verb"},{"la":"nisi","forms":"","de":"wenn nicht, falls nicht","note":"↔ si","pos":"Sonstiges"},{"la":"parere","forms":"pareo 2, parui, –","de":"gehorchen","note":"vgl. parieren; ↔ parare 1","pos":"Verb"},{"la":"servus","forms":"servi m.","de":"Sklave","note":"Servus! (erg. sum) = „Ich bin dein Diener“","pos":"Nomen"},{"la":"non iam","forms":"","de":"nicht mehr","note":"↔ iam","pos":"Sonstiges"},{"la":"culpa","forms":"culpae f.","de":"Schuld","note":"ital. colpa, span. culpa","pos":"Nomen"},{"la":"nullus/a/um","forms":"2.F. nullius, 3.F. nulli","de":"kein","note":"vgl. Null; ↔ nonnulli","pos":"Adjektiv"},{"la":"exemplum","forms":"exempli n.","de":"Beispiel","note":"engl. for example („zum Beispiel“)","pos":"Nomen"},{"la":"maxime (Adv.)","forms":"","de":"sehr; am meisten","note":"vgl. maximal","pos":"Adverb"},{"la":"familia","forms":"familiae f.","de":"Familie","note":"engl. family, frz. famille, ital. famiglia","pos":"Nomen"},{"la":"expellere","forms":"expello 3, expuli, expulsum","de":"1) vertreiben; 2) verjagen","note":"","pos":"Verb"}],"grammar":[{"title":"Numeralia (Zahlwörter)","blocks":[{"type":"table","headers":["Ziffer","Grundzahl","Bedeutung","Ordnungszahl","Bedeutung"],"rows":[["I","unus, una, unum","„ein(s)“","primus/a/um","„der/die/das Erste“"],["II","duo, duae, duo","„zwei“","secundus/a/um","„der/die/das Zweite“"],["III","tres, tres, tria","„drei“","tertius/a/um","„der/die/das Dritte“"],["IV","quattuor","„vier“","quartus/a/um","„der/die/das Vierte“"],["V","quinque","„fünf“","quintus/a/um","„der/die/das Fünfte“"],["VI","sex","„sechs“","sextus/a/um","„der/die/das Sechste“"],["VII","septem","„sieben“","septimus/a/um","„der/die/das Siebente“"],["VIII","octo","„acht“","octavus/a/um","„der/die/das Achte“"],["IX","novem","„neun“","nonus/a/um","„der/die/das Neunte“"],["X","decem","„zehn“","decimus/a/um","„der/die/das Zehnte“"],["C","centum","„hundert“","centesimus/a/um","„der/die/das Hundertste“"],["M","mille","„tausend“","millesimus/a/um","„der/die/das Tausendste“"]]},{"type":"text","text":"Die Zahlen 1–3 werden dekliniert:"},{"type":"table","headers":["Fall","unus (m., f., n.)","duo (m., f., n.)","tres (m./f., n.)"],"rows":[["1","unus, una, unum","duo, duae, duo","tres, tria"],["2","unius","duorum, duarum, duorum","trium"],["3","uni","duobus, duabus, duobus","tribus"],["4","unum, unam, unum","duos, duas, duo","tres, tria"],["6","uno, una, uno","duobus, duabus, duobus","tribus"]]},{"type":"text","text":"Zu mille (nicht deklinierbar) gibt es einen Plural, z. B. duo milia (= 2000). Diese Form dekliniert: 1.F. milia, 2.F. milium, 3.F. milibus, 4.F. milia, 6.F. (cum) milibus."},{"type":"note","text":"A. D. = anno Domini („im Jahr des Herrn“ = nach Christi Geburt). Das Zahlzeichen D steht für 500."}]},{"title":"Zeitablativ (Ablativus temporis) und Akkusativ der Zeitstrecke","blocks":[{"type":"list","items":["Bei Zeitbegriffen („Tag“, „Monat“, „Jahr“ etc.) steht auf die Frage „WANN?“ der Zeitablativ (Ablativus temporis) ohne Präposition: hora prima iterum in castris sunt = „in der (zur) ersten Stunde sind sie wieder im Lager“; secundo anno = „im zweiten Jahr“","Dagegen steht auf die Frage „WIE LANGE?“ der Akkusativ (Akkusativ der Zeitstrecke): tres horas equitant = „sie reiten drei Stunden (lang)“"]},{"type":"text","text":"Unter der prima hora verstanden die Römer die Stunde, in der es hell wurde. Da der Tag von Sonnenaufgang bis Sonnenuntergang in jedem Fall in zwölf horae eingeteilt war, variierte die Dauer einer hora zwischen Winter und Sommer stark."}]}]},{"number":9,"title":"Quem Romani maxime timent?","unit":"Die römische Frühzeit","klasse":5,"vocab":[{"la":"quem?","forms":"","de":"wen?","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"timere","forms":"timeo 2, timui, –","de":"fürchten; sich fürchten","note":"ital. temere, span. temer","pos":"Verb"},{"la":"Galli","forms":"Gallorum m.","de":"die Gallier (= Kelten)","note":"frz. Gaulois","pos":"Nomen"},{"la":"flumen","forms":"fluminis n.","de":"Fluss","note":"ital. fiume","pos":"Nomen"},{"la":"miles","forms":"militis m.","de":"Soldat","note":"vgl. Militär","pos":"Nomen"},{"la":"fugere (+ Akk.)","forms":"fugio M, fugi, –","de":"flüchten (vor), fliehen","note":"vgl. Zentrifuge, Refugium (= Rückzugsort)","pos":"Verb"},{"la":"occupare","forms":"occupo 1, -avi, -atum","de":"besetzen","note":"frz. occuper, ital. occupare; vgl. okkupieren","pos":"Verb"},{"la":"delere","forms":"deleo 2, delevi, deletum","de":"zerstören","note":"vgl. engl. to delete = „löschen“","pos":"Verb"},{"la":"oppugnare","forms":"oppugno 1, -avi, -atum","de":"bestürmen, belagern","note":"wörtlich: „dagegenkämpfen“","pos":"Verb"},{"la":"expugnare","forms":"expugno 1, -avi, -atum","de":"erobern","note":"wörtlich: „herauskämpfen“","pos":"Verb"},{"la":"nox","forms":"noctis f. (2. F. Pl. -ium)","de":"Nacht","note":"frz. nuit, ital. notte, span. noche","pos":"Nomen"},{"la":"constituere","forms":"constituo 3, constitui, constitutum","de":"beschließen, festsetzen","note":"vgl. Konstitution (= Verfassung)","pos":"Verb"},{"la":"clam (Adv.)","forms":"","de":"heimlich","note":"vgl. klammheimlich (= ganz heimlich)","pos":"Adverb"},{"la":"ascendere","forms":"ascendo 3, ascendi, ascensum","de":"hinaufsteigen, besteigen","note":"vgl. Aszendent; frz. ascenseur, ital. ascensore, span. ascensor","pos":"Verb"},{"la":"homo","forms":"hominis m.","de":"Mensch","note":"frz. homme; Homo sapiens","pos":"Nomen"},{"la":"canis","forms":"canis m.","de":"Hund","note":"frz. chien, ital. cane; Cave canem","pos":"Nomen"},{"la":"Iuno","forms":"Iunonis f.","de":"Juno (griech. Hera)","note":"Gattin des Jupiter","pos":"Nomen"},{"la":"sacer/cra/crum","forms":"","de":"1) heilig; 2) geweiht","note":"vgl. Sakristei, Sakrament, sakral","pos":"Adjektiv"},{"la":"quamquam","forms":"","de":"obwohl","note":"","pos":"Sonstiges"},{"la":"carere (+ Abl.)","forms":"careo 2, carui, –","de":"frei sein (von …), nicht haben","note":"z. B. otio careo = (ich bin frei von Freizeit →) „ich habe keine Freizeit“; vgl. Karenz","pos":"Verb"},{"la":"vox","forms":"vocis f.","de":"Stimme","note":"engl. voice, frz. voix, ital. voce, span. voz","pos":"Nomen"},{"la":"clamor","forms":"clamoris m.","de":"Geschrei, Lärm","note":"frz. clameur, ital. clamore; vgl. clamare","pos":"Nomen"},{"la":"statim (Adv.)","forms":"","de":"sofort, sogleich","note":"","pos":"Adverb"},{"la":"ceteri/ae/a (Pl.)","forms":"","de":"die übrigen","note":"etc. (et cetera) = „und das Übrige“","pos":"Adjektiv"},{"la":"servare","forms":"servo 1, -avi, -atum","de":"1) retten; 2) bewahren","note":"vgl. konservieren","pos":"Verb"},{"la":"gloria","forms":"gloriae f.","de":"Ruhm, Ehre","note":"vgl. Gloria; glorreich (= ruhmreich)","pos":"Nomen"},{"la":"nomen","forms":"nominis n.","de":"Name","note":"vgl. Nomen est omen = „Der Name ist Vorzeichen“","pos":"Nomen"},{"la":"accipere","forms":"accipio M, accepi, acceptum","de":"1) erhalten; 2) aufnehmen; 3) annehmen","note":"vgl. akzeptieren (= etwas annehmen)","pos":"Verb"}],"grammar":[{"title":"„Dritte“ Deklination: Konsonantenstämme","blocks":[{"type":"text","text":"Die dritte Deklination ist ein Sammelbegriff für verschiedene Nomina (Substantiva), die zwar sehr unterschiedliche Nominative, sonst aber weitgehend gleiche Kasusendungen haben. Die in diesem Stück vorkommenden Wörter gehören zu den sogenannten Konsonantenstämmen, da ihr Stamm auf einen Konsonanten (Mitlaut) endet."},{"type":"text","text":"Den Stamm erkennst du, wenn du vom Genetiv Sg. die Endung -is weglässt:"},{"type":"list","items":["homin-is → Stamm homin-","voc-is → Stamm voc-","flumin-is → Stamm flumin-"]},{"type":"text","text":"Das Geschlecht der Wörter der 3. Deklination kann maskulin, feminin oder neutrum sein."},{"type":"table","headers":["Fall","Frage","maskulin","feminin","neutrum"],"rows":[["Sg. 1","Wer?/Was?","homo","vox","flumen"],["Sg. 2","Wessen?","hominis","vocis","fluminis"],["Sg. 3","Wem?","homini","voci","flumini"],["Sg. 4","Wen?/Was?","hominem","vocem","flumen"],["Sg. 5","(Anrede)","homo!","vox!","flumen!"],["Sg. 6","Womit? Wodurch?","cum homine","voce","flumine"],["Pl. 1","Wer?","homines","voces","flumina"],["Pl. 2","Wessen?","hominum","vocum","fluminum"],["Pl. 3","Wem?","hominibus","vocibus","fluminibus"],["Pl. 4","Wen?/Was?","homines","voces","flumina"],["Pl. 5","(Anrede)","homines!","voces!","flumina!"],["Pl. 6","Womit? Wodurch?","cum hominibus","vocibus","fluminibus"]]},{"type":"note","text":"Einige Endungen der 3. Deklination sind „verwechslungsanfällig“ mit der a- bzw. o-Deklination: -is → 3. Dekl. 2.F. Sg. (hominis = „des Menschen“), aber a-/o-Dekl. 3./6.F. Pl. (amicis = „den Freunden“). -i → 3. Dekl. 3.F. Sg. (homini = „dem Menschen“), aber o-Dekl. 2.F. Sg. (amici = „des Freundes“) oder 1.F. Pl. (amici = „die Freunde“)."},{"type":"tip","text":"Dass ein Wort zur 3. Deklination gehört, erkennst du am Genetiv Singular auf -is. Bei den Vokabeln musst du daher immer den Genetiv Singular (und das Geschlecht) mitlernen!"}]},{"title":"Quis?/Quid? („Wer?“/„Was?“)","blocks":[{"type":"text","text":"Bei quis?/quid? handelt es sich um das substantivische Fragepronomen (Interrogativpronomen). Substantivisch heißt, dass es nicht übereingestimmt wird, sondern wie ein Substantiv (= Nomen) alleine steht: z. B. Quem vides? = „Wen siehst du?“"},{"type":"table","headers":["Fall","Person","Sache","Bedeutung"],"rows":[["1.F.","quis?","quid?","„wer?“ / „was?“"],["2.F.","cuius?","cuius?","„wessen?“"],["3.F.","cui?","cui?","„wem?“"],["4.F.","quem?","quid?","„wen?“ / „was?“"],["6.F.","a quo? / cum quo?","a quo? / cum quo?","„von wem?“ / „mit wem?“"]]},{"type":"text","text":"Das adjektivische Fragepronomen ist dagegen mit einem Nomen übereingestimmt: qui, quae, quod (→ Lektion 12): z. B. Quem canem vides? = „Welchen Hund siehst du?“"}]}]},{"number":10,"title":"De Hannibale","unit":"Die römische Frühzeit","klasse":5,"vocab":[{"la":"imperator","forms":"imperatoris m.","de":"1) Feldherr; 2) Kaiser","note":"eigentl.: „Befehlshaber“ (vgl. imperare!)","pos":"Nomen"},{"la":"virtus","forms":"virtutis f.","de":"1) Tapferkeit; 2) Tugend","note":"eigentl.: „Mannhaftigkeit“ (vgl. vir = Mann)","pos":"Nomen"},{"la":"copiae (Pl.)","forms":"copiarum f.","de":"Truppen","note":"↔ copia, -ae (Sg.)","pos":"Nomen"},{"la":"ducere","forms":"duco 3, duxi, ductum","de":"führen","note":"vgl. reduzieren","pos":"Verb"},{"la":"navis","forms":"navis f.","de":"Schiff","note":"Navigation (= Steuerung des Schiffs); vgl. engl. navy","pos":"Nomen"},{"la":"mare","forms":"maris n.","de":"Meer","note":"frz. mer, ital. mare; vgl. Marine","pos":"Nomen"},{"la":"audere","forms":"audeo 2, ausus sum","de":"wagen","note":"frz. oser, ital. osare, span. osar","pos":"Verb"},{"la":"amittere","forms":"amitto 3, amisi, amissum","de":"verlieren","note":"wörtl.: „wegschicken“","pos":"Verb"},{"la":"pugna","forms":"pugnae f.","de":"Kampf","note":"vgl. pugnare","pos":"Nomen"},{"la":"vincere","forms":"vinco 3, vici, victum","de":"siegen, besiegen","note":"frz. vaincre, ital. vincere, span. vencer","pos":"Verb"},{"la":"pars","forms":"partis f.","de":"Teil","note":"engl. part; vgl. partiell (= teilweise)","pos":"Nomen"},{"la":"timor","forms":"timoris m.","de":"Furcht, Angst","note":"ital. timore, span. temor; vgl. timere","pos":"Nomen"},{"la":"ne … quidem","forms":"","de":"nicht einmal …","note":"z. B. ne tu quidem","pos":"Sonstiges"},{"la":"prohibere","forms":"prohibeo 2, -ui, -itum","de":"1) ab-, fernhalten; 2) hindern, verhindern","note":"ital. proibire, span. prohibir; vgl. engl. to prohibit („verbieten“)","pos":"Verb"},{"la":"occidere","forms":"occido 3, occidi, occisum","de":"töten","note":"ital. uccidere","pos":"Verb"},{"la":"porta","forms":"portae f.","de":"Tor, Tür","note":"frz. porte, ital. porta; vgl. Portal, Portier","pos":"Nomen"},{"la":"urbs","forms":"urbis f.","de":"Stadt","note":"vgl. engl. suburb; urban (= städtisch)","pos":"Nomen"},{"la":"summus/a/um","forms":"","de":"der höchste; sehr hoch","note":"vgl. Summe; engl. summit (= Höhepunkt)","pos":"Adjektiv"},{"la":"honor","forms":"honoris m.","de":"Ehre, Ansehen","note":"vgl. honorieren (= belohnen); engl. honour","pos":"Nomen"},{"la":"facere","forms":"(mit doppeltem Akk.)","de":"zu etwas machen","note":"z. B. te amicam meam facio","pos":"Verb"},{"la":"patria","forms":"patriae f.","de":"Heimat","note":"ital. + span. patria; vgl. Patriot","pos":"Nomen"},{"la":"pax","forms":"pacis f.","de":"Friede","note":"engl. peace; vgl. Pazifist (= Kriegsgegner), Pazifik","pos":"Nomen"},{"la":"hostis","forms":"hostis m.","de":"Feind","note":"vgl. engl. hostile (= feindlich)","pos":"Nomen"},{"la":"liberare (+ Abl.)","forms":"libero 1, -avi, -atum","de":"befreien (von)","note":"vgl. liberalisieren (= von Regelungen befreien)","pos":"Verb"}],"grammar":[{"title":"„Dritte“ Deklination: Misch- und i-Stämme","blocks":[{"type":"text","text":"Zur dritten Deklination gehören nicht nur die Konsonantenstämme (siehe vorige Lektion), sondern auch die Mischstämme und die i-Stämme. Die drei Untergruppen unterscheiden sich nur in einigen wenigen Details voneinander: im Akkusativ und Ablativ Sg. sowie im Genetiv Pl. Auch bei Misch- und i-Stämmen sind die Nominative sehr unterschiedlich, gemeinsam ist allen Wörtern wieder der Genetiv auf -is."},{"type":"table","headers":["Fall","Frage","Mischst. f.","Mischst. f.","i-Stamm f.","i-Stamm n."],"rows":[["Sg. 1","Wer?/Was?","navis („Schiff“)","urbs („Stadt“)","turris („Turm“)","mare („Meer“)"],["Sg. 2","Wessen?","navis","urbis","turris","maris"],["Sg. 3","Wem?","navi","urbi","turri","mari"],["Sg. 4","Wen?/Was?","navem","urbem","turrim","mare"],["Sg. 5","(Anrede)","navis!","urbs!","turris!","mare!"],["Sg. 6","Womit? Wodurch?","nave","urbe","turri","mari"],["Pl. 1","Wer?","naves","urbes","turres","maria"],["Pl. 2","Wessen?","navium","urbium","turrium","marium"],["Pl. 3","Wem?","navibus","urbibus","turribus","maribus"],["Pl. 4","Wen?/Was?","naves","urbes","turres","maria"],["Pl. 5","(Anrede)","naves!","urbes!","turres!","maria!"],["Pl. 6","Womit? Wodurch?","navibus","urbibus","turribus","maribus"]]},{"type":"text","text":"Die Mischstämme sind großteils feminin. Zu ihnen gehören zwei Gruppen von Nomina:"},{"type":"list","items":["Wörter, bei denen der 1. und 2. F. gleich (nämlich auf -is) lauten: z. B. navis, navis („Schiff“).","Wörter, deren Stamm auf zwei oder mehr Mitlaute endet: z. B. urbs, urb-is („Stadt“); pars, part-is („Teil“)."]},{"type":"text","text":"Auch bei den i-Stämmen gibt es zwei Gruppen:"},{"type":"list","items":["feminin sind bestimmte, extra zu lernende Wörter wie turris, -is („Turm“).","neutrum sind alle Nomina auf -e oder -al: z. B. mare, -is („Meer“); animal, -alis („Tier“)."]}]},{"title":"Zusammenfassung: Unterschiede in der 3. Deklination","blocks":[{"type":"table","headers":["","4.F. Sg. m./f.","6.F. Sg.","1./4.F. Pl. n.","2.F. Pl."],"rows":[["Konsonantenstämme","-em","-e","-a","-um"],["Mischstämme","-em","-e","–","-ium"],["i-Stämme","-im","-i","-ia","-ium"]]},{"type":"note","text":"Die Gemeinsamkeiten der drei Untergruppen der 3. Deklination sind wesentlich größer als ihre Unterschiede. Zu den i-Stämmen gehören nur wenige, selten vorkommende Wörter, wie z. B. mare und turris."}]},{"title":"Ablativ der Trennung (Ablativus separationis)","blocks":[{"type":"text","text":"Er steht auf die Frage „WOVON?“ und wird dementsprechend mit „von“ übersetzt:"},{"type":"list","items":["timore liberare = „von der Furcht befreien“","urbe prohibere = „von der Stadt fern halten“"]}]},{"title":"Ablativ der Eigenschaft (Ablativus qualitatis)","blocks":[{"type":"text","text":"Er gibt die Eigenschaft einer Person an. Erstübersetzung: „von“, oft aber auch frei:"},{"type":"list","items":["vir summa virtute = „ein Mann von höchster Tapferkeit“ / „ein sehr tapferer Mann“"]}]}]},{"number":11,"title":"Quis Iovem non amat?","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"Iuppiter","forms":"Iovis m.","de":"Jupiter","note":"griech. Zeus","pos":"Nomen"},{"la":"scire","forms":"scio 4, scivi, scitum","de":"wissen","note":"vgl. engl. science","pos":"Verb"},{"la":"is, ea, id","forms":"","de":"1) dieser/e/es; 2) er, sie, es","note":"hinweisendes Fürwort (siehe Grammatica)","pos":"Sonstiges"},{"la":"vocare","forms":"voco 1, -avi, -atum","de":"1) rufen; 2) nennen","note":"vgl. vox, vocis; vgl. Vokativ („Ruf-Fall“), Advokat","pos":"Verb"},{"la":"imperare","forms":"impero 1, -avi, -atum","de":"befehlen","note":"vgl. Imperator, Imperativ","pos":"Verb"},{"la":"mons","forms":"montis m.","de":"Berg","note":"engl. mount, frz. mont, ital. + span. monte","pos":"Nomen"},{"la":"rex","forms":"regis m.","de":"König","note":"frz. roi, ital. re, span. rey","pos":"Nomen"},{"la":"litus","forms":"litoris n.","de":"Küste, Strand","note":"ital. lido, span. litoral","pos":"Nomen"},{"la":"eius","forms":"(2.F. Sg.)","de":"dessen/deren","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"eorum/earum","forms":"(2.F. Pl.)","de":"deren","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"iussum","forms":"iussi n.","de":"Befehl","note":"","pos":"Nomen"},{"la":"conficere","forms":"conficio M, confeci, confectum","de":"1) ausführen, anfertigen; 2) beenden","note":"vgl. facere M","pos":"Verb"},{"la":"solere","forms":"soleo 2, solitus sum","de":"gewohnt sein, pflegen","note":"span. soler","pos":"Verb"},{"la":"idem, eadem, idem","forms":"","de":"der-, die-, dasselbe","note":"(siehe Grammatica); vgl. ident, identisch","pos":"Sonstiges"},{"la":"locus","forms":"loci m.","de":"Ort, Stelle, Platz","note":"vgl. Lokal, lokalisieren; der Lokus (= WC)","pos":"Nomen"},{"la":"virgo","forms":"virginis f.","de":"Mädchen, Jungfrau","note":"engl. virgin, frz. vierge, ital. vergine, span. virgen","pos":"Nomen"},{"la":"ludere","forms":"ludo 3, lusi, lusum","de":"spielen","note":"vgl. Präludium (= Vorspiel)","pos":"Verb"},{"la":"taurus","forms":"tauri m.","de":"Stier","note":"ital. + span. toro; vgl. Torero (= Stierkämpfer)","pos":"Nomen"},{"la":"multitudo","forms":"multitudinis f.","de":"Menge","note":"vgl. multi/ae/a","pos":"Nomen"},{"la":"conspicere","forms":"conspicio M, conspexi, conspectum","de":"erblicken","note":"vgl. in-spizieren (= genau untersuchen)","pos":"Verb"},{"la":"pulchritudo","forms":"pulchritudinis f.","de":"Schönheit","note":"vgl. pulcher/ra/rum","pos":"Nomen"},{"la":"primo (Adv.)","forms":"","de":"zuerst","note":"vgl. Primel; ↔ primus/a/um (Adj.)","pos":"Adverb"},{"la":"tangere","forms":"tango 3, tetigi, tactum","de":"berühren","note":"vgl. Tangente, tangieren, Tangens; engl. contact","pos":"Verb"},{"la":"corpus","forms":"corporis n.","de":"Körper","note":"vgl. der Korpus; das Corpus delicti (= Beweisstück)","pos":"Nomen"},{"la":"mox (Adv.)","forms":"","de":"bald","note":"","pos":"Adverb"},{"la":"insula","forms":"insulae f.","de":"Insel","note":"engl. island, frz. île, ital. isola, span. isla","pos":"Nomen"}],"grammar":[{"title":"Demonstrativpronomina: is, ea, id","blocks":[{"type":"text","text":"Demonstrativpronomina sind hinweisende Fürwörter (demonstrare = „zeigen“, „hinweisen“, vgl. Demonstration). is, ea, id: „dieser, diese, dieses“"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","is","ea","id","ii","eae","ea"],["2","eius","eius","eius","eorum","earum","eorum"],["3","ei","ei","ei","iis (= eis)","iis (= eis)","iis (= eis)"],["4","eum","eam","id","eos","eas","ea"],["6","eo","eā","eo","iis (= eis)","iis (= eis)","iis (= eis)"]]},{"type":"text","text":"is, ea, id wird auf drei Arten verwendet:"},{"type":"list","items":["a) als Demonstrativpronomen (→ mit einem Nomen übereingestimmt): „dieser, diese, dieses“ – Videte eum taurum! = „Seht diesen Stier!“","b) als Personalpronomen der 3.P. (→ nicht übereingestimmt): „er, sie, es“ – In monte boves regis sunt: Duc eos ad litus! = „Auf dem Berg sind die Rinder des Königs: Führe sie zur Küste!“","c) als Possessivpronomen → nur in den Genetivformen eius (Sg.) = „dessen“ („sein“) / „deren“ („ihr“) und eorum / earum (Pl.) „deren“ („ihr“) – Mercurius Iovem adiuvat et eius iussa conficit. = „Merkur hilft Jupiter und führt dessen Befehle aus.“"]}]},{"title":"idem, eadem, idem: „derselbe, dieselbe, dasselbe“","blocks":[{"type":"text","text":"Dieses Pronomen setzt sich aus den Formen von is, ea, id und -dem („-selbe“) zusammen:"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","idem","eadem","idem","iidem","eaedem","eadem"],["2","eiusdem","eiusdem","eiusdem","eorundem","earundem","eorundem"],["3","eidem","eidem","eidem","iisdem","iisdem","iisdem"],["4","eundem","eandem","idem","eosdem","easdem","eadem"],["6","eodem","eādem","eodem","iisdem","iisdem","iisdem"]]}]},{"title":"Genetiv der Eigenschaft (Genetivus qualitatis)","blocks":[{"type":"text","text":"Er gibt – wie der Ablativ der Eigenschaft – die Eigenschaft einer Person oder Sache an. Er wird auch so wie der Ablativus qualitatis übersetzt: mit „von“ oder frei (d. h. mit einem Adjektiv):"},{"type":"list","items":["taurus summae pulchritudinis = „ein Stier von höchster Schönheit“ / „ein sehr schöner Stier“","puer decem annorum = „ein Bub von zehn Jahren“ / „ein zehnjähriger Bub“","miles magnae virtutis = „ein Soldat von großer Tapferkeit“ / „ein sehr tapferer Soldat“"]}]},{"title":"Teilungsgenetiv (Genetivus partitivus)","blocks":[{"type":"text","text":"Er steht nach Pronomina und Mengenangaben und hebt einen Teil aus einer Menge heraus. Übersetzung: meist „von“, z. B.:"},{"type":"list","items":["quis vestrum? = „wer von euch?“","multi nostrum = „viele von uns“","quid novi? = (was des Neuen =) „Was (gibt es) Neues?“","multum auri = (viel des Goldes =) „viel Gold“"]}]}]},{"number":12,"title":"De Minotauro","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"pater","forms":"patris m.","de":"Vater","note":"vgl. Patriarch (= Familienoberhaupt); ↔ patria, -ae = „Vaterland“","pos":"Nomen"},{"la":"quaerere","forms":"quaero 3, quaesivi, quaesitum","de":"1) suchen (+ Akk.); 2) fragen (+ ab/ex)","note":"quaero amicam = ich suche die Freundin; quaero ab amica = ich frage die Freundin","pos":"Verb"},{"la":"parentes (Pl.)","forms":"parentum m.","de":"Eltern","note":"engl. + frz. parents","pos":"Nomen"},{"la":"qui, quae, quod","forms":"","de":"1) welcher/e/es; 2) der/die/das","note":"(Relativpronomen, siehe Grammatica)","pos":"Sonstiges"},{"la":"nihil","forms":"","de":"nichts","note":"vgl. Nihilist (= einer, der an nichts glaubt)","pos":"Sonstiges"},{"la":"nihil nisi","forms":"","de":"nichts außer; nur","note":"(wörtl.: „nichts, wenn nicht“)","pos":"Sonstiges"},{"la":"debere (+ Inf.)","forms":"debeo 2, -ui, -itum","de":"müssen","note":"frz. devoir, ital. dovere, span. deber","pos":"Verb"},{"la":"caput","forms":"capitis n.","de":"Kopf, Haupt","note":"vgl. engl. capital; vgl. Kapuze, Kapitän","pos":"Nomen"},{"la":"periculum","forms":"periculi n.","de":"Gefahr","note":"vgl. ital. pericoloso","pos":"Nomen"},{"la":"interficere","forms":"interficio M, interfeci, interfectum","de":"töten","note":"= necare, occidere","pos":"Verb"},{"la":"miser/era/erum","forms":"","de":"1) arm, elend; 2) unglücklich","note":"vgl. miserabel; die Misere (= Notlage)","pos":"Adjektiv"},{"la":"navigare","forms":"navigo 1, -avi, -atum","de":"segeln, mit dem Schiff fahren","note":"vgl. navis, -is; navigieren (= „steuern“)","pos":"Verb"},{"la":"adulescens","forms":"adulescentis m.","de":"junger Mann","note":"vgl. die Adoleszenz (= Jugendalter)","pos":"Nomen"},{"la":"iuvare","forms":"iuvo 1, iuvi, iutum","de":"unterstützen, helfen","note":"= adiuvare (Lec. 7)","pos":"Verb"},{"la":"nemo","forms":"","de":"niemand","note":"","pos":"Sonstiges"},{"la":"invenire","forms":"invenio 4, inveni, inventum","de":"1) finden; 2) erfinden","note":"wörtl.: „darauf-kommen“; engl. invention, to invent","pos":"Verb"},{"la":"cura","forms":"curae f.","de":"Sorge","note":"vgl. Kur","pos":"Nomen"},{"la":"quomodo","forms":"","de":"wie","note":"(wörtlich: „auf welche Weise?“)","pos":"Sonstiges"},{"la":"modus","forms":"modi m.","de":"Art, Weise","note":"vgl. Mode (= Art, sich anzuziehen)","pos":"Nomen"},{"la":"dare","forms":"do 1, dedi, datum","de":"geben","note":"ital. dare, span. dar; vgl. Dativ („Gib-Fall“)","pos":"Verb"},{"la":"medius/a/um","forms":"","de":"der mittlere; in der Mitte","note":"vgl. engl. medium (z. B. Kleidergröße, Steak), mediterran","pos":"Adjektiv"},{"la":"medio in labyrintho","forms":"","de":"mitten im Labyrinth","note":"","pos":"Sonstiges"},{"la":"paratus/a/um","forms":"","de":"bereit","note":"vgl. parare (Lec. 7); vgl. „etwas parat haben“","pos":"Adjektiv"},{"la":"atque (= ac)","forms":"","de":"und","note":"= et, -que","pos":"Sonstiges"}],"grammar":[{"title":"qui, quae, quod","blocks":[{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","qui","quae","quod","qui","quae","quae"],["2","cuius","cuius","cuius","quorum","quarum","quorum"],["3","cui","cui","cui","quibus","quibus","quibus"],["4","quem","quam","quod","quos","quas","quae"],["6","quo","qua","quo","quibus","quibus","quibus"]]},{"type":"note","text":"Die Präposition cum wird an die Ablativformen meist angehängt: quocum, quacum, quibuscum."},{"type":"text","text":"Verwendungsarten von qui, quae, quod:"},{"type":"list","items":["als adjektivisches Fragepronomen (→ Bezugswort dahinter): „welcher?“, „welche?“, „welches?“ – Quod monstrum liberos devorat? = „Welches Ungeheuer verschlingt die Kinder?“","als Relativpronomen (als Einleitung eines Relativsatzes → nach Beistrich, Bezugswort davor): „der“, „die“, „das“ / „welcher“, „welche“, „welches“ – Monstrum, quod liberos devorat, Minotaurus est. = „Das Ungeheuer, das (welches) die Kinder verschlingt, ist der Minotaurus.“"]},{"type":"note","text":"Im Gegensatz zu quis?, quid? (vgl. Lec. 9) ist qui, quae, quod ein adjektivisches Fragepronomen, d. h. es ist – wie ein Adjektiv – immer mit einem Substantiv (Nomen) übereingestimmt, während quis?/quid? immer alleine steht: Qui puer clamat? („Welcher Bub schreit?“) ↔ Quis clamat? („Wer schreit?“)"}]},{"title":"Relativsätze (bezügliche Gliedsätze, Attributsätze)","blocks":[{"type":"text","text":"Die häufigste Verwendungsart von qui, quae, quod ist die als Relativpronomen (bezügliches Fürwort)."},{"type":"list","items":["Dieses bezieht sich in Zahl und Geschlecht auf ein (meist davor stehendes) Bezugswort.","Der Fall richtet sich danach, wie man nach dem Pronomen im Gliedsatz fragt."]},{"type":"text","text":"Theseus navem, in qua liberi sunt, ascendit. = „Theseus besteigt das Schiff, in dem die Kinder sind.“ – in qua: Zahl → Sg. (wie navem); Geschlecht → feminin (wie navem); Fall → 6. F. („Wo sind die Kinder?“)"},{"type":"text","text":"Übersetzung des Relativpronomens (achte besonders auf den Genetiv!):"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m./f./n."],"rows":[["1","„der“","„die“","„das“","„die“"],["2","„dessen“","„deren“","„dessen“","„deren“"],["3","„dem“","„der“","„dem“","„denen“"],["4","„den“","„die“","„das“","„die“"],["6","„mit dem“","„mit der“","„mit dem“","„mit denen“"]]},{"type":"text","text":"Die Übersetzung des lateinischen Ablativs hängt davon ab, um welchen Ablativ es sich handelt: „durch den“, „mit dem“, „von dem“ etc."}]}]},{"number":13,"title":"De Daedalo et Icaro","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"amor","forms":"amoris m.","de":"Liebe","note":"frz. amour, ital. amore, span. amor; vgl. Amor","pos":"Nomen"},{"la":"cupere","forms":"cupio M, cupivi, -itum","de":"wünschen, begehren","note":"↔ capere M","pos":"Verb"},{"la":"petere","forms":"peto 3, petivi, petitum","de":"„anstreben“","note":"","pos":"Verb"},{"la":"petere a/ab","forms":"(+ Abl.)","de":"bitten, erbitten","note":"peto a te auxilium = „ich bitte dich um Hilfe“, „ich erbitte Hilfe von dir“","pos":"Verb"},{"la":"manus","forms":"manus f.","de":"Hand","note":"vgl. manuell, Manufaktur, Maniküre","pos":"Nomen"},{"la":"artificium","forms":"artificii n.","de":"Ku
