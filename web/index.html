Forum. c) Für den heiligen Petrus wurde ein Altar errichtet. d) Reliquien des heiligen Sebastian wurden nach Rom gebracht.","a":"a) richtig; b) falsch – sie flohen in die Berge, auf dem Forum wuchs Gras; c) falsch – ein Altar für Sebastian (in der Petrus-Basilika); d) falsch – sie wurden aus Rom (nach Pavia) gebracht"}]},{"title":"Info: Die römischen Katakomben","blocks":[{"type":"text","text":"Entlang der Via Appia wurde wegen des Bestattungsverbots innerhalb der Stadtmauern schon in vorchristlicher Zeit bestattet. Für die einfache Bevölkerung entstanden unterirdische Grabanlagen: In das weiche Tuffgestein wurden Gänge geschlagen, an deren Seiten die Toten in Nischengräbern lagen; die frühen Christen übernahmen das. Mitte des 3. Jh. brachte man die Gebeine von Petrus und Paulus in eine solche Anlage, um sie zu schützen – dort („iuxta vestigia apostolorum“) wurde auch Sebastian bestattet. Der Ort hieß „ad catacumbas“ („bei der Talsenke“); der Name „Katakomben“ ging später auf alle solchen Anlagen über (in Rom über 60). Sie waren nie geheime Zufluchtsorte, sondern Grabanlagen und Gedenkorte."}]},{"title":"III.6 A – Benedikt kommt nach Montecassino (Gregor der Große, Dialoge II,8)","blocks":[{"type":"text","text":"Eine der wichtigsten Persönlichkeiten für die Verbreitung des Christentums war Benedikt von Nursia. Der frühere Einsiedler soll im Jahr 529 in Montecassino (zwischen Rom und Neapel) das Mutterkloster der Benediktiner gegründet haben, das später Vorbild vieler weiterer Mönchsorden wurde."},{"type":"text","text":"Castrum, quod Casinum dicitur, in alti montis latere situm est. Ibi vetustissimum fanum fuit, in quo ex more antiquorum gentilium ab stulto rusticorum populo Apollo colebatur. Ibi itaque vir Dei perveniens, contrivit idolum et subvertit aram atque in ipso templo Apollinis oraculum beati Martini (construxit). Ubi vero ara eiusdem Apollinis fuit, oraculum sancti construxit Iohannis, et multitudinem circumquaque commorantem praedicatione continua ad fidem vocabat."},{"type":"gloss","text":"castrum: „befestigter Ort“; latus, -eris n.: hier „Abhang“; fanum: „Heiligtum“; ex (+ Abl.): hier „gemäß“; gentiles, -ium m.: „die Heiden“; idolum: „Götterbild“; conterere, contrivi: „zerschlagen“; subvertere: „umstürzen“; oraculum: hier „Gebetshaus, Kapelle“; circumquaque: „ringsum, in der Gegend“; commorantem = habitantem; fides: hier „Glaube“."},{"type":"task","q":"Übersetze den Text.","a":"Der befestigte Ort, der Casinum heißt, liegt am Abhang eines hohen Berges. Dort gab es ein sehr altes Heiligtum, in dem nach der Sitte der alten Heiden vom dummen Volk der Bauern Apollo verehrt wurde. Als der Mann Gottes dorthin kam, zerschlug er das Götterbild, stürzte den Altar um und errichtete im Tempel Apollos selbst eine Kapelle des seligen Martin. Wo aber der Altar desselben Apollo gewesen war, errichtete er eine Kapelle des heiligen Johannes, und die Menge, die ringsum wohnte, rief er durch unablässige Predigt zum Glauben."}]},{"title":"III.6 B – Benedikt prophezeit König Totila seine Zukunft (Gregor der Große, Dialoge II,15)","blocks":[{"type":"text","text":"Im Jahr 546 kommt der wegen seiner Grausamkeit gefürchtete Ostgotenkönig Totila nach Montecassino. Dort trifft er auf Benedikt, dem wegen seiner Wundertätigkeit ein großer Ruf vorauseilt."},{"type":"text","text":"Tunc isdem Totila ad Dei hominem accessit. Quem cum longe sedentem cerneret, non ausus (est) accedere, sese in terram dedit. Cui dum vir Dei bis et ter diceret: „Surge“, sed ipse ante eum erigi de terra non auderet, Benedictus, Iesu Christi Domini famulus, ipse dignatus est accedere ad regem prostratum. Quem de terra levavit, de suis actibus increpavit, atque in paucis sermonibus cuncta, quae illi erant ventura, praenuntiavit, dicens: „Multa mala facis, multa fecisti. Iam aliquando ab iniquitate compescere! Et quidem Romam intrabis, mare transibis, novem annis regnabis, decimo morieris.“ Quibus (verbis) auditis rex vehementer territus, oratione petita, recessit, atque ex illo iam tempore minus crudelis fuit. Cum non multo post Romam adiit, ad Siciliam perrexit, anno autem regni sui decimo omnipotentis Dei iudicio regnum cum vita perdidit."},{"type":"gloss","text":"homo/vir Dei: gemeint ist Benedikt; dum (+ Konj.) = cum (+ Konj.); erigere: passiv „sich erheben“; dignari: „sich bereit finden, geruhen“; prostratus: „am Boden liegend“; increpare (de): „tadeln (wegen)“; erant ventura: „bevorstand“; compescere (Imperativ): „lass ab!“; orationem petere: „um ein Gebet bitten“; ex (+ Abl.): hier „seit“; Romam adiit: Totila soll Rom kurz darauf erobert und sich gegenüber den Gefangenen auffallend mild verhalten haben; pergere, perrexi: „aufbrechen“; perdidit = amisit."},{"type":"task","q":"Übersetze den Text.","a":"Da ging derselbe Totila zum Mann Gottes. Als er ihn von Weitem sitzen sah, wagte er nicht heranzutreten und warf sich zu Boden. Als der Mann Gottes zwei- und dreimal zu ihm sagte: „Steh auf!“, er sich aber vor ihm nicht vom Boden zu erheben wagte, fand sich Benedikt, der Diener des Herrn Jesus Christus, selbst bereit, zum am Boden liegenden König zu gehen. Er hob ihn vom Boden auf, tadelte ihn wegen seiner Taten und sagte ihm in wenigen Worten alles voraus, was ihm bevorstand: „Viel Böses tust du, viel hast du getan. Lass endlich einmal ab vom Unrecht! Du wirst zwar Rom betreten, das Meer überqueren, neun Jahre herrschen, im zehnten sterben.“ Nachdem der König diese Worte gehört hatte, zog er sich heftig erschrocken zurück, nachdem er um ein Gebet gebeten hatte, und war seit dieser Zeit weniger grausam. Als er nicht viel später nach Rom gegangen war, brach er nach Sizilien auf; im zehnten Jahr seiner Herrschaft aber verlor er durch das Urteil des allmächtigen Gottes die Herrschaft zugleich mit dem Leben."}]},{"title":"III.6 C – Schlafordnung für Mönche (Regula Benedicti 22)","blocks":[{"type":"text","text":"Die Regula Benedicti ist die erste Mönchsregel des Abendlandes. Benedikt verfasste sie für seine Klostergemeinschaft in Montecassino; im Mittelalter wurde sie zur Grundlage vieler Ordensregeln (z. B. der Zisterzienser). Sie enthält sehr genaue Vorschriften für das Klosterleben – auch für die Nachtruhe."},{"type":"text","text":"Singuli per singula lecta dormiant. Si potest fieri, omnes in uno loco dormiant; sin autem multitudo non sinit, deni aut viceni cum senioribus, qui super eos solliciti sint, pausent. Candela iugiter in eadem cella ardeat usque mane. Vestiti dormiant et cultellos suos ad latus suum non habeant, dum dormiunt, ne forte per somnum vulnerent dormientem. Adulescentiores fratres iuxta se non habeant lectos, sed permixti cum senioribus. Surgentes vero ad opus Dei invicem se moderate cohortentur propter somnulentorum excusationes."},{"type":"gloss","text":"per: hier „in“; lectum/lectus: „Bett“; sinere: „zulassen“; deni: „je zehn“; viceni: „je 20“; sollicitus (super): „besorgt (um)“; pausare: „ruhen“; iugiter: „ununterbrochen“; cultellus: „Messer“; iuxta se: „nebeneinander“; invicem: „gegenseitig“; somnulentus: „Langschläfer“; excusatio, -onis f.: „Ausrede“."},{"type":"task","q":"Übersetze den Text.","a":"Die Einzelnen sollen in einzelnen Betten schlafen. Wenn es möglich ist, sollen alle an einem Ort schlafen; wenn aber die Menge es nicht zulässt, sollen sie zu je zehn oder zwanzig mit Älteren ruhen, die um sie besorgt sind. Eine Kerze soll ununterbrochen in diesem Raum bis zum Morgen brennen. Sie sollen bekleidet schlafen und ihre Messer nicht an ihrer Seite haben, während sie schlafen, damit sie nicht etwa im Schlaf einen Schlafenden verletzen. Die jüngeren Brüder sollen ihre Betten nicht nebeneinander haben, sondern gemischt mit den Älteren. Wenn sie aber zum Gottesdienst aufstehen, sollen sie sich gegenseitig maßvoll ermuntern – wegen der Ausreden der Langschläfer."}]},{"title":"III.6 Arbeitsaufgaben (Benedikt)","blocks":[{"type":"task","q":"A: Finde verwandte lateinische Wörter: a) Alt-Stimme b) Antiquitäten c) konstruieren d) Moral e) Predigt.","a":"a) alti (altus); b) antiquorum (antiquus); c) construxit (construere); d) more (mos); e) praedicatione (praedicatio)"},{"type":"task","q":"A: Ergänze: Montecassino ist auf einem … gelegen, wo sich früher ein … befunden hatte. Benedikt zerstörte das … und den … und errichtete zwei …, die den Heiligen … und … geweiht wurden. Die Bewohner ermunterte er durch … zum Glauben.","a":"Bergabhang – (sehr altes) Apollo-Heiligtum – Götterbild – Altar – Kapellen (Gebetshäuser) – Martin – Johannes – unablässige Predigt"},{"type":"task","q":"B: Zerlege: a) accessit b) praenuntiavit c) iniquitate d) transibis.","a":"a) ad- (hin) + cedere (gehen) = ging hin; b) prae- (vorher) + nuntiare (melden) = sagte voraus; c) in- (un-) + aequus (gerecht) + -tas = Ungerechtigkeit, Unrecht; d) trans- (hinüber) + ire (gehen) = du wirst überqueren"},{"type":"task","q":"C: Liste die Präsens-Konjunktive auf und gib die Konjugation an.","a":"dormiant (i-Konj.), pausent (a-Konj.), ardeat (e-Konj.), habeant (e-Konj.), vulnerent (a-Konj.), cohortentur (a-Konj., Deponens), sint (esse)"},{"type":"task","q":"C: Richtig oder falsch? a) Die Mönche sollen nach Möglichkeit in getrennten Räumen schlafen. b) In der Nacht sollen die Kerzen ausgelöscht werden. c) Aus Sicherheitsgründen sollen die Mönche auch im Bett ihr Messer bei sich tragen. d) Zwischen den jüngeren Mönchen sollen immer ältere liegen.","a":"a) falsch – möglichst alle an einem Ort (aber jeder im eigenen Bett); b) falsch – eine Kerze brennt bis zum Morgen; c) falsch – keine Messer, damit sie niemanden verletzen; d) richtig"}]},{"title":"Info: Montecassino im Zweiten Weltkrieg","blocks":[{"type":"text","text":"Das Kloster Montecassino war Schauplatz einer der schwersten Schlachten des Zweiten Weltkriegs: Weil die Alliierten deutsche Soldaten im Kloster vermuteten, wurde es am 15. Februar 1944 durch einen Bombenangriff bis auf die Grundmauern zerstört. Da die Kunstschätze und Baupläne rechtzeitig gerettet worden waren, konnte die Abtei nach dem Krieg rekonstruiert werden; heute leben dort nur noch knapp 20 Mönche."}]},{"title":"IV.1 A – Die Stadt Quinsai (Hangzhou) – das chinesische Venedig (Marco Polo 2,64)","blocks":[{"type":"text","text":"Marco Polo stammte aus einer venezianischen Kaufmannsfamilie. 1271 brach er mit Vater und Onkel in den Fernen Osten auf und kam in Peking an den Hof des Mongolenherrschers Kublai Khan, des Enkels von Dschingis Khan. Er gewann dessen Vertrauen und bereiste als Gesandter weite Gebiete des Mongolenreiches. Sein Reisebericht (nach 1295, ursprünglich französisch) zählt zu den wichtigsten mittelalterlichen Quellen über Asien – auch wenn manche bezweifeln, dass er je in China war. Die lateinische Übersetzung hatte die größte Bedeutung."},{"type":"text","text":"Quinsai est tam magna, ut maior (civitas) in orbe (esse) non putetur. Continet circuitus huius urbis miliaria circiter centum; pontes vero lapideos habet duodecim milia, eosque tam altos, ut naves magnae erecto malo pertransire possint. Fundus autem civitatis est in loco paludinoso, fere ut Venetiae; unde, si careret pontibus, de vico ad vicum perveniri non posset. In hac civitate Quinsai sunt pulcherrimae et elegantissimae domus. Cives eius adorant idola; comedunt carnes equorum, canum et aliorum immundorum animalium. Omnes plateae civitatis lapidibus sunt constratae; unde fit, ut mundissima sit. Inveniuntur etiam in ea circiter tria milia thermarum, quibus homines pro abluendis corporibus utuntur. Nam hoc unum gens illa studet, ut sit munda corpore. Familiae putantur esse in urbe Quinsai DC milia. Est etiam consuetudo in hac urbe et tota provincia, ut quilibet paterfamilias scribat super ostium domus suae nomen suum et nomina uxoris atque totius familiae suae, sed etiam numerum equorum suorum. Per hunc modum absque magna difficultate sciri potest numerus hominum totius civitatis."},{"type":"gloss","text":"putatur/putantur (+ NCI): „man vermutet, dass …“; circuitus, -us: „Umfang“; miliarium: „Meile“; malus, -i m.: „Mastbaum“; pertransire: „durchfahren“; fundus: „Fundament“; paludinosus: „sumpfig“; Venetiae: „Venedig“; unde = itaque; vicus: „Stadtteil“; idolum: „Götzenbild“; platea: „Platz, Straße“; constratus: „gepflastert“; abluere: „waschen“; hoc unum studere: „sich darum ganz besonders bemühen“; quilibet: „jeder“; paterfamilias: „Familienoberhaupt“; absque = sine."},{"type":"task","q":"Übersetze den Text.","a":"Quinsai ist so groß, dass man glaubt, es gebe keine größere Stadt auf der Welt. Der Umfang dieser Stadt beträgt etwa hundert Meilen; sie hat aber zwölftausend steinerne Brücken, und diese so hoch, dass große Schiffe mit aufgerichtetem Mast darunter durchfahren können. Das Fundament der Stadt liegt aber in sumpfigem Gelände, fast wie Venedig; deshalb könnte man, wenn sie keine Brücken hätte, nicht von Stadtteil zu Stadtteil gelangen. In dieser Stadt Quinsai gibt es sehr schöne und sehr elegante Häuser. Ihre Bürger beten Götzenbilder an; sie essen das Fleisch von Pferden, Hunden und anderen unreinen Tieren. Alle Straßen der Stadt sind mit Steinen gepflastert; daher kommt es, dass sie sehr sauber ist. Man findet in ihr auch etwa dreitausend Bäder, die die Menschen zum Waschen des Körpers benutzen. Denn darum bemüht sich jenes Volk ganz besonders, am Körper sauber zu sein. Man vermutet, dass es in der Stadt Quinsai 600 000 Familien gibt. Es ist in dieser Stadt und der ganzen Provinz auch Brauch, dass jedes Familienoberhaupt über die Tür seines Hauses seinen Namen und die Namen seiner Frau und seiner ganzen Familie schreibt, aber auch die Zahl seiner Pferde. Auf diese Weise kann ohne große Schwierigkeit die Zahl der Menschen der ganzen Stadt festgestellt werden."}]},{"title":"IV.1 B – Das chinesische Geld (Marco Polo 2,21)","blocks":[{"type":"text","text":"Moneta Magni Cham non fit de auro vel argento aut alio metallo, sed corticem accipiunt medium ab arbore mori et hunc consolidant atque in particulas varias et rotundas, magnas et parvas, scindunt atque regale imprimunt signum. De hac itaque materia iubet imperator in civitate Cambalu cudi immensam vim pecuniae, quae pro toto sufficit imperio; nullique sub poena mortis in omnibus regnis et terris suis licet aliam cudere vel etiam expendere monetam aut illam recusare. Mandat quoque nonnumquam Imperator his, qui in Cambalu morantur, ut (ii), qui aurum vel argentum aut lapides pretiosos habent, ea quantocius officialibus suis tradant et consuetam ab illis monetam iuxta illorum valorem recipiant. Hoc modo fit, ut mercatores et cives indemnes serventur et nihilominus rex omne aurum et argentum corradens maximum congreget thesaurum."},{"type":"gloss","text":"moneta: „Geld“; Magnus Cham: „Großkhan“; cortex medius: „innere Rinde, Bast“; morum: „Maulbeere“; consolidare: „festigen, trocknen“; scindere: „schneiden“; Cambalu: „Peking“; cudere: „prägen“; vis: hier „Menge“; expendere: „ausgeben“; morari: „sich aufhalten“; quantocius = celerrime; officialis: „Beamter“; iuxta (+ Akk.): „entsprechend“; valor, -oris m.: „Wert“; indemnis servari: „schadlos bleiben“; corradere: „zusammenkratzen“; nihilominus: „trotzdem“."},{"type":"task","q":"Übersetze den Text.","a":"Das Geld des Großkhans wird nicht aus Gold, Silber oder einem anderen Metall gemacht, sondern man nimmt die innere Rinde (den Bast) vom Maulbeerbaum, trocknet ihn, schneidet ihn in verschiedene runde, große und kleine Stücke und drückt das königliche Siegel darauf. Aus diesem Material also lässt der Kaiser in der Stadt Peking eine gewaltige Menge Geld prägen, die für das ganze Reich ausreicht; und niemandem ist es unter Todesstrafe in all seinen Reichen und Ländern erlaubt, anderes Geld zu prägen oder auszugeben oder jenes zurückzuweisen. Der Kaiser befiehlt auch manchmal denen, die sich in Peking aufhalten, dass diejenigen, die Gold, Silber oder Edelsteine haben, diese möglichst schnell seinen Beamten übergeben und von ihnen das übliche Geld entsprechend ihrem Wert erhalten. So kommt es, dass die Kaufleute und Bürger keinen Verlust haben und der König trotzdem, indem er alles Gold und Silber zusammenkratzt, einen riesigen Schatz anhäuft."}]},{"title":"IV.1 Arbeitsaufgaben (Marco Polo)","blocks":[{"type":"task","q":"A: Liste die Konjunktive des ersten Absatzes auf und übersetze sie.","a":"putetur (Konsekutivsatz: „dass man glaubt“); possint („dass … können“); careret, posset (Irrealis: „wenn sie nicht hätte …, könnte man nicht …“)"},{"type":"task","q":"A: Zerlege: a) immundorum b) abluendis c) difficultate.","a":"a) in- (un-) + mundus (sauber) = unrein; b) ab- (weg) + luere (spülen) = (zum) Abwaschen; c) dis- (Gegenteil) + facilis (leicht) + -tas = Schwierigkeit"},{"type":"task","q":"A: Welche drei Aussagen stimmen? Der Umfang von Quinsai beträgt 1000 Meilen. – Die Stadt hat 12 000 steinerne Brücken. – Schiffe können nur schlecht durch die Stadt fahren. – Die Einwohner beten Bilder von Hunden an. – Es gibt 3000 Thermen in der Stadt. – Über den Eingangstüren kann man die Namen aller Bewohner lesen.","a":"Richtig: 12 000 steinerne Brücken; 3000 Thermen (Bäder); Namen über den Eingangstüren. (Umfang ca. 100 Meilen; Schiffe fahren sogar mit Mast durch; sie beten Götzenbilder an und essen Hundefleisch.)"},{"type":"task","q":"B: Finde verwandte lateinische Wörter: a) Parterre b) Partikel c) Rezept d) Schindel e) Tradition.","a":"a) – (terris, terra); b) particulas; c) recipiant (recipere); d) scindunt (scindere); e) tradant (tradere)"},{"type":"task","q":"B: Worauf beziehen sich a) hunc (Z. 2) b) illam (Z. 8) c) ea (Z. 10) d) illis (Z. 11)?","a":"a) den Bast (corticem); b) das Geld des Großkhans (monetam); c) Gold, Silber und Edelsteine; d) die Beamten (officialibus)"},{"type":"task","q":"B: a) fit (Z. 1) heißt „macht“, „geschieht“, „wird gemacht“ oder „wird“? b) ut (Z. 12) heißt „wie“, „dass“, „damit“ oder „sodass“?","a":"a) „wird gemacht“ (fieri als Passiv zu facere); b) „dass“ (fit, ut … = es geschieht, dass …)"},{"type":"task","q":"B: Ergänze: Das Geld des Großkhans wird aus … in der Stadt … hergestellt. Es ist strengstens verboten, ein anderes Geld … oder das Geld des Großkhans … Auch Edelmetalle müssen …","a":"Bast (Rinde) des Maulbeerbaums – Peking (Cambalu) – zu prägen oder auszugeben – zurückzuweisen – den Beamten übergeben (gegen Papiergeld getauscht) werden."}]},{"title":"Info: Erfindungen aus China","blocks":[{"type":"text","text":"Die Chinesen verwendeten nicht nur Papiergeld lange vor den Europäern, sondern auch Schießpulver, Kompass und Buchdruck. Auch Spaghetti sollen schon seit dem 2. Jahrtausend v. Chr. in China bekannt gewesen und erst von Marco Polo nach Italien gebracht worden sein."}]},{"title":"IV.2 A – Ohrlöcher – schon bei den Indios in Mode (Vespucci, Mundus novus 5)","blocks":[{"type":"text","text":"Kolumbus gilt als Entdecker Amerikas (1492); benannt ist der Erdteil aber nach Amerigo Vespucci. Anders als Kolumbus, der bis zu seinem Tod glaubte, in Ostasien gewesen zu sein, erkannte Vespucci, dass er einen neuen Kontinent entdeckt hatte. Seinen Bericht über die dritte Fahrt (1501–1502) las man in der lateinischen Fassung „Mundus novus“ in ganz Europa."},{"type":"text","text":"Omnes utriusque sexus incedunt nudi, nullam corporis partem operientes; et ut ex ventre matris prodeunt, sic usque ad mortem vadunt. Corpora enim habent magna, bene proportionata et colore declinantia ad rubedinem. Quod eis accidere puto, quia nudi incedentes tingantur a sole. Habent et comam amplam et nigram. Sunt in incessu et ludis agiles et venusta facie. Quam tamen ipsi sibi destruunt. Perforant enim sibi genas et labra et nares et aures. Neque credas foramina illa esse parva aut quod unum solum habeant. Vidi enim nonnullos habentes in sola facie septem foramina. Obturant sibi haec foramina cum petris caeruleis, marmoreis, cristallinis et cum ossibus candidissimis. Et hic mos solus est virorum. Nam mulieres non perforant sibi faciem, sed aures solum."},{"type":"gloss","text":"operire: „bedecken“; bene proportionatus: „gut gebaut“; declinare: „sich annähern“; rubedo, -inis f.: „Röte“; tingere: „färben“ (Konjunktiv bleibt unübersetzt); amplus: „voll, dicht“; incessus: „Gang“; venustus: „anmutig“; destruere: „verunstalten“; gena: „Wange“; labrum: „Lippe“; nares: „Nase“; foramen: „Loch“; quod (+ Konj.): „dass“; obturare: „behängen“; petra: „Stein“; caeruleus: „blau“; cristallinus: „durchsichtig“; candidus: „hell“."},{"type":"task","q":"Übersetze den Text.","a":"Alle beiderlei Geschlechts gehen nackt umher und bedecken keinen Teil des Körpers; und wie sie aus dem Bauch der Mutter hervorkommen, so gehen sie bis zum Tod. Sie haben nämlich große, gut gebaute Körper, deren Farbe sich der Röte annähert. Das geschieht ihnen, glaube ich, weil sie nackt umhergehen und von der Sonne gefärbt werden. Sie haben auch volles, schwarzes Haar. Sie sind beim Gehen und bei Spielen gewandt und haben ein anmutiges Gesicht. Dieses aber verunstalten sie sich selbst. Sie durchbohren sich nämlich Wangen, Lippen, Nase und Ohren. Und glaube nicht, dass jene Löcher klein sind oder dass sie nur eines haben. Ich habe nämlich einige gesehen, die allein im Gesicht sieben Löcher hatten. Diese Löcher behängen sie mit blauen Steinen, Marmor, Kristallen und mit ganz hellen Knochen. Und diese Sitte haben nur die Männer. Denn die Frauen durchbohren sich nicht das Gesicht, sondern nur die Ohren."}]},{"title":"IV.2 B – Die Indios als Kannibalen (Vespucci, Mundus novus 5 f.)","blocks":[{"type":"text","text":"Nullum habent templum et nullam tenent legem, neque sunt idolatrae. Quid ultra dicam? Vivunt secundum naturam. Non sunt inter eos mercatores neque commercia rerum. Populi inter se bella gerunt sine arte, sine ordine. Seniores suis contionibus iuvenes ad bella incendunt, in quibus crudeliter se mutuo interficiunt. Et (eos), quos ex bello captivos ducunt, sui victus causa occidendos servant; nam alii alios et victores victos comedunt; et inter carnes humana (caro) est eis communis in cibis. Iam visum est patrem comedisse filios et uxorem; et ego hominem novi, qui plus quam ex trecentis humanis corporibus edisse vulgabatur. Et item steti viginti septem dies in urbe quadam, ubi vidi per domos humanam carnem salsam contignationibus suspensam, uti apud nos moris est lardum suspendere et carnem suillam. Plus dico: Ipsi admirantur, cur nos non comedimus inimicos nostros et eorum carne non utimur in cibis; quam dicunt esse saporosissimam. Eorum arma sunt arcus et sagittae; et quando properant ad bella, nullam sui tutandi gratia corporis partem operiunt: adeo sunt et in hoc bestiis similes. Nos, quantum potuimus, conati sumus eos dissuadere et ab his pravis moribus dimovere; qui et se eos dimissuros (esse) nobis promiserunt."},{"type":"gloss","text":"idolatra: „Götzenverehrer“; ultra: „noch mehr“; secundum (+ Akk.): „gemäß“; commercia rerum: „Warenaustausch“; contio: „Rede“; incendere: hier „anstacheln“; mutuo: „gegenseitig“; victus, -us m.: „Nahrung“; occidendos: „zum Töten“; communis: „überall üblich“; noscere, novi: „kennenlernen“; vulgabatur = dicebatur (NCI); steti = mansi; salsus: „gesalzen“; contignatio: „Dachbalken“; suspendere: „aufhängen“; moris est: „es ist Brauch“; lardum: „Speck“; suillus: „Schweine-“; saporosus: „schmackhaft“; tutari: „schützen“; gratia (+ Gen.) = causa; adeo: „so sehr“; dissuadere: „abraten“; pravus: „schlecht“; dimittere: „aufgeben“."},{"type":"task","q":"Übersetze den Text.","a":"Sie haben keinen Tempel und kein Gesetz, und sie sind auch keine Götzenverehrer. Was soll ich noch mehr sagen? Sie leben nach der Natur. Es gibt unter ihnen keine Kaufleute und keinen Warenaustausch. Die Völker führen untereinander Kriege ohne Kunst und ohne Ordnung. Die Älteren stacheln mit ihren Reden die Jungen zu Kriegen an, in denen sie sich grausam gegenseitig töten. Und die, die sie aus dem Krieg als Gefangene wegführen, heben sie auf, um sie zur Nahrung zu töten; denn die einen essen die anderen, und die Sieger die Besiegten; und unter den Fleischsorten ist Menschenfleisch bei ihnen als Speise überall üblich. Man hat schon gesehen, dass ein Vater seine Kinder und seine Frau gegessen hat; und ich habe einen Menschen kennengelernt, von dem man sagte, er habe mehr als dreihundert menschliche Körper gegessen. Ebenso blieb ich 27 Tage in einer Stadt, wo ich in den Häusern gesalzenes Menschenfleisch an den Dachbalken aufgehängt sah, wie es bei uns Brauch ist, Speck und Schweinefleisch aufzuhängen. Ich sage noch mehr: Sie wundern sich, warum wir unsere Feinde nicht essen und ihr Fleisch nicht als Speise verwenden; sie sagen, es sei sehr schmackhaft. Ihre Waffen sind Bogen und Pfeile; und wenn sie in den Krieg eilen, bedecken sie keinen Teil des Körpers, um sich zu schützen: So sehr sind sie auch darin den Tieren ähnlich. Wir haben, so sehr wir konnten, versucht, ihnen abzuraten und sie von diesen schlechten Sitten abzubringen; und sie haben uns versprochen, dass sie sie aufgeben würden."}]},{"title":"IV.2 Arbeitsaufgaben (Indios)","blocks":[{"type":"task","q":"A: Nenne sechs Begriffe aus dem Wortfeld „Körperteile“.","a":"corporis/corpora, ventre, coma(m), facie(s), genas, labra, nares, aures, ossibus"},{"type":"task","q":"A: a) quod (Z. 3) heißt „weil“, „welches“ oder „dieses“? b) credas (Z. 8) heißt „du glaubst“, „du wirst glauben“ oder „du sollst glauben“?","a":"a) „dieses“ (relativer Anschluss: Quod … = Das …); b) „du sollst glauben“ (neque credas = glaube nicht!)"},{"type":"task","q":"A: Richtig oder falsch? a) Manche sterben schon im Bauch der Mutter. b) Sie haben ein hübsches Gesicht. c) Sie durchbohren sich ihre Wangen. d) In die gebohrten Löcher hängen sie Steine. e) Frauen bohren sich mehr Löcher als Männer.","a":"a) falsch; b) richtig (venusta facie); c) richtig; d) richtig; e) falsch – Frauen nur die Ohren"},{"type":"task","q":"B: Finde im zweiten Absatz zwei Gegensatzpaare derselben Wortart.","a":"seniores – iuvenes; victores – victos (alii – alios)"},{"type":"task","q":"B: Finde im letzten Absatz ein Hyperbaton.","a":"„nullam sui tutandi gratia corporis partem“ (nullam … partem getrennt)"},{"type":"task","q":"B: Ergänze: a) Die jungen Männer werden von … zum Krieg angestachelt. b) Die Gefangenen werden von ihnen … c) Vespucci sah in ihren Häusern … d) Im Kampf bedecken sie …","a":"a) den Älteren (mit ihren Reden); b) aufgehoben, um sie zur Nahrung zu töten (gegessen); c) gesalzenes Menschenfleisch, das an den Dachbalken hing; d) keinen Teil ihres Körpers."}]},{"title":"Info: Kannibalismus und Namen der Neuen Welt","blocks":[{"type":"text","text":"Als Kolumbus 1492 auf Hispaniola landete, bemerkte er die Angst der Menschen vor den „Caniba“, den Bewohnern einer Nachbarinsel, die angeblich Menschenfleisch aßen. Durch sein veröffentlichtes Bordbuch wurde der Name zum festen Begriff. Vespucci nannte eine Bucht, die er am 1. Januar entdeckte, „Rio de Janeiro“ („Januar-Fluss“), weil er sie für eine Flussmündung hielt. Der Amazonas erhielt seinen Namen 40 Jahre später von Francisco de Orellana, der dort auf große, kräftige Kriegerinnen gestoßen sein soll – wie die sagenhaften Amazonen."}]},{"title":"IV.3 A – Die Hagia Sophia (Busbequius, Legationis Turcicae Epistola I)","blocks":[{"type":"text","text":"Ogier Ghiselin de Busbecq (1522–1592) aus Lille war Diplomat der Habsburger Karl V. und Ferdinand I. 1554, 25 Jahre nach der ersten Belagerung Wiens durch die Osmanen, wurde er nach Istanbul geschickt, um mit Sultan Süleyman einen Frieden auszuhandeln. Er blieb sieben Jahre und berichtete in den „Legationis Turcicae Epistolae IV“ als erster Westeuropäer ausführlich und weitgehend vorurteilslos über das Osmanische Reich. Als er im Jänner 1555 ankommt, ist der Sultan auf Kriegszug – Busbecq hat Zeit für eine Stadtbesichtigung:"},{"type":"text","text":"Interim, dum responsum exspectatur, facultas urbis Constantinopolis inspiciendae per otium fuit. Imprimis Divae Sophiae templum adire placuit. Tamen non nisi singulari beneficio sum admissus: Turcae sua templa prophanari credunt, si quis Christianus ingrediatur. Est ea moles magnifica et digna, quae spectetur – maximo cum fornice sive hemisphaerio in medio, quod a solo impluvio lucem habet. Ad huius templi formam omnia fere Turcarum templa sunt constructa."},{"type":"gloss","text":"facultas, -atis f.: „Gelegenheit“; Turcae: „die Türken“ (heute korrekter: „die Osmanen“); prophanare: „entweihen“; moles, -is f.: „Bauwerk“; quae: hier = ut; fornix: „Gewölbe“; hemisphaerium: „Halbkugel“; impluvium: „Regenöffnung“."},{"type":"task","q":"Übersetze den Text.","a":"Während man inzwischen auf die Antwort wartete, hatte ich Gelegenheit, die Stadt Konstantinopel in Ruhe zu besichtigen. Vor allem wollte ich die Kirche der heiligen Sophia aufsuchen. Ich wurde aber nur durch eine besondere Gunst eingelassen: Die Türken glauben, dass ihre Gotteshäuser entweiht werden, wenn ein Christ hineingeht. Es ist ein prächtiges Bauwerk und wert, angeschaut zu werden – mit einem sehr großen Gewölbe bzw. einer Halbkugel in der Mitte, die ihr Licht allein durch eine (Regen-)Öffnung bekommt. Nach dem Vorbild dieser Kirche sind fast alle Moscheen der Türken gebaut."}]},{"title":"IV.3 B – Der Schleier als Schutz vor den Männern (Busbequius, Epistola III)","blocks":[{"type":"text","text":"Besonderes Interesse weckte bei Busbecq die Stellung der Frau bei den Osmanen:"},{"type":"text","text":"Turcae, magis quam ulla alia gens, uxorum pudicitiae student. Itaque (eas) inclusas servant domi atque abdunt, ut vix solem aspiciant. Quodsi necessitas eas in publicum evocet, (eas) ita pannis tectas emittunt, ut occurrentibus merae larvae videantur. (Uxoribus) ipsis quidem per linteum copia videndi viros est, (sed) viris nulla earum corporis pars ad conspectum patet. Est enim apud eos recepta opinio nullam mulierem, quam forma aut aetas commendet, a viro sine potiundi libidine ac sine mentis labe conspici posse. Ob id omnes habent absconditas."},{"type":"gloss","text":"pudicitia: „Keuschheit“; abdere: „verstecken“; pannus: „Stoff“; occurrentibus: „den Entgegenkommenden“; larva: „Gespenst“; linteum: „Leinentuch“; copia: hier „Möglichkeit“; receptus: „weit verbreitet“; potiundi libido: „sexuelle Gier“; labes, -is f.: „Befleckung“; absconditus: „versteckt“."},{"type":"task","q":"Übersetze den Text.","a":"Die Türken achten mehr als jedes andere Volk auf die Keuschheit ihrer Frauen. Deshalb halten sie sie zu Hause eingeschlossen und verstecken sie, sodass sie kaum die Sonne sehen. Wenn aber eine Notwendigkeit sie in die Öffentlichkeit ruft, schicken sie sie so mit Stoffen bedeckt hinaus, dass sie den Entgegenkommenden wie reine Gespenster erscheinen. Die Frauen selbst haben zwar durch ein Leinentuch die Möglichkeit, die Männer zu sehen, den Männern aber ist kein Teil ihres Körpers zum Anblick zugänglich. Es ist nämlich bei ihnen die Meinung weit verbreitet, dass keine Frau, die durch Schönheit oder Alter anziehend ist, von einem Mann ohne sexuelle Begierde und ohne Befleckung des Geistes angesehen werden könne. Deshalb halten alle sie versteckt."}]},{"title":"IV.3 C – Frauen und Nebenfrauen (Busbequius, Epistola III)","blocks":[{"type":"text","text":"Nulla lex vetat Turcas ad iustas uxores pelices assumere, quot velint. Neque ullum discrimen honoris (est) inter harum et illarum liberos, eodemque iure censentur. Pelices vero aut sibi emunt aut bello acquirunt. Quarum ubi taedet, nihil impedit, quominus (eas) in forum productas vendant. Uxor iusta a concubina sola dote dignoscitur. Servarum nulla dos est. Dote dicta veluti matres familias in reliquas mulieres totamque mariti domum imperium habent, sic tamen, ut mariti optio sit, cum qua nocte cubet. Quod cum uxori significaverit, illa imperat ancillae, ut ad eum dormitum eat, eaque paret. Una nox singulis hebdomadibus, (nox) diei Veneris apud eos festi, uxori reservatur. Ceterae noctes eius arbitrii sunt. Divortia fiunt inter eos pluribus de causis, quas viris comminisci facile est. Mulieres aegrius a viris divortunt."},{"type":"gloss","text":"pelex, -icis f.: „Nebenfrau“; censere: hier „behandeln“; quarum taedet: „sie haben genug von ihnen“; quominus (+ Konj.): „dass“; dignoscere: „unterscheiden“; dos, dotis f.: „Mitgift“; dotem dicere: „eine Mitgift festsetzen“; familias = familiae (alter Genitiv); imperium in: „Macht über“; optio: „Wahl“; dormitum: „um zu schlafen“; singulis hebdomadibus: „pro Woche“; dies Veneris: „Freitag“; eius arbitrii sunt: „bleiben seiner Wahl überlassen“; comminisci: „sich ausdenken“; aegrius: „schwieriger“."},{"type":"task","q":"Übersetze den Text.","a":"Kein Gesetz verbietet den Türken, zu den rechtmäßigen Ehefrauen so viele Nebenfrauen hinzuzunehmen, wie sie wollen. Und es gibt keinen Unterschied im Ansehen zwischen den Kindern der einen und der anderen; sie werden nach demselben Recht behandelt. Die Nebenfrauen aber kaufen sie sich oder erwerben sie im Krieg. Wenn sie von ihnen genug haben, hindert nichts daran, dass sie sie auf den Markt führen und verkaufen. Die rechtmäßige Ehefrau unterscheidet sich von der Nebenfrau allein durch die Mitgift. Sklavinnen haben keine Mitgift. Wenn eine Mitgift festgesetzt ist, haben sie wie Hausmütter Macht über die übrigen Frauen und das ganze Haus des Mannes, so jedoch, dass der Mann die Wahl hat, mit welcher er die Nacht verbringt. Wenn er das der Ehefrau mitgeteilt hat, befiehlt sie der Magd, zu ihm schlafen zu gehen, und diese gehorcht. Eine Nacht pro Woche, die des Freitags, der bei ihnen ein Feiertag ist, ist der Ehefrau vorbehalten. Die übrigen Nächte bleiben seiner Wahl überlassen. Scheidungen gibt es bei ihnen aus mehreren Gründen, die sich die Männer leicht ausdenken können. Frauen können sich schwerer von ihren Männern scheiden lassen."}]},{"title":"IV.3 Arbeitsaufgaben (Osmanisches Reich)","blocks":[{"type":"task","q":"A: Liste die Stellen, an denen der Genitiv vor dem Nomen steht (wie hostium rex).","a":"Divae Sophiae templum; huius templi formam; Turcarum templa"},{"type":"task","q":"A: a) per otium heißt „für die Muße“, „in Ruhe“ oder „für die Freizeit“? b) quod (Z. 6) heißt „die“, „was“ oder „weil“?","a":"a) „in Ruhe“; b) „die“ (Relativpronomen, bezogen auf hemisphaerio – im Deutschen „die Halbkugel“)"},{"type":"task","q":"B: Zerlege: a) inclusas b) abdunt c) aspiciant d) emittunt.","a":"a) in- (hinein) + claudere (schließen) = eingeschlossen; b) ab- (weg) + dare (geben, tun) = verstecken; c) ad- (hin) + specere (schauen) = anschauen; d) ex- (hinaus) + mittere (schicken) = hinausschicken"},{"type":"task","q":"B: Ergänze: a) Die Männer sperren ihre Frauen ein, sodass sie … b) Wenn die Frauen das Haus verlassen müssen, … c) Man meint, Männer würden durch den Anblick von Frauen, die … und … sind, sexuell erregt.","a":"a) … kaum die Sonne sehen. b) … werden sie so mit Stoffen verhüllt, dass sie wie Gespenster aussehen. c) … schön und jung (im passenden Alter) …"},{"type":"task","q":"C: Nenne vier Ausdrücke aus dem Wortfeld „Familie“.","a":"uxores, liberos, matres familias, mariti (pelices, concubina, divortia)"},{"type":"task","q":"C: Worauf beziehen sich a) ad eum b) ea(que) c) apud eos d) quas?","a":"a) den Ehemann; b) die Magd (Nebenfrau); c) die Osmanen; d) die Gründe (causis) für die Scheidung"},{"type":"task","q":"C: Richtig oder falsch? a) Nebenfrauen sind immer Kriegsgefangene. b) Sie werden wieder verkauft, wenn der Ehemann genug von ihnen hat. c) Den Freitag reserviert der Mann für die Ehefrau. d) Frauen dürfen sich nicht scheiden lassen.","a":"a) falsch – sie werden auch gekauft; b) richtig; c) richtig; d) falsch – sie können es, aber schwerer"}]},{"title":"Info: Formen der Verhüllung","blocks":[{"type":"text","text":"Im Islam gibt es viele Formen der Verhüllung: Schaila (langer Schal um Kopf und Schultern), Hijab (Kopftuch), al-Amira (zweiteilig), Chimar (mantelartiger Schleier bis zur Taille), Tschador (Ganzkörperschleier), Nikab (bedeckt das Gesicht bis auf die Augen) und Burka (Ganzkörperschleier mit Gitter vor den Augen)."}]}]}],"stems":[{"group":"Perfekt auf -v-","inf":"delere","cls":"2","perf":"delevi","ppp":"deletum","de":"zerstören","lesson":9},{"group":"Perfekt auf -v-" const ALL = [];
for (const l of LESSONS) for (const v of l.vocab) { v.lesson = l.number; v.id = l.number + "|" + v.la; ALL.push(v); }
const UNITS = [...new Set(LESSONS.map(l => l.unit))];
const NUMS = LESSONS.map(l => l.number);
const byNum = n => LESSONS.find(l => l.number === n);
const lessonsIn = (a, b) => LESSONS.filter(l => l.number >= Math.min(a, b) && l.number <= Math.max(a, b));
const vocabIn = (a, b) => lessonsIn(a, b).flatMap(l => l.vocab);
const headLa = v => { let s = v.la; const i = s.indexOf(" ("); if (i >= 0) s = s.slice(0, i); s = s.replace(/ (m|f|n)\.$/, ""); return s.trim(); };
const speakable = v => headLa(v).replace(/\//g, " ").replace(/–/g, " ");
const hasStem = v => v.pos === "Verb" && v.forms.includes(",");
// Formen (Genitiv/Stammformen): "show" = immer sichtbar, "reveal" = erst beim Aufdecken, "hide" = ausgeblendet.
// "Formen mitlernen": Formen gehören zur Antwort -> vorne versteckt, werden extra abgefragt.
const realForms = v => !!v.forms && !v.forms.startsWith("(") && !/Frage/.test(v.forms);
const fMode = () => P.s.forms || "show";
const fFront = v => (fMode() === "show" && !P.s.learnForms) ? v.forms : "";
const fBack = v => (P.s.learnForms || fMode() !== "hide") ? v.forms : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = () => Math.random() < 0.5;

// Prüft und bereinigt gespeicherte oder importierte Daten (nie blind vertrauen).
function sanitize(d) {
  const o = structuredClone(DEFAULTS); let fixed = 0;
  if (!d || typeof d !== "object") return { P: o, fixed: 0, ok: false };
  if (d.s && typeof d.s === "object") for (const k of Object.keys(DEFAULTS.s)) if (typeof d.s[k] === typeof DEFAULTS.s[k]) o.s[k] = d.s[k]; else if (k in d.s) fixed++;
  o.s.goal = Math.min(200, Math.max(10, Math.round(num(o.s.goal, 30))));
  o.s.newPerDay = Math.min(30, Math.max(0, Math.round(num(o.s.newPerDay, 5))));
  if (!["show", "reveal", "hide"].includes(o.s.forms)) o.s.forms = "show";
  if (d.items && typeof d.items === "object") for (const [id, it] of Object.entries(d.items)) {
    if (!it || typeof it !== "object") { fixed++; continue; }
    const bx = Math.min(5, Math.max(0, Math.round(num(it.box))));
    const x = { box: bx, right: Math.max(0, Math.round(num(it.right))), wrong: Math.max(0, Math.round(num(it.wrong))), xp: Math.min(bx >= 4 ? 100 : 80, Math.max(0, Math.round(num(it.xp, XP_BASE[bx])))) };
    if (num(it.first)) x.first = it.first;

    if (x.box && !x.lastSeen) x.lastSeen = Date.now();
    if (x.box !== it.box || x.right !== it.right || x.wrong !== it.wrong) fixed++;
    o.items[id] = x;
  }
  if (d.days && typeof d.days === "object") for (const [k, n] of Object.entries(d.days)) { if (/^\d{4}-\d\d-\d\d$/.test(k) && num(n) > 0) o.days[k] = Math.round(n); else fixed++; }
  if (Array.isArray(d.tests)) o.tests = d.tests.filter(t => t && typeof t === "object" && num(t.total) > 0 && num(t.date));
  if (d.highscores && typeof d.highscores === "object") for (const [k, n] of Object.entries(d.highscores)) if (num(n) > 0) o.highscores[k] = n;
  if (Array.isArray(d.starred)) o.starred = [...new Set(d.starred.filter(x => typeof x === "string"))];
  o.lastBackup = num(d.lastBackup); o.xp = Math.max(0, Math.round(num(d.xp))); o.v = SCHEMA;

  el.cleanup = () => clearInterval(timer);

      <div class="card">${q.cat ? `<div class="cat">${esc(q.cat.toUpperCase())}</div>` : ""}

      ${q.hint ? `<div class="hint">${esc(q.hint)}</div>` : ""}
      ${q.speak ? `<div style="margin-top:10px"><button class="btn" id="say">🔊 Anhören</button></div>` : ""}
      ${chosen !== null && q.expl ? `<div class="expl">${esc(q.expl)}</div>` : ""}</div>
      <div class="opts">${q.options.map((t, k) => `<button class="opt ${chosen === null ? "" : k === q.correct ? "right" : k === chosen ? "wrong" : "dim"}" data-k="${k}" ${chosen !== null ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
      ${chosen !== null && !o.auto ? `<button class="btn primary full" id="next" style="margin-top:14px">${i + 1 < deck.length ? "Weiter" : "Fertig"}</button>` : ""}`;
    const say = el.querySelector("#say"); if (say) say.onclick = () => speakLatin(q.speak);
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));

  function finish() {

    if (o.exam && !retry) { const t = deck.length; P.tests.unshift({ date: Date.now(), range: o.exam, correct: correct(), total: t, grade: grade(correct(), t) }); save(); }

    el.innerHTML = `<div class="card"><div style="font-size:50px">${o.exam ? "🎓" : "🏅"}</div><h2 style="margin:6px 0">${correct()} von ${total} richtig</h2>
      ${gainHTML(sn)}${o.exam ? `<div class="hl">Note: ${g} – ${GRADE[g]}</div>` : ""}${rec ? `<div class="hl">🏆 Neuer Rekord!</div>` : ""}</div>
      ${wrong.length ? `<div class="ghead" style="margin-top:20px">Fehler (${wrong.length})</div><div class="group">${wrong.map(a => `<div class="row"><div class="grow">

function sessSnap(items) { const u = [...new Map(items.map(v => [v.id, v])).values()]; return { xp: P.xp || 0, items: u, st: new Map(u.map(v => [v.id, stage(v)])), ls: new Map([...new Set(u.map(v => v.lesson))].slice(0, 4).map(n => [n, byNum(n) ? learned(byNum(n).vocab) : 0])) }; }
function gainHTML(sn) {

  const ln = [...sn.ls].map(([n, a]) => [n, a, learned(byNum(n).vocab)]).filter(x => x[2] > x[1] + .004).map(x => `<div>Lektion ${x[0]}: ${Math.round(x[1] * 100)} % → <b>${Math.round(x[2] * 100)} %</b> gelernt</div>`).join("");
  if (dx <= 0 && !up && !ln) return "";
  return `<div class="gain"><div>+${dx} Punkte${up ? ` · ⬆️ ${up} ${up === 1 ? "Wort" : "Wörter"} aufgestiegen` : ""}</div>${ln}</div>`;

// ---------- Karteikarten ----------

function flashView(el, items, dir) {

  let queue = shuffle(items).sort((a, b) => box(a) - box(b)), revealed = false, d = resolveDir(dir), busy = false, fresh = true;
  const first = new Map(), requeued = new Set(), sn = sessSnap(items);
  const knew = () => [...first.values()].filter(Boolean).length;
  function result() {

      ${missed.length ? `<div class="ghead" style="margin-top:20px">Noch nicht sicher (${missed.length})</div><div class="group">${missed.map(c => `<div class="row"><div class="grow"><div class="hl">${esc(c.la)}</div><div class="sub">${esc(c.de)}</div></div></div>`).join("")}</div>
      <button class="btn primary full" id="again">Diese ${missed.length} nochmal üben</button>` : ""}
      <button class="btn full" id="fin" style="margin-top:10px">Fertig</button>`;
    el.querySelector("#fin").onclick = pop;
    const ag = el.querySelector("#again");

  }

    const fc = el.querySelector("#fc"), tint = el.querySelector("#tint");

    el.querySelector("#say").onclick = () => speakLatin(speakable(c));

  }

}

        <div class="btns">${res ? "" : `<button class="btn" id="ovr">Doch gewusst</button>`}<button class="btn primary" id="nx">Weiter</button></div>`

    const inp = el.querySelector("#inp");
    el.querySelector("#f").onsubmit = e => { e.preventDefault(); res === null ? check() : next(); };
    if (res === null) { setTimeout(() => inp.focus(), 50); el.querySelector("#chk").onclick = check; el.querySelector("#idk").onclick = () => { inp.value = ""; check(); }; }
    else { el.querySelector("#nx").onclick = next; const o = el.querySelector("#ovr"); if (o) o.onclick = () => { if (!requeued.has(v.id)) { first.set(v.id, true); record(v, true, 1.5); } res = true; draw(); }; }

  function check() { const v = queue[0], val = el.querySelector("#inp").value; last = val; res = checkAnswer(val, d === "laDe" ? v.de : headLa(v)); buzz(res); if (!first.has(v.id)) { first.set(v.id, res); record(v, res, 1.5); } draw(); }

  draw();
}

// ---------- Zuordnen ----------
function matchView(el, items) {
  const sn = sessSnap(items);
  let remaining = shuffle(items), round = [], L = [], R = [], sel = null, mistakesSet = new Set(), sec = 0, done = false;
  const timer = setInterval(() => { if (done) return clearInterval(timer); if (!el.isConnected) return; sec++; const t = el.querySelector("#sec"); if (t) t.textContent = sec + " s"; }, 1000);
  el.cleanup = () => clearInterval(timer);
  function nextRound() { const used = new Set(), rest = []; round = [];
    for (const v of remaining) { if (round.length < 6 && !used.has(v.de)) { used.add(v.de); round.push(v); } else rest.push(v); }
    remaining = rest; if (!round.length) { done = true; return draw(); } L = shuffle(round); R = shuffle(round); draw(); }
  function draw() {
    if (done) { el.innerHTML = `<div class="card" style="margin-top:20px"><div style="font-size:50px">🧩</div><h2>Alle Paare gefunden!</h2><p>Zeit: ${sec} s · Fehler: ${mistakesSet.size}</p>${gainHTML(sn)}<button class="btn primary" id="fin">Fertig</button></div>`; el.querySelector("#fin").onclick = pop; return; }
    el.innerHTML = `<div class="qhead"><span>⏱ <b id="sec">${sec} s</b></span><span>Noch ${remaining.length + round.length} Paare</span></div>
      <div class="mgrid"><div style="display:flex;flex-direction:column;gap:8px">${L.map(v => `<button class="tile ${round.includes(v) ? "" : "gone"} ${sel === v ? "sel" : ""}" data-l="${esc(v.id)}">${esc(v.la)}</button>`).join("")}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${R.map(v => `<button class="tile ${round.includes(v) ? "" : "gone"}" data-r="${esc(v.id)}">${esc(v.de)}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { sel = round.find(v => v.id === b.dataset.l); draw(); });
    el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      if (!sel) return; const v = round.find(x => x.id === b.dataset.r);
      if (v === sel) { buzz(true); record(v, !mistakesSet.has(v.id), .6); round = round.filter(x => x !== v); sel = null; if (!round.length) nextRound(); else draw(); }
      else { buzz(false); mistakesSet.add(sel.id); b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 400); }
    });
  }
  nextRound();
}

const TABS = [["lessons", "📖", "Lektionen"], ["practice", "🧠", "Üben"], ["search", "🔍", "Suchen"], ["stats", "📊", "Statistik"], ["settings", "⚙️", "Mehr"]];

let tab = "lessons"; const stacks = {};
const mainEl = document.getElementById("main"), topEl = document.getElementById("top");
// Höhe der oberen Leiste messen, damit die Suchleiste genau darunter klebt
function measureTop() { document.documentElement.style.setProperty("--top-h", topEl.getBoundingClientRect().height + "px"); }
try { new ResizeObserver(measureTop).observe(topEl); } catch (e) { window.addEventListener("resize", measureTop); }
measureTop();
function current() { const s = stacks[tab]; return s[s.length - 1]; }
const titleEl = document.getElementById("title");
function dispose(entry) { if (entry && entry.node && entry.node.cleanup) { try { entry.node.cleanup(); } catch (e) {} } if (entry) entry.node = null; }
function render() {
  const v = current(); const s = stacks[tab], root = s.length === 1;
  titleEl.textContent = v.title; titleEl.classList.toggle("fade", root);
  document.getElementById("back").hidden = root;
  [...mainEl.children].forEach(c => c.remove());
  if (root) {

    const h = document.createElement("div"); h.className = "big-title"; h.id = "bigtitle"; h.textContent = v.title; mainEl.appendChild(h);
  }
  if (!v.node) { v.node = document.createElement("div"); mainEl.appendChild(v.node); v.fn(v.node); }
  else mainEl.appendChild(v.node);
  window.scrollTo(0, v.scroll || 0); drawTabs(); onScroll();
}
function push(title, fn) { current().scroll = window.scrollY; stacks[tab].push({ title, fn }); render(); }
function replace(title, fn) { dispose(current()); stacks[tab][stacks[tab].length - 1] = { title, fn }; render(); }
function pop() { if (stacks[tab].length > 1) { dispose(stacks[tab].pop()); render(); } }
function switchTab(t) {

}

document.getElementById("back").onclick = pop;
for (const [k, , ] of TABS) stacks[k] = [{ title: ROOTS[k][0], fn: ROOTS[k][1] }];

let searchQuery = "";
const fold = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
function searchTab(el) {
  el.innerHTML = `<div class="search"><div class="field"><input type="search" id="q" placeholder="Latein oder Deutsch suchen" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button class="clear" id="clr" aria-label="Suche leeren" hidden>✕</button></div></div><div id="res"></div>`;
  const q = el.querySelector("#q"), res = el.querySelector("#res"), clr = el.querySelector("#clr");
  q.value = searchQuery;
  const secText = s => fold(s.blocks.map(b => [b.text || "", b.q || "", ...(b.items || []), ...(b.rows || []).flat()].join(" ")).join(" "));
  function run() {
    searchQuery = q.value; clr.hidden = !q.value;
    const t = fold(q.value.trim());
    const all = t.length >= 2 ? ALL.filter(v => [v.la, v.de, v.forms, v.note].some(x => fold(x).includes(t))) : [];
    // Treffer am Wortanfang zuerst
    all.sort((a, b) => (fold(b.la).startsWith(t) || fold(b.de).startsWith(t)) - (fold(a.la).startsWith(t) || fold(a.de).startsWith(t)));
    const hits = all.slice(0, 100);
    const gh = []; for (const l of LESSONS) for (const s of l.grammar) if (!t || fold(s.title).includes(t) || secText(s).includes(t)) gh.push([l, s]);
    for (const a of ANHANG.sections) for (const s of a.grammar) if (t && (fold(s.title).includes(t) || secText(s).includes(t))) gh.push([{ number: "Anhang", title: a.title }, s]);
    res.innerHTML = (hits.length ? `<div class="ghead">Vokabeln (${all.length > 100 ? "100 von " + all.length : all.length})</div><div class="group">${hits.map((v, k) => vocabRow(v, false, k, true)).join("")}</div>` : (t.length >= 2 ? `<p class="sub">Keine Vokabeln gefunden.</p>` : ""))
      + (gh.length ? `<div class="ghead">${t ? "Grammatik (" + gh.length + ")" : "Grammatik-Register"}</div><div class="group">${gh.map(([l, s], k) => `<div class="row link" data-g="${k}"><span class="pill">${typeof l.number === "number" ? "L" + l.number : "Anhang"}</span><div class="grow">${esc(s.title)}</div></div>`).join("")}</div>` : (t ? `<p class="sub">Keine Grammatik gefunden.</p>` : ""));
    bindVocabRows(res, hits);
    res.querySelectorAll("[data-g]").forEach(r => r.onclick = () => { const [l, s] = gh[+r.dataset.g]; push(lname(l), e => { e.innerHTML = grammarHTML([s]); }); });
  }
  q.oninput = run;
  q.onkeydown = e => { if (e.key === "Enter") q.blur(); };
  clr.onclick = () => { q.value = ""; run(); q.focus(); };
  run();
}

    <div class="ghead">Üben</div><div class="group">
      <label class="row"><div class="grow">Eintippen-Modus anzeigen</div><input type="checkbox" id="typ" ${s.typing ? "checked" : ""}></label>
      ${s.typing ? `<label class="row"><div class="grow">Tolerante Prüfung</div><input type="checkbox" id="tol" ${s.tolerant ? "checked" : ""}></label>` : ""}
      <label class="row"><div class="grow">Vibration (Android)</div><input type="checkbox" id="snd" ${s.sound ? "checked" : ""}></label></div>
    <div class="gfoot">Standardmäßig wird alles durch Antippen geübt. Tolerant: kleine Tippfehler und eine von mehreren Bedeutungen zählen als richtig.</div>
    <div class="ghead">Tagesziel</div><div class="group"><div class="row"><div class="grow">${s.goal} Fragen pro Tag</div><button class="btn" id="gm">−</button><button class="btn" id="gp">+</button></div>
      <div class="row"><div class="grow">${s.newPerDay} neue Wörter pro Tag<div class="sub">Für das Tages-Training</div></div><button class="btn" id="nm">−</button><button class="btn" id="np">+</button></div></div>
    <div class="ghead">Auf den Home-Bildschirm</div><div class="group"><div class="row" style="display:block">
      <b>iPhone (Safari):</b> Teilen-Knopf <span class="pill">⬆︎</span> → „Zum Home-Bildschirm“.<br><b>Android (Chrome):</b> Menü ⋮ → „App installieren“ bzw. „Zum Startbildschirm hinzufügen“.<br><span class="sub">Dann startet die App im Vollbild mit eigenem Icon.</span></div></div>
    <div class="ghead">Backup</div><div class="group">
      <div class="row link" id="exp"><div class="grow">Fortschritt sichern (Text kopieren)</div></div>
      <div class="row link" id="imp"><div class="grow">Fortschritt wiederherstellen</div></div>
      <div class="row link" id="health"><div class="grow">Datenstatus &amp; Reparatur</div><div class="sub">${saveFailed ? "⚠️" : "✅"}</div></div></div>
    <div class="gfoot">Der Fortschritt wird nur in diesem Browser gespeichert. ${P.lastBackup ? "Letzte Sicherung: " + new Date(P.lastBackup).toLocaleDateString("de-AT") + "." : "Du hast noch keine Sicherung gemacht."} Sichere ihn ab und zu, z. B. in einer Notiz.</div>
    <div class="group"><div class="row link" id="reset" style="color:var(--red)"><div class="grow">Gesamten Fortschritt löschen</div></div></div>
    <div class="ghead">Über</div><div class="group">
      <div class="row"><div class="grow">Version</div><div class="sub">${APP_VERSION}</div></div>
      <div class="row link" id="news"><div class="grow">Was ist neu?</div></div>
      <div class="row link" id="upd"><div class="grow">Nach Updates suchen</div></div></div>
    <div class="sub center">Lern-App zum Lateinbuch „Medias in Res!“ (Lektion 1–30). Nur für den privaten Gebrauch.</div>`;
  el.querySelectorAll("#theme [data-v]").forEach(b => b.onclick = () => { s.theme = b.dataset.v; applyLook(); re(); });
  el.querySelectorAll("#zoom [data-v]").forEach(b => b.onclick = () => { s.zoom = +b.dataset.v; applyLook(); re(); });
  el.querySelectorAll("#rate [data-v]").forEach(b => b.onclick = () => { s.rate = +b.dataset.v; save(); speakLatin("Salve"); render(); });
  el.querySelector("#auto").onchange = e => { s.autoSpeak = e.target.checked; save(); };
  el.querySelector("#test").onclick = () => speakLatin("Salve, discipuli!");
  el.querySelector("#news").onclick = () => whatsNew(null);
  el.querySelector("#upd").onclick = checkUpdate;
  const re = () => { save(); current().scroll = window.scrollY; render(); };
  bindForms(el, re);
  el.querySelector("#typ").onchange = e => { s.typing = e.target.checked; re(); };
  const tol = el.querySelector("#tol"); if (tol) tol.onchange = e => { s.tolerant = e.target.checked; re(); };
  el.querySelector("#snd").onchange = e => { s.sound = e.target.checked; re(); };
  el.querySelector("#gm").onclick = () => { s.goal = Math.max(10, s.goal - 10); re(); };
  el.querySelector("#gp").onclick = () => { s.goal = Math.min(200, s.goal + 10); re(); };
  el.querySelector("#nm").onclick = () => { s.newPerDay = Math.max(0, s.newPerDay - 1); re(); };
  el.querySelector("#np").onclick = () => { s.newPerDay = Math.min(30, s.newPerDay + 1); re(); };
  el.querySelector("#exp").onclick = () => push("Fortschritt sichern", e => {
    const txt = JSON.stringify(P);
    e.innerHTML = `<p class="sub">Kopiere diesen Text und bewahre ihn auf (z. B. in Notizen).</p><textarea id="t" rows="10" style="width:100%" readonly>${esc(txt)}</textarea>
      <div class="btns"><button class="btn primary" id="cp">Kopieren</button><a class="btn" id="dl" download="MediasInRes-Fortschritt.json">Als Datei</a></div><p id="m" class="sub"></p>`;
    const dl = e.querySelector("#dl");
    if (/claude/.test(location.host) || window.self !== window.top) dl.remove();
    else try { dl.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); } catch (x) {}
    const done = () => { P.lastBackup = Date.now(); save(); };
    const dl2 = e.querySelector("#dl"); if (dl2) dl2.onclick = done;
    e.querySelector("#cp").onclick = async () => { try { await navigator.clipboard.writeText(txt); done(); e.querySelector("#m").textContent = "Kopiert ✅"; } catch (x) { const t = e.querySelector("#t"); t.focus(); t.select(); done(); e.querySelector("#m").textContent = "Text ist markiert – jetzt kopieren."; } };
  });
  el.querySelector("#imp").onclick = () => push("Wiederherstellen", e => {
    e.innerHTML = `<p class="sub">Füge den gesicherten Text ein oder wähle die Datei.</p><textarea id="t" rows="8" style="width:100%"></textarea>
      <input type="file" id="f" accept=".json,application/json,text/plain" style="margin:10px 0"><button class="btn primary full" id="go">Wiederherstellen</button><p id="m" class="sub"></p>`;
    e.querySelector("#f").onchange = ev => { const f = ev.target.files[0]; if (f) f.text().then(t => e.querySelector("#t").value = t); };
    e.querySelector("#go").onclick = () => {
      const m = e.querySelector("#m"); let r;
      try { r = sanitize(JSON.parse(e.querySelector("#t").value)); if (!r.ok || !(Object.keys(r.P.items).length || Object.keys(r.P.days).length)) throw 0; }
      catch (x) { m.textContent = "Der Text konnte nicht gelesen werden – ist das wirklich ein Backup?"; return; }
      const n = Object.keys(r.P.items).length, d = Object.keys(r.P.days).length, tot = Object.values(r.P.days).reduce((a, b) => a + b, 0);
      sheet(`<h2 style="margin-top:0">Backup gefunden</h2><p class="sub">${n} geübte Wörter, ${d} Lerntage, ${tot} beantwortete Fragen.${r.fixed ? " (" + r.fixed + " fehlerhafte Einträge wurden repariert.)" : ""}</p>
        <p class="sub"><b>Zusammenführen</b> behält deinen jetzigen Stand und ergänzt das Backup (jeweils das Bessere gewinnt). <b>Ersetzen</b> überschreibt alles.</p>
        <div class="btns"><button class="btn" id="c">Abbrechen</button><button class="btn" id="mg">Zusammenführen</button><button class="btn red" id="rp">Ersetzen</button></div>`,
        (rt, close) => {
          const fin = msg => { close(); save(); m.textContent = msg; drawTabs(); };
          rt.querySelector("#c").onclick = close;
          rt.querySelector("#mg").onclick = () => { const keep = P.s; P = mergeData(P, r.P); P.s = keep; fin("Zusammengeführt ✅"); };
          rt.querySelector("#rp").onclick = () => { try { localStorage.setItem(KEY_BAK, JSON.stringify(P)); } catch (x) {} P = r.P; fin("Fortschritt wiederhergestellt ✅"); };
        });
    };
  });
  el.querySelector("#health").onclick = () => push("Datenstatus", dataHealth);
  el.querySelector("#reset").onclick = () => confirmSheet("Wirklich alles löschen?", "Dein gesamter Lernfortschritt geht verloren.", "Löschen", () => { const keep = P.s; P = structuredClone(DEFAULTS); P.s = keep; save(); render(); });
}

// ---------- Datenstatus ----------
function dataHealth(e) {
  const ids = new Set(ALL.map(v => v.id)), orphans = Object.keys(P.items).filter(id => !ids.has(id)), starOrph = P.starred.filter(id => !ids.has(id));
  let size = 0; try { size = (localStorage.getItem(KEY) || "").length; } catch (x) {}
  const bak = (() => { try { return !!localStorage.getItem(KEY_BAK); } catch (x) { return false; } })();
  const rows = [["Gespeichert", saveFailed ? "⚠️ Fehler" : (lastSaved ? "✅ " + new Date(lastSaved).toLocaleTimeString("de-AT", { timeStyle: "short" }) : "✅ bereit")],
    ["Geübte Wörter", Object.keys(P.items).length + " von " + ALL.length], ["Lerntage", Object.keys(P.days).length], ["Merkliste", P.starred.length], ["Schularbeiten", P.tests.length],
    ["Datengröße", (size / 1024).toFixed(1) + " KB"], ["Sicherheitskopie", bak ? "vorhanden" : "noch nicht"],
    ["Dauerhafter Speicher", "…"], ["Verwaiste Einträge", orphans.length + starOrph.length]];
  e.innerHTML = `<div class="group">${rows.map(([a, b], i) => `<div class="row"><div class="grow">${a}</div><div class="sub" id="r${i}">${b}</div></div>`).join("")}</div>
    <div class="btns"><button class="btn primary full" id="fix">Daten prüfen &amp; reparieren</button></div>${bak ? `<div class="btns"><button class="btn full" id="rst">Sicherheitskopie zurückspielen</button></div>` : ""}<p id="m" class="sub"></p>
    <p class="tiny">iPhone-Tipp: Als App auf dem Home-Bildschirm bleibt der Speicher stabiler als im Safari-Tab. iOS kann Daten von Webseiten, die lange nicht geöffnet wurden, löschen – darum ab und zu ein Backup machen.</p>`;
  try { navigator.storage.persisted().then(p => { e.querySelector("#r7").textContent = p ? "✅ ja" : "nicht zugesagt"; }).catch(() => {}); } catch (x) { e.querySelector("#r7").textContent = "unbekannt"; }
  e.querySelector("#fix").onclick = () => {
    const r = sanitize(P); const keep = Object.keys(P.items).length; P = mergeData(structuredClone(DEFAULTS), r.P); P.s = r.P.s; P.lastBackup = r.P.lastBackup;
    const n = r.fixed; save(); e.querySelector("#m").textContent = n ? n + " fehlerhafte Einträge repariert ✅" : "Alles in Ordnung ✅ (" + keep + " Wörter geprüft)";
  };
  const rs = e.querySelector("#rst"); if (rs) rs.onclick = () => confirmSheet("Sicherheitskopie zurückspielen?", "Dein jetziger Stand wird durch die automatische Kopie vom letzten Lerntag ersetzt.", "Zurückspielen", () => {
    try { const r = sanitize(JSON.parse(localStorage.getItem(KEY_BAK))); if (r.ok) { P = r.P; save(); e.querySelector("#m").textContent = "Zurückgespielt ✅"; drawTabs(); } } catch (x) { e.querySelector("#m").textContent = "Kopie nicht lesbar."; } });
}
function backupNag() {
  const ans = totalAnswered(), last = P.lastBackup || 0;
  if (ans >= 100 && Date.now() - last > 14 * 864e5 && Date.now() - (P.s.nagAt || 0) > 3 * 864e5) {
    P.s.nagAt = Date.now(); save();
    toast("💾 Zeit für ein Backup – tippen", () => { switchTab && switchTab("settings"); }, 6000);
  }
}

// ---------- Dialoge ----------
function sheet(html, bind) { const r = document.getElementById("modal-root"); r.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; bind(r, () => r.innerHTML = ""); }
function confirmSheet(t, d, ok, fn) { sheet(`<h2 style="margin-top:0">${esc(t)}</h2><p class="sub">${esc(d)}</p><div class="btns"><button class="btn" id="c">Abbrechen</button><button class="btn red" id="o">${esc(ok)}</button></div>`,
  (r, close) => { r.querySelector("#c").onclick = close; r.querySelector("#o").onclick = () => { close(); fn(); }; }); }
function toast(msg, onTap, ms) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  t.onclick = () => { t.remove(); if (onTap) onTap(); };
  if (ms) setTimeout(() => t.remove(), ms);
}
const verNum = v => String(v || "0").split(".").map(Number).reduce((a, x) => a * 1000 + (x || 0), 0);
function whatsNew(since) {
  const list = CHANGELOG.filter(c => !since || verNum(c.v) > verNum(since));
  sheet(`<h2 style="margin-top:0">Was ist neu? ✨</h2><div class="changes">${list.slice(0, since ? 99 : 6).map(c => `<h3>Version ${esc(c.v)}${c.date ? ` <span class="sub">· ${esc(c.date)}</span>` : ""}</h3><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>
    <button class="btn primary full" id="ok" style="margin-top:16px">Super!</button>`, (r, close) => r.querySelector("#ok").onclick = close);
}
function applyLook() {
  const r = document.documentElement;
  if (P.s.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", P.s.theme);
  r.style.setProperty("--z", P.s.zoom || 1);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(r).getPropertyValue("--bg").trim() === "#000" ? "#000000" : "#7a1a20";
}
let swReg = null;
async function checkUpdate() {
  if (!swReg) { location.reload(); return; }
  toast("Suche nach Updates …", null, 1500);
  try { await swReg.update(); } catch (e) {}
  setTimeout(() => { if (!swReg.installing && !swReg.waiting) toast("Du hast die neueste Version (" + APP_VERSION + ") ✅", null, 2500); }, 1600);
}
function onboarding() {
  sheet(`<div class="center"><img src="${ICON}" alt="" style="width:84px;height:84px;border-radius:19px"><h1 style="margin:10px 0 4px">Salve! 👋</h1><p>Alles aus „Medias in Res!“ – Lektion 1 bis 30 – zum Lernen und Wiederholen.</p></div>
    ${[["📖", "Lektionen", "Vokabeln und Grammatik jeder Lektion."], ["🧠", "Üben", "Wähle z. B. Lektion 5–10: Karteikarten, Quiz, Hören, Formen oder Schularbeit."], ["📅", "Täglich wiederholen", "Die App merkt sich, was du kannst, und zeigt fällige Wörter."], ["📲", "Wie eine App", "iPhone: Teilen ⬆︎ → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“."]]
      .map(([i, t, d]) => `<div style="display:flex;gap:14px;margin:14px 0"><div style="font-size:26px">${i}</div><div><b>${t}</b><div class="sub">${d}</div></div></div>`).join("")}
    <button class="btn primary full" id="go">Los geht’s – medias in res!</button>`, (r, close) => r.querySelector("#go").onclick = () => { P.s.onboarded = true; save(); close(); });
}

// ---------- Start ----------
applyLook();
render();
if (!P.s.onboarded) { onboarding(); P.s.lastVersion = APP_VERSION; save(); }
else if (P.s.lastVersion !== APP_VERSION) { const prev = P.s.lastVersion; P.s.lastVersion = APP_VERSION; save(); whatsNew(prev || "1.0.0"); }
if (loadInfo.recovered) toast("Dein Fortschritt wurde aus der Sicherheitskopie wiederhergestellt ♻️", null, 5000); else if (loadInfo.corrupt) toast("Gespeicherte Daten waren beschädigt – neu gestartet.", null, 5000);
backupNag();
try { if (speechSynthesis) speechSynthesis.getVoices(); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.host)) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => {
    swReg = r;
    // Beim Zurückkehren in die App nach Updates schauen
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") r.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    toast("Neue Version verfügbar – tippen zum Aktualisieren 🔄", () => location.reload());
  });
}
</script>
</body>
</html>
