o","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"pater","forms":"patris m.","de":"Vater","note":"vgl. Patriarch (= Familienoberhaupt); ↔ patria, -ae = „Vaterland“","pos":"Nomen"},{"la":"quaerere","forms":"quaero 3, quaesivi, quaesitum","de":"1) suchen (+ Akk.); 2) fragen (+ ab/ex)","note":"quaero amicam = ich suche die Freundin; quaero ab amica = ich frage die Freundin","pos":"Verb"},{"la":"parentes (Pl.)","forms":"parentum m.","de":"Eltern","note":"engl. + frz. parents","pos":"Nomen"},{"la":"qui, quae, quod","forms":"","de":"1) welcher/e/es; 2) der/die/das","note":"(Relativpronomen, siehe Grammatica)","pos":"Pronomen"},{"la":"nihil","forms":"","de":"nichts","note":"vgl. Nihilist (= einer, der an nichts glaubt)","pos":"Pronomen"},{"la":"nihil nisi","forms":"","de":"nichts außer; nur","note":"(wörtl.: „nichts, wenn nicht“)","pos":"Sonstiges"},{"la":"debere (+ Inf.)","forms":"debeo 2, -ui, -itum","de":"müssen","note":"frz. devoir, ital. dovere, span. deber","pos":"Verb"},{"la":"caput","forms":"capitis n.","de":"Kopf, Haupt","note":"vgl. engl. capital; vgl. Kapuze, Kapitän","pos":"Nomen"},{"la":"periculum","forms":"periculi n.","de":"Gefahr","note":"vgl. ital. pericoloso","pos":"Nomen"},{"la":"interficere","forms":"interficio M, interfeci, interfectum","de":"töten","note":"= necare, occidere","pos":"Verb"},{"la":"miser/era/erum","forms":"","de":"1) arm, elend; 2) unglücklich","note":"vgl. miserabel; die Misere (= Notlage)","pos":"Adjektiv"},{"la":"navigare","forms":"navigo 1, -avi, -atum","de":"segeln, mit dem Schiff fahren","note":"vgl. navis, -is; navigieren (= „steuern“)","pos":"Verb"},{"la":"adulescens","forms":"adulescentis m.","de":"junger Mann","note":"vgl. die Adoleszenz (= Jugendalter)","pos":"Nomen"},{"la":"iuvare","forms":"iuvo 1, iuvi, iutum","de":"unterstützen, helfen","note":"= adiuvare (Lec. 7)","pos":"Verb"},{"la":"nemo","forms":"","de":"niemand","note":"","pos":"Pronomen"},{"la":"invenire","forms":"invenio 4, inveni, inventum","de":"1) finden; 2) erfinden","note":"wörtl.: „darauf-kommen“; engl. invention, to invent","pos":"Verb"},{"la":"cura","forms":"curae f.","de":"Sorge","note":"vgl. Kur","pos":"Nomen"},{"la":"quomodo","forms":"","de":"wie","note":"(wörtlich: „auf welche Weise?“)","pos":"Adverb"},{"la":"modus","forms":"modi m.","de":"Art, Weise","note":"vgl. Mode (= Art, sich anzuziehen)","pos":"Nomen"},{"la":"dare","forms":"do 1, dedi, datum","de":"geben","note":"ital. dare, span. dar; vgl. Dativ („Gib-Fall“)","pos":"Verb"},{"la":"medius/a/um","forms":"","de":"der mittlere; in der Mitte","note":"vgl. engl. medium (z. B. Kleidergröße, Steak), mediterran","pos":"Adjektiv"},{"la":"medio in labyrintho","forms":"","de":"mitten im Labyrinth","note":"","pos":"Sonstiges"},{"la":"paratus/a/um","forms":"","de":"bereit","note":"vgl. parare (Lec. 7); vgl. „etwas parat haben“","pos":"Adjektiv"},{"la":"atque (= ac)","forms":"","de":"und","note":"= et, -que","pos":"Konjunktion"}],"grammar":[{"title":"qui, quae, quod","blocks":[{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","qui","quae","quod","qui","quae","quae"],["2","cuius","cuius","cuius","quorum","quarum","quorum"],["3","cui","cui","cui","quibus","quibus","quibus"],["4","quem","quam","quod","quos","quas","quae"],["6","quo","qua","quo","quibus","quibus","quibus"]]},{"type":"note","text":"Die Präposition cum wird an die Ablativformen meist angehängt: quocum, quacum, quibuscum."},{"type":"text","text":"Verwendungsarten von qui, quae, quod:"},{"type":"list","items":["als adjektivisches Fragepronomen (→ Bezugswort dahinter): „welcher?“, „welche?“, „welches?“ – Quod monstrum liberos devorat? = „Welches Ungeheuer verschlingt die Kinder?“","als Relativpronomen (als Einleitung eines Relativsatzes → nach Beistrich, Bezugswort davor): „der“, „die“, „das“ / „welcher“, „welche“, „welches“ – Monstrum, quod liberos devorat, Minotaurus est. = „Das Ungeheuer, das (welches) die Kinder verschlingt, ist der Minotaurus.“"]},{"type":"note","text":"Im Gegensatz zu quis?, quid? (vgl. Lec. 9) ist qui, quae, quod ein adjektivisches Fragepronomen, d. h. es ist – wie ein Adjektiv – immer mit einem Substantiv (Nomen) übereingestimmt, während quis?/quid? immer alleine steht: Qui puer clamat? („Welcher Bub schreit?“) ↔ Quis clamat? („Wer schreit?“)"}]},{"title":"Relativsätze (bezügliche Gliedsätze, Attributsätze)","blocks":[{"type":"text","text":"Die häufigste Verwendungsart von qui, quae, quod ist die als Relativpronomen (bezügliches Fürwort)."},{"type":"list","items":["Dieses bezieht sich in Zahl und Geschlecht auf ein (meist davor stehendes) Bezugswort.","Der Fall richtet sich danach, wie man nach dem Pronomen im Gliedsatz fragt."]},{"type":"text","text":"Theseus navem, in qua liberi sunt, ascendit. = „Theseus besteigt das Schiff, in dem die Kinder sind.“ – in qua: Zahl → Sg. (wie navem); Geschlecht → feminin (wie navem); Fall → 6. F. („Wo sind die Kinder?“)"},{"type":"text","text":"Übersetzung des Relativpronomens (achte besonders auf den Genetiv!):"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m./f./n."],"rows":[["1","„der“","„die“","„das“","„die“"],["2","„dessen“","„deren“","„dessen“","„deren“"],["3","„dem“","„der“","„dem“","„denen“"],["4","„den“","„die“","„das“","„die“"],["6","„mit dem“","„mit der“","„mit dem“","„mit denen“"]]},{"type":"text","text":"Die Übersetzung des lateinischen Ablativs hängt davon ab, um welchen Ablativ es sich handelt: „durch den“, „mit dem“, „von dem“ etc."}]}]},{"number":13,"title":"De Daedalo et Icaro","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"amor","forms":"amoris m.","de":"Liebe","note":"frz. amour, ital. amore, span. amor; vgl. Amor","pos":"Nomen"},{"la":"cupere","forms":"cupio M, cupivi, -itum","de":"wünschen, begehren","note":"↔ capere M","pos":"Verb"},{"la":"petere","forms":"peto 3, petivi, petitum","de":"„anstreben“","note":"","pos":"Verb"},{"la":"petere a/ab","forms":"(+ Abl.)","de":"bitten, erbitten","note":"peto a te auxilium = „ich bitte dich um Hilfe“, „ich erbitte Hilfe von dir“","pos":"Verb"},{"la":"manus","forms":"manus f.","de":"Hand","note":"vgl. manuell, Manufaktur, Maniküre","pos":"Nomen"},{"la":"artificium","forms":"artificii n.","de":"Kunstwerk","note":"zusammengesetzt aus: ars + facere","pos":"Nomen"},{"la":"res","forms":"rei f.","de":"Sache","note":"vgl. Medias in Res!; vgl. realisieren, realistisch","pos":"Nomen"},{"la":"ars","forms":"artis f.","de":"1) Kunst; 2) Technik","note":"engl. + frz. art, ital. + span. arte; vgl. Artist","pos":"Nomen"},{"la":"casus","forms":"casus m.","de":"1) Fall; 2) Zufall; 3) Unglücksfall","note":"engl. case (= Fall), frz. cas, ital. + span. caso","pos":"Nomen"},{"la":"coniungere","forms":"coniungo 3, coniunxi, coniunctum","de":"1) verbinden; 2) vereinigen","note":"vgl. Konjunktion (= Bindewort)","pos":"Verb"},{"la":"dies","forms":"diei m.","de":"Tag","note":"span. día; vgl. engl. diary (= Tagebuch)","pos":"Nomen"},{"la":"opus","forms":"operis n.","de":"Werk","note":"ital. opera; vgl. das Opus (= Musikwerk)","pos":"Nomen"},{"la":"meridies","forms":"meridiei m.","de":"Mittag","note":"vgl. Meridian (= „Mittagslinie“), a. m. (= ante meridiem)","pos":"Nomen"},{"la":"sol","forms":"solis m.","de":"Sonne","note":"frz. soleil, ital. sole, span. sol; vgl. Solarium","pos":"Nomen"},{"la":"caelum","forms":"caeli n.","de":"Himmel","note":"engl. ceiling, frz. ciel, ital. + span. cielo","pos":"Nomen"},{"la":"metus","forms":"metus m.","de":"Furcht, Angst","note":"= timor, -oris","pos":"Nomen"},{"la":"denique (Adv.)","forms":"","de":"schließlich, endlich","note":"= postremo","pos":"Adverb"},{"la":"neglegere","forms":"neglego 3, neglexi, neglectum","de":"missachten, ignorieren","note":"engl. to neglect, frz. négliger","pos":"Verb"},{"la":"solvere","forms":"solvo 3, solvi, solutum","de":"auflösen, lösen","note":"engl. to solve (a problem); solution (= Lösung)","pos":"Verb"},{"la":"cadere","forms":"cado 3, cecidi, –","de":"fallen","note":"de-kadent (= verfallen, entartet); vgl. casus, -us","pos":"Verb"},{"la":"mortuus/a/um","forms":"","de":"tot, gestorben","note":"frz. mort; vgl. Mortalität (= Sterblichkeit)","pos":"Adjektiv"}],"grammar":[{"title":"e- und u-Deklination","blocks":[{"type":"text","text":"Diese beiden Deklinationen unterscheiden sich in erster Linie durch den Auslaut ihres Stammes, der -e bzw. -u lautet (der reine, endungslose Stamm ist jeweils im Ablativ Sg. zu sehen). Die Endungen sind großteils identisch:"},{"type":"table","headers":["Fall","e-Dekl. (res, rei f.)","u-Dekl. (casus, -us m.)"],"rows":[["Sg. 1/5","res („Sache“)","casus („Fall“)"],["Sg. 2","rei","casus"],["Sg. 3","rei","casui"],["Sg. 4","rem","casum"],["Sg. 6","re","casu"],["Pl. 1/5","res","casus"],["Pl. 2","rerum","casuum"],["Pl. 3","rebus","casibus"],["Pl. 4","res","casus"],["Pl. 6","rebus","casibus"]]},{"type":"text","text":"Geschlechtsregeln:"},{"type":"list","items":["Nomina der e-Deklination sind feminin. (Ausnahmen: dies „Tag“ und meridies „Mittag“ sind maskulin.)","Nomina der u-Deklination auf -us sind meist maskulin. (Ausnahmen: domus „Haus“, manus „Hand“ sind feminin.)"]},{"type":"note","text":"Es gibt auch einige wenige neutrale Nomina auf -u (2.F. -us), z. B. cornu, -us „Horn“ (1./4. Pl.: cornua!)."}]},{"title":"Objektsgenetiv (Genetivus obiectivus)","blocks":[{"type":"text","text":"Manchmal kann es vorkommen, dass die wörtliche Übersetzung eines lateinischen Genetivs keinen Sinn ergibt, so z. B. bei amor patriae: „die Liebe der Heimat“ ist nicht sinnvoll, da die Heimat ja keine Person ist, die jemanden lieben kann. Also muss die Übersetzung wohl eher heißen: „die Liebe zur Heimat“."},{"type":"text","text":"Einen solchen Genetiv, der nicht wörtlich, sondern nur mithilfe einer passenden Präposition übersetzt werden kann, nennt man Genetivus obiectivus, da er das „Objekt“ (den Gegenstand) einer Handlung bezeichnet:"},{"type":"list","items":["amor patriae = „die Liebe zur Heimat“ (= die Heimatliebe) (→ jemand liebt die Heimat, sie ist „Objekt“ seiner Liebe)"]},{"type":"text","text":"Es kann jedoch auch vorkommen, dass sowohl die „normale“ Übersetzung als auch die mit Präposition möglich ist. In diesem Fall entscheidet der Kontext über die richtige Übersetzung: metus Romanorum ="},{"type":"list","items":["a) „die Angst der Römer“ („normaler“ Genetiv = Genetivus subiectivus → die Römer fürchten sich, sie sind Subjekt)","b) „die Angst vor den Römern“ (Genetivus obiectivus → man fürchtet die Römer, sie sind Objekt)"]},{"type":"note","text":"Welche der beiden Übersetzungen die richtige ist, ergibt sich nur aus dem Zusammenhang! Insgesamt kommt der Genetivus obiectivus aber wesentlich seltener vor als der Genetivus subiectivus!"}]}]},{"number":14,"title":"De Tartaro","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"fuit","forms":"Perfekt von est","de":"er/sie/es war","note":"(siehe Grammatica)","pos":"Verb"},{"la":"hic, haec, hoc","forms":"","de":"dieser/e/es","note":"hinweisendes Fürwort (siehe Grammatica)","pos":"Pronomen"},{"la":"cena","forms":"cenae f.","de":"Mahlzeit, Mahl","note":"frz. cène, ital. + span. cena (= Abendessen)","pos":"Nomen"},{"la":"invitare","forms":"invito 1, -avi, invitatum","de":"einladen","note":"engl. to invite, frz. inviter, ital. invitare","pos":"Verb"},{"la":"quidam, quaedam, quoddam","forms":"2.F. cuiusdam, 3.F. cuidam","de":"Sg.: ein (gewisser); Pl.: einige","note":"Deklination wie qui/quae/quod + -dam","pos":"Pronomen"},{"la":"facinus","forms":"facinoris n.","de":"1) Tat; 2) Untat","note":"abgeleitet vom Verbum facere (= tun)","pos":"Nomen"},{"la":"prudentia","forms":"prudentiae f.","de":"Klugheit","note":"engl. + frz. prudence, ital. prudenza, span. prudencia","pos":"Nomen"},{"la":"intellegere","forms":"intellego 3, intellexi, intellectum","de":"erkennen, einsehen","note":"vgl. Intelligenz, intelligent","pos":"Verb"},{"la":"reddere","forms":"reddo 3, reddidi, redditum","de":"zurückgeben","note":"aus: re- („zurück-“) + dare","pos":"Verb"},{"la":"poena","forms":"poenae f.","de":"Strafe","note":"vgl. Pönale (= Strafgeld), Penalty (= Strafstoß)","pos":"Nomen"},{"la":"poenas solvere","forms":"","de":"eine Strafe verbüßen","note":"wörtlich: „Strafgeld zahlen“","pos":"Sonstiges"},{"la":"stare","forms":"sto 1, steti, statum","de":"stehen","note":"vgl. Station, Statue; statisch (= stillstehend)","pos":"Verb"},{"la":"arbor","forms":"arboris f.","de":"Baum","note":"Nota bene: Bäume galten als weiblich!","pos":"Nomen"},{"la":"sitis","forms":"sitis f. (i-Stamm)","de":"Durst","note":"ital. sete, span. sed","pos":"Nomen"},{"la":"fames","forms":"famis f.","de":"Hunger","note":"frz. faim, ital. fame","pos":"Nomen"},{"la":"cum (Konjunktion)","forms":"","de":"1) wenn, sooft; 2) als","note":"↔ cum + Abl.","pos":"Sonstiges"},{"la":"bibere","forms":"bibo 3, bibi, –","de":"trinken","note":"frz. boire, ital. bere, span. beber","pos":"Verb"},{"la":"improbus/a/um","forms":"","de":"schlecht, böse","note":"","pos":"Adjektiv"},{"la":"scelus","forms":"sceleris n.","de":"Verbrechen","note":"","pos":"Nomen"},{"la":"mors","forms":"mortis f.","de":"Tod","note":"frz. mort, ital. morte, span. muerte","pos":"Nomen"},{"la":"contra (+ Akk.)","forms":"","de":"gegen","note":"vgl. Kontrast; Pro und Kontra (= Für und Wider)","pos":"Präposition"},{"la":"natura","forms":"naturae f.","de":"Natur","note":"engl. + frz. nature, ital. natura","pos":"Nomen"},{"la":"genus","forms":"generis n.","de":"1) Art; 2) Geschlecht","note":"engl. gender, frz. genre, ital. genere","pos":"Nomen"},{"la":"punire","forms":"punio 4, punivi, -itum","de":"bestrafen","note":"frz. punir, ital. punire; vgl. poena","pos":"Verb"},{"la":"saxum","forms":"saxi n.","de":"Fels","note":"ital. sasso","pos":"Nomen"},{"la":"vis (Sg.)","forms":"vim (4.F.), vi (6.F.) f.","de":"1) Kraft; 2) Gewalt","note":"↔ vir, viri (= Mann)","pos":"Nomen"},{"la":"vires (Pl.)","forms":"virium f.","de":"die Kräfte","note":"Viribus unitis („mit vereinten Kräften“)","pos":"Nomen"},{"la":"paene (Adv.)","forms":"","de":"fast, beinahe","note":"vgl. engl. pen-insula („Fast-Insel“ = Halbinsel)","pos":"Adverb"},{"la":"summo in monte","forms":"","de":"auf der Spitze des Berges","note":"vgl. summus/a/um. Aus dem Vokabelverzeichnis","pos":"Sonstiges"}],"grammar":[{"title":"Perfekt + Plusquamperfekt aktiv","blocks":[{"type":"text","text":"Diese beiden lateinischen Zeiten sind im Gegensatz zum Deutschen einfache Verbalformen, d. h. sie werden nicht, wie im Deutschen, durch ein Hilfszeitwort + Mittelwort gebildet (z. B. „ich habe gesungen“), sondern indem bestimmte Endungen an den aktiven Perfektstamm treten."},{"type":"text","text":"Der aktive Perfektstamm ist von Konjugation zu Konjugation unterschiedlich:"},{"type":"table","headers":["","Präsensstamm","aktiver Perfektstamm"],"rows":[["a-Konjugation","amo, amas … amare","-av- (amav-)"],["e-Konjugation","moneo, mones … monēre","-u- (monu-)"],["konsonantische K.","mitto, mittis … mittere","verschieden (z. B. mis-)"],["i-Konjugation","audio, audis … audire","-iv- (audiv-)"],["Mischkonjugation","capio, capis … capere","verschieden (z. B. cep-)"]]},{"type":"text","text":"Das bedeutet (leider): Da es keine Regel gibt, musst du den Perfektstamm für jedes Wort der konsonantischen und Mischkonjugation extra lernen!"},{"type":"text","text":"Die Endungen, die an den Perfektstamm angefügt werden, sind dagegen für alle Konjugationen gleich:"},{"type":"table","headers":["","Perfekt Sg.","Perfekt Pl.","Plusquamperfekt Sg.","Plusquamperfekt Pl."],"rows":[["1.P.","-i","-imus","-eram","-eramus"],["2.P.","-isti","-istis","-eras","-eratis"],["3.P.","-it","-ērunt","-erat","-erant"]]},{"type":"text","text":"Beispiele für die a-Konjugation:"},{"type":"table","headers":["","Perfekt","Plusquamperfekt"],"rows":[["Sg. 1.P.","amavi „ich habe geliebt“","amaveram „ich hatte geliebt“"],["Sg. 2.P.","amavisti „du hast geliebt“","amaveras „du hattest geliebt“"],["Sg. 3.P.","amavit „er/sie hat geliebt“","amaverat „er/sie hatte geliebt“"],["Pl. 1.P.","amavimus „wir haben geliebt“","amaveramus „wir hatten geliebt“"],["Pl. 2.P.","amavistis „ihr habt geliebt“","amaveratis „ihr hattet geliebt“"],["Pl. 3.P.","amavērunt „sie haben geliebt“","amaverant „sie hatten geliebt“"]]},{"type":"text","text":"Das Perfekt ist die lateinische Erzählzeit: Es beschreibt einmalige, in der Vergangenheit abgeschlossene Vorgänge. Es wird im Deutschen entweder mit dem Präteritum oder (in Gliedsätzen) mit dem Perfekt wiedergegeben: Veni, vidi, vici. = „Ich kam, sah und siegte.“"},{"type":"text","text":"Das Plusquamperfekt (wörtlich: „mehr als vergangen“) drückt eine Handlung aus, die vor dem Perfekt stattgefunden hat: Quintus, qui Iuliam amaverat (Plqpf.), postremo Claudiam in matrimonium duxit (Perfekt). = „Quintus, der Julia geliebt hatte, heiratete schließlich Claudia.“"},{"type":"note","text":"Achtung auf die 3.P. Plural: duxērunt = „sie haben geführt“ (→ Perfekt); duxerant = „sie hatten geführt“ (→ Plqpf.)"}]},{"title":"hic, haec, hoc","blocks":[{"type":"text","text":"Bei diesem Wort handelt es sich um ein weiteres Demonstrativpronomen. Bedeutung: „dieser, diese, dieses“:"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","hic","haec","hoc","hi","hae","haec"],["2","huius","huius","huius","horum","harum","horum"],["3","huic","huic","huic","his","his","his"],["4","hunc","hanc","hoc","hos","has","haec"],["6","hoc","hac","hoc","his","his","his"]]}]}]},{"number":15,"title":"De Orpheo et Eurydice","unit":"Aus der griechischen Mythologie","klasse":5,"vocab":[{"la":"ille, illa, illud","forms":"","de":"jener/e/es","note":"vgl. die Artikel: frz. le/la, ital. il/la, span. el/la","pos":"Pronomen"},{"la":"et … et","forms":"","de":"sowohl … als auch","note":"","pos":"Sonstiges"},{"la":"animal (i-Stamm)","forms":"animalis n.","de":"1) Tier; 2) Lebewesen","note":"engl. + frz. + span. animal, ital. animale","pos":"Nomen"},{"la":"carmen","forms":"carminis n.","de":"Lied","note":"vgl. Carmina Burana (Carl Orff)","pos":"Nomen"},{"la":"canere","forms":"cano 3, cecini, –","de":"singen, besingen","note":"frz. chanter, ital. cantare, span. cantar","pos":"Verb"},{"la":"olim (Adv.)","forms":"","de":"einst","note":"","pos":"Adverb"},{"la":"matrimonium","forms":"matrimonii n.","de":"Ehe","note":"ital. + span. matrimonio, engl. matrimony","pos":"Nomen"},{"la":"in matrimonium ducere","forms":"","de":"heiraten (vom Mann aus)","note":"wörtl.: „(die Frau) in die Ehe führen“","pos":"Sonstiges"},{"la":"dolor","forms":"doloris m.","de":"Schmerz","note":"frz. douleur, ital. dolore, span. dolor","pos":"Nomen"},{"la":"flere","forms":"fleo 2, flevi, fletum","de":"weinen","note":"vgl. flennen","pos":"Verb"},{"la":"dolere","forms":"doleo 2, dolui, –","de":"trauern, Schmerz empfinden","note":"vgl. dolor","pos":"Verb"},{"la":"ipse, ipsa, ipsum","forms":"","de":"selbst","note":"(siehe Grammatica)","pos":"Pronomen"},{"la":"regina","forms":"reginae f.","de":"Königin","note":"ital. regina","pos":"Nomen"},{"la":"movere","forms":"moveo 2, movi, motum","de":"bewegen; beeindrucken","note":"engl. to move, movie; vgl. motivieren, Motor","pos":"Verb"},{"la":"postquam","forms":"(+ Perfekt)","de":"nachdem","note":"","pos":"Konjunktion"},{"la":"cuncti/ae/a (Pl.!)","forms":"","de":"alle; alles (n.)","note":"","pos":"Adjektiv"},{"la":"frustra (Adv.)","forms":"","de":"vergeblich","note":"vgl. Frustration (= enttäuschte Erwartung)","pos":"Adverb"},{"la":"desinere","forms":"desino 3, desii, –","de":"aufhören, ablassen","note":"","pos":"Verb"},{"la":"considere","forms":"consido 3, consedi, –","de":"sich niedersetzen","note":"↔ sedere 2","pos":"Verb"},{"la":"ignotus/a/um","forms":"","de":"unbekannt","note":"","pos":"Adjektiv"},{"la":"eram, eras … (etc.)","forms":"","de":"ich war, du warst … (etc.)","note":"(Imperfekt von esse, siehe Grammatica)","pos":"Sonstiges"},{"la":"condicio","forms":"condicionis f.","de":"Bedingung","note":"vgl. Konditionalsatz (= Bedingungssatz)","pos":"Nomen"},{"la":"uxor","forms":"uxoris f.","de":"Gattin, Ehefrau","note":"","pos":"Nomen"},{"la":"iter","forms":"itineris n.","de":"1) Weg; 2) Reise","note":"ital. + span. itinerario","pos":"Nomen"},{"la":"iter facere","forms":"","de":"reisen, marschieren","note":"wörtl.: „eine Reise machen“","pos":"Sonstiges"},{"la":"vertere","forms":"verto 3, verti, versum","de":"wenden, drehen","note":"vgl. konvertieren (= die Religion wechseln)","pos":"Verb"},{"la":"domus","forms":"domus f.","de":"Haus","note":"vgl. Dom, Domizil (= Wohnsitz)","pos":"Nomen"},{"la":"longus/a/um","forms":"","de":"lang","note":"engl. long; vgl. Longinus (= großer Mensch)","pos":"Adjektiv"},{"la":"lux","forms":"lucis f.","de":"Licht","note":"ital. luce, span. luz; vgl. Luzifer („Lichtbringer“)","pos":"Nomen"}],"grammar":[{"title":"Imperfekt","blocks":[{"type":"text","text":"Das lateinische Imperfekt wird vom Präsensstamm (!) gebildet. Zwischen den Stamm und die Endungen tritt das Erkennungszeichen -ba-. (Nota bene: Davor steht immer -e-, nur bei der a-Konjugation -a-!)"},{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj.","esse","posse"],"rows":[["Sg. 1.P.","amabam","monebam","mittebam","audiebam","capiebam","eram","poteram"],["Sg. 2.P.","amabas","monebas","mittebas","audiebas","capiebas","eras","poteras"],["Sg. 3.P.","amabat","monebat","mittebat","audiebat","capiebat","erat","poterat"],["Pl. 1.P.","amabamus","monebamus","mittebamus","audiebamus","capiebamus","eramus","poteramus"],["Pl. 2.P.","amabatis","monebatis","mittebatis","audiebatis","capiebatis","eratis","poteratis"],["Pl. 3.P.","amabant","monebant","mittebant","audiebant","capiebant","erant","poterant"]]},{"type":"text","text":"Übersetzung: Das Imperfekt stellt lang andauernde oder wiederholte Handlungen dar. Es wird mit dem Präteritum wiedergegeben: Orpheus homines carminibus suis delectabat. = „Orpheus erfreute die Menschen mit seinen Liedern.“ (→ er tat es immer wieder)"},{"type":"text","text":"Unterschied Perfekt ↔ Imperfekt:"},{"type":"table","headers":["","Lat. Imperfekt","Lat. Perfekt"],"rows":[["Was drückt die Zeit aus?","a) wiederholte Handlung; b) länger dauernde Handlung","einmalige Handlung (= Erzählzeit!)"],["Grafische Entsprechung","Zeitdauer (Linie: –)","Zeitpunkt (Punkt: •)"],["Wiedergabe im Deutschen","Präteritum","Präteritum / Perfekt"]]},{"type":"text","text":"Zeitleiste: Plqpf. → Perfekt / Imperfekt → Präsens"},{"type":"note","text":"Perfekt und Imperfekt sind gleich weit vom Präsens entfernt, drücken aber Unterschiedliches aus."},{"type":"text","text":"Beispiel: Dormiebam; subito magister me clamavit. = „Ich schlief; plötzlich rief mich der Lehrer.“ (dormiebam = Imperfekt: (an-)dauernd; clamavit = Perfekt: einmal)"}]},{"title":"Demonstrativpronomina (hinweisende Fürwörter)","blocks":[{"type":"text","text":"ille, illa, illud: „jener, jene, jenes“"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","ille","illa","illud","illi","illae","illa"],["2","illius","illius","illius","illorum","illarum","illorum"],["3","illi","illi","illi","illis","illis","illis"],["4","illum","illam","illud","illos","illas","illa"],["6","illo","illa","illo","illis","illis","illis"]]},{"type":"text","text":"ipse, ipsa, ipsum: „selbst“"},{"type":"table","headers":["Fall","Sg. m.","Sg. f.","Sg. n.","Pl. m.","Pl. f.","Pl. n."],"rows":[["1","ipse","ipsa","ipsum","ipsi","ipsae","ipsa"],["2","ipsius","ipsius","ipsius","ipsorum","ipsarum","ipsorum"],["3","ipsi","ipsi","ipsi","ipsis","ipsis","ipsis"],["4","ipsum","ipsam","ipsum","ipsos","ipsas","ipsa"],["6","ipso","ipsa","ipso","ipsis","ipsis","ipsis"]]},{"type":"note","text":"Viele Pronomina haben im Genetiv Sg. die Endung -ius und im Dativ Sg. -i (jeweils für alle drei Geschlechter). Auch einige Adjektiva, die ansonsten nach der a-/o-Deklination abwandeln, weisen diese Besonderheit („Pronominale Deklination“) auf, z. B.: solus/a/um („allein“), unus/a/um („ein“, „einzig“), nullus/a/um („kein“)."}]}]},{"number":16,"title":"De Spartaco","unit":"Die römische Republik","klasse":5,"vocab":[{"la":"natio","forms":"nationis f.","de":"Volk","note":"vgl. inter-national, Nation, Nationalismus","pos":"Nomen"},{"la":"nobilis/e","forms":"","de":"1) vornehm; 2) adelig","note":"frz. noble, ital. nobile, span. noble; vgl. nobel","pos":"Adjektiv"},{"la":"natus/a/um","forms":"","de":"1) geboren; 2) abstammend","note":"vgl. engl. native speaker","pos":"Adjektiv"},{"la":"fortis/e","forms":"","de":"tapfer","note":"↔ frz. fort + ital. forte („stark“)!","pos":"Adjektiv"},{"la":"gladiator","forms":"gladiatoris m.","de":"Gladiator","note":"wörtl.: „Schwertkämpfer“ (vgl. gladius)","pos":"Nomen"},{"la":"crudelis/e","forms":"","de":"grausam","note":"engl. + frz. + span. cruel, ital. crudele","pos":"Adjektiv"},{"la":"varius/a/um","forms":"","de":"verschieden","note":"vgl. variieren (= abwechseln), Variante, Variation","pos":"Adjektiv"},{"la":"discere","forms":"disco 3, didici, –","de":"lernen","note":"vgl. discipulus","pos":"Verb"},{"la":"difficilis/e","forms":"","de":"schwierig","note":"engl. difficult, frz. + ital. difficile, span. difícil","pos":"Adjektiv"},{"la":"exercitus","forms":"exercitus m.","de":"Heer","note":"ital. esercito, span. ejército; vgl. exercere","pos":"Nomen"},{"la":"brevis/e","forms":"","de":"kurz","note":"engl. brief, frz. bref, ital. + span. breve","pos":"Adjektiv"},{"la":"tempus","forms":"temporis n.","de":"Zeit","note":"frz. temps, ital. tempo; vgl. Temporalsatz, temporär","pos":"Nomen"},{"la":"agere","forms":"ago 3, egi, actum","de":"1) tun; 2) verbringen","note":"vgl. agieren, reagieren; agil (= beweglich, flink)","pos":"Verb"},{"la":"vitam agere","forms":"","de":"das Leben verbringen","note":"","pos":"Sonstiges"},{"la":"exercere","forms":"exerceo 2, -ui, -itum","de":"trainieren, üben","note":"engl. exercise; vgl. exerzieren","pos":"Verb"},{"la":"celer/eris/ere","forms":"","de":"schnell","note":"ital. celere; vgl. engl. celerity","pos":"Adjektiv"},{"la":"ager","forms":"agri m.","de":"Feld; Pl.: Gebiet(e)","note":"vgl. Agrar-; vgl. engl. agriculture","pos":"Nomen"},{"la":"latus/a/um","forms":"","de":"weit, breit","note":"vgl. Latifundien (= große Landgüter)","pos":"Adjektiv"},{"la":"recipere","forms":"recipio M, recepi, receptum","de":"aufnehmen","note":"vgl. Rezeption, Rezept","pos":"Verb"},{"la":"se recipere","forms":"","de":"sich zurückziehen","note":"","pos":"Sonstiges"},{"la":"continere","forms":"contineo 2, continui, –","de":"1) zusammenhalten; 2) enthalten","note":"vgl. Kontinent; Container","pos":"Verb"},{"la":"cupiditas","forms":"cupiditatis f.","de":"Begierde, Gier","note":"vgl. cupere","pos":"Nomen"},{"la":"adductus/a/um","forms":"","de":"veranlasst","note":"","pos":"Adjektiv"},{"la":"senatus","forms":"senatus m.","de":"Senat","note":"eigtl.: „Ältestenrat“ (vgl. senex = „alter Mann“)","pos":"Nomen"},{"la":"cognoscere","forms":"cognosco 3, cognovi, cognitum","de":"1) erkennen; 2) erfahren; 3) kennenlernen","note":"vgl. kognitiv, inkognito (= unerkannt)","pos":"Verb"},{"la":"atrox (m./f./n.)","forms":"atrocis (2.F.)","de":"wild, grässlich","note":"(siehe Grammatica)","pos":"Adjektiv"},{"la":"crux","forms":"crucis f.","de":"Kreuz","note":"frz. croix, ital. croce, span. cruz; vgl. Kruzifix","pos":"Nomen"}],"grammar":[{"title":"Adjektiva der dritten Deklination","blocks":[{"type":"text","text":"Neben den bisher bekannten Adjektiva der a-/o-Deklination (z. B. magnus/a/um) gibt es eine weitere, ebenso große Gruppe von Adjektiva, die nach der dritten Deklination abgewandelt werden. Sie haben großteils die Endungen der i-Stämme, im Akkusativ Sg. aber -em. Gemeinsames Merkmal dieser Adjektiva ist nicht der Nominativ, sondern der Genetiv auf -is!"},{"type":"text","text":"Nach dem Nominativ unterscheidet man drei Untergruppen:"},{"type":"list","items":["a) eine Endung für alle drei Geschlechter → z. B. atrox (m./f./n.)","b) zwei Endungen (am häufigsten!) → z. B. fortis (m./f.), forte (n.)","c) drei Endungen → z. B. celer (m.), celeris (f.), celere (n.)"]},{"type":"table","headers":["Fall","atrox m./f.","atrox n.","fortis m./f.","forte n.","celer m.","celeris f.","celere n."],"rows":[["Sg. 1/5","atrox","atrox","fortis","forte","celer","celeris","celere"],["Sg. 2","atrocis","atrocis","fortis","fortis","celeris","celeris","celeris"],["Sg. 3","atroci","atroci","forti","forti","celeri","celeri","celeri"],["Sg. 4","atrocem","atrox","fortem","forte","celerem","celerem","celere"],["Sg. 6","atroci","atroci","forti","forti","celeri","celeri","celeri"],["Pl. 1/5","atroces","atrocia","fortes","fortia","celeres","celeres","celeria"],["Pl. 2","atrocium","atrocium","fortium","fortium","celerium","celerium","celerium"],["Pl. 3","atrocibus","atrocibus","fortibus","fortibus","celeribus","celeribus","celeribus"],["Pl. 4","atroces","atrocia","fortes","fortia","celeres","celeres","celeria"],["Pl. 6","atrocibus","atrocibus","fortibus","fortibus","celeribus","celeribus","celeribus"]]},{"type":"note","text":"Achtung auf die Endung -i: Im Gegensatz zu den meisten Nomina der 3. Deklination steht diese Endung nicht nur für den Dativ Sg., sondern auch für den Ablativ Sg.: brevi tempore (6.F. Sg.: „in kurzer Zeit“)."},{"type":"note","text":"Umgekehrt ist die Endung -e bei diesen Adjektiven kein Ablativ Sg., sondern der Nominativ oder Akkusativ Sg. Neutrum: tempus breve (1./4. F. Sg. n.: „die kurze Zeit“)."}]},{"title":"Apposition (Beisatz)","blocks":[{"type":"text","text":"Wenn ein Nomen (oder Nomen + Adjektiv) ein anderes Nomen, das im selben Fall steht, näher erklärt, spricht man von einer Apposition („Beisatz“):"},{"type":"list","items":["urbs Roma = „die Stadt Rom“ (→ urbs erklärt Roma näher)","Romam, urbem pulchram, petimus. = „Wir besuchen die schöne Stadt Rom (= Rom, die schöne Stadt).“"]},{"type":"note","text":"Beim Übersetzen muss die Apposition im Fall an das vorangestellte Nomen angepasst werden: Romulus nuntios ad Sabinos (4. Fall), populum vicinum (4. Fall), mittit. = „Romulus schickt Boten zu den Sabinern (3. Fall), einem benachbarten Volk (3. Fall).“"}]},{"title":"Prädikativum","blocks":[{"type":"text","text":"Unter einem Prädikativum versteht man ein Nomen (oder Adjektiv), das im selben Fall wie ein anderes Nomen steht, aber nicht das Nomen, sondern das Prädikat näher bestimmt. Es wird mit „als“ übersetzt:"},{"type":"list","items":["Romani multos viros servos in patriam ducebant. = „Die Römer führten viele Männer als Sklaven in ihre Heimat.“","Iulia prima venit. = „Julia kam als Erste.“"]},{"type":"tip","text":"Wenn du ein Subjekt oder Objekt „zu viel“ hast, probiere die Übersetzung mit „als“!"}]}]},{"number":17,"title":"De Cicerone","unit":"Die römische Republik","klasse":5,"vocab":[{"la":"littera","forms":"litterae f.","de":"Buchstabe","note":"vgl. die Lettern (= große Buchstaben)","pos":"Nomen"},{"la":"litterae (Pl.!)","forms":"litterarum f.","de":"1) Wissenschaft; 2) Brief","note":"engl. letter; vgl. Literatur","pos":"Nomen"},{"la":"iuvenis","forms":"iuvenis m.","de":"junger Mann (30–45 Jahre)","note":"ital. giovane; ↔ adulescens (ca. 18–30 Jahre)","pos":"Nomen"},{"la":"orator","forms":"oratoris m.","de":"Redner","note":"","pos":"Nomen"},{"la":"res publica","forms":"rei publicae f.","de":"Staat","note":"(wörtl.: „öffentliche Sache“); vgl. Republik","pos":"Nomen"},{"la":"iustitia","forms":"iustitiae f.","de":"Gerechtigkeit","note":"vgl. Justiz (= staatliche Rechtspflege)","pos":"Nomen"},{"la":"incola","forms":"incolae m.","de":"Bewohner, Einwohner","note":"","pos":"Nomen"},{"la":"provincia","forms":"provinciae f.","de":"Provinz","note":"vgl. die Provence (Region in S-Frankreich)","pos":"Nomen"},{"la":"divitiae (Pl.!)","forms":"divitiarum f.","de":"Reichtum","note":"","pos":"Nomen"},{"la":"antiquus/a/um","forms":"","de":"alt","note":"antik; vgl. Antiquitäten (= alte Kunstgegenstände)","pos":"Adjektiv"},{"la":"ferre","forms":"fero, fers, tuli, latum","de":"tragen, bringen; ertragen","note":"(siehe Grammatica); vgl. Transfer","pos":"Verb"},{"la":"nobilitas","forms":"nobilitatis f.","de":"Adel","note":"vgl. Snob (= sine nobilitate); nobilis/e","pos":"Nomen"},{"la":"ius","forms":"iuris n.","de":"Recht","note":"Jus, Jura, Jurisdiktion (= Rechtsprechung)","pos":"Nomen"},{"la":"oratio","forms":"orationis f.","de":"Rede","note":"vgl. orator","pos":"Nomen"},{"la":"iudicium","forms":"iudicii n.","de":"Urteil","note":"ital. giudizio, span. juicio","pos":"Nomen"},{"la":"sponte sua","forms":"","de":"freiwillig","note":"vgl. spontan (= aus eigenem Antrieb)","pos":"Sonstiges"},{"la":"exilium","forms":"exilii n.","de":"Exil, Verbannung","note":"Exil","pos":"Nomen"},{"la":"ire","forms":"eo, is, ii, itum","de":"gehen","note":"vgl. Semperit = „Es geht immer“","pos":"Verb"},{"la":"Romae","forms":"(Lokativ)","de":"in Rom","note":"","pos":"Sonstiges"},{"la":"studere (+ Dat.)","forms":"studeo 2, studui, –","de":"sich bemühen (um), streben (nach)","note":"studieren, Student","pos":"Verb"},{"la":"cogere","forms":"cogo 3, coegi, coactum","de":"1) sammeln; 2) zwingen","note":"aus: co-agere = wörtl.: „zusammentreiben“","pos":"Verb"},{"la":"consul","forms":"consulis m.","de":"Konsul","note":"","pos":"Nomen"},{"la":"convocare","forms":"convoco 1, -avi, -atum","de":"zusammenrufen","note":"con- = „zusammen-“","pos":"Verb"},{"la":"senator","forms":"senatoris m.","de":"Senator","note":"vgl. senatus (Lec. 16)","pos":"Nomen"},{"la":"fere","forms":"","de":"1) ungefähr; 2) fast","note":"↔ ferre (= „tragen“)","pos":"Adverb"},{"la":"exire","forms":"exeo, exis, exii, exitum","de":"hinausgehen","note":"vgl. engl. exit; vgl. Exitus (= Tod)","pos":"Verb"},{"la":"iubere (+ Akk.)","forms":"iubeo 2, iussi, iussum","de":"befehlen; lassen (+ Inf.)","note":"iubeo te (Akk.) = ich befehle dir (Dativ!)","pos":"Verb"},{"la":"socius","forms":"socii m.","de":"Gefährte","note":"vgl. sozial, Sozialismus; Sozius (= Beifahrersitz)","pos":"Nomen"},{"la":"comprehendere","forms":"comprehendo 3, comprehendi, -prehensum","de":"1) ergreifen; 2) erfassen (auch geistig)","note":"vgl. engl. listening comprehension","pos":"Verb"},{"la":"afficere","forms":"afficio M, affeci, affectum","de":"erfüllen, versehen (mit)","note":"vgl. Affekt (= Gefühlsregung)","pos":"Verb"},{"la":"priusquam","forms":"","de":"bevor","note":"","pos":"Konjunktion"},{"la":"adire","forms":"adeo, adis, adii, aditum","de":"1) hingehen; 2) sich wenden (an); 3) angreifen","note":"","pos":"Verb"}],"grammar":[{"title":"Futur","blocks":[{"type":"text","text":"Das Futur wird je nach Konjugation auf zwei verschiedene Arten gebildet:"},{"type":"table","headers":["","a- und e-Konj.: „bo/bis/bunt“-Futur (a-Konj.)","übrige Konj.: „a/e“-Futur (kons. Konj.)","unregelmäßig: esse"],"rows":[["Sg. 1.P.","amabo „ich werde lieben“","mittam „ich werde schicken“","ero „ich werde sein“"],["Sg. 2.P.","amabis „du wirst lieben“","mittes „du wirst schicken“","eris „du wirst sein“"],["Sg. 3.P.","amabit „er/sie wird lieben“","mittet „er/sie wird schicken“","erit „er/sie wird sein“"],["Pl. 1.P.","amabimus „wir werden lieben“","mittemus „wir werden schicken“","erimus „wir werden sein“"],["Pl. 2.P.","amabitis „ihr werdet lieben“","mittetis „ihr werdet schicken“","eritis „ihr werdet sein“"],["Pl. 3.P.","amabunt „sie werden lieben“","mittent „sie werden schicken“","erunt „sie werden sein“"]]},{"type":"list","items":["ebenso: monebo, monebis … monebunt (e-Konj.)","ebenso: capiam, capies … (Mischkonj.) bzw. audiam, audies … (i-Konj.)","ebenso: potero, poteris … poterunt"]},{"type":"note","text":"Während das „bo/bis/bunt“-Futur normalerweise leicht zu erkennen ist (es sei denn, du verwechselst es mit dem -ba- des Imperfekts), besteht beim „a/e“-Futur die Verwechslungsgefahr mit dem Präsens der e-Konjugation: mittes (konsonantische Konjugation) → Futur („du wirst schicken“); habes (e-Konjugation) → Präsens („du hast“)."},{"type":"tip","text":"Es ist also wichtig, dass du die Stammformen jedes Verbs gut beherrschst, damit du weißt, zu welcher Konjugationsklasse das Wort gehört!"}]},{"title":"Die unregelmäßigen Verba ire und ferre","blocks":[{"type":"table","headers":["","ire Präsens","ire Futur","ire Perfekt","ferre Präsens","ferre Futur","ferre Perfekt"],"rows":[["Sg. 1.P.","eo","ibo","ii","fero","feram","tuli"],["Sg. 2.P.","is","ibis","isti","fers","feres","tulisti"],["Sg. 3.P.","it","ibit","iit","fert","feret","tulit"],["Pl. 1.P.","imus","ibimus","iimus","ferimus","feremus","tulimus"],["Pl. 2.P.","itis","ibitis","istis","fertis","feretis","tulistis"],["Pl. 3.P.","eunt","ibunt","ierunt","ferunt","ferent","tulerunt"],["Imperativ","Sg. i! Pl. ite!","","","Sg. fer! Pl. ferte!","",""]]},{"type":"text","text":"ire = „gehen“, ferre = „tragen“, „bringen“."}]},{"title":"Neutrum Plural bei Pronomina („cuncta“-Regel)","blocks":[{"type":"text","text":"Steht ein lateinisches Pronomen alleine (d. h. ohne ein Nomen, mit dem es übereingestimmt ist) im 1./4.F. Plural Neutrum, muss es im Deutschen mit dem Singular wiedergegeben werden:"},{"type":"list","items":["Haec (4.F. Pl. n.) fere dixit. = „Er sagte ungefähr dieses.“ (4.F. Sg. n.)"]},{"type":"text","text":"Ist ein solches Wort Subjekt, muss im Lateinischen auch das Prädikat im Plural stehen:"},{"type":"list","items":["Cuncta, quae dicis, mihi placent. (→ Pl.) = „Alles, was du sagst, gefällt mir.“ (→ Sg.)"]}]}]},{"number":18,"title":"Caesar Gallos superat","unit":"Die römische Republik","klasse":5,"vocab":[{"la":"C. Iulius Caesar","forms":"Iulii Caesaris","de":"Gaius Julius Cäsar","note":"vgl. Kaiser, Zar; C. = altlateinisch für G!","pos":"Sonstiges"},{"la":"prudens (m./f./n.)","forms":"prudentis (2.F.)","de":"klug","note":"frz. prudent, ital. + span. prudente","pos":"Adjektiv"},{"la":"quam","forms":"(nach Komparativ)","de":"als","note":"vgl. Plusquamperfekt („mehr als vergangen“)","pos":"Sonstiges"},{"la":"civitas","forms":"civitatis f.","de":"1) Stamm; 2) Gemeinde; 3) Staat","note":"vgl. engl. city, frz. cité, ital. città, span. ciudad","pos":"Nomen"},{"la":"Gallia","forms":"Galliae f.","de":"Gallien","note":"= das heutige Frankreich; frz. Gaule","pos":"Nomen"},{"la":"tradere","forms":"trado 3, tradidi, traditum","de":"1) ausliefern; 2) überliefern","note":"vgl. Tradition (= Überlieferung)","pos":"Verb"},{"la":"se tradere","forms":"","de":"sich ergeben","note":"","pos":"Sonstiges"},{"la":"amicitia","forms":"amicitiae f.","de":"Freundschaft","note":"ital. amicizia; vgl. amicus, amica","pos":"Nomen"},{"la":"legio","forms":"legionis f.","de":"Legion","note":"(ca. 4000–6000 Mann)","pos":"Nomen"},{"la":"pauci/ae/a","forms":"","de":"wenige","note":"frz. peu, ital. poco („wenig“)","pos":"Adjektiv"},{"la":"totus/a/um","forms":"2.F. totius, 3.F. toti","de":"ganz","note":"frz. tout, ital. tutto; vgl. total","pos":"Adjektiv"},{"la":"at","forms":"","de":"aber","note":"= autem, sed; ↔ atque (ac) = „und“","pos":"Konjunktion"},{"la":"auctoritas","forms":"auctoritatis f.","de":"Ansehen, Einfluss","note":"vgl. Autorität","pos":"Nomen"},{"la":"omnis/e (Sg.)","forms":"","de":"1) jeder; 2) ganz","note":"ital. ogni; vgl. omnipräsent","pos":"Adjektiv"},{"la":"omnes (Pl. m./f.)","forms":"2.F. omnium","de":"alle (Pl. m./f.)","note":"vgl. Omnibus (wörtl. = „für alle“)","pos":"Nomen"},{"la":"omnia (Pl. neutrum)","forms":"","de":"alles (Sg. neutrum!)","note":"z. B. omnia scio = „ich weiß alles“","pos":"Sonstiges"},{"la":"proelium","forms":"proelii n.","de":"Schlacht","note":"z. B. proelium committere","pos":"Nomen"},{"la":"qui, quae, quod","forms":"(am Satzanfang)","de":"dieser, diese, dieses","note":"(„Relativer Anschluss“, siehe Grammatica)","pos":"Pronomen"},{"la":"circumvenire","forms":"circumvenio 4, circumveni, -ventum","de":"umzingeln","note":"circum („herum-“) + venire","pos":"Verb"},{"la":"advenire","forms":"advenio 4, -veni, -ventum","de":"hinkommen, ankommen","note":"vgl. Advent (= Ankunft Christi)","pos":"Verb"},{"la":"frumentum","forms":"frumenti n.","de":"Getreide","note":"ital. frumento","pos":"Nomen"},{"la":"concilium","forms":"concilii n.","de":"Versammlung","note":"vgl. Konzil; ↔ consilium","pos":"Nomen"},{"la":"honestus/a/um","forms":"","de":"ehrenhaft, ehrenvoll","note":"engl. honest = „anständig“, „ehrlich“","pos":"Adjektiv"},{"la":"servitus","forms":"servitutis f.","de":"Sklaverei","note":"vgl. servus","pos":"Nomen"},{"la":"aetas","forms":"aetatis f.","de":"1) Alter; 2) Zeitalter, Zeit","note":"ital. età, span. edad","pos":"Nomen"},{"la":"aut","forms":"","de":"oder","note":"↔ autem","pos":"Konjunktion"},{"la":"ubi (+ Perfekt)","forms":"","de":"sobald","note":"↔ ubi als Fragewort","pos":"Sonstiges"},{"la":"prior (m./f.), prius (n.)","forms":"","de":"der/die/das frühere","note":"vgl. Priorität (= Vorrang, Vorzug)","pos":"Adjektiv"},{"la":"acer/acris/acre","forms":"","de":"1) heftig; 2) spitz, scharf","note":"","pos":"Adjektiv"},{"la":"incipere","forms":"incipio M, coepi, coeptum","de":"beginnen, anfangen","note":"↔ cepi (von capere M) = „ich habe gefangen“","pos":"Verb"}],"grammar":[{"title":"Komparativ (Mehrstufe)","blocks":[{"type":"text","text":"Der Komparativ wird bei allen Adjektiva gleich gebildet: An den Wortstamm (= Gen. Sg. ohne Endung -i bzw. -is) tritt die Silbe -ior (m. + f.) bzw. -ius (n.):"},{"type":"list","items":["clarus, clara, clarum (a-/o-Dekl.) → clarior, clarius","pulcher, pulchra, pulchrum (a-/o-Dekl.) → pulchrior, pulchrius","fortis, forte (3. Dekl.) → fortior, fortius","prudens, prudentis (3. Dekl.) → prudentior, prudentius"]},{"type":"text","text":"Abwandlung: nach der 3. Deklination (wie die Nomina der Konsonantenstämme):"},{"type":"table","headers":["Fall","Sg. m./f.","Sg. n.","Pl. m./f.","Pl. n."],"rows":[["1/5","fortior","fortius","fortiores","fortiora"],["2","fortioris","fortioris","fortiorum","fortiorum"],["3","fortiori","fortiori","fortioribus","fortioribus"],["4","fortiorem","fortius","fortiores","fortiora"],["6","fortiore","fortiore","fortioribus","fortioribus"]]},{"type":"text","text":"Übersetzung:"},{"type":"list","items":["1) als echter Komparativ: pensum difficilius = „die schwierigere Aufgabe“","2) mit „ziemlich“: pensum difficilius = „die ziemlich schwierige Aufgabe“","3) mit „(all)zu“: pensum difficilius = „die allzu schwierige Aufgabe“"]}]},{"title":"Superlativ (Meiststufe)","blocks":[{"type":"text","text":"a) Der Superlativ endet meistens auf -issimus und wandelt nach der a-/o-Deklination ab:"},{"type":"list","items":["clarus/a/um → clarissimus/a/um","fortis/forte → fortissimus/a/um","prudens, prudentis → prudentissimus/a/um"]},{"type":"text","text":"b) Endet ein Adjektiv im 1.F. Sg. m. der Grundstufe auf -er, lautet der Superlativ -errimus:"},{"type":"list","items":["pulcher, pulchra, pulchrum → pulcherrimus/a/um","celer, celeris, celere → celerrimus/a/um"]},{"type":"text","text":"c) Einige Adjektiva auf -ilis (facilis, difficilis, similis, dissimilis) bilden den Superlativ auf -illimus:"},{"type":"list","items":["facilis, facile → facillimus/a/um","difficilis, difficile → difficillimus/a/um"]},{"type":"text","text":"Übersetzung:"},{"type":"list","items":["1) als echter Superlativ: pensum difficillimum = „die schwierigste Aufgabe“","2) mit „sehr“: pensum difficillimum = „die sehr schwierige Aufgabe“"]}]},{"title":"Relativer Anschluss","blocks":[{"type":"text","text":"Steht qui, quae, quod am Satzbeginn, wird es (außer es handelt sich um einen Fragesatz!) nicht mit „der, die, das“ oder „welcher, welche, welches“, sondern mit „dieser, diese, dieses“ übersetzt:"},{"type":"list","items":["Vercingetorix a ceteris civitatibus auxilium petivit. Quae exercitum magnum miserunt. = „Vercingetorix bat die übrigen Stämme um Hilfe. Diese schickten ein großes Heer.“"]}]},{"title":"Vergleichsablativ (Ablativus comparationis)","blocks":[{"type":"text","text":"Der Vergleich wird entweder durch quam („als“) oder durch den (meist vor dem Komparativ stehenden) Vergleichsablativ ausgedrückt:"},{"type":"list","items":["Hic miles est fortior quam ille. = Hic miles illo (Abl.!) fortior est. = „Dieser Soldat ist tapferer als jener.“"]}]}]},{"number":19,"title":"De Caesaris morte","unit":"Die römische Republik","klasse":5,"vocab":[{"la":"maximus/a/um","forms":"","de":"der größte, sehr groß","note":"vgl. maximal, maximieren, Maximum","pos":"Adjektiv"},{"la":"potestas","forms":"potestatis f.","de":"Macht","note":"vgl. posse","pos":"Nomen"},{"la":"dictator","forms":"dictatoris m.","de":"Diktator","note":"Oberbefehlshaber in Kriegszeiten für max. 6 Monate","pos":"Nomen"},{"la":"perpetuus/a/um","forms":"","de":"ununterbrochen, ewig","note":"vgl. dictator perpetuus = „Diktator auf Lebenszeit“","pos":"Adjektiv"},{"la":"civis","forms":"civis m.","de":"Bürger","note":"vgl. Zivilist; ↔ civitas, -atis","pos":"Nomen"},{"la":"persuadere","forms":"persuadeo 2, persuasi, persuasum","de":"1) überreden; 2) überzeugen","note":"engl. to persuade, frz. persuader, ital. persuadere, span. persuadir","pos":"Verb"},{"la":"persuadeo tibi","forms":"(Dativ!)","de":"ich überrede dich (Akk.!)","note":"","pos":"Sonstiges"},{"la":"mos","forms":"moris m.","de":"Sitte, Brauch","note":"vgl. Moral (Sittenlehre); ↔ mors, mortis","pos":"Nomen"},{"la":"lex","forms":"legis f.","de":"Gesetz","note":"frz. loi, ital. legge, span. ley; vgl. legal, Legislative (= gesetzgebende Gewalt im Staat)","pos":"Nomen"},{"la":"libertas","forms":"libertatis f.","de":"Freiheit","note":"engl. liberty, frz. liberté, span. libertad; vgl. liberare","pos":"Nomen"},{"la":"melior (m./f.)","forms":"melius (n.)","de":"besser","note":"frz. meilleur, ital. migliore, span. mejor","pos":"Adjektiv"},{"la":"caedes","forms":"caedis f.","de":"Ermordung, Mord","note":"vgl. ital. omi-cidio; engl. sui-cide (= Selbstmord)","pos":"Nomen"},{"la":"vivere","forms":"vivo 3, vixi, –","de":"leben","note":"frz. vivre, ital. vivere, span. vivir; engl. to survive","pos":"Verb"},{"la":"facilis/e","forms":"","de":"leicht","note":"frz. facile, ital. facile, span. fácil; ↔ difficilis","pos":"Adjektiv"},{"la":"plurimi/ae/a","forms":"","de":"die meisten","note":"(Superlativ zu multi/ae/a, siehe Grammatica)","pos":"Adjektiv"},{"la":"statuere","forms":"statuo 3, statui, statutum","de":"1) beschließen; 2) aufstellen","note":"= constituere; vgl. Statuten (= beschlossene Richtlinien)","pos":"Verb"},{"la":"futurus/a/um","forms":"","de":"zukünftig","note":"vgl. engl. future, frz. futur, ital. + span. futuro","pos":"Adjektiv"},{"la":"adesse","forms":"adsum, ades, adfui, –","de":"da sein, anwesend sein","note":"","pos":"Verb"},{"la":"quidem","forms":"","de":"zwar, freilich","note":"↔ ne … quidem","pos":"Adverb"},{"la":"iste, ista, istud","forms":"","de":"dieser/e/es (da)","note":"abschätzig gemeint! (Deklination: wie ille/illa/illud)","pos":"Pronomen"},{"la":"defendere","forms":"defendo 3, defendi, defensum","de":"verteidigen","note":"frz. défendre, ital. difendere, span. defender; vgl. defensiv","pos":"Verb"},{"la":"vulnus","forms":"vulneris n.","de":"Wunde","note":"vgl. engl. vulnerable (= verletzlich, verwundbar)","pos":"Nomen"},{"la":"ultimus/a/um","forms":"","de":"der/die/das letzte","note":"vgl. Ultimatum (= letzte Aufforderung)","pos":"Adjektiv"},{"la":"maior, maius","forms":"maioris (2.F.)","de":"größer","note":"Komparativ zu magnus. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"minor, minus","forms":"minoris (2.F.)","de":"kleiner","note":"Komparativ zu parvus. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"minimus/a/um","forms":"","de":"der kleinste","note":"vgl. minimal. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"optimus/a/um","forms":"","de":"der beste","note":"vgl. optimal. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"peior, peius","forms":"peioris (2.F.)","de":"schlechter","note":"Komparativ zu malus. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"pessimus/a/um","forms":"","de":"der schlechteste","note":"vgl. Pessimist. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"plus","forms":"pluris (2.F.)","de":"mehr","note":"vgl. Plus. Aus dem Vokabelverzeichnis","pos":"Adjektiv"},{"la":"plures/a (Pl.)","forms":"plurium (2.F.)","de":"mehr, mehrere","note":"vgl. Plural. Aus dem Vokabelverzeichnis","pos":"Adjektiv"}],"vocabNote":"Ab dieser Lektion findest du in der zweiten Spalte auch das PPP (Partizip Perfekt Passiv, Mittelwort der Vergangenheit). Diese letzte Form der lateinischen Stammformen musst du von nun an immer mitlernen.","grammar":[{"title":"Partizip Perfekt Passiv (PPP)","blocks":[{"type":"text","text":"Das PPP ist die letzte der Stammformen. Dieses Partizip (Mittelwort) wird folgendermaßen gebildet:"},{"type":"table","headers":["","Präsensstamm","Perfektstamm aktiv","Perfektstamm passiv (= PPP)"],"rows":[["a-Konjugation","amo, -as … -are","amav-i","-atus (z. B. amatus/a/um = „geliebt“)"],["e-Konjugation","moneo, -es … -ēre","monu-i","-itus (z. B. monitus/a/um = „gemahnt“)"],["konsonant. K.","mitto, -is … -ere","mis-i","verschieden (z. B. missus/a/um = „geschickt“)"],["i-Konjugation","audio, -is … -ire","audiv-i","-itus (z. B. auditus/a/um = „gehört“)"],["Mischkonj.","capio, -is … -ere","cep-i","verschieden (z. B. captus/a/um = „gefangen“)"]]},{"type":"list","items":["Erkennungsmerkmal des PPP ist die Endsilbe -tus (seltener: -sus oder -xus).","Das PPP dekliniert wie ein Adjektiv der a-/o-Deklination und passt sich dem Geschlecht und der Zahl des Nomens an, mit dem es übereingestimmt ist: Gaius amatus est. Iulia amata est. Gaius et Quintus amati sunt. (etc.)","Das PPP ist passiv und vorzeitig. Es wird wie das deutsche Mittelwort der Vergangenheit (Partizip II) übersetzt: amatus = „geliebt“ (= „einer, der geliebt worden ist“)"]},{"type":"text","text":"Verwendung des PPP:"},{"type":"list","items":["a) als Adjektiv: Graeci servati = „die geretteten Griechen“","b) als Nomen: servati = „die Geretteten“","c) mit einer Form von esse zur Bildung der passiven Perfektstammformen: Graeci servati sunt = „die Griechen sind gerettet worden“"]}]},{"title":"Passive Perfektstammformen","blocks":[{"type":"text","text":"Die Formen des passiven Perfektstammes (Perfekt Passiv, Plqpf. Passiv) setzen sich aus zwei Teilen zusammen: aus dem PPP und einer Form von esse (Beispiele für die a-Konjugation):"},{"type":"table","headers":["","Perfekt Passiv","Plusquamperfekt Passiv"],"rows":[["Sg. 1.P.","amatus sum „ich bin geliebt worden“","amatus eram „ich war geliebt worden“"],["Sg. 2.P.","amatus es „du bist geliebt worden“","amatus eras „du warst geliebt worden“"],["Sg. 3.P.","amatus est „er ist geliebt worden“","amatus erat „er war geliebt worden“"],["Pl. 1.P.","amati sumus „wir sind geliebt worden“","amati eramus „wir waren geliebt worden“"],["Pl. 2.P.","amati estis „ihr seid geliebt worden“","amati eratis „ihr wart geliebt worden“"],["Pl. 3.P.","amati sunt „sie sind geliebt worden“","amati erant „sie waren geliebt worden“"]]},{"type":"text","text":"Ebenso: monitus sum, missus sum, captus sum, auditus sum bzw. monitus eram, missus eram, captus eram, auditus eram. In Erzählungen wird das Perfekt meist als Präteritum wiedergegeben."},{"type":"text","text":"Weitere Übersetzungsbeispiele:"},{"type":"list","items":["amata est = „sie ist geliebt worden“ (Perfekt) ↔ amata erat = „sie war geliebt worden“ (Plqpf.)","amatum est = „es ist geliebt worden“ (Perfekt) ↔ amatum erat = „es war geliebt worden“ (Plqpf.)"]}]},{"title":"Unregelmäßige Steigerung","blocks":[{"type":"table","headers":["Grundstufe","Komparativ","Superlativ","Eselsbrücke"],"rows":[["magnus/a/um („groß“)","maior/maius („größer“)","maximus/a/um („größter“)","maximal"],["parvus/a/um („klein“)","minor/minus („kleiner“)","minimus/a/um („kleinster“)","minimal"],["bonus/a/um („gut“)","melior/melius („besser“)","optimus/a/um („bester“)","optimal; Optimist"],["malus/a/um („schlecht“)","peior/peius („schlechter“)","pessimus/a/um („schlechtester“)","Pessimist"],["multi/ae/a („viele“)","plures/plura („mehr“)","plurimi/ae/a („die meisten“)","Plural"],["multum („viel“)","plus/pluris (Gen.) („mehr“)","plurimum („am meisten“)","Plus"]]}]}]},{"number":20,"title":"De Cleopatra","unit":"Die römische Republik","klasse":5,"vocab":[{"la":"convenire","forms":"convenio 4, conveni, conventum","de":"zusammenkommen","note":"vgl. Konvent (= Klostergemeinde; Zusammenkunft)","pos":"Verb"},{"la":"mulier","forms":"mulieris f.","de":"Frau","note":"span. mujer; vgl. ital. moglie (= „Ehefrau“)","pos":"Nomen"},{"la":"finis (Sg.)","forms":"finis m.","de":"1) Grenze; 2) Ende","note":"vgl. Finale (= Endspiel)","pos":"Nomen"},{"la":"fines (Pl.)","forms":"finium m.","de":"Gebiet(e)","note":"","pos":"Nomen"},{"la":"regnum","forms":"regni n.","de":"1) Königreich, Reich; 2) Herrschaft","note":"vgl. engl. reign („Herrschaft“)","pos":"Nomen"},{"la":"augere","forms":"augeo 2, auxi, auctum","de":"vergrößern, steigern, vermehren","note":"vgl. Auktion (= Versteigerung)","pos":"Verb"},{"la":"donum","forms":"doni n.","de":"Geschenk","note":"","pos":"Nomen"},{"la":"mihi gaudio est","forms":"","de":"es bereitet mir Freude","note":"","pos":"Sonstiges"},{"la":"ingens (m./f./n.)","forms":"ingentis (2.F.)","de":"riesig, gewaltig","note":"","pos":"Adjektiv"},{"la":"antea (Adv.)","forms":"","de":"vorher, früher","note":"span. antes; ↔ ante (Präp.)","pos":"Adverb"},{"la":"clades","forms":"cladis f.","de":"Niederlage","note":"","pos":"Nomen"},{"la":"classis","forms":"classis f.","de":"Flotte","note":"auch: „Abteilung“ (davon „Klasse“!)","pos":"Nomen"},{"la":"animadvertere","forms":"animadverto 3, animadverti, -versum","de":"bemerken, wahrnehmen","note":"aus: animum ad … vertere (wörtl.: „den Geist hinwenden zu …“)","pos":"Verb"},{"la":"cedere","forms":"cedo 3, cessi, cessum","de":"weggehen, weichen","note":"vgl. Rezession (= Rückgang der Wirtschaft)","pos":"Verb"},{"la":"claudere","forms":"claudo 3, clausi, clausum","de":"einschließen; schließen","note":"ital. chiudere; vgl. Klausur, Numerus clausus","pos":"Verb"},{"la":"custos","forms":"custodis m.","de":"Wächter","note":"ital. custode; vgl. Küster (= Kirchendiener)","pos":"Nomen"},{"la":"ponere","forms":"pono 3, posui, positum","de":"stellen, legen","note":"engl. to put, span. poner; vgl. Position (= Lage)","pos":"Verb"},{"la":"enim","forms":"(nachgestellt!)","de":"denn, nämlich","note":"z. B. tu enim = nam tu („denn du“)","pos":"Konjunktion"},{"la":"auferre","forms":"aufero, aufers, abstuli, ablatum","de":"wegtragen, wegnehmen","note":"aus: ab + ferre (= davontragen); vgl. „Ablativ“ (drückt eine Trennung aus!)","pos":"Verb"},{"la":"serva","forms":"servae f.","de":"Sklavin","note":"vgl. servus, -i","pos":"Nomen"}],"grammar":[{"title":"Passive Präsensstammformen","blocks":[{"type":"text","text":"Die passiven Formen des Präsensstammes (Präsens passiv, Imperfekt passiv, Futur passiv) sind einteilig. Sie werden gebildet, indem die aktiven Präsensstammendungen durch die folgenden passiven Personalendungen ersetzt werden:"},{"type":"table","headers":["","Aktiv Sg.","Passiv Sg.","Aktiv Pl.","Passiv Pl."],"rows":[["1.P.","-o / -m","-(o)r","-mus","-mur"],["2.P.","-s","-ris","-tis","-mini"],["3.P.","-t","-tur","-nt","-ntur"]]},{"type":"text","text":"Präsens passiv:"},{"type":"table","headers":["","a-Konj.","kons. Konj."],"rows":[["Sg. 1.P.","amor „ich werde geliebt“","mittor „ich werde geschickt“"],["Sg. 2.P.","amaris „du wirst geliebt“","mitteris „du wirst geschickt“"],["Sg. 3.P.","amatur „er/sie/es wird geliebt“","mittitur „er/sie/es wird geschickt“"],["Pl. 1.P.","amamur „wir werden geliebt“","mittimur „wir werden geschickt“"],["Pl. 2.P.","amamini „ihr werdet geliebt“","mittimini „ihr werdet geschickt“"],["Pl. 3.P.","amantur „sie werden geliebt“","mittuntur „sie werden geschickt“"]]},{"type":"text","text":"Imperfekt passiv:"},{"type":"table","headers":["","a-Konj.","kons. Konj."],"rows":[["Sg. 1.P.","amabar „ich wurde geliebt“","mittebar „ich wurde geschickt“"],["Sg. 2.P.","amabaris „du wurdest geliebt“","mittebaris „du wurdest geschickt“"],["Sg. 3.P.","amabatur „er/sie/es wurde geliebt“","mittebatur „er/sie/es wurde geschickt“"],["Pl. 1.P.","amabamur „wir wurden geliebt“","mittebamur „wir wurden geschickt“"],["Pl. 2.P.","amabamini „ihr wurdet geliebt“","mittebamini „ihr wurdet geschickt“"],["Pl. 3.P.","amabantur „sie wurden geliebt“","mittebantur „sie wurden geschickt“"]]},{"type":"text","text":"Futur passiv:"},{"type":"table","headers":["","a-Konj.","kons. Konj."],"rows":[["Sg. 1.P.","amabor „ich werde geliebt werden“","mittar „ich werde geschickt werden“"],["Sg. 2.P.","amaberis „du wirst geliebt werden“","mitteris „du wirst geschickt werden“"],["Sg. 3.P.","amabitur „er/sie/es wird geliebt werden“","mittetur „er/sie/es wird geschickt werden“"],["Pl. 1.P.","amabimur „wir werden geliebt werden“","mittemur „wir werden geschickt werden“"],["Pl. 2.P.","amabimini „ihr werdet geliebt werden“","mittemini „ihr werdet geschickt werden“"],["Pl. 3.P.","amabuntur „sie werden geliebt werden“","mittentur „sie werden geschickt werden“"]]},{"type":"note","text":"Bei der Übersetzung der Passivformen musst du im Deutschen auf die Verwechslungsgefahr mit dem aktiven Futur aufpassen: audiam → Futur aktiv: „ich werde hören“; audior → Präsens passiv: „ich werde gehört“; audiar → Futur passiv: „ich werde gehört werden“."},{"type":"tip","text":"Zur Unterscheidung von Aktiv und Passiv solltest du dir einprägen: AKTIV → ich tue etwas; PASSIV → mit mir geschieht etwas."}]}]},{"number":21,"title":"De Paridis iudicio","unit":"Der Trojanische Krieg","klasse":6,"vocab":[{"la":"praeter (+ Akk.)","forms":"","de":"außer","note":"","pos":"Präposition"},{"la":"discordia","forms":"discordiae f.","de":"Zwietracht, Streit","note":"ital. + span. discordia; ↔ concordia","pos":"Nomen"},{"la":"controversia","forms":"controversiae f.","de":"Auseinandersetzung","note":"vgl. Kontroverse; aus: contra + vertere!","pos":"Nomen"},{"la":"iacere","forms":"iacio M, ieci, iactum","de":"werfen, schleudern","note":"vgl. projizieren, Projektor","pos":"Verb"},{"la":"Venus","forms":"Veneris f.","de":"Venus","note":"Göttin der Liebe (griech.: Aphrodite)","pos":"Nomen"},{"la":"certare","forms":"certo 1, -avi, -atum","de":"1) streiten; 2) wetteifern","note":"vgl. Kon-zert","pos":"Verb"},{"la":"iudicare","forms":"iudico 1, -avi, -atum","de":"1) urteilen, beurteilen; 2) richten","note":"vgl. iudicium, -i","pos":"Verb"},{"la":"deligere","forms":"deligo 3, -legi, -lectum","de":"auswählen","note":"vgl. engl. election (= Wahl)","pos":"Verb"},{"la":"praemium","forms":"praemii n.","de":"Belohnung, Preis","note":"Prämie, prämieren","pos":"Nomen"},{"la":"praeterea (Adv.)","forms":"","de":"außerdem","note":"aus: praeter + ea (wörtl.: „außer diesem“)","pos":"Adverb"},{"la":"dives (m./f./n.)","forms":"divitis (2.F.)","de":"reich","note":"vgl. divitiae, -arum","pos":"Adjektiv"},{"la":"fortitudo","forms":"fortitudinis f.","de":"Tapferkeit","note":"vgl. fortis/e","pos":"Nomen"},{"la":"quia","forms":"","de":"weil","note":"= quod (Einleitung eines Kausalsatzes)","pos":"Konjunktion"},{"la":"Graecia","forms":"Graeciae f.","de":"Griechenland","note":"↔ Graeci, -orum","pos":"Nomen"},{"la":"decernere","forms":"decerno 3, decrevi, decretum","de":"beschließen","note":"vgl. Dekret (= amtlicher Beschluss)","pos":"Verb"},{"la":"eo (Adv.)","forms":"","de":"dorthin","note":"","pos":"Adverb"},{"la":"fides","forms":"fidei f.","de":"Treue, Vertrauen (hier: Schutz)","note":"ital. fede","pos":"Nomen"},{"la":"mandare","forms":"mando 1, -avi, -atum","de":"anvertrauen","note":"vgl. Mandant; eigentl.: in manum dare","pos":"Verb"},{"la":"occasio","forms":"occasionis f.","de":"Gelegenheit","note":"engl. occasion, frz. occasion, span. ocasión","pos":"Nomen"},{"la":"iungere","forms":"iungo 3, iunxi, iunctum","de":"verbinden","note":"vgl. con-iungere","pos":"Verb"},{"la":"maritus","forms":"mariti m.","de":"Gatte, Ehemann","note":"frz. mari, ital. marito, span. marido","pos":"Nomen"},{"la":"aut … aut","forms":"","de":"entweder … oder","note":"","pos":"Konjunktion"},{"la":"eiusmodi","forms":"(= huiusmodi)","de":"derartig","note":"wörtl.: „dieser Art“; vgl. modus, Lec. 12","pos":"Sonstiges"},{"la":"Troia","forms":"Troiae f.","de":"Troja","note":"","pos":"Nomen"},{"la":"sive – sive","forms":"(= seu – seu)","de":"sei es (dass) – sei es (dass)","note":"Aus dem Vokabelverzeichnis","pos":"Konjunktion"}],"grammar":[{"title":"Überblick über die lateinische Zeitenbildung (Indikativ)","blocks":[{"type":"text","text":"A) Präsensstamm:"},{"type":"table","headers":["","Aktiv","Passiv"],"rows":[["Präsens","Sg.: -o, -s, -t; Pl.: -mus, -tis, -nt","Sg.: -or, -ris, -tur; Pl.: -mur, -mini, -ntur"],["Imperfekt","Sg.: -bam, -bas, -bat; Pl.: -bamus, -batis, -bant","Sg.: -bar, -baris, -batur; Pl.: -bamur, -bamini, -bantur"],["Futur (a- und e-Konjugation)","Sg.: -bo, -bis, -bit; Pl.: -bimus, -bitis, -bunt","Sg.: -bor, -beris, -bitur; Pl.: -bimur, -bimini, -buntur"],["Futur (übrige Konjugationen)","Sg.: -am, -es, -et; Pl.: -emus, -etis, -ent","Sg.: -ar, -eris, -etur; Pl.: -emur, -emini, -entur"]]},{"type":"text","text":"B) Perfektstamm:"},{"type":"table","headers":["","Aktiv","Passiv"],"rows":[["Perfekt","Sg.: -i, -isti, -it; Pl.: -imus, -istis, -erunt","Sg.: PPP + sum, es, est; Pl.: PPP + sumus, estis, sunt"],["Plusquamperfekt","Sg.: -eram, -eras, -erat; Pl.: -eramus, -eratis, -erant","Sg.: PPP + eram, eras, erat; Pl.: PPP + eramus, eratis, erant"]]}]},{"title":"Adverbia (Umstandswörter)","blocks":[{"type":"list","items":["Adjektiva bestimmen ein Nomen näher: Miles fortis pugnat. = „Der tapfere Soldat kämpft.“ (Frage: Was für ein Soldat kämpft?)","Adverbia bestimmen ein Verb (ad verbum = „zum Verb“!) näher: Miles fortiter pugnat. = „Der Soldat kämpft tapfer.“ (Frage: Auf welche Weise kämpft er?)"]},{"type":"text","text":"a) Die Bildung des Adverbs in der Grundstufe ist abhängig von der Deklination des Adjektivs:"},{"type":"table","headers":["","Adjektiv","Adverb"],"rows":[["Adj. der a-/o-Dekl. → -e","certus, certa, certum","certe („sicher“)"],["Adj. der a-/o-Dekl. → -e","pulcher, pulchra, pulchrum","pulchre („schön“)"],["Adj. der 3. Dekl. → -iter","fortis, forte","fortiter („tapfer“)"],["Adj. der 3. Dekl. → -iter","atrox, atrocis","atrociter („wild“)"],["Adj. der 3. Dekl. → -iter","celer, celeris, celere","celeriter („schnell“)"],["Adj. auf -ns → -nter","prudens, prudentis","prudenter („klug“)"]]},{"type":"note","text":"Beachte folgende Ausnahmen: bonus → bene; facilis → facile."},{"type":"text","text":"b) Bildung im Komparativ: Stamm der Grundstufe + -ius: certius („sicherer“), pulchrius („schöner“), fortius („tapferer“), atrocius („wilder“), facilius („leichter“) etc. – z. B.: Miles fortius pugnavit. = „Der Soldat kämpfte tapferer (ziemlich tapfer).“"},{"type":"text","text":"c) Bildung im Superlativ: Superlativstamm + -e:"},{"type":"list","items":["certe → certissime („am sichersten“)","fortis → fortissime („am tapfersten“)","atrox → atrocissime („am wildesten“)","pulcher → pulcherrime („am schönsten“)","facilis → facillime („am leichtesten“)"]},{"type":"text","text":"z. B.: Miles fortissime pugnavit. = „Der Soldat kämpfte am tapfersten (sehr tapfer).“"},{"type":"note","text":"Neben den Adverbia, die von Adjektiva abgeleitet sind, gibt es auch zahlreiche Einzeladverbia: z. B. mox („bald“), statim („sofort“), olim („einst“), iterum („wieder“) etc."}]}]},{"number":22,"title":"De ira Achillis","unit":"Der Trojanische Krieg","klasse":6,"vocab":[{"la":"ira","forms":"irae f.","de":"Zorn","note":"ital. + span. ira; vgl. iratus/a/um","pos":"Nomen"},{"la":"moenia (Pl.)","forms":"moenium n. (3. Dekl.)","de":"(Stadt-)Mauern","note":"","pos":"Nomen"},{"la":"altus/a/um","forms":"","de":"1) hoch; 2) tief","note":"ital. alto; vgl. Altstimme (tiefe Frauenstimme)","pos":"Adjektiv"},{"la":"ut (+ Konj.)","forms":"","de":"dass; damit; sodass","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"Troiani (Pl.)","forms":"Troianorum m.","de":"die Trojaner","note":"","pos":"Nomen"},{"la":"tenere","forms":"teneo 2, tenui, –","de":"halten","note":"ital. tenere, span. tener","pos":"Verb"},{"la":"abstinere","forms":"abstineo 2, abstinui, –","de":"(sich) fernhalten (von)","note":"vgl. abstinent (= enthaltsam)","pos":"Verb"},{"la":"imperium","forms":"imperii n.","de":"1) Befehl; 2) Herrschaft; 3) Reich","note":"engl. empire, frz. empire; vgl. Imperativ, Imperialismus (= Streben nach Weltmacht)","pos":"Nomen"},{"la":"obtinere","forms":"obtineo 2, obtinui, –","de":"innehaben, besitzen","note":"engl. to obtain","pos":"Verb"},{"la":"incendere","forms":"incendo 3, incendi, incensum","de":"anzünden","note":"","pos":"Verb"},{"la":"ne (+ Konj.)","forms":"","de":"dass nicht; damit nicht","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"putare","forms":"puto 1, putavi, -atum","de":"1) glauben; 2) halten für","note":"puto te amicum = „ich halte dich für einen Freund“","pos":"Verb"},{"la":"interesse (+ Dat.)","forms":"intersum, interfui, –","de":"beiwohnen, teilnehmen (an)","note":"vgl. Interesse (geistig bei etwas dabei sein)","pos":"Sonstiges"},{"la":"complures (m./f.)","forms":"complura (n.)","de":"mehrere","note":"↔ plurimi/ae/a = „die meisten“","pos":"Adjektiv"},{"la":"caedere","forms":"caedo 3, cecidi, caesum","de":"(fällen =) töten","note":"vgl. caedes, -is","pos":"Verb"},{"la":"deponere","forms":"depono 3, deposui, depositum","de":"ablegen, weglegen","note":"vgl. deponieren, Deponie","pos":"Verb"},{"la":"equus","forms":"equi m.","de":"Pferd","note":"","pos":"Nomen"},{"la":"trahere","forms":"traho 3, traxi, tractum","de":"ziehen","note":"vgl. Traktor, subtrahieren („ab-ziehen“)","pos":"Verb"},{"la":"magis (Adv.)","forms":"","de":"mehr","note":"vgl. magister (wörtl.: einer, der „mehr“ ist)","pos":"Adverb"},{"la":"preces (Pl.)","forms":"precum f. (3. Dekl.)","de":"die Bitten","note":"vgl. ital. pregare","pos":"Nomen"},{"la":"aurum","forms":"auri n.","de":"Gold","note":"chem. Zeichen für Gold = Au","pos":"Nomen"},{"la":"frater","forms":"fratris m.","de":"Bruder","note":"frz. frère, ital. fratello","pos":"Nomen"},{"la":"Apollo","forms":"Apollinis m.","de":"Apoll","note":"griech.-röm. Gott der Weissagekunst","pos":"Nomen"}],"grammar":[{"title":"Konjunktiv Präsens und Imperfekt","blocks":[{"type":"text","text":"Anders als im Deutschen existieren im Lateinischen vier Konjunktive mit unterschiedlichen Funktionen, nämlich für das Präsens, Imperfekt, Perfekt und Plusquamperfekt."},{"type":"text","text":"a) Konjunktiv Präsens:"},{"type":"list","items":["Erkennungszeichen: -a- (Ausnahme a-Konjugation: -e-).","Endungen: die üblichen des Präsensstammes: -m/-s/-t, -mus/-tis/-nt (Passiv: -r/-ris/-tur etc.)"]},{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj.","esse","posse"],"rows":[["Sg. 1.P.","amem","moneam","mittam","audiam","capiam","sim","possim"],["Sg. 2.P.","ames","moneas","mittas","audias","capias","sis","possis"],["Pl. 3.P.","ament","moneant","mittant","audiant","capiant","sint","possint"]]},{"type":"note","text":"Der Konjunktiv Präsens der a-Konjugation schaut auf ersten Blick wie ein Indikativ der e-Konjugation aus: ames (Konjunktiv von amare) ↔ debes (Indikativ von debēre)."},{"type":"text","text":"b) Konjunktiv Imperfekt:"},{"type":"list","items":["Erkennungszeichen: die Form enthält (auch im Passiv!) den aktiven Infinitiv Präsens.","Endungen: die üblichen des Präsensstammes: -m/-s/-t, -mus/-tis/-nt (Passiv: -r/-ris/-tur etc.)"]},{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj.","esse","posse"],"rows":[["Sg. 1.P.","amarem","monerem","mitterem","audirem","caperem","essem","possem"],["Sg. 2.P.","amares","moneres","mitteres","audires","caperes","esses","posses"],["Pl. 3.P.","amarent","monerent","mitterent","audirent","caperent","essent","possent"]]}]},{"title":"Konjunktivische ut-Sätze","blocks":[{"type":"text","text":"Der Konjunktiv hat in lateinischen Gliedsätzen eine gänzlich andere Funktion als im Deutschen: Er zeigt nämlich an, welche Bedeutung das einleitende Bindewort hat. Während ut mit Indikativ die Bedeutungen „wie“ oder „als“ hat (z. B. Ut scis, te amo. = „Wie du weißt, liebe ich dich.“), kann es mit Konjunktiv drei verschiedene Bedeutungen haben:"},{"type":"text","text":"a) „dass“ (begehrendes ut) – Verneinung: ne („dass nicht“)"},{"type":"list","items":["Peto, ut ad me venias. = „Ich bitte dich, dass du zu mir kommst (… zu mir zu kommen).“","Petivi, ut ad me venires. = „Ich bat dich, dass du zu mir komm(e)st (… zu mir zu kommen).“"]},{"type":"text","text":"b) „damit“ (bezweckendes/finales ut) – Verneinung: ne („damit nicht“)"},{"type":"list","items":["Domi maneo, ut dormiam. = „Ich bleibe zu Hause, damit ich schlafe (… um zu schlafen).“","Domi mansi, ut dormirem. = „Ich blieb zu Hause, damit ich schlief (… um zu schlafen).“"]},{"type":"tip","text":"Begehrende und bezweckende ut-Sätze solltest du im Deutschen nach Möglichkeit immer als Infinitivgruppe („zu …“ bzw. „um … zu“) wiedergeben."},{"type":"text","text":"c) „(so)dass“ (folgerndes/konsekutives ut) – Verneinung: ut non („sodass nicht“)"},{"type":"list","items":["Dormis, ut me non audias. = „Du schläfst, sodass du mich nicht hörst.“","Dormiebas, ut me non audires. = „Du schliefst, sodass du mich nicht hörtest.“"]},{"type":"note","text":"Ob im ut-Satz der Konjunktiv Präsens oder Imperfekt steht, hängt von der Zeit des übergeordneten Satzes ab: Gegenwart → Konj. Präsens; Vergangenheit → Konj. Imperfekt."}]},{"title":"Doppelter Akkusativ","blocks":[{"type":"text","text":"Manche Verben ändern ihre Bedeutung, wenn sie mit zwei Akkusativen verbunden sind:"},{"type":"list","items":["putare (eigtl. „glauben“) + doppelter Akkusativ = „halten … für“: Te amicum bonum puto. = „Ich halte dich für einen guten Freund.“","dicere (eigtl. „sagen“) + doppelter Akkusativ = „nennen“: Quintus Iuliam amicam dicit. = „Quintus nennt Julia eine Freundin.“","vocare (eigtl. „rufen“) + doppelter Akkusativ = „nennen“: Iulia Quintum puerum stultum vocat. = „Julia nennt Quintus einen Dummkopf.“"]}]}]},{"number":23,"title":"De equo Troiano","unit":"Der Trojanische Krieg","klasse":6,"vocab":[{"la":"Troianus/a/um","forms":"","de":"trojanisch","note":"↔ Troiani, -orum","pos":"Adjektiv"},{"la":"Ulixes","forms":"Ulixis m.","de":"Odysseus","note":"vgl. James Joyces Roman „Ulysses“","pos":"Nomen"},{"la":"etsi","forms":"","de":"wenn auch, obwohl","note":"","pos":"Konjunktion"},{"la":"firmus/a/um","forms":"","de":"stark","note":"vgl. Firmung (= „Stärkung“ im Glauben)","pos":"Adjektiv"},{"la":"numquam (Adv.)","forms":"","de":"niemals","note":"span. nunca","pos":"Adverb"},{"la":"includere","forms":"includo 3, inclusi, inclusum","de":"einschließen","note":"vgl. inkludieren; inklusive","pos":"Verb"},{"la":"cum (+ Konj.)","forms":"","de":"1) als; 2) weil; 3) obwohl","note":"(siehe Grammatica)","pos":"Sonstiges"},{"la":"apparere","forms":"appareo 2, apparui, –","de":"erscheinen","note":"engl. to appear, ital. apparire, span. aparecer","pos":"Verb"},{"la":"intra (+ Akk.)","forms":"","de":"innerhalb","note":"vgl. intravenös, intramuskulär etc.","pos":"Präposition"},{"la":"favere (+ Dat.)","forms":"faveo 2, favi, fautum","de":"begünstigen, bevorzugen","note":"vgl. favorisieren","pos":"Verb"},{"la":"arx","forms":"arcis f.","de":"Burg","note":"↔ ars, artis","pos":"Nomen"},{"la":"victoria","forms":"victoriae f.","de":"Sieg","note":"engl. victory, frz. victoire, ital. vittoria, span. victoria","pos":"Nomen"},{"la":"vinum","forms":"vini n.","de":"Wein","note":"frz. vin, ital. + span. vino","pos":"Nomen"},{"la":"celebrare","forms":"celebro 1, -avi, -atum","de":"feiern","note":"vgl. zelebrieren, engl. celebrities","pos":"Verb"},{"la":"universi/ae/a","forms":"","de":"alle (gemeinsam)","note":"ital. universale; vgl. universal, Universum","pos":"Adjektiv"},{"la":"interea (Adv.)","forms":"","de":"inzwischen","note":"aus: inter + ea = „zwischen diesen (Dingen)“","pos":"Adverb"},{"la":"redire","forms":"redeo, redii, reditum","de":"zurückkehren","note":"↔ reddere 3, reddidi, redditum","pos":"Verb"},{"la":"aperire","forms":"aperio 4, aperui, apertum","de":"öffnen","note":"frz. ouvrir, ital. aprire, span. abrir; vgl. Aperitif","pos":"Verb"},{"la":"flamma","forms":"flammae f.","de":"Flamme","note":"ital. fiamma (fiammifero = Streichholz)","pos":"Nomen"},{"la":"consumere","forms":"consumo 3, consumpsi, consumptum","de":"1) vernichten; 2) verbrauchen","note":"vgl. konsumieren, Konsument, Konsum","pos":"Verb"}],"grammar":[{"title":"Konjunktiv Perfekt und Plusquamperfekt","blocks":[{"type":"text","text":"Im Gegensatz zum Konjunktiv Präsens und Imperfekt werden diese beiden Konjunktive vom Perfektstamm gebildet. Dementsprechend ist das Passiv, wie jede Form des passiven Perfektstammes, zweiteilig."},{"type":"text","text":"a) Konjunktiv Perfekt:"},{"type":"list","items":["Aktiv: aktiver Perfektstamm + -erim, -eris, -erit (Sg.) bzw. -erimus, -eritis, -erint (Pl.)","Passiv: PPP + sim, sis, sit (Sg.) bzw. simus, sitis, sint (Pl.)"]},{"type":"table","headers":["","a-Konj. Aktiv","a-Konj. Passiv","e-Konj. Aktiv","e-Konj. Passiv"],"rows":[["Sg. 1.P.","amaverim","amatus/a sim","monuerim","monitus/a sim"],["Sg. 2.P.","amaveris","amatus/a sis","monueris","monitus/a sis"],["Pl. 3.P.","amaverint","amati/ae sint","monuerint","moniti/ae sint"]]},{"type":"text","text":"b) Konjunktiv Plusquamperfekt:"},{"type":"list","items":["Aktiv: Perfektstamm + -issem, -isses, -isset (Sg.) bzw. -issemus, -issetis, -issent (Pl.)","Passiv: PPP + essem, esses, esset (Sg.) bzw. essemus, essetis, essent (Pl.)"]},{"type":"table","headers":["","a-Konj. Aktiv","a-Konj. Passiv","e-Konj. Aktiv","e-Konj. Passiv"],"rows":[["Sg. 1.P.","amavissem","amatus/a essem","monuissem","monitus/a essem"],["Sg. 2.P.","amavisses","amatus/a esses","monuisses","monitus/a esses"],["Pl. 3.P.","amavissent","amati/ae essent","monuissent","moniti/ae essent"]]}]},{"title":"Konjunktivische cum-Sätze","blocks":[{"type":"text","text":"Wie bei ut zeigt auch beim Bindewort cum der Konjunktiv lediglich an, dass cum eine andere als die gewohnte Bedeutung (cum + Indikativ: „wenn“, „sooft“, „als“) hat. Darüber hinaus kannst du aus der Art des Konjunktivs ablesen, welches Zeitverhältnis der Gliedsatz zum Hauptsatz hat (Konj. Präsens und Imperfekt → gleichzeitig, Konj. Perfekt/Plqpf. → vorzeitig)."},{"type":"text","text":"a) „als“, „nachdem“, „während“ (zeitlich/temporal)"},{"type":"list","items":["Cum dormirem, de te somniabam. = „Als/während ich schlief, träumte ich von dir.“","Cum dormivissem, pensa feci. = „Nachdem ich geschlafen hatte, machte ich die Aufgaben.“"]},{"type":"text","text":"b) „weil“ (begründend/kausal)"},{"type":"list","items":["Cum mihi placeas, tibi rosam dono. = „Weil du mir gefällst, schenke ich dir eine Rose.“","Cum mihi placeres, tibi rosam donavi. = „Weil du mir gefielst, schenkte ich dir eine Rose.“"]},{"type":"text","text":"c) „obwohl“ (einschränkend/konzessiv; oft im Hauptsatz mit tamen = „dennoch“!)"},{"type":"list","items":["Cum te amarem, te (tamen) reliqui. = „Obwohl ich dich liebte, habe ich dich (dennoch) verlassen.“","Cum te olim amaverim, nunc aliam puellam amo. = „Obwohl ich dich einst geliebt habe, liebe ich jetzt ein anderes Mädchen.“"]},{"type":"note","text":"In cum-Sätzen darfst du den Konjunktiv nicht übersetzen, sondern musst ihn als Indikativ wiedergeben."},{"type":"tip","text":"Als Erstübersetzung für cum ist „als“ meistens gut brauchbar!"}]}]},{"number":24,"title":"De Cassandra","unit":"Der Trojanische Krieg","klasse":6,"vocab":[{"la":"velle","forms":"volo, vis, volui, –","de":"wollen","note":"(siehe Grammatica); frz. vouloir, ital. volere","pos":"Verb"},{"la":"nolle","forms":"nolo, non vis, nolui, –","de":"nicht wollen","note":"(siehe Grammatica)","pos":"Verb"},{"la":"Noli me tangere!","forms":"(Verbot mit noli)","de":"Berühr mich nicht!","note":"Das sagte Jesus nach seiner Auferstehung zu Maria Magdalena.","pos":"Sonstiges"},{"la":"verus/a/um","forms":"","de":"wahr, echt","note":"frz. vrai, ital. vero, span. verdadero","pos":"Adjektiv"},{"la":"promittere","forms":"promitto 3, promisi, promissum","de":"versprechen","note":"engl. to promise, frz. promettre, ital. promettere, span. prometer","pos":"Verb"},{"la":"sperare","forms":"spero 1, -avi, -atum","de":"hoffen, erhoffen","note":"frz. espérer, ital. sperare, span. esperar","pos":"Verb"},{"la":"praebere","forms":"praebeo 2, -ui, -itum","de":"bieten, anbieten, geben","note":"","pos":"Verb"},{"la":"scientia","forms":"scientiae f.","de":"Wissen, Kenntnis","note":"vgl. scire; engl. science, frz. science, ital. scienza, span. ciencia","pos":"Nomen"},{"la":"usus","forms":"usus m.","de":"1) Nutzen; 2) Gebrauch","note":"engl. use, frz. utilité; vgl. „es ist Usus“","pos":"Nomen"},{"la":"usui esse","forms":"(Zweckdativ)","de":"nützlich sein","note":"wörtl. = „zum Nutzen sein“","pos":"Sonstiges"},{"la":"veritas","forms":"veritatis f.","de":"Wahrheit","note":"frz. vérité, ital. verità, span. verdad","pos":"Nomen"},{"la":"credere","forms":"credo 3, credidi, creditum","de":"glauben","note":"ital. credere; vgl. Credo, Kredit (Gläubiger!)","pos":"Verb"},{"la":"inde (Adv.)","forms":"","de":"1) von da an; 2) von dort","note":"","pos":"Adverb"},{"la":"ardere","forms":"ardeo 2, arsi, –","de":"brennen","note":"vgl. ital. ardente, span. ardiente = brennend","pos":"Verb"},{"la":"tacere","forms":"taceo 2, -ui, –","de":"schweigen","note":"frz. taire, ital. tacere","pos":"Verb"},{"la":"interire","forms":"intereo, interii, interitum","de":"sterben, untergehen","note":"","pos":"Verb"},{"la":"errare","forms":"erro 1, -avi, -atum","de":"irren, sich irren","note":"ital. errare; vgl. engl. error","pos":"Verb"},{"la":"tollere","forms":"tollo 3, sustuli, sublatum","de":"aufheben, (er)heben","note":"↔ tolerare 1 = ertragen","pos":"Verb"},{"la":"orare","forms":"oro 1, -avi, -atum","de":"1) (er)bitten; 2) beten","note":"ital. orare, span. orar; vgl. Oratorium","pos":"Verb"}],"grammar":[{"title":"velle/nolle („wollen“/„nicht wollen“)","blocks":[{"type":"text","text":"Die Modalverba velle („wollen“) und nolle („nicht wollen“) werden im Präsensstamm unregelmäßig abgewandelt."},{"type":"table","headers":["","velle","nolle"],"rows":[["Sg. 1.P.","volo","nolo"],["Sg. 2.P.","vis","non vis"],["Sg. 3.P.","vult","non vult"],["Pl. 1.P.","volumus","nolumus"],["Pl. 2.P.","vultis","non vultis"],["Pl. 3.P.","volunt","nolunt"],["Infinitiv","velle","nolle"],["Imperativ","–","noli! / nolite!"]]},{"type":"text","text":"noli(te) wird verwendet, um ein Verbot an die 2. Person auszudrücken (siehe unten)."},{"type":"note","text":"vis ist doppeldeutig: a) 2.P. Sg. Präsens von velle = „du willst“; b) Nom. Sg. von vis, vim, vi = „die Kraft“."},{"type":"text","text":"Die Formen der übrigen Zeiten sind regelmäßig:"},{"type":"list","items":["Imperfekt: volebam/nolebam …","Futur: volam/nolam, voles/noles …","Perfekt: volui/nolui …","Plqpf.: volueram/nolueram …"]}]},{"title":"Verbot mit noli + Infinitiv","blocks":[{"type":"text","text":"Eine der Möglichkeiten, im Lateinischen ein Verbot auszudrücken, ist die Verwendung von noli (Sg.) bzw. nolite (Pl.) mit einem Infinitiv:"},{"type":"list","items":["Sg.: Noli equum in oppidum trahere! = „Zieh das Pferd nicht in die Stadt!“ (wörtl.: „Wolle das Pferd nicht in die Stadt ziehen!“)","Pl.: Nolite equum in oppidum trahere! = „Zieht das Pferd nicht in die Stadt!“ (wörtl.: „Wollet das Pferd nicht in die Stadt ziehen!“)"]}]},{"title":"Indirekte Fragesätze","blocks":[{"type":"text","text":"Indirekte Fragen unterscheiden sich von direkten dadurch, dass sie von einem anderen Verbum (z. B. des Fragens oder Wissens) abhängen:"},{"type":"list","items":["direkte Frage: „Wie spät ist es?“ (→ mit Fragezeichen)","indirekte Frage: Ich frage dich / Ich weiß nicht, wie spät es ist. (→ ohne Fragezeichen)"]},{"type":"text","text":"Im Lateinischen muss in indirekten Fragesätzen (im Gegensatz zum Deutschen) der Konjunktiv stehen. Welcher, das wird durch die sogenannte Consecutio temporum (Zeitenfolge) geregelt:"},{"type":"table","headers":["Der übergeordnete Satz steht im …","gleichzeitig (glz.)","vorzeitig (vz.)","nachzeitig (nz.)"],"rows":[["Präsens, Futur","Konj. Präsens","Konj. Perfekt","-urus sim (sis …)"],["Imperfekt, Perfekt","Konj. Imperfekt","Konj. Plqpf.","-urus essem (esses …)"]]},{"type":"text","text":"Die Formen -urus sim und -urus essem
