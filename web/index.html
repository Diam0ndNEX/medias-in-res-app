bestehen aus dem Futurpartizip und dem Konj. Präsens bzw. Imperfekt von esse. Sie bilden eine Art Futur-Konjunktiv und werden ausschließlich in nachzeitigen Gliedsätzen verwendet."},{"type":"text","text":"Beispiel für die Consecutio temporum anhand indirekter Fragesätze:"},{"type":"table","headers":["Lateinisch","Deutsch","Zeitverhältnis"],"rows":[["Interrogo te, quid facias.","„Ich frage dich, was du machst.“","glz."],["Interrogo te, quid feceris.","„Ich frage dich, was du gemacht hast.“","vz."],["Interrogo te, quid facturus/a sis.","„Ich frage dich, was du machen wirst.“","nz."],["Interrogavi te, quid faceres.","„Ich fragte dich, was du machtest.“","glz."],["Interrogavi te, quid fecisses.","„Ich fragte dich, was du gemacht hattest.“","vz."],["Interrogavi te, quid facturus/a esses.","„Ich fragte dich, was du machen wirst.“","nz."]]},{"type":"tip","text":"Gib den Konjunktiv beim Übersetzen zunächst in der entsprechenden Zeit des Indikativs wieder!"},{"type":"note","text":"Die Consecutio temporum gilt für folgende Gliedsätze: ut-Sätze (→ immer gleichzeitig); cum-Sätze (→ gleich- oder vorzeitig); indirekte Fragesätze (→ gleich-, vor- oder nachzeitig)."}]}]},{"number":25,"title":"De Ulixe","unit":"Der Trojanische Krieg","klasse":6,"vocab":[{"la":"poeta","forms":"poetae m.","de":"Dichter","note":"Poet; frz. poète, ital. + span. poeta","pos":"Nomen"},{"la":"pervenire","forms":"pervenio 4, perveni, perventum","de":"kommen, gelangen","note":"wörtl.: „durchkommen“","pos":"Verb"},{"la":"inire","forms":"ineo, inii, initum","de":"hineingehen, betreten","note":"vgl. etwas initiieren (= in Angriff nehmen), Initiative, Initialen (= Anfangsbuchstaben)","pos":"Verb"},{"la":"exitus","forms":"exitus m.","de":"1) Ausgang; 2) Ende, Tod","note":"engl. exit","pos":"Nomen"},{"la":"dulcis/e","forms":"","de":"süß","note":"frz. doux/douce, ital. dolce (= Nachspeise)","pos":"Adjektiv"},{"la":"forte (Adv.)","forms":"","de":"zufällig","note":"↔ fortis/e","pos":"Adverb"},{"la":"postulare","forms":"postulo 1, -avi, -atum","de":"fordern","note":"vgl. postulieren, Postulat (= Forderung)","pos":"Verb"},{"la":"gratia","forms":"gratiae f.","de":"Dank","note":"ital. grazie, span. gracias; vgl. gratis (Abl.): „um den (bloßen) Dank“","pos":"Nomen"},{"la":"gratias agere","forms":"","de":"danken, Dank sagen","note":"wörtl.: „Dank tun“","pos":"Sonstiges"},{"la":"tandem","forms":"","de":"endlich, schließlich","note":"= postremo, denique; ↔ tamen","pos":"Adverb"},{"la":"plenus/a/um","forms":"(+ Gen.)","de":"voll (mit/von)","note":"frz. plein, ital. pieno, span. lleno; vgl. das Plenum (= die Vollversammlung)","pos":"Adjektiv"},{"la":"ignis","forms":"ignis m.","de":"Feuer","note":"","pos":"Nomen"},{"la":"sumere","forms":"sumo 3, sumpsi, sumptum","de":"nehmen","note":"vgl. consumere","pos":"Verb"},{"la":"frons","forms":"frontis f.","de":"Stirn","note":"ital. fronte, span. frente; vgl. Front, frontal","pos":"Nomen"},{"la":"laedere","forms":"laedo 3, laesi, laesum","de":"verletzen","note":"vgl. lädiert","pos":"Verb"},{"la":"vero","forms":"","de":"aber","note":"↔ verus/a/um (Adjektiv)","pos":"Adverb"},{"la":"constat","forms":"constitit, –","de":"es steht fest (+ ACI: dass)","note":"vgl. konstant, Konstante (= unveränderbarer Wert)","pos":"Verb"},{"la":"posterus/a/um","forms":"","de":"folgend, nachfolgend","note":"","pos":"Adjektiv"},{"la":"postero die","forms":"(Zeitablativ)","de":"am folgenden Tag","note":"","pos":"Sonstiges"},{"la":"diligens (m./f./n.)","forms":"diligentis (2.F.)","de":"sorgfältig, genau","note":"engl. diligent, ital. + span. diligente","pos":"Adjektiv"},{"la":"prodesse","forms":"prosum, prodes, profui, –","de":"nützen","note":"vgl. Prosit! (= „Es soll dir nützen!“)","pos":"Verb"}],"grammar":[{"title":"Infinitiv Perfekt","blocks":[{"type":"text","text":"Die Perfektinfinitive werden vom Perfektstamm gebildet:"},{"type":"list","items":["Infinitiv Perfekt Aktiv: aktiver Perfektstamm + -isse","Infinitiv Perfekt Passiv: passiver Perfektstamm (PPP) + esse"]},{"type":"table","headers":["","Infinitiv Perfekt aktiv","Infinitiv Perfekt passiv"],"rows":[["a-Konjugation","amav-isse „geliebt (zu) haben“","amatum esse „geliebt worden (zu) sein“"],["e-Konjugation","monu-isse „ermahnt (zu) haben“","monitum esse „ermahnt worden (zu) sein“"],["konsonant. Konj.","mis-isse „geschickt (zu) haben“","missum esse „geschickt worden (zu) sein“"],["i-Konjugation","audiv-isse „gehört (zu) haben“","auditum esse „gehört worden (zu) sein“"],["Mischkonjugation","cep-isse „gefangen (zu) haben“","captum esse „gefangen worden (zu) sein“"]]},{"type":"text","text":"Der passive Perfektinfinitiv wird im Akkusativ angegeben, da er fast ausschließlich im ACI vorkommt: amatum esse steht hier also für amatum/am/um esse (Sg.) bzw. amatos/as/a esse (Pl.)."}]},{"title":"Accusativus cum infinitivo (ACI)","blocks":[{"type":"text","text":"Der ACI ist ein aus einem Akkusativ und einem Infinitiv bestehender Satzteil, der im Deutschen meistens nicht wörtlich übersetzt werden kann, sondern zu einem „dass“-Satz umgeformt wird:"},{"type":"list","items":["Legimus Ulixem ad speluncam pervenisse. (wörtl.: „Wir lesen Odysseus zu einer Höhle gekommen zu sein.“) = „Wir lesen, dass Odysseus zu einer Höhle gekommen ist.“"]},{"type":"text","text":"Wie du aus diesem Beispiel siehst, wird der lateinische Akkusativ im Deutschen zum Subjekt („Subjektsakkusativ“) und der Infinitiv zum Prädikat des „dass“-Satzes:"},{"type":"table","headers":["lat. ACI","","Subjektsakkusativ","Infinitiv"],"rows":[["dt. Gliedsatz","„dass“ +","Nominativ","Prädikat"]]},{"type":"text","text":"Der Infinitiv drückt im ACI keine bestimmte Zeit, sondern ein Zeitverhältnis aus:"},{"type":"table","headers":["","Lateinisch","Deutsch"],"rows":[["Inf. Präsens → gleichzeitig","Scio Iuliam venire.","„Ich weiß, dass Julia kommt.“"],["Inf. Präsens → gleichzeitig","Scivi Iuliam venire.","„Ich wusste, dass Julia kam.“"],["Inf. Perfekt → vorzeitig","Scio Iuliam venisse.","„Ich weiß, dass Julia gekommen ist.“"],["Inf. Perfekt → vorzeitig","Scivi Iuliam venisse.","„Ich wusste, dass Julia gekommen war.“"]]},{"type":"text","text":"Bei der Übersetzung des Infinitivs musst du also immer die Zeit des übergeordneten Verbums mitberücksichtigen!"},{"type":"note","text":"Das Reflexivpronomen se wird als Subjektsakkusativ im ACI mit „dass er“ bzw. „dass sie“ (je nach dem Subjekt im Hauptsatz) übersetzt: Ulixes intellexit se ad speluncam Polyphemi pervenisse. = „Odysseus erkannte, dass er zur Höhle des Polyphem gekommen war.“ – Graeci intellexerunt se ad speluncam Polyphemi pervenisse. = „Die Griechen erkannten, dass sie zur Höhle des Polyphem gekommen waren.“"}]}]},{"number":26,"title":"De incendio Romae","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"incendium","forms":"incendii n.","de":"Brand","note":"ital. + span. incendio; vgl. incendere","pos":"Nomen"},{"la":"princeps","forms":"principis m.","de":"1) der Erste; 2) Prinzeps, Kaiser","note":"vgl. Prinz, der Prinzipat (= römische Kaiserzeit)","pos":"Nomen"},{"la":"gravis/e","forms":"","de":"schwer, schwerwiegend","note":"gravierend; frz. grave, ital. + span. grave","pos":"Adjektiv"},{"la":"existere","forms":"existo 3, extiti, –","de":"entstehen","note":"engl. to exist, ital. esistere, span. existir; vgl. existieren, Existenz","pos":"Verb"},{"la":"auctor","forms":"auctoris m.","de":"1) Autor; 2) Urheber, Anstifter","note":"frz. auteur, ital. autore, span. autor; vgl. auctoritas, -atis","pos":"Nomen"},{"la":"vastare","forms":"vasto 1, -avi, -atum","de":"verwüsten","note":"vgl. devastieren (= völlig zerstören)","pos":"Verb"},{"la":"numerus","forms":"numeri m.","de":"Zahl, Anzahl","note":"Nummer; vgl. Numerus clausus","pos":"Nomen"},{"la":"privatus/a/um","forms":"","de":"privat","note":"frz. privé, ital. privato, span. privado","pos":"Adjektiv"},{"la":"publicus/a/um","forms":"","de":"öffentlich","note":"engl. public; vgl. publizieren (= veröffentlichen)","pos":"Adjektiv"},{"la":"fama","forms":"famae f.","de":"1) Gerücht; 2) Ruf","note":"ital. + span. fama; vgl. famos (= großartig)","pos":"Nomen"},{"la":"fama erat","forms":"","de":"es gab das Gerücht","note":"esse kann auch „es gibt“ bedeuten!","pos":"Sonstiges"},{"la":"magnitudo","forms":"magnitudinis f.","de":"Größe","note":"frz. magnitude","pos":"Nomen"},{"la":"ornare","forms":"orno 1, -avi, -atum","de":"schmücken","note":"ital. ornare; vgl. Ornament (= Verzierung)","pos":"Verb"},{"la":"postea (Adv.)","forms":"","de":"später","note":"↔ post (+ Akk.)","pos":"Adverb"},{"la":"appellare","forms":"appello 1, -avi, -atum","de":"1) nennen; 2) rufen","note":"frz. appeler; vgl. Appell (= Aufruf)","pos":"Verb"},{"la":"cupidus/a/um","forms":"(+ Gen.)","de":"gierig (nach)","note":"vgl. cupiditas, -atis","pos":"Adjektiv"},{"la":"cupidus gloriae","forms":"","de":"gierig nach Ruhm","note":"","pos":"Sonstiges"},{"la":"condere","forms":"condo 3, condidi, conditum","de":"gründen","note":"vgl. ab urbe condita (a. u. c.)","pos":"Verb"},{"la":"usque ad (+ Akk.)","forms":"","de":"bis zu","note":"","pos":"Präposition"},{"la":"iussu","forms":"","de":"auf Befehl","note":"vgl. iubere, iussi, iussum","pos":"Sonstiges"},{"la":"Christiani","forms":"Christianorum m.","de":"die Christen","note":"frz. chrétiens, ital. cristiani, span. cristianos","pos":"Nomen"},{"la":"crimen","forms":"criminis n.","de":"1) Verbrechen; 2) Vorwurf","note":"engl. crime, frz. crime, ital. crimine, span. crimen; vgl. Kriminalität, kriminell","pos":"Nomen"},{"la":"accusare","forms":"accuso 1, -avi, -atum","de":"anklagen","note":"engl. to accuse, frz. accuser, ital. accusare","pos":"Verb"},{"la":"quasi","forms":"","de":"gleichsam (als), wie","note":"↔ ital. quasi, span. casi = „fast“!","pos":"Adverb"}],"grammar":[{"title":"Konjunktiv im Hauptsatz","blocks":[{"type":"text","text":"Im Gegensatz zum Konjunktiv im Gliedsatz (ut-Sätze, cum-Sätze, indirekte Fragesätze), wo der Konjunktiv ein Zeitverhältnis zum Ausdruck bringt, drückt der Konjunktiv im Hauptsatz a) einen Wunsch, b) eine Möglichkeit oder c) eine Unmöglichkeit aus. Er muss daher übersetzt werden!"},{"type":"table","headers":["","Merkmal","Bedeutung + Übersetzung","Beispiel"],"rows":[["Konj. Präsens","-a- (außer a-Konj.: -e-): amem, moneam, mittam, capiam, audiam","Wunsch/Optativus: „soll“, „möge“; deutscher Konjunktiv 1","Audiatur et(iam) altera pars. = „Es soll/möge auch die andere Seite gehört werden.“"],["Konj. Imperfekt","Infinitiv Präsens aktiv vor der Endung: amarem, monerem, mitterem","Unmöglichkeit/Irrealis Gegenwart: „würde“; deutscher Konjunktiv 2","Si sanus essem, ad te venirem. = „Wenn ich gesund wäre, würde ich zu dir kommen.“"],["Konj. Perfekt","Aktiv: -erim, -eris … -erint; Passiv: PPP + sim, sis … sint","Verbot/Prohibitivus (ne + 2.P.): als verneinter Imperativ","Ne me tetigeris! = „Berühr mich nicht!“ (= Noli me tangere!)"],["Konj. Plusquamperfekt","Aktiv: -issem, -isses … -issent; Passiv: PPP + essem, esses …","Unmöglichkeit/Irrealis der Vergangenheit: „wäre/hätte“ + Mittelwort der Vergangenheit","Si tacuisses, philosophus mansisses. = „Wenn du geschwiegen hättest, wärest du ein Philosoph geblieben.“"]]}]},{"title":"Konditionalsätze (Bedingungssätze)","blocks":[{"type":"text","text":"Bedingungssätze werden mit si („wenn“, „falls“) oder nisi („wenn nicht“, „falls nicht“) eingeleitet. Steht in ihnen ein Konjunktiv, muss er übersetzt werden, und zwar nach den Regeln des Konjunktivs im Hauptsatz:"},{"type":"list","items":["si + Konj. Imperfekt (Irrealis der Gegenwart: eine Situation kann jetzt unmöglich eintreten): „würde“ oder Konj. 2: Si Iulia Quintum amaret, ille felix esset. = „Wenn Julia Quintus lieben würde (liebte), wäre jener glücklich.“ (→ aber Julia liebt Quintus nicht)","si + Konj. Plqpf. (Irrealis der Vergangenheit: eine Situation konnte früher unmöglich eintreten): „wäre / hätte“ (+ Mittelwort der Vght.): Si Iulia Quintum amavisset, ille felix fuisset. = „Wenn Julia Quintus geliebt hätte, wäre jener glücklich gewesen.“ (→ aber Julia hat Quintus nicht geliebt)"]}]},{"title":"Übersicht: Konjunktivübersetzung","blocks":[{"type":"table","headers":["Der lateinische Konjunktiv …","wo?"],"rows":[["muss übersetzt werden","in Hauptsätzen; in Konditionalsätzen"],["kann übersetzt werden","in ut-Sätzen (Ausnahme: Folge-ut „sodass“); in indirekten Fragesätzen"],["darf nicht übersetzt werden","in cum-Sätzen; in Folge-ut-Sätzen („sodass“)"]]}]}]},{"number":27,"title":"De martyrio sancti Petri","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"sanctus/a/um","forms":"","de":"heilig","note":"engl. saint, frz. saint; vgl. Sankt Stefan (etc.)","pos":"Adjektiv"},{"la":"cultus","forms":"cultus m.","de":"Verehrung","note":"vgl. Kult (= religiöse Verehrung)","pos":"Nomen"},{"la":"dubitare","forms":"dubito 1, -avi, -atum","de":"1) zögern; 2) zweifeln","note":"engl. to doubt, ital. dubitare, span. dudar","pos":"Verb"},{"la":"commovere","forms":"commoveo 2, commovi, commotum","de":"1) (heftig) bewegen; 2) veranlassen","note":"vgl. movere","pos":"Verb"},{"la":"fuga","forms":"fugae f.","de":"Flucht","note":"vgl. fugere; Refugium (= Zufluchtsort), Zentrifuge","pos":"Nomen"},{"la":"proximus/a/um","forms":"","de":"der nächste","note":"frz. prochain, ital. prossimo, span. próximo","pos":"Adjektiv"},{"la":"repente (Adv.)","forms":"","de":"plötzlich","note":"= subito; span. de repente","pos":"Adverb"},{"la":"obviam (Adv.)","forms":"","de":"entgegen","note":"","pos":"Adverb"},{"la":"videtur (+ Inf.)","forms":"","de":"er/sie/es scheint","note":"(NCI, siehe Grammatica)","pos":"Verb"},{"la":"dominus","forms":"domini m.","de":"Herr","note":"vgl. dominieren","pos":"Nomen"},{"la":"quo","forms":"","de":"wohin","note":"↔ eo","pos":"Adverb"},{"la":"vadere","forms":"vado 3, –","de":"gehen","note":"vgl. Invasion (= kriegerischer Einmarsch)","pos":"Verb"},{"la":"dicitur (+ Inf.)","forms":"","de":"er/sie/es soll (angeblich)","note":"(NCI, siehe Grammatica)","pos":"Verb"},{"la":"lacrima","forms":"lacrimae f.","de":"Träne","note":"frz. larme, ital. lacrima","pos":"Nomen"},{"la":"referre","forms":"refero, rettuli, relatum","de":"1) zurückbringen; 2) berichten","note":"vgl. referieren, Referent","pos":"Verb"},{"la":"sic","forms":"","de":"so","note":"= ita, tam","pos":"Adverb"},{"la":"salus","forms":"salutis f.","de":"1) Heil, Rettung; 2) Gruß","note":"vgl. salutieren; Salut!","pos":"Nomen"},{"la":"mundus","forms":"mundi m.","de":"Welt","note":"frz. monde, ital. mondo, span. mundo; vgl. Minimundus","pos":"Nomen"},{"la":"dignus/a/um","forms":"(+ Abl.)","de":"würdig (+ Gen.)","note":"ital. degno, frz. digne, span. digno; vgl. engl. dignity","pos":"Adjektiv"}],"grammar":[{"title":"Infinitiv Präsens passiv","blocks":[{"type":"text","text":"Der Infinitiv Präsens passiv endet bei der a-, e- und i-Konjugation auf -ri, bei den übrigen auf -i:"},{"type":"table","headers":["a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj."],"rows":[["amari „geliebt zu werden“","moneri „ermahnt zu werden“","mitti „geschickt zu werden“","audiri „gehört zu werden“","capi „gefangen zu werden“"]]}]},{"title":"Partizip Futur und Infinitiv Futur aktiv","blocks":[{"type":"text","text":"Im Lateinischen gibt es auch ein Partizip Futur. Es wird vom PPP gebildet, wobei die Endung -us/a/um durch -urus/a/um ersetzt wird: amatus/a/um → amaturus/a/um, monitus/a/um → moniturus/a/um, missus/a/um → missurus/a/um (etc.)"},{"type":"text","text":"Verwendet wird das Partizip Futur vor allem in Kombination mit esse zur Bildung des Infinitivs Futur aktiv: amaturum esse, moniturum esse, dicturum esse."},{"type":"text","text":"Der Infinitiv Futur aktiv kommt fast nur im ACI vor. Wie beim Infinitiv Perfekt passiv muss dabei die Endung des Partizips mit dem Subjektsakkusativ übereingestimmt werden:"},{"type":"list","items":["Quintus amicos mox venturos esse sperat. = „Quintus hofft, dass die Freunde bald kommen werden.“","Quintus amicas mox venturas esse sperat. = „Quintus hofft, dass die Freundinnen bald kommen werden.“"]}]},{"title":"Überblick: alle Infinitive","blocks":[{"type":"table","headers":["","a-Konj.","e-Konj.","kons. Konj.","i-Konj.","Mischkonj."],"rows":[["Präsens aktiv","amare","monere","mittere","audire","capere"],["Präsens passiv","amari","moneri","mitti","audiri","capi"],["Perfekt aktiv","amavisse","monuisse","misisse","audivisse","cepisse"],["Perfekt passiv","amatum esse","monitum esse","missum esse","auditum esse","captum esse"],["Futur aktiv","amaturum esse","moniturum esse","missurum esse","auditurum esse","capturum esse"]]},{"type":"note","text":"Der Infinitiv Präsens ist gleichzeitig (→ Handlung zugleich mit der Haupthandlung). Der Infinitiv Perfekt ist vorzeitig (→ Handlung vor der Haupthandlung). Der Infinitiv Futur ist nachzeitig (→ Handlung nach der Haupthandlung)."}]},{"title":"Nominativus cum infinitivo (NCI)","blocks":[{"type":"text","text":"Bei einigen Verba steht im Passiv der NCI, die Verbindung eines Nominativs mit einem Infinitiv:"},{"type":"list","items":["dicitur / dicuntur + NCI = „er/sie/es soll“ (Sg.) / „sie sollen“ (Pl.); „man sagt, dass er/sie/es …“","videtur / videntur + NCI = „er/sie/es scheint“ (Sg.) / „sie scheinen“ (Pl.); „es scheint, dass er/sie/es …“"]},{"type":"text","text":"Beispiele:"},{"type":"list","items":["Christus respondisse dicitur. = 1) „Christus soll geantwortet haben.“ 2) „Man sagt, dass Christus geantwortet hat.“","Christus ei obviam venire videbatur. = 1) „Christus schien ihm entgegenzukommen.“ 2) „Es schien, dass Christus ihm entgegenkam.“"]}]},{"title":"Dativ des Interesses (Dativus commodi)","blocks":[{"type":"text","text":"Wenn ein Dativ ausdrückt, wofür oder für wen etwas geschieht, wird er mit „für“ übersetzt:"},{"type":"list","items":["Fugere Petro difficile non erat. = „Zu flüchten war für Petrus nicht schwer.“","Non scholae, sed vitae discimus. = „Nicht für die Schule, sondern fürs Leben lernen wir.“"]}]}]},{"number":28,"title":"De Marco Aurelio","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"dividere","forms":"divido 3, divisi, divisum","de":"trennen, teilen","note":"engl. to divide; vgl. dividieren, Division","pos":"Verb"},{"la":"transire","forms":"transeo, transii, transitum","de":"überqueren, hinübergehen","note":"aus: trans + ire; vgl. Transitverkehr","pos":"Verb"},{"la":"gens","forms":"gentis f.","de":"Volk","note":"frz. gens, ital. + span. gente (= Leute); ↔ genus, -eris n.","pos":"Nomen"},{"la":"traducere","forms":"traduco 3, traduxi, traductum","de":"hinüberführen","note":"aus: trans + ducere","pos":"Verb"},{"la":"adhuc (Adv.)","forms":"","de":"bis jetzt; bisher","note":"","pos":"Adverb"},{"la":"felix (m./f./n.)","forms":"felicis (2.F.)","de":"glücklich, erfolgreich","note":"ital. felice, span. feliz; vgl. frz. félicité","pos":"Adjektiv"},{"la":"fortuna","forms":"fortunae f.","de":"1) Glück; 2) Schicksal","note":"engl. + frz. fortune, ital. + span. fortuna","pos":"Nomen"},{"la":"eques","forms":"equitis m.","de":"Reiter; Ritter","note":"↔ equus, -i","pos":"Nomen"},{"la":"campus","forms":"campi m.","de":"Feld","note":"frz. champ; vgl. Camping, der Uni-Campus","pos":"Nomen"},{"la":"aestas","forms":"aestatis f.","de":"Sommer","note":"frz. été, ital. estate; ↔ aetas, -atis f.","pos":"Nomen"},{"la":"deesse","forms":"desum, dees, defui, –","de":"fehlen","note":"wörtl.: „weg sein“","pos":"Verb"},{"la":"fessus/a/um","forms":"","de":"erschöpft, müde","note":"","pos":"Adjektiv"},{"la":"vix (Adv.)","forms":"","de":"kaum","note":"","pos":"Adverb"},{"la":"ullus/a/um","forms":"ullius (2.F.), ulli (3.F.)","de":"irgendein(e)","note":"↔ nullus","pos":"Adjektiv"},{"la":"spes","forms":"spei f.","de":"Hoffnung","note":"frz. espoir, ital. speranza, span. esperanza; vgl. sperare","pos":"Nomen"},{"la":"rogare","forms":"rogo 1, -avi, -atum","de":"1) bitten; 2) fragen","note":"vgl. interrogare","pos":"Verb"},{"la":"divinus/a/um","forms":"","de":"göttlich","note":"engl. divine, frz. divin, ital. + span. divino; vgl. Diva","pos":"Adjektiv"},{"la":"ecce!","forms":"","de":"siehe!","note":"","pos":"Adverb"},{"la":"miraculum","forms":"miraculi n.","de":"Wunder","note":"engl. miracle; vgl. Mirakel, Miraculix (Zauberer!)","pos":"Nomen"},{"la":"accidere","forms":"accido 3, accidi, –","de":"geschehen","note":"vgl. engl. accident","pos":"Verb"}],"grammar":[{"title":"Partizip Präsens aktiv (PPA)","blocks":[{"type":"text","text":"Das Partizip Präsens (erstes Mittelwort) wird vom Präsensstamm gebildet und ist an der Silbe -ns (1.F. Sg.) bzw. -nt- (übrige Fälle) zu erkennen. Es dekliniert wie die Mischstämme:"},{"type":"table","headers":["Fall","Sg. m. + f.","Sg. n.","Pl. m. + f.","Pl. n."],"rows":[["1/5","amans","amans","amantes","amantia"],["2","amantis","amantis","amantium","amantium"],["3","amanti","amanti","amantibus","amantibus"],["4","amantem","amans","amantes","amantia"],["6","amante","amante","amantibus","amantibus"]]},{"type":"text","text":"Ebenso: monens, -entis; mittens, -entis; audiens, -entis; capiens, -entis; PPA von ire: iens, euntis."},{"type":"text","text":"Übersetzung: Das Partizip Präsens ist aktiv und gleichzeitig: amans = „liebend“ (= „einer, der liebt“); „ein Liebender“."},{"type":"text","text":"Verwendung:"},{"type":"list","items":["als Adjektiv: Christiani orantes = „die betenden Christen“","als Nomen: orantes = „die Betenden“","als Participium coniunctum (siehe unten)"]}]},{"title":"Participium coniunctum (PC)","blocks":[{"type":"text","text":"Unter dem Participium coniunctum („verbundenes Partizip“) versteht man ein Partizip, das"},{"type":"list","items":["mit einem Nomen übereingestimmt ist,","nicht unmittelbar neben diesem Nomen steht, sondern eine Sperrung (= Klammer) bildet."]},{"type":"text","text":"Da die wörtliche Übersetzung in solchen Fällen meist nicht wirklich „deutsch“ klingt, musst du eine solche Sperrung auflösen, und zwar am besten in einen Relativsatz:"},{"type":"list","items":["Christiani ad deum suum orantes e periculis servati sunt. = (Die Christen, zu ihrem Gott betend, wurden aus Gefahren gerettet. =) „Die Christen, die zu ihrem Gott beteten, wurden aus Gefahren gerettet.“"]},{"type":"text","text":"Der Relativsatz ist die einfachste Möglichkeit, ein Participium coniunctum zu übersetzen. Weitere Möglichkeiten: mit „als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional) oder als Hauptsatz mit „und“ (beiordnend)."},{"type":"text","text":"Bei der Übersetzung von Sperrungen musst du auf die Art des Partizips achten:"},{"type":"table","headers":["","Merkmal","Eigenschaften","Beispiel"],"rows":[["Partizip Präsens (PPA)","-ns, -ntis (3. Dekl.)","aktiv + gleichzeitig","amans = „einer, der liebt“"],["Partizip Perfekt (PPP)","-tus/-sus (a/o-Dekl.)","passiv + vorzeitig","amatus/a/um = „einer, der geliebt worden ist“"],["Partizip Futur (PFA)","-urus (a/o-Dekl.)","aktiv + nachzeitig","amaturus/a/um = „einer, der lieben wird“"]]},{"type":"list","items":["PPA (→ gleichzeitig): Im Relativsatz steht dieselbe Zeit wie im übergeordneten Satz (Beispiel siehe oben).","PPP (→ vorzeitig): Die Zeit im Relativsatz liegt eine Zeitstufe vor der Zeit im übergeordneten Satz: Romani ab hostibus inclusi (PPP) magno in periculo erant. (Imperfekt) = „Die Römer, die von den Feinden eingeschlossen worden waren (Plqpf.), befanden sich in großer Gefahr.“","PFA (→ nachzeitig): Das Futurpartizip kommt nur selten als PC vor; es bezeichnet dann den Zweck einer Handlung (finale Bedeutung) und wird mit „um zu …“ übersetzt: Marcus Aurelius Danuvium transiit Germanos victurus. = „Mark Aurel überquerte die Donau, um die Germanen zu besiegen.“"]}]}]},{"number":29,"title":"De Constantino victore","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"victor","forms":"victoris m.","de":"siegreich; Sieger","note":"vgl. Viktor; ↔ victoria, -ae","pos":"Nomen"},{"la":"civilis/e","forms":"","de":"bürgerlich; Bürger-","note":"vgl. zivil; engl. + frz. civil, ital. civile, span. civil","pos":"Adjektiv"},{"la":"metuere","forms":"metuo 3, metui, –","de":"fürchten","note":"vgl. metus, -us","pos":"Verb"},{"la":"oraculum","forms":"oraculi n.","de":"Orakel(spruch)","note":"frz. oracle, ital. oracolo, span. oráculo","pos":"Nomen"},{"la":"extra (+ Akk.)","forms":"","de":"außerhalb","note":"vgl. E.T. (= Extraterrestris), das Extra, extravagant","pos":"Präposition"},{"la":"uterque, utraque, utrumque","forms":"utriusque (2.F.), utrique (3.F.)","de":"jeder von beiden, beide","note":"Pronominale Deklination","pos":"Sonstiges"},{"la":"notus/a/um","forms":"","de":"bekannt","note":"↔ ignotus/a/um","pos":"Adjektiv"},{"la":"signum","forms":"signi n.","de":"Zeichen","note":"engl. sign, frz. signe; vgl. Signal, signieren","pos":"Nomen"},{"la":"scribere","forms":"scribo 3, scripsi, scriptum","de":"schreiben","note":"frz. écrire, ital. scrivere, span. escribir; vgl. Skriptum, Manuskript","pos":"Verb"},{"la":"prope (+ Akk.)","forms":"","de":"nahe bei","note":"vgl. ap-propinquare","pos":"Präposition"},{"la":"pons","forms":"pontis m.","de":"Brücke","note":"vgl. Pontifex maximus (= der Papst)","pos":"Nomen"},{"la":"plebs","forms":"plebis f.","de":"(niedriges) Volk","note":"vgl. Plebiszit (= Volksabstimmung)","pos":"Nomen"},{"la":"causa","forms":"causae f.","de":"Grund, Ursache","note":"vgl. Kausalsatz (= Begründungssatz)","pos":"Nomen"},{"la":"qua de causa","forms":"","de":"1) deshalb; 2) weshalb","note":"wörtl.: „aus welchem Grund“","pos":"Sonstiges"},{"la":"consulere","forms":"consulo 3, consului, consultum","de":"befragen, um Rat fragen","note":"vgl. konsultieren, Konsul (= „Berater“)","pos":"Verb"},{"la":"nuntiare","forms":"nuntio 1, -avi, -atum","de":"melden","note":"vgl. nuntius, -i","pos":"Verb"},{"la":"hodie (Adv.)","forms":"","de":"heute","note":"aus: hoc + die","pos":"Adverb"},{"la":"adducere","forms":"adduco 3, adduxi, adductum","de":"1) hinführen; 2) veranlassen","note":"vgl. adductus/a/um","pos":"Verb"},{"la":"studium","forms":"studii n.","de":"Eifer, Begeisterung","note":"vgl. Studium; vgl. studere","pos":"Nomen"},{"la":"premere","forms":"premo 3, pressi, pressum","de":"1) drücken; 2) bedrängen","note":"vgl. pressen; frz. presser; vgl. engl. pressure","pos":"Verb"},{"la":"pellere","forms":"pello 3, pepuli, pulsum","de":"schlagen, stoßen","note":"vgl. Puls; vgl. expellere","pos":"Verb"}],"grammar":[{"title":"Ablativus absolutus (Abl. abs.)","blocks":[{"type":"text","text":"Der Ablativus absolutus (Abl. abs., „losgelöster Ablativ“) besteht a) aus einem Nomen oder Pronomen im Ablativ und b) einem damit übereingestimmten Partizip (Präsens oder Perfekt)."},{"type":"text","text":"Diese Wortgruppe darf nicht wörtlich übersetzt werden, sondern muss zu einem Gliedsatz (meist einem Temporalsatz) umgeformt werden. Dabei gelten folgende Faustregeln:"},{"type":"list","items":["PARTIZIP PRÄSENS (PPA): gleichzeitig (+ aktiv) – „während“: Constantino ipso pugnante Maxentius Romam relinquere metuit. = „Während Konstantin selbst kämpfte, scheute sich Maxentius, Rom zu verlassen.“","PARTIZIP PERFEKT (PPP): vorzeitig (+ passiv) – „nachdem“: Ponte interrupto Maxentius Tiberim transire non potuit. = „Nachdem die Brücke eingerissen worden war, konnte Maxentius den Tiber nicht überqueren.“"]},{"type":"text","text":"Vorgangsweise beim Übersetzen:"},{"type":"list","items":["1) Suche zu jedem Partizip das Bezugswort (steht meist davor) und unterstreiche die beiden Wörter: z. B.: Libro in schola lecto discipuli dormiverunt.","2) Wenn die beiden Wörter im Ablativ stehen, handelt es sich um einen Abl. abs. → keine wörtliche Übersetzung! (falls anderer Fall → Participium coniunctum)","3) Bestimme die Art des Partizips und verwandle die unterstrichene Wortgruppe in einen Temporalsatz (PPA → „während“ + aktiv, PPP → „nachdem“ + passiv): z. B.: „Nachdem das Buch in der Schule gelesen worden war, schliefen die Schüler ein.“","4) Wenn der Satz passiv nicht „deutsch“ klingt, verwandle ihn in einen aktiven Satz: z. B.: „Nachdem sie das Buch in der Schule gelesen hatten, schliefen die Schüler ein.“"]},{"type":"note","text":"Statt eines Nomens kann im Abl. abs. auch ein Pronomen stehen: Quo (= hoc) viso Maxentius fugit. = „Nachdem das gesehen worden war, floh Maxentius.“ (besser aktiv: „Nachdem er das gesehen hatte, …“)"}]},{"title":"Zusammenfassung: Participium coniunctum und Ablativus absolutus","blocks":[{"type":"table","headers":["","Participium coniunctum","Ablativus absolutus"],"rows":[["besteht aus","Nomen + Partizip","Nomen + Partizip"],["steht im","1. bis 6. Fall (im Ablativ nur nach Präpositionen)","6. Fall (ohne Präposition)"],["Erstübersetzung","„der/die/das“ (Relativsatz)","„während“ bei PPA; „nachdem“ bei PPP"],["Weitere Übersetzungsmöglichkeiten","„als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional)","„als“ (temporal), „weil“ (kausal), „obwohl“ (konzessiv), „wenn“ (konditional)"]]},{"type":"note","text":"Participium coniunctum und Ablativus absolutus sind sogenannte „satzwertige Konstruktionen“ (sK). Diese Partizip-Konstruktionen sind im Lateinischen nur Satzteile, werden im Deutschen aber als Gliedsätze wiedergegeben. Weitere satzwertige Konstruktionen sind die Infinitivkonstruktionen ACI und NCI, die im Deutschen als „dass“-Sätze, also ebenfalls als Gliedsätze, übersetzt werden."}]}]},{"number":30,"title":"De beneficio sancti Martini","unit":"Die römische Kaiserzeit und das Christentum","klasse":6,"vocab":[{"la":"beneficium","forms":"beneficii n.","de":"Wohltat","note":"vgl. Benefizveranstaltung; aus: bene + facere","pos":"Nomen"},{"la":"hiems","forms":"hiemis f.","de":"Winter","note":"","pos":"Nomen"},{"la":"pauper (m./f./n.)","forms":"pauperis (2.F.)","de":"arm","note":"frz. pauvre, ital. povero, span. pobre","pos":"Adjektiv"},{"la":"vestis","forms":"vestis f.","de":"Gewand","note":"ital. vestiti; vgl. Weste, Transvestit, Investitur","pos":"Nomen"},{"la":"pati (D)","forms":"patior M, passus sum","de":"1) ertragen; 2) erleiden","note":"vgl. passiv, Patient, Passion (= Leidensgeschichte)","pos":"Verb"},{"la":"misericordia","forms":"misericordiae f.","de":"Mitleid","note":"ital. misericordia; vgl. miser","pos":"Nomen"},{"la":"nudus/a/um","forms":"","de":"nackt","note":"frz. nu, ital. nudo, span. desnudo; vgl. Nudist","pos":"Adjektiv"},{"la":"reliquus/a/um","forms":"","de":"übrig","note":"↔ relictus (PPP von relinquere)","pos":"Adjektiv"},{"la":"similis/e","forms":"","de":"ähnlich","note":"engl. similar, ital. simile, frz. similaire, span. similar; vgl. As-similation („Anpassung“)","pos":"Adjektiv"},{"la":"militaris/e","forms":"","de":"militärisch, Militär-","note":"↔ miles, -itis","pos":"Adjektiv"},{"la":"alter/era/erum","forms":"alterius (2.F.), alteri (3.F.)","de":"der andere (von zweien)","note":"vgl. Alternative, das Alter Ego (= zweites Ich), Altruismus (= Selbstlosigkeit)","pos":"Adjektiv"},{"la":"alter – alter","forms":"","de":"der eine – der andere","note":"","pos":"Sonstiges"},{"la":"mens","forms":"mentis f.","de":"Geist, Verstand, Sinn","note":"vgl. mental, Mentalität (= Geisteshaltung)","pos":"Nomen"},{"la":"sanus/a/um","forms":"","de":"gesund; vernünftig","note":"engl. sane; vgl. Sanitäter; SPA","pos":"Adjektiv"},{"la":"queri (D)","forms":"queror 3, questus sum","de":"klagen","note":"↔ quaerere, quaesivi, quaesitum","pos":"Verb"},{"la":"humanus/a/um","forms":"","de":"menschlich","note":"engl. human, frz. humain; vgl. Humanbiologie","pos":"Adjektiv"},{"la":"possidere","forms":"possideo 2, possedi, possessum","de":"besitzen","note":"engl. to possess; vgl. Possessivpronomen (= besitzanzeigendes Fürwort, z. B. „mein“ etc.)","pos":"Verb"},{"la":"sequi (D)","forms":"sequor 3, secutus sum","de":"folgen","note":"vgl. Sequenz (= Abfolge); Con-secutio temporum","pos":"Verb"},{"la":"sequor te (Akk.!)","forms":"","de":"ich folge dir (Dativ!)","note":"","pos":"Sonstiges"},{"la":"tegere","forms":"tego 3, texi, tectum","de":"bedecken","note":"vgl. Toga (= Körperbedeckung!)","pos":"Verb"},{"la":"loqui (D)","forms":"loquor 3, locutus sum","de":"sprechen","note":"vgl. eloquent (= redegewandt)","pos":"Verb"},{"la":"vereri (D)","forms":"vereor 2, veritus sum","de":"1) fürchten; 2) sich scheuen","note":"vereri = timere / metuere","pos":"Verb"},{"la":"quidquid","forms":"","de":"was auch immer; alles was","note":"","pos":"Pronomen"},{"la":"hortari (D)","forms":"hortor 1, hortatus sum","de":"auffordern, ermuntern","note":"","pos":"Verb"},{"la":"servire","forms":"servio 4, -ivi, -itum","de":"dienen","note":"frz. + span. servir; vgl. servieren; ↔ servare","pos":"Verb"},{"la":"quisquis","forms":"","de":"wer auch immer","note":"Neutrum: quidquid. Aus dem Vokabelverzeichnis","pos":"Pronomen"}],"grammar":[{"title":"Deponentia","blocks":[{"type":"text","text":"Deponentia sind Verba mit passiver Form, aber aktiver Bedeutung. Der Name Deponentia kommt vom Verbum deponere („ablegen“), da man meinte, diese Wörter hätten ihre aktiven Formen (bzw. passiven Bedeutungen) abgelegt. Entstanden sind Deponentia aus dem sogenannten „Medium“, einem Mittelding zwischen Aktiv und Passiv."},{"type":"tip","text":"Ob ein Wort ein Deponens ist, kann man nicht „erraten“, sondern muss man lernen! Im Wörterbuch erkennst du ein Deponens daran, dass der Infinitiv nicht aktiv (auf -re), sondern passiv (auf -ri oder -i) angegeben ist (z. B. hortari 1, hortatus sum)! Deponentia gibt es übrigens von allen Konjugationen."},{"type":"text","text":"Am Beispiel von loqui (konsonantische Konjugation):"},{"type":"table","headers":["Präsens","Form passiv!","Übersetzung aktiv!"],"rows":[["Sg. 1.P.","loquor","„ich spreche“"],["Sg. 2.P.","loqueris","„du sprichst“"],["Sg. 3.P.","loquitur","„er/sie spricht“"],["Pl. 1.P.","loquimur","„wir sprechen“"],["Pl. 2.P.","loquimini","„ihr sprecht“"],["Pl. 3.P.","loquuntur","„sie sprechen“"],["Sonstige Formen","Form","Übersetzung"],["Infinitiv Präsens","loqui","„(zu) sprechen“"],["Infinitiv Perfekt","locutum esse","„gesprochen (zu) haben“"],["Infinitiv Futur","locuturum esse","(„sprechen werden“)"],["Partizip Präsens","loquens, -entis","„sprechend“"],["Partizip Perfekt","locutus/a/um","(„gesprochen habend“)"],["Partizip Futur","locuturus/a/um","(„sprechen werdend“)"],["Imperativ Sg.","loquere!","„sprich!“"],["Imperativ Pl.","loquimini!","„sprecht!“"]]},{"type":"note","text":"Der Imperativ Plural (loquimini!) ist identisch mit der 2.P. Pl. Präsens (loquimini = „ihr sprecht“)."}]},{"title":"Gerund","blocks":[{"type":"text","text":"Das Gerund erkennt man an der Buchstabengruppe -nd-. Je nachdem, ob das Gerund mit einem Nomen übereingestimmt ist oder nicht, spricht man von Gerundium oder Gerundivum:"},{"type":"list","items":["nicht übereingestimmt (= Nomen) → Gerundium (Deklination wie pensum, -i n.)","übereingestimmt (= Adjektiv) → Gerundivum („Gerundivum pro gerundio“, Deklination wie bonus/a/um)"]},{"type":"table","headers":["Fall","Gerundium (Nomen!)","Gerundivum (Adjektiv!)"],"rows":[["1.F.","(legere = „das Lesen“; „zu lesen“)","(legere = „das Lesen“; „zu lesen“)"],["2.F.","a) legendi = „des Lesens“ / „zu lesen“; b) legendi causa = „um zu lesen“","libri legendi = („des Buchlesens“), „ein Buch zu lesen“; libri legendi causa = „um ein Buch zu lesen“"],["3.F.","(im Dativ kommt das Gerund kaum vor)","(im Dativ kommt das Gerund kaum vor)"],["4.F.","ad legendum = „um zu lesen“","ad librum legendum = „um ein Buch zu lesen“"],["6.F.","a) legendo = „durch das Lesen“; b) in legendo = „beim Lesen“","libro legendo = „durch das Lesen eines Buches“; in libro legendo = „beim Lesen eines Buches“"]]},{"type":"text","text":"Im Gegensatz zum Gerundium kommt das Gerundiv in allen drei Geschlechtern und auch im Plural vor: ad libros legendos (= librorum legendorum causa) = „um die Bücher zu lesen“."}]},{"title":"„müssen“-Gerundiv (prädikatives Gerundiv)","blocks":[{"type":"text","text":"Tritt ein Gerundiv kombiniert mit einer Form von esse auf, hat es eine gänzlich andere Bedeutung als oben: Es drückt aus, dass etwas gemacht werden muss. Als Erstübersetzung kannst du aber, so wie oben, den Infinitiv („zu“) wählen, danach forme den Satz zu einem „müssen“-Satz um:"},{"type":"list","items":["Mihi hic liber legendus est. = (Mir ist dieses Buch zu lesen. →) „Ich muss dieses Buch lesen.“","Mihi legendum est. = (Mir ist zu lesen. →) „Ich muss lesen.“","Mihi legendum non est. = (Mir ist nicht zu lesen. →) „Ich darf nicht lesen.“ (vgl. engl. I must not read.)"]},{"type":"note","text":"Der Dativ, der beim prädikativen Gerundiv angibt, wer etwas tun muss, heißt Dativus auctoris (Dativ der handelnden Person). Er wird im Deutschen zum Nominativ (Subjekt) des Satzes!"}]}]},{"number":31,"title":"Lernvokabel zur Autorenlektüre","unit":"Anhang: Auf zur Autorenlektüre!","klasse":6,"vocab":[{"la":"ait","forms":"","de":"er/sie sagt(e)","note":"","pos":"Verb"},{"la":"aliqui/aliqua/aliquod","forms":"","de":"irgendein","note":"","pos":"Pronomen"},{"la":"aliquis/aliquid","forms":"","de":"irgendjemand/-etwas","note":"","pos":"Pronomen"},{"la":"aut – aut","forms":"","de":"entweder – oder","note":"","pos":"Konjunktion"},{"la":"beatus/a/um","forms":"","de":"1) glücklich; 2) heilig","note":"","pos":"Adjektiv"},{"la":"caro","forms":"carnis f.","de":"Fleisch","note":"vgl. Karneval, Chili con carne","pos":"Nomen"},{"la":"cibus","forms":"cibi m.","de":"Speise","note":"","pos":"Nomen"},{"la":"ergo (Adv.)","forms":"","de":"also, daher","note":"","pos":"Adverb"},{"la":"et","forms":"","de":"1) und; 2) auch (= etiam)","note":"","pos":"Konjunktion"},{"la":"fieri","forms":"fio, factus sum","de":"1) werden; 2) geschehen; 3) gemacht werden","note":"dient als Passiv zu facere","pos":"Verb"},{"la":"igitur (Adv.)","forms":"","de":"also, daher","note":"","pos":"Adverb"},{"la":"mori","forms":"morior M, mortuus sum","de":"sterben","note":"vgl. mortuus/a/um, mors","pos":"Verb"},{"la":"ob (+ Akk.)","forms":"","de":"wegen","note":"","pos":"Präposition"},{"la":"pergere","forms":"pergo 3, perrexi, perrectum","de":"aufbrechen","note":"","pos":"Verb"},{"la":"praecipere","forms":"praecipio M, praecepi, praeceptum","de":"befehlen","note":"","pos":"Verb"},{"la":"qui-/quae-/quodcumque","forms":"","de":"wer auch immer","note":"","pos":"Pronomen"},{"la":"quisquam/quidquam","forms":"","de":"irgendjemand/-etwas","note":"","pos":"Pronomen"},{"la":"quod","forms":"","de":"1) weil; 2) dass","note":"","pos":"Konjunktion"},{"la":"si quis/quid","forms":"","de":"wenn jemand/etwas","note":"","pos":"Pronomen"},{"la":"talis/e","forms":"","de":"solch","note":"","pos":"Adjektiv"},{"la":"tantus/a/um","forms":"","de":"so groß","note":"","pos":"Adjektiv"},{"la":"uti","forms":"utor 3, usus sum (+ Abl.)","de":"gebrauchen, benützen","note":"vgl. usus, -us","pos":"Verb"},{"la":"uti (= ut)","forms":"","de":"wie; dass, damit, sodass","note":"","pos":"Konjunktion"},{"la":"vel","forms":"","de":"oder","note":"","pos":"Konjunktion"},{"la":"vel – vel","forms":"","de":"entweder – oder","note":"","pos":"Konjunktion"}],"vocabNote":"Diese Wörter stehen im Buch auf S. 154 als „Wichtige Lernvokabel“ für die Originaltexte (Autorenlektüre).","grammar":[{"title":"Auf zur Autorenlektüre!","blocks":[{"type":"text","text":"Alle Texte, die du bisher im Buch übersetzt hast, waren speziell für den Anfangsunterricht zusammengestellt. Der nächste große Schritt ist das Übersetzen von Originaltexten – also von Texten, die in den letzten 2000 Jahren von Autoren der Antike, des Mittelalters und der Neuzeit verfasst wurden."},{"type":"text","text":"Ab jetzt kommen in einem Text nicht mehr nur wenige, bestimmte Grammatik-Themen vor: Du solltest alle Grammatik-Kapitel jederzeit abrufbereit haben."},{"type":"text","text":"Neben dem Übersetzen wird auch das Interpretieren der lateinischen Texte wichtig. Bei Schularbeiten bekommst du zwei Texte: einen Übersetzungstext (ÜT) und einen Interpretationstext (IT), den du nicht übersetzen, sondern nur so weit verstehen musst, dass du Arbeitsaufgaben dazu lösen kannst."},{"type":"text","text":"Von nun an darfst du bei Schularbeiten auch das Wörterbuch verwenden."},{"type":"list","items":["I. Die Romanisierung Europas: Texte über die Gallier, Germanen und Britannier","II. Österreich in lateinischen Quellen: österreichische Heilige, Wien im 15. Jh., lateinische Inschriften","III. Das Christentum als prägende Kraft Europas: Vulgata (lateinische Bibel), Legenda Aurea und Ordensregel des hl. Benedikt","IV. Begegnung mit fremden Kulturen: Texte über China, Amerika und die Osmanen"]},{"type":"tip","text":"Damit du den Grundwortschatz nicht vergisst, wiederhole ihn regelmäßig – z. B. mit der täglichen Wiederholung in dieser App."}]},{"title":"Tipps für die Benützung des Wörterbuchs","blocks":[{"type":"list","items":["1. Schlage so selten wie möglich nach! Je öfter du nachschlägst, desto mehr Zeit verlierst du. Je größer dein Grundwortschatz, umso seltener musst du nachschlagen. Stell dir einen Satz wie ein Puzzle vor: Wenn du sieben oder acht von zehn Wörtern weißt, ergibt sich die Bedeutung der fehlenden oft von selbst – danach kannst du zur Bestätigung nachschlagen.","2. Nimm nicht automatisch das erste Wort, das so aussieht wie das im Text! Unter populus gibt es zwei Einträge: „Volk“ und „Pappel“. Achte auf die Kennzeichnung gleich lautender Einträge (hochgestellte Ziffern oder römische Ziffern: populus¹/populus² bzw. I. populus/II. populus).","3. Wähle nicht automatisch die erste Bedeutung! Die erste Bedeutung ist nicht zwangsläufig die passende – lies immer alle Hauptbedeutungen. Beispiel: Bei liber, libri steht manchmal „Bast“ an erster Stelle, meist bedeutet das Wort aber „Buch“.","4. Achtung auf assimilierte Formen! Zusammengesetzte Wörter stehen meist in der assimilierten Form im Wörterbuch: adfigere → affigere, adpropinquare → appropinquare, adsequi → assequi (adp… → app…, adf… → aff…, adg… → agg…, ads… → ass…).","5. Überlege, von welchem Wort sich die Form im Text ableitet! Analysiere die Form zuerst genau: iacebit ist e-Konjugation → bei iacere 2 nachschlagen (nicht bei iacere M, dessen Futur iaciet wäre). Zu pedum gehört eher pes, pedis („Fuß“) als pedum, -i („Hirtenstab“). Dekliniere „rückwärts“ bis zum Genetiv Sg.: legibus → legis → lex (wie rex, regis); ore → oris → os (wie mos, moris).","6. Achtung auf Eigennamen! Achte auf Groß- und Kleinschreibung: venus, -eris = „Liebe“, „Anmut“; Venus, -eris = „Venus“ (die Liebesgöttin). Völkernamen kannst du eindeutschen: Helvetii, -orum = „die Helvetier“."]},{"type":"note","text":"In manchen Lexika sind die häufigsten Bedeutungen durch Fettdruck und/oder Sperrung gekennzeichnet."}]}]}];

const CHANGELOG = [{"v": "1.6.0", "date": "20.11.2026", "items": ["Fortschritt repariert: Der Lektions-Fortschritt bewegt sich jetzt sofort bei jeder Übung (Karteikarten, Multiple Choice, Eintippen, Zuordnen …) – du musst nicht mehr tagelang auf Box 4 warten", "Neu: Wortstufen (Neu, Gesehen, Lernend, Bekannt, Gelernt, Gemeistert) mit Punkten pro Wort; Eintippen zählt mehr als Richtig/Falsch", "Neu: Lernerfolg nach jeder Übung („+40 Punkte, 5 Wörter aufgestiegen, Lektion 3: 42 % → 55 %“)", "Neu: Ränge von Tiro bis Imperator mit Punktekonto in der Statistik", "Neu: Tages-Training mit fälligen, schwachen und neuen Wörtern; neue Wörter pro Tag einstellbar", "Neu: Übung „Schwache Wörter“, Stufenleiste pro Lektion, Stufen-Diagramm, zwei neue Abzeichen"]}, {"v": "1.5.0", "date": "20.11.2026", "items": ["Neu: Repetitiones – alle Wiederholungsübungen zu Lektion 1–30 mit Lösungen und Übersetzungen", "Neu: Autorenlektüre – alle Originaltexte (Cäsar, Bibel, Legenda Aurea, Marco Polo, Vespucci, Busbecq …) mit Vokabelhilfen, Übersetzung, Arbeitsaufgaben und Infos; dazu die lateinischen Inschriften aus Wien und Innsbruck", "Neu: Wortklauberei 1–25 – damit ist die Wortkunde aller 30 Lektionen komplett", "Über 220 Buchaufgaben mit aufdeckbarer Lösung", "Neue Übung „Buchaufgaben“: zufällige Aufgaben lösen, Lösung aufdecken, „Nicht gewusst“ kommt später wieder", "Lange Kapitel haben jetzt ein Inhaltsverzeichnis und „Weiter“-Knöpfe; die Suche findet auch Aufgaben"]}, {"v": "1.4.0", "date": "20.11.2026", "items": ["Neu: Buchanhang nach Lektion 30 in der App – unter „Lektionen“ → „Anhang“", "Formenlehre: alle Deklinationen, Steigerung und alle Konjugationen (Indikativ/Konjunktiv, Aktiv/Passiv) plus esse, posse, ire, ferre, velle", "Stammformen der Verba (143 Verba, geordnet nach Perfektbildung, mit PPP und Lektion)", "Vorsilben, Nachsilben, Stilmittel, 37 Sprichwörter mit Bedeutung und Wortklauberei 26–30", "Neue „Lektion 31“: die 25 Lernvokabeln zur Autorenlektüre und die Tipps fürs Wörterbuch", "Vokabelverzeichnis des Buchs komplett abgeglichen: 31 fehlende Wörter ergänzt (z. B. Zahlwörter, maior/minor/optimus/pessimus, turris, theatrum, sive – sive, quisquis)", "Neue Übungen: Stammformen-Liste, Formenlehre-Training, Vor- und Nachsilben, Stilmittel, Sprichwörter", "Neu: Sprichwort des Tages auf der Startseite und Wörterverzeichnis A–Z mit Buchstaben-Sprung", "Suche findet jetzt auch alles aus dem Anhang; neue Wortart „Zahlwort“"]}, {"v": "1.3.0", "date": "18.11.2026", "items": ["Vokabeln noch einmal komplett mit dem Buch abgeglichen (alle 756 Einträge, Lektion 1–30): keine falschen oder fehlenden Wörter gefunden", "Wortarten genauer: neue Filter „Pronomen“ und „Konjunktion“, Verben und Adverbien richtig eingeordnet", "Sicherer Speicher: Fortschritt wird beim Verlassen der App sofort gespeichert, einmal täglich entsteht eine automatische Sicherheitskopie", "Beschädigte oder fehlerhafte Daten werden beim Start erkannt und repariert bzw. aus der Sicherheitskopie wiederhergestellt", "Warnung, falls das Speichern einmal nicht klappt; dauerhafter Speicher wird beim Browser angefragt", "Zwei offene Fenster überschreiben sich nicht mehr gegenseitig", "Lernplan korrigiert: Eine Vokabel steigt nur noch auf, wenn sie wirklich zur Wiederholung dran war (nicht mehrmals am selben Tag)", "Backup: Wiederherstellen zeigt vorher eine Übersicht und bietet „Zusammenführen“ oder „Ersetzen“; Erinnerung an Backups alle 2 Wochen", "Neu: „Datenstatus & Reparatur“ unter Mehr → Backup", "Statistik: Wörter nach Box, Wiederholungen der nächsten 7 Tage und Kalender der letzten 12 Wochen"]}, {"v": "1.2.1", "date": "17.11.2026", "items": ["Behoben: Wischen bei den Karteikarten ruckelte und zog Nachbilder; die Seite verschob sich dabei seitlich. Die Karte folgt jetzt flüssig dem Finger, springt bei zu kurzem Wischen zurück und fliegt sonst weg", "Behoben: Falsch beantwortete Wörter kamen alle paar Karten wieder, bis sie richtig waren – wenige Wörter liefen so in einer Schleife. ,"–","ertragen, erdulden","30"]]}]}]},{"id":"praefix","icon":"🧱","title":"Vorsilben (Präfixe)","sub":"ab-, ad-, con-, ex- … und was sie bedeuten (S. 197)","grammar":[{"title":"Die Bedeutung lateinischer Vorsilben (Präfixe)","blocks":[{"type":"text","text":"Viele lateinische Präpositionen werden auch für zusammengesetzte Wörter (besonders Verba) verwendet. Wenn du die Bedeutung dieser Vorsilben weißt, ergeben sich die Bedeutungen solcher Komposita oft von selbst: ire = „gehen“ → ab-ire = „weg-gehen“, ex-ire = „hinaus-gehen“, ad-ire = „hin-gehen“."},{"type":"note","text":"Manche Vorsilben passen sich an den nachfolgenden Buchstaben an (Assimilation), besonders oft ad-: afferre (aus ad-ferre), Perfekt attuli (aus ad-tuli), PPP allatum (aus ad-latum)."},{"type":"note","text":"Gelegentlich ändert sich bei Komposita auch der Vokal (Vokalschwächung): facere → conficere, tenere → continere, capere → accipere."},{"type":"table","headers":["Präfix","Bedeutung","Beispiele"],"rows":[["a- (ab-, abs-)","„weg-“","abstinere; abire, abesse, abscedere"],["ad- (ac-, af-, ap-)","„hin-“, „heran-“","adducere, adire, advenire, accipere, appropinquare; aspicere, attrahere"],["ante-","„voran-“","anteire, anteponere"],["circum-","„herum-“","circumvenire; circumferre, circumfluere"],["con- (com-, co-)","„zusammen-“","convenire, continere, convocare, concilium; conferre"],["con- (com-, co-)","(Verstärkung)","coniungere, commovere, conficere"],["contra-","„gegen-“","contradicere"],["de-","„weg-“, „herab-“, „ab-“","deponere, desinere, deesse; desilire"],["dis- (di-)","„auseinander-“, „weg-“","dividere, discordia; disputare, discedere, dimittere"],["ex- (e-)","„hinaus-“","exire, expellere, expugnare; eripere, explorare, excedere"],["in- (im-)","„hinein-“ (bei Verben)","inire, includere; inducere, immittere"],["in- (im-)","„un-“ (bei Adjektiven/Nomen)","iniuria, improbus; inimicus, immortalis, ingratus, incredibilis, incertus"],["inter-","„(da)zwischen-“","interesse, interea; interregnum, intervenire"],["intro-","„hinein-“","introducere, introire"],["ne-","(Gegenteil)","neglegere; nescire, nefas, negotium"],["ob-","„entgegen-“","obviam, oppugnare; obire, offerre, opponere, occurrere"],["per-","„durch-“","pervenire; perferre, percurrere"],["per-","(Verstärkung): „sehr“","permagnus, permulti, perfacilis, perantiquus"],["post-","„(da)hinter-“","postea; postponere"],["prae-","„vor(an)-“","praeparare, praecurrere, praemittere, praeesse"],["pro-","„voran-“","procedere, progredi, prodesse"],["re-","„zurück-“","reddere, redire, referre, relinquere, resistere; revenire, reverti"],["sub-","„(da)runter-“","subesse, subire"],["trans- (tra-)","„hinüber-“","tradere, traducere, transire; transportare, transferre"]]},{"type":"tip","text":"Unter den Beispielen stehen zuerst die Wörter aus dem Buch; die übrigen kannst du dir leicht selbst erschließen."}]}]},{"id":"suffix","icon":"🧩","title":"Nachsilben (Suffixe)","sub":"-tor, -tas, -io, -bilis … (S. 198)","grammar":[{"title":"Die Bedeutung lateinischer Nachsilben (Suffixe)","blocks":[{"type":"text","text":"Ein Suffix ist eine Silbe, die hinten an einen Wortstamm angefügt ist und dem Wort eine bestimmte Bedeutung gibt."},{"type":"table","headers":["Suffix beim Nomen","Bedeutung","Beispiele"],"rows":[["-tor (-toris)","Täter (Nomen agentis)","genitor = „Erzeuger“, „Vater“ (vgl. Doktor)"],["-trix (-tricis)","Täterin","genitrix = „Erzeugerin“, „Mutter“"],["-tudo (-dinis)","Eigenschaft (vgl. „-heit“)","pulchritudo = „Schönheit“ (vgl. Amplitude)"],["-tas (-tatis) / -tus (-tutis)","Eigenschaft (vgl. „-keit“)","crudelitas = „Grausamkeit“ (vgl. Qualität, Mobilität); virtus = „Tapferkeit“"],["-ia / -itia","Eigenschaft, Zustand","concordia = „Eintracht“, amicitia = „Freundschaft“"],["-io (-ionis)","Handlung (vgl. „-ung“)","quaestio = „Frage“ (vgl. Reaktion, Korruption)"],["-mentum / -trum","Mittel, Werkzeug","instrumentum (vgl. Medikament, Fundament)"],["-ulus, -olus, -ellus","Verkleinerung (Deminutiv; vgl. „-lein“, „-chen“)","navicula = „kleines Schiff“, „Schiffchen“; filiolus = „kleiner Sohn“, „Söhnlein“"]]},{"type":"table","headers":["Suffix beim Adjektiv","Bedeutung","Beispiele"],"rows":[["-ilis / -bilis","Fähigkeit (vgl. „-bar“, „-haft“, „-lich“)","mirabilis = „wunderbar“ (vgl. variabel, stabil)"],["-alis / -aris / -arius","Zugehörigkeit","militaris = „militärisch“"],["-eus / -a / -um","Stoff","aureus = „golden“"]]}]}]},{"id":"stil","icon":"🎭","title":"Stilmittel","sub":"Alliteration, Chiasmus, Klimax … (S. 198)","grammar":[{"title":"Die wichtigsten Stilmittel","blocks":[{"type":"table","headers":["Stilmittel","Erklärung","Beispiel"],"rows":[["Alliteration (Stabreim)","Aufeinanderfolgende Wörter beginnen mit demselben Laut.","Manner mag man eben."],["Anapher","Wiederholung desselben Wortes am Anfang aufeinander folgender Satzteile/Sätze.","Einfach gut, einfach schnell, einfach lecker."],["Antithese","Betonte Gegenüberstellung von Gegensätzen.","schwarz – weiß, hell – dunkel, gut – böse"],["Asyndeton","Unverbundene Aneinanderreihung von Wörtern/Sätzen.","Veni, vidi, vici."],["Polysyndeton","Aneinanderreihung von Wörtern/Sätzen immer mit „und“ (lat. et, -que).","Veni et vidi et vici."],["Ellipse","Auslassung selbstverständlicher Wörter.","Dafür hat er die gelbe (ergänze: Karte) bekommen. Ende gut, alles gut."],["Hyperbaton (Sperrung)","Zusammengehörige Wörter sind voneinander getrennt.","Magno me metu liberabis."],["Chiasmus („Kreuzstellung“)","Spiegelbildliche Anordnung einander entsprechender Wörter oder Wortgruppen (Abfolge ABBA).","Die Kunst ist lang, kurz ist das Leben."],["Parallelismus","Parallele Anordnung einander entsprechender Wörter oder Wortgruppen (Abfolge ABAB).","Die Kunst ist lang, das Leben ist kurz."],["Klimax","Stufenweise Steigerung.","Gut, besser, Gösser."],["Metapher","Bildlicher Ausdruck.","Die Zeit läuft mir davon."],["Pleonasmus","Eine Sache wird doppelt ausgedrückt.","der weiße Schimmel, eine tote Leiche"],["Rhetorische Frage","Frage, auf die keine Antwort erwartet wir "Nomen est omen.","Der Name ist ein Zeichen (Vorbedeutung).","9"],["Non scholae, sed vitae discimus.","Nicht für die Schule, sondern für das Leben lernen wir.","1"],["Ora et labora!","Bete und arbeite!","24"],["Pacta sunt servanda.","Verträge sind einzuhalten.",""],["Panem et circenses.","Brot und Zirkusspiele.",""],["Pecunia non olet.","Geld stinkt nicht.",""],["Per aspera ad astra.","Über raue Wege zu den Sternen. (Durch Mühen zum Erfolg.)",""],["Per pedes.","Zu Fuß.",""],["Plenus venter non studet libenter.","Ein voller Bauch studiert nicht gern.",""],["Quod erat demonstrandum. (q.e.d.)","Was zu beweisen war.",""],["Quod licet Iovi, non licet bovi.","Was Jupiter erlaubt ist, ist dem Rind nicht erlaubt.","11"],["Roma locuta, causa finita.","Rom hat gesprochen, die Sache ist erledigt.",""],["Si tacuisses, philosophus mansisses.","Wenn du geschwiegen hättest, wärst du ein Philosoph geblieben.",""],["Urbi et orbi.","Der Stadt (Rom) und dem Erdkreis.","10"],["Vare, redde mihi legiones!","Varus, gib mir (meine) Legionen zurück!",""],["Veni, vidi, vici.","Ich kam, ich sah, ich siegte.","7"],["Viribus unitis.","Mit vereinten Kräften.","14"]]},{"type":"note","text":"Im Buch ist die Bedeutung nur bei den Sprichwörtern aus den Lektionen erklärt – die übrigen Übersetzungen hat die App ergänzt."}]}]},{"id":"wk","icon":"🔍","title":"Wortklauberei","sub":"Wortkunde nach je 5 Lektionen – mit Aufgaben und Lösungen","grammar":[{"title":"L1–5 · Die lateinische Sprache und ihre „Töchter“","blocks":[{"type":"text","text":"Ein Grund, warum dir Latein später sehr nützlich sein wird: Die „romanischen Sprachen“ haben sich aus dem Lateinischen entwickelt – sie lernst du dadurch viel leichter."},{"type":"task","q":"Nenne die fünf meistgesprochenen romanischen Sprachen.","a":"Spanisch, Portugiesisch, Französisch, Italienisch, Rumänisch."},{"type":"task","q":"Aus welcher Sprache stammen diese Wörter für „Freund“ (lat. amicus)? ami – amico – amigo – amic (ein Wort ist in zwei Sprachen gleich).","a":"ami = Französisch; amico = Italienisch; amigo = Spanisch und Portugiesisch; amic = Rumänisch."},{"type":"text","text":"Abgesehen von den romanischen Sprachen gibt es in Europa noch zwei weitere große Sprachgruppen."},{"type":"task","q":"Ordne zu: Polnisch, Englisch, Niederländisch, Dänisch, Russisch, Kroatisch, Schwedisch, Deutsch, Tschechisch – slawisch oder germanisch?","a":"Slawisch: Polnisch, Russisch, Kroatisch, Tschechisch. Germanisch: Englisch, Niederländisch, Dänisch, Schwedisch, Deutsch."},{"type":"task","q":"Wie heißt die riesige Sprachfamilie, der (außer Ungarisch, Finnisch und Estnisch) fast alle Sprachen Europas angehören?","a":"Die indogermanische (indoeuropäische) Sprachfamilie."}]},{"title":"L1–5 · Groß- und Kleinschreibung","blocks":[{"type":"text","text":"In lateinischen Texten werden fast alle Wörter kleingeschrieben. Zwei Ausnahmen:"},{"type":"list","items":["Am Satzbeginn wird großgeschrieben.","Alle Eigennamen werden großgeschrieben, z. B. Romani („die Römer“), Roma („Rom“), Graeci („die Griechen“)."]},{"type":"tip","text":"Anders als im Deutschen gilt das auch für Adjektiva: „das lateinische Buch“ = liber Latinus (wie im Englischen: the Roman culture)."},{"type":"task","q":"Wie schreibt man lateinisch: a) der römische Tempel, b) das griechische Mädchen?","a":"a) templum Romanum; b) puella Graeca."}]},{"title":"L1–5 · Vokale, Konsonanten & Co.","blocks":[{"type":"list","items":["Vokale (Selbstlaute): A – E – I – O – U – (Y)","Konsonanten (Mitlaute): B – C – D – F – G – H – L – M – N – P – Q – R – S – T – V – X – (Z)","Diphthonge (Zwielaute): AE – AU – OE – EI (etc.)"]},{"type":"note","text":"Y und Z schrieben die Römer nur in griechischen Fremdwörtern und Namen (syllaba, symphonia, zona, Zama)."},{"type":"task","q":"Welche drei Konsonanten gibt es (außer Z) im Lateinischen nicht, und was schreibt man stattdessen?","a":"J, K und W fehlen. Man schreibt stattdessen I, C und V (z. B. Iulia, Cicero, vinum)."}]},{"title":"L1–5 · Grammatikalische Ausdrücke (Lektion 1–5)","blocks":[{"type":"table","headers":["Name","Übersetzung","deutsches Beispiel"],"rows":[["Deklination","Abwandlung von Nomen/Adjektiva (Fälle)","der Freund, des Freundes …"],["Konjugation","Abwandlung von Verben (Personen, Zeiten)","ich lobe, du lobst …"],["Nomen/Substantiv","Hauptwort, Namenwort","Freund, Straße"],["Adjektiv","Eigenschaftswort","schön, groß"],["Verbum","Zeitwort, Tätigkeitswort","loben, rufen"],["Infinitiv","Nennform (Grundform) des Verbs","loben, sein"],["Imperativ","Befehlsform","Lobe! Lobt!"],["Personalpronomen","persönliches Fürwort","ich, du, wir"],["Possessivpronomen","besitzanzeigendes Fürwort","mein, dein, unser"]]},{"type":"note","text":"Die mittlere und rechte Spalte sind im Buch zum Ausfüllen leer – hier hat die App sie ergänzt."}]},{"title":"L1–5 · Präpositionen und Präfixe","blocks":[{"type":"task","q":"Zähle alle bisher gelernten Präpositionen auf: a) mit Ablativ, b) mit Akkusativ.","a":"a) mit Ablativ: a/ab, cum, de, e/ex, in (wo?), prae, pro, sine, sub (wo?). b) mit Akkusativ: ad, ante, in (wohin?), per, post, sub (wohin?)."},{"type":"text","text":"Manche Präpositionen verbinden sich mit einem Verbum – dann spricht man von einem Präfix (einer Vorsilbe). Die Bedeutung ist meist eng verwandt: prae heißt als Präposition wie als Präfix „vor“."},{"type":"task","q":"Was bedeuten diese Fremdwörter mit prae-? Präludium, präparieren, prähistorisch, Prävention, Prädestination, Präfix, Präposition, Präsentation","a":"Präludium = Vorspiel; präparieren = vorbereiten; prähistorisch = vorgeschichtlich; Prävention = Vorbeugung; Prädestination = Vorherbestimmung; Präfix = Vorsilbe; Präposition = Vorwort (Verhältniswort); Präsentation = Vorstellung, Vorführung."}]},{"title":"L6–10 · Grammatikalische Ausdrücke (Lektion 6–10)","blocks":[{"type":"table","headers":["Name","Übersetzung","Beispiel"],"rows":[["Infinitiv","Nennform","laudare = loben"],["Imperativ","Befehlsform","Lauda! = Lobe!"],["Deklination","Abwandlung von Nomen/Adjektiva","amicus, amici, amico …"],["Konjugation","Abwandlung von Verben","laudo, laudas, laudat …"],["Dativus possessivus","Dativ des Besitzers","Mihi liber est. = Ich habe ein Buch."],["Vokal","Selbstlaut","a, e, i, o, u"],["Konsonant","Mitlaut","b, c, d, f …"],["Diphthong","Zwielaut","ae, au, oe"]]},{"type":"note","text":"Mittlere und rechte Spalte sind im Buch leer – hier von der App ergänzt."}]},{"title":"L6–10 · Geschlechtsregeln (3. Deklination)","blocks":[{"type":"text","text":"Bei der a-Deklination sind die Wörter meist feminin (aqua, terra, vita), bei der o-Deklination meist maskulin (gladius, annus, oculus) bzw. neutrum (otium, oppidum, exemplum). Die Wörter der 3. Deklination können ganz unterschiedliche Geschlechter haben – diese Regeln helfen:"},{"type":"table","headers":["Geschlecht","Regel","Beispiele aus Lektion 9 und 10"],"rows":[["maskulin","alle auf -or/-oris","clamor, timor, honor, imperator"],["feminin","die meisten auf -is/-is","navis, turris (Ausnahme: canis, hostis m.)"],["feminin","alle auf -us/-utis","virtus"],["feminin","die meisten auf -x","vox, nox, pax"],["feminin","die meisten, die mit zwei Konsonanten enden","urbs, pars"],["neutrum","alle auf -men/-minis","nomen, flumen"],["„natürliches Geschlecht“","männliche Lebewesen → maskulin","miles, homo"],["„natürliches Geschlecht“","weibliche Lebewesen → feminin","Iuno"]]},{"type":"note","text":"Die Beispielspalte ist im Buch zum Ausfüllen – hier von der App ergänzt."}]},{"title":"L6–10 · Komposita","blocks":[{"type":"text","text":"Ein Kompositum (Plural: Komposita) ist ein zusammengesetztes Wort."},{"type":"task","q":"Welche Komposita zum deutschen Verbum „tragen“ fallen dir ein?","a":"z. B. vertragen, ertragen, abtragen, auftragen, eintragen, übertragen, beitragen, vortragen, zutragen."},{"type":"task","q":"Was bedeuten die Komposita zu pugnare („kämpfen“): a) expugnare, b) oppugnare?","a":"a) expugnare = erobern („herauskämpfen“); b) oppugnare = bestürmen, belagern („gegen etwas kämpfen“)."}]},{"title":"L6–10 · Ein Wort – viele Bedeutungen: capere","blocks":[{"type":"text","text":"Für capere (Lektion 7) gibt es im Wörterbuch unzählige Bedeutungen. Merk dir als Grundbedeutung „etwas fassen“ – damit findest du in jedem Zusammenhang die passende Übersetzung."},{"type":"task","q":"Wähle aus „erfassen“, „einnehmen“, „nehmen“, „ergreifen“: castra hostium capere – gladium capere – librum capere – magnus timor me capit","a":"castra hostium capere = das Lager der Feinde einnehmen; gladium capere = das Schwert ergreifen; librum capere = das Buch nehmen; magnus timor me capit = große Angst erfasst mich."}]},{"title":"L6–10 · Aufgepasst auf Pluralwörter!","blocks":[{"type":"text","text":"Manche Nomina gibt es nur im Plural. Du erkennst sie im Vokabelverzeichnis daran, dass auch der Genetiv im Plural steht: castra, -orum n. = „Lager“."},{"type":"task","q":"Ergänze Genetiv, Geschlecht und Bedeutung: copiae, arma, liberi, Graeci, Romani, Galli","a":"copiae, -arum f. = Truppen; arma, -orum n. = Waffen; liberi, -orum m. = Kinder; Graeci, -orum m. = die Griechen; Romani, -orum m. = die Römer; Galli, -orum m. = die Gallier."},{"type":"task","q":"Was heißt dagegen Graecus/a/um bzw. Romanus/a/um?","a":"griechisch bzw. römisch (Adjektiva)."}]},{"title":"L6–10 · Wörter, die du nicht verwechseln solltest","blocks":[{"type":"text","text":"Manche Wörter unterscheiden sich nur durch einen Buchstaben – und heißen etwas ganz anderes. Kleine Ursache, große Wirkung!"},{"type":"table","headers":["Wort","Bedeutung","Wort","Bedeutung"],"rows":[["audire","hören","audere","wagen"],["parare","(vor)bereiten","parere","gehorchen"],["nos","wir; uns","vos","ihr; euch"],["novus","neu","nonus","der neunte"],["ab","von, von … weg","ad","zu, an, bei"],["ibi","dort","ubi","wo"],["tam","so","tum","dann, damals"],["alius","ein anderer","alienus","fremd"],["manere","bleiben","monere","ermahnen"]]}]},{"title":"L11–15 · Grammatikalische Ausdrücke (Lektion 11–15)","blocks":[{"type":"table","headers":["Name","Übersetzung","Beispiel"],"rows":[["Demonstrativpronomen","hinweisendes Fürwort","hic, ille, is, iste, idem"],["Relativpronomen","bezügliches Fürwort","qui, quae, quod"],["Interrogativpronomen","Fragefürwort","quis? quid?"],["Possessivpronomen","besitzanzeigendes Fürwort","meus, tuus, suus, noster, vester"],["Personalpronomen","persönliches Fürwort","ego, tu, nos, vos"]]},{"type":"note","text":"Mittlere und rechte Spalte sind im Buch leer – hier von der App ergänzt."}]},{"title":"L11–15 · Die Nachsilbe (Suffix) -tudo","blocks":[{"type":"text","text":"In Lektion 11 hast du zwei Nomina kennengelernt, die von Adjektiven abgeleitet sind: multi/ae/a „viele“ → multitudo, -inis „Menge“; pulcher/chra/chrum „schön“ → pulchritudo, -inis „Schönheit“."},{"type":"task","q":"Wie könnten die Nomina zu magnus, longus, clarus und solus lauten?","a":"magnitudo, -inis = Größe; longitudo, -inis = Länge; claritudo, -inis = Berühmtheit, Glanz; solitudo, -inis = Einsamkeit."},{"type":"list","items":["Wörter auf -tudo, -tudinis sind immer von Adjektiven abgeleitet und drücken eine Eigenschaft aus (vgl. dt. -heit und -keit).","Wörter auf -tudo, -tudinis sind immer feminin (vgl. die Eitelkeit, die Bescheidenheit).","Die Endung lebt in den romanischen Sprachen weiter: ital. -tudine, frz. -tude, span. -tud."]},{"type":"task","q":"Was heißt la longitudine (ital.), la longitude (frz.), la longitud (span.)?","a":"Jeweils „die Länge“ (geografisch auch „die Längengrad-Angabe“)."}]},{"title":"L11–15 · Wortfamilien","blocks":[{"type":"text","text":"Wörter mit derselben Wurzel und verwandter Bedeutung bilden eine Wortfamilie (z. B. fliegen – abfliegen – Flügel – Fliege)."},{"type":"task","q":"Was bedeuten facere, facinus, -oris und conficere?","a":"facere = tun, machen; facinus = Tat, Untat; conficere = ausführen, beenden (aus con- + facere, Vokalschwächung)."}]},{"title":"L11–15 · Ein Wort – viele Bedeutungen: petere","blocks":[{"type":"text","text":"In petere (Lektion 13) steckt das Anvisieren von etwas und die Bewegung zu etwas hin. Grundbedeutung: „etwas anpeilen“, „etwas anstreben“."},{"type":"task","q":"Wähle aus „wollen“, „reisen“, „bitten“, „begehren“, „angreifen“: gloriam peto – hostem peto – amicam pulchram peto – Italiam peto – a te auxilium peto","a":"gloriam peto = ich will Ruhm (strebe nach Ruhm); hostem peto = ich greife den Feind an; amicam pulchram peto = ich begehre die schöne Freundin; Italiam peto = ich reise nach Italien; a te auxilium peto = ich bitte dich um Hilfe."}]},{"title":"L11–15 · Wörter mit Geschichte (Etymologie)","blocks":[{"type":"text","text":"Wortgeschichten heißen Etymologien. Beispiel: Rivale (Gegner) kommt von lat. rivus, -i „Fluss“ – wer sich im wasserarmen Süditalien am selben Fluss ansiedelte, wurde zum Gegner, weil man sich das Wasser streitig machte."},{"type":"task","q":"Auf welche lateinischen Wörter gehen zurück: identisch, Kapitän, Maniküre, Lokomotive, domestizieren, Daten, engl. peninsula, engl. library?","a":"identisch: idem (derselbe); Kapitän: caput (Kopf); Maniküre: manus (Hand) + cura (Pflege); Lokomotive: locus (Ort) + movere (bewegen); domestizieren: domus (Haus); Daten: dare (geben) – „das Gegebene“; peninsula: paene (fast) + insula (Insel) = Halbinsel; library: liber (Buch)."},{"type":"tip","text":"Wenn du Wortgeschichten magst, leg dir ein etymologisches Wörterbuch zu."}]},{"title":"L11–15 · Vokabellerntipp: Eselsbrücken","blocks":[{"type":"list","items":["solere („gewohnt sein“) → „Ich bin gewohnt, Soletti zu essen.“","ignotus („unbekannt“) → „Mir ist unbekannt, was ignotus heißt.“","tam („so“) → „Mach nicht so ein Tamtam!“","tum („dann“, „damals“) → Alter-tum (das Altertum hat mit „damals“ zu tun)","ipse („selbst“) → klingt ähnlich: „-ps-“ / „-bs-“","iterum heißt „wiederum“ (Reim!)"]}]},{"title":"L16–20 · Das Suffix -tor","blocks":[{"type":"text","text":"Das Suffix -tor bezeichnet immer den „Täter“, also den Ausführenden einer Handlung. Nomina auf -tor sind meistens von einem Verbum abgeleitet."},{"type":"task","q":"Was bedeuten orator, spectator, amator, imperator – und welche Verba stecken darin?","a":"orator = Redner (orare = reden; auch bitten, beten); spectator = Zuschauer (spectare = anschauen); amator = Liebhaber (amare = lieben); imperator = Feldherr, Kaiser (imperare = befehlen)."}]},{"title":"L16–20 · Das Suffix -tio","blocks":[{"type":"text","text":"Das Suffix -tio drückt eine Handlung aus (lat. actio, -ionis = „Tätigkeit“; engl. action). Der orator ist der „Täter“ (Redner), die oratio die Handlung selbst (Rede)."},{"type":"task","q":"Was könnten traditio, laudatio, auctio und contentio bedeuten?","a":"traditio = Übergabe, Überlieferung (tradere = übergeben, überliefern); laudatio = Lobrede, Lob (laudare = loben); auctio = Vermehrung, Versteigerung (augere = vermehren); contentio = Anstrengung, Wettkampf, Streit (contendere = eilen, kämpfen)."}]},{"title":"L16–20 · Das Suffix -tas","blocks":[{"type":"text","text":"Wie -tudo drückt auch -tas eine Eigenschaft aus (auctoritas, -atis = „das Ansehen“). Nomina auf -tas sind immer feminin."},{"type":"task","q":"Was bedeuten libertas, potestas, cupiditas, nobilitas, atrocitas, improbitas?","a":"libertas = Freiheit; potestas = Macht; cupiditas = Begierde, Gier; nobilitas = Adel (nobilis = adelig); atrocitas = Grausamkeit, Wildheit (atrox = wild, grässlich); improbitas = Schlechtigkeit, Bosheit (improbus = schlecht)."}]},{"title":"L16–20 · Überblick über die Suffixe -tor / -tio / -tas / -tudo","blocks":[{"type":"table","headers":["","-tor","-tio","-tas","-tudo"],"rows":[["Bedeutung","Täter","Handlung","Eigenschaft","Eigenschaft"],["Geschlecht","m.","f.","f.","f."],["lat. Beispiel","auctor („Autor“)","actio („Handlung“)","libertas („Freiheit“)","solitudo („Einsamkeit“)"],["Französisch","auteur","action","liberté","solitude"],["Italienisch","autore","azione","libertà","solitudine"],["Spanisch","autor","acción","libertad","solitud"]]}]},{"title":"L16–20 · Eine „herrschsüchtige“ Wortfamilie","blocks":[{"type":"text","text":"Eine besonders große Wortfamilie bilden die Wörter mit dem Stamm reg-, der immer mit „Herrschen“ und „Regieren“ zu tun hat."},{"type":"task","q":"Was bedeuten regnare, regnum, rex und regina?","a":"regnare = herrschen, regieren; regnum = (König-)Reich, Herrschaft; rex = König; regina = Königin."}]},{"title":"L16–20 · Synonyme und Antonyme","blocks":[{"type":"text","text":"Synonyme sind gleichbedeutende, Antonyme gegensätzliche Wörter."},{"type":"task","q":"Ergänze Deutsch, deutsches und lateinisches Antonym (Beispiel: facilis = leicht ↔ schwer = difficilis): bonus, multi, docere, pax, novus","a":"bonus = gut ↔ schlecht = malus; multi = viele ↔ wenige = pauci; docere = lehren ↔ lernen = discere; pax = Friede ↔ Krieg = bellum; novus = neu ↔ alt = antiquus."}]},{"title":"L16–20 · Das G'frett mit dem -us!","blocks":[{"type":"text","text":"Die Endung -us gibt es im Nominativ bei mehreren Deklinationen:"},{"type":"table","headers":["1.F. Sg.","2.F. Sg.","Deklination"],"rows":[["-us","-i","o-Dekl. m."],["-us","-us","u-Dekl. m./f."],["-us","-utis","3. Dekl. f."],["-us","-oris/-eris","3. Dekl. n."]]},{"type":"task","q":"Ordne zu: tempus, virtus, animus, vulnus, servitus, senatus, socius, opus, litus, casus, manus, discipulus, domus, facinus, genus","a":"o-Dekl. (-i): animus, socius, discipulus. u-Dekl. (-us): senatus, casus, manus, domus. 3. Dekl. f. (-utis): virtus, servitus. 3. Dekl. n. (-oris/-eris): tempus, vulnus, opus, litus, facinus, genus."}]},{"title":"L16–20 · Wörter, die du nicht verwechseln solltest","blocks":[{"type":"task","q":"Was bedeuten: coepi – cepi, vicerunt – vixerunt, posuit – potuit, more – morte, parat – paret?","a":"coepi = ich habe begonnen – cepi = ich habe gefasst; vicerunt = sie haben gesiegt – vixerunt = sie haben gelebt; posuit = er hat gelegt/gestellt – potuit = er hat gekonnt; more = durch die Sitte – morte = durch den Tod; parat = er bereitet vor – paret = er gehorcht."}]},{"title":"L21–25 · Präfixe über Präfixe!","blocks":[{"type":"text","text":"Komposita (zusammengesetzte Zeitwörter) bestehen aus einer Vorsilbe (Präfix) und dem Grundverb: adesse → ad- + esse = „da sein“; continere → con- + tenere = „zusammenhalten“."},{"type":"note","text":"Ein Vokal des Grundverbs kann sich im Kompositum verändern (meist a oder e zu i): tenere → continere, capere → recipere, facere → conficere („Vokalschwächung“)."},{"type":"text","text":"Die meisten Präfixe sind aus Präpositionen entstanden und haben eine ähnliche Bedeutung."},{"type":"table","headers":["Präfix","Bedeutung","1. Beispiel","2. Beispiel"],"rows":[["a(b)-","„weg-“","abire = weggehen","abesse = abwesend sein"],["ad-","„hin-“","adducere = hinführen","adire = hingehen"],["co(n)-","1) „zusammen-“; 2) „sehr“","convenire = zusammenkommen","convocare = zusammenrufen"],["de-","„weg-“, „herab-“","deponere = ablegen","desinere = aufhören"],["di(s)-","„auseinander-“","dimittere = wegschicken, entlassen","discordia = Zwietracht"],["e(x)-","„hinaus-“, „aus-“","exire = hinausgehen","expellere = vertreiben"],["in-/im-","„hinein-“ (bei Verben)","includere = einschließen","inducere = hineinführen"],["in-/im-","„un-“ (bei Adjektiven)","ingratus = undankbar","infirmus = unfest, schwach"],["ne-","Verneinung","neglegere = missachten","nescire = nicht wissen"],["per-","„sehr“ (bei Adjektiven)","permagnus = sehr groß","permulti = sehr viele"],["prae-","„vor-“","praeparare = vorbereiten","praemittere = vorausschicken"],["re-","„zurück-“","reddere = zurückgeben","redire = zurückkehren"],["tra(ns)-","„hinüber-“","tradere = übergeben, ausliefern","traducere = hinüberführen"]]},{"type":"note","text":"Die Beispiel-Bedeutungen sind im Buch zum Ausfüllen – hier von der App ergänzt."},{"type":"task","q":"Was bedeuten diese Fremdwörter? Absenz, Advent, deponieren, Diskriminierung, Disqualifikation, Dissonanz, Export, Immigration, inhuman, Kongress","a":"Absenz = Abwesenheit (abesse); Advent = Ankunft (advenire); deponieren = hinterlegen, ablegen (deponere); Diskriminierung = Benachteiligung, „Unterscheidung“ (dis-); Disqualifikation = Ausschluss; Dissonanz = Missklang (dis- + sonare); Export = Ausfuhr (ex- + portare); Immigration = Einwanderung (in- + migrare); inhuman = unmenschlich (in- + humanus); Kongress = Zusammenkunft, Tagung (con- + gradi)."},{"type":"task","q":"Und diese? Konsens, Konsonant, Negation, permanent, Präferenz, reflektieren, Renaissance, retour, Transfer, Transfusion","a":"Konsens = Übereinstimmung (con- + sentire); Konsonant = Mitlaut (con- + sonare, „mittönend“); Negation = Verneinung (negare); permanent = dauernd (per- + manere, „durchbleibend“); Präferenz = Vorliebe, Vorzug (prae- + ferre); reflektieren = nachdenken, zurückwerfen (re- + flectere); Renaissance = Wiedergeburt (re- + nasci); retour = zurück (re-); Transfer = Übertragung (trans- + ferre); Transfusion = Übertragung (von Blut) (trans- + fundere)."}]},{"title":"L21–25 · Assimilation – Anpassung geht über alles!","blocks":[{"type":"text","text":"Wie sich das Chamäleon an seine Umwelt anpasst (assimiliert), passen sich auch im Lateinischen Buchstaben an ihre Umgebung an – vor allem an der Schnittstelle von Präfix und Verb. Gut zu sehen bei afferre („hinbringen“): Präsens ad-ferre → af-ferre; Perfekt ad-tuli → at-tuli; PPP ad-latus → al-latus."},{"type":"text","text":"Der Grund ist die leichtere Aussprache. Konsonanten werden völlig angeglichen (ad-ferre → af-ferre) oder nur angenähert (in-ponere → im-ponere, con-ponere → com-ponere). Besonders oft betrifft das ad-, con- und in-."},{"type":"task","q":"Aus welchen Präfixen sind commovere, afficere, accipere, immittere und assimilare entstanden? Was bedeuten sie?","a":"commovere = con-movere: bewegen, veranlassen; afficere = ad-facere: versehen (mit), erfüllen; accipere = ad-capere: erhalten, annehmen; immittere = in-mittere: hineinschicken; assimilare = ad-similare: angleichen, anpassen."}]},{"title":"L21–25 · Fremdwörter aufspüren leicht gemacht!","blocks":[{"type":"list","items":["Lehnwörter sehen wie deutsche Wörter aus, haben aber einen lateinischen Ursprung: „Fenster“ (fenestra), „Straße“ (strata), „Ziegel“ (tegula).","Fremdwörter sehen „fremd“ aus und sind leichter zu erkennen: Computer (computare = „rechnen“), Ventilator (ventum ferre = „Windbringer“), Lokomotive (loco movere = „Vom-Ort-Beweger“)."]},{"type":"table","headers":["Fremdwort","Bedeutung","lat. Wurzel(n) und wörtliche Übersetzung"],"rows":[["attraktiv","anziehend","ad- + trahere („hin-ziehen“)"],["Kontroverse","Streit","contra + vertere („sich dagegen wenden“)"],["Läsion","Verletzung","laedere, laesum („verletzen“)"],["Intellekt","Verstand","intellegere, intellectum („erkennen“)"],["kontrahieren","zusammenziehen","con- + trahere („zusammen-ziehen“)"],["konzelebrieren","gemeinsam feiern (Messe)","con- + celebrare („zusammen-feiern“)"],["Motor","Antrieb, „Beweger“","movere, motum („bewegen“)"],["Prävention","Vorbeugung","prae- + venire („zuvorkommen“)"],["Relikt","Überbleibsel","relinquere, relictum („zurücklassen“)"],["Reparatur","Wiederherstellung","re- + parare („wieder-bereiten“)"]]},{"type":"note","text":"Ab „Läsion“ sind die Spalten im Buch zum Ausfüllen – hier von der App ergänzt."}]},{"title":"L26–30 · Latein und die romanischen Sprachen","blocks":[{"type":"text","text":"Viele lateinische Wörter sind mit geringen Veränderungen in die romanischen Sprachen übergegangen. Auch das Geschlecht der Nomina hat sich großteils „weitervererbt“: lat. feminin → romanisch feminin; lat. maskulin → romanisch maskulin."},{"type":"tip","text":"Ausnahme sind die neutralen Wörter: Sie wurden im Französischen, Italienischen und Spanischen durchwegs maskulin. Beispiel: lat. vinum, -i (n.) → frz. le vin / ital. il vino / span. el vino."},{"type":"table","headers":["Latein","Französisch","Italienisch","Spanisch"],"rows":[["poeta („Dichter“): m.","le poète (m.)","il poeta (m.)","el poeta (m.)"],["veritas („Wahrheit“): f.","la vérité (f.)","la verità (f.)","la verdad (f.)"],["tempus („Zeit“): n.","le temps (m.!)","il tempo (m.!)","el tiempo (m.!)"]]},{"type":"task","q":"Ergänze die Artikel. numerus m. → … numéro / … numero / … número; lex f. → … loi / … legge / … ley; crimen n. → … crime / … crimine / … crimen.","a":"le numéro, il numero, el número („Zahl“); la loi, la legge, la ley („Gesetz“); le crime, il crimine, el crimen („Verbrechen“)."},{"type":"task","q":"Was bedeuten diese Wörter, und von welchem lateinischen Wort kommen sie?","a":"victoire = Sieg (victoria); miracolo = Wunder (miraculum); lágrima = Träne (lacrima); corps = Körper (corpus); campo = Feld (campus); mundo = Welt (mundus); arbre = Baum (arbor); mente = Geist (mens); invitación = Einladung (invitare)."}]},{"title":"L26–30 · Das Medium","blocks":[{"type":"text","text":"Neben Aktiv und Passiv gibt es im Lateinischen das Medium („das Mittlere“): Es hat passive Formen, wird aber reflexiv übersetzt („mich …“, „dich …“, „sich …“). Aus dem Medium sind auch die Deponentia entstanden."},{"type":"table","headers":["Form","Bedeutung","Beispiel"],"rows":[["Aktiv (aktive Formen)","ich tue etwas","lavo = „ich wasche“"],["Passiv (passive Formen)","mit mir geschieht etwas","lavor = „ich werde gewaschen“"],["Medium (passive Formen!)","ich tue etwas, was mich selbst betrifft","lavor = 1) „ich wasche mich“; 2) „ich bade“"]]},{"type":"tip","text":"Die Formen des Mediums sind identisch mit denen des Passivs – nur aus dem Zusammenhang erkennst du, ob es ein echtes Passiv oder ein Medium ist."},{"type":"task","q":"Übersetze passiv und medial: delectatur, movebar, vertuntur.","a":"delectatur = er/sie wird erfreut – er/sie freut sich; movebar = ich wurde bewegt – ich bewegte mich; vertuntur = sie werden gewendet – sie wenden sich."}]},{"title":"L26–30 · Wort- und Sachfelder","blocks":[{"type":"text","text":"Wortfamilien sind sinnverwandte Wörter mit demselben Wortstamm."},{"type":"list","items":["Wortfeld = inhaltlich zusammenhängende Wörter derselben Wortart (z. B. Wortfeld „Verkehr“: Auto, Straßenbahn, Ampel, Stau, St
