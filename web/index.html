 „missachten“; ciula: „Schiff“; ostium: „Mündung“; Tamesis: „die Themse“; perpessae sunt = passae sunt; proconsul: „Stellvertreter“; inire: auch „beginnen“; supra dictus: „vorher erwähnt“; sudis, -is f.: „Pfahl“; vadum: „Furt, seichte Stelle“; discrimen, -inis n.: „Gefahr“; ars: hier „Kriegslist“; in illa vice = in illa pugna; tertio: „zum dritten Mal“; nativitas, -atis f.: „Geburt“."},{"type":"task","q":"Übersetze den Text.","a":"Die Römer schickten Gesandte zu den Britanniern, um von ihnen Geiseln und Abgaben zu bekommen, wie sie sie von allen Gebieten und Inseln bekamen. Die Britannier aber missachteten, weil sie Tyrannen und hochmütig waren, die Gesandtschaft der Römer. Da wurde Julius Cäsar sehr zornig, kam mit sechzig Schiffen nach Britannien und hielt auf die Mündung der Themse zu; dort erlitten seine Schiffe Schiffbruch, während er selbst bei Dolobellus kämpfte, dem Stellvertreter des britannischen Königs; und Julius kehrte ohne Sieg zurück, nachdem seine Soldaten getötet und seine Schiffe zerbrochen worden waren. Und nach einem Zeitraum von drei Jahren kam er wieder mit einem großen Heer und dreihundert Schiffen und gelangte bis zur Mündung des Flusses, der Themse genannt wird. Dort begannen die Römer den Krieg, und viele von ihren Pferden und Soldaten fielen, weil der oben erwähnte Stellvertreter eiserne Pfähle in die seichten Stellen des Flusses gesetzt hatte. Diese unsichtbare Kriegslist war eine große Gefahr für die römischen Soldaten, und sie zogen in jenem Kampf ohne Frieden ab. Zum dritten Mal wurde der Krieg nahe dem Ort geführt, der Trinovantum heißt; und Julius erhielt die Herrschaft über das britannische Volk 47 Jahre vor Christi Geburt."}]},{"title":"I.3 B – Die Eroberung Britanniens (Historia Brittonum 21)","blocks":[{"type":"text","text":"Erst fast hundert Jahre nach Cäsar wurde Britannien erobert: Kaiser Claudius (41–54 n. Chr.), der nicht sehr beliebt war, wollte durch militärische Erfolge sein Image aufpolieren, setzte mit einem riesigen Heer über und besetzte große Teile Britanniens (etwa das heutige England)."},{"type":"text","text":"Secundus post hunc Claudius imperator venit et in Brittannia imperavit annis quadraginta octo post adventum Christi et bellum fecit magnum non absque detrimento militum; tamen victor fuit in Brittannia; et postea cum ciulis perrexit ad Orcades insulas et subiecit sibi et fecit eas tributarias."},{"type":"gloss","text":"absque = sine; detrimentum: „Verlust“; ciula: „Schiff“; Orcades, -um f.: „Orkney-Inseln“ (nördlich von Schottland)."},{"type":"task","q":"Übersetze den Text.","a":"Als Zweiter nach diesem kam Kaiser Claudius und herrschte in Britannien 48 Jahre nach der Ankunft Christi; er führte einen großen Krieg, nicht ohne Verluste an Soldaten; dennoch war er in Britannien Sieger; und danach zog er mit Schiffen zu den Orkney-Inseln, unterwarf sie sich und machte sie tributpflichtig."}]},{"title":"I.3 C – Der Hadrianswall (Historia Brittonum 22)","blocks":[{"type":"text","text":"Im Norden sicherte man die Provinz durch starke Grenzbefestigungen. Errichtet wurden sie unter Kaiser Hadrian (117–138); Septimius Severus, den der Autor als Erbauer nennt, ließ den Bau wahrscheinlich nur verstärken."},{"type":"text","text":"Tertius fuit Severus, qui transfretavit ad Brittannos; ibi, ut receptas provincias ab incursione barbarica faceret tutiores, murum et aggerem a mari usque ad mare per latitudinem Brittanniae, id est per CXXXII milia passuum, deduxit. Propterea iussit (murum) fieri inter Brittones et Pictos et Scottos, quia Scotti ab occidente et Picti ab aquilone unanimiter pugnabant contra Brittones, nam et ipsi pacem inter se habebant; et non multo post intra Brittanniam Severus moritur."},{"type":"gloss","text":"transfretare: „über das Meer fahren“; agger, -eris m.: „Wall“; milia passuum: „Meilen“; deducere: „errichten“; Picti: „Pikten“ (Volk in Schottland); aquilo, -onis m.: „Norden“."},{"type":"task","q":"Übersetze den Text.","a":"Der Dritte war Severus, der zu den Britanniern übersetzte; dort errichtete er, um die gewonnenen Provinzen vor dem Einfall der Barbaren sicherer zu machen, eine Mauer und einen Wall von Meer zu Meer quer durch Britannien, das heißt über 132 Meilen. Er ließ die Mauer deshalb zwischen den Britanniern einerseits und den Pikten und Skoten andererseits errichten, weil die Skoten vom Westen und die Pikten vom Norden her einmütig gegen die Britannier kämpften; denn sie selbst hatten untereinander Frieden. Und nicht viel später stirbt Severus in Britannien."}]},{"title":"I.3 Arbeitsaufgaben (Britannien)","blocks":[{"type":"task","q":"A: Finde lateinische Synonyme derselben Wortart zu a) ciulis (Z. 4), b) dicitur (Z. 14).","a":"a) navibus (naves); b) vocatur"},{"type":"task","q":"A: Britannicae gentis (Z. 15) heißt übersetzt: „des brit. Volkes“, „vom brit. Volk“, „über das brit. Volk“ oder „zum brit. Volk“?","a":"„über das britannische Volk“ (imperium + Genitiv: Herrschaft über …)"},{"type":"task","q":"B: Zerlege in Präfix/Suffix und Grundwort: a) adventum, b) victor, c) subiecit.","a":"a) ad- (hin, an) + venire (kommen) = Ankunft; b) vincere (siegen) + -tor (Täter) = Sieger; c) sub- (unter) + iacere (werfen) = unterwarf"},{"type":"task","q":"B: Richtig oder falsch? a) Claudius führte in Britannien Krieg ohne Verlust von Soldaten. b) Claudius unterwarf die Orkney-Inseln.","a":"a) falsch (non absque detrimento militum = nicht ohne Verluste); b) richtig"},{"type":"task","q":"C: Aus welchen Wörtern setzt sich unanimiter (Z. 6) zusammen?","a":"unus (ein) + animus (Geist, Sinn) + Adverb-Endung -iter = „einmütig“"},{"type":"task","q":"C: a) ut (Z. 1) heißt „wie“, „damit“ oder „als“? b) post (Z. 7) heißt „nach“, „hinter“ oder „später“?","a":"a) „damit“ (ut + Konjunktiv faceret); b) „später“ (non multo post = nicht viel später)"},{"type":"task","q":"C: Ergänze: a) Severus errichtete einen Wall, um … b) Die Länge des Walls betrug …","a":"a) … die gewonnenen Provinzen vor den Einfällen der Barbaren (Pikten und Skoten) zu schützen. b) … 132 Meilen."}]},{"title":"Info: Der Hadrianswall","blocks":[{"type":"text","text":"Der Hadrianswall gilt als eines der bemerkenswertesten Bauwerke der Antike. Er wurde unter Kaiser Hadrian im frühen 2. Jh. n. Chr. als Schutz der Nordgrenze der Provinz Britannia vor schottischen und irischen Stämmen errichtet und erstreckt sich über die ganze Breite der Insel – ungefähr dort, wo heute die Grenze zwischen England und Schottland liegt. Er bestand teils aus einem Erdwall, teils aus mehrere Meter hohen Mauern mit Toren, Wachttürmen und Kastellen. Große Teile stehen noch heute; er ist UNESCO-Weltkulturerbe."},{"type":"task","q":"Wie hieß der Wall, durch den sich die Römer vor den Germanen schützten?","a":"Der Limes (obergermanisch-raetischer Limes)."}]},{"title":"II.1 A – Beginn der Christenverfolgungen in Österreich (Passio Floriani 2)","blocks":[{"type":"text","text":"Florian wirkte auf dem Gebiet des heutigen Österreich. Er diente unter den Kaisern Diokletian und Maximian im römischen Heer, wurde Amtsvorsteher des Statthalters der Provinz Noricum Ripense (Ufernorikum, zwischen Donau und Alpen) und übersiedelte nach seiner Pensionierung nach Cetium (St. Pölten). Schon als Soldat war er Christ geworden."},{"type":"text","text":"Ergo in illis diebus cum venisset sacrilegorum principum praeceptio apud Noricum Ripense, tunc adveniens praeses in castrum Lauriacense coepit vehementer inquirere Christianos. Et comprehensi sunt sanctorum numero quadraginta, qui – multis suppliciis cruciati – missi sunt in carcerem. Ad quorum confessionem beatus Florianus gaudens successit. Qui cum habitaret apud Cetium civitatem, audiens haec fieri apud Lauriacum, dixit ad suos: „Oportet me Lauriacum ambulare ad praesidem et ibidem pro Christi nomine diversa supplicia sustinere.“"},{"type":"gloss","text":"sacrilegus: „gottlos“; praeceptio, -onis f.: „Befehl“; apud: hier „nach“; praeses, -sidis m.: „Statthalter“; Lauriacensis: „von Lauriacum“ (heute Lorch bei Enns); supplicium: „Strafe, Folter“; confessio: „Bekenntnis (zu Gott)“; succedere: „nachfolgen“; sui: „die Seinigen“; Lauriacum: „nach Lauriacum“."},{"type":"task","q":"Übersetze den Text.","a":"Als also in jenen Tagen der Befehl der gottlosen Kaiser nach Ufernorikum gekommen war, begann der Statthalter, der in das Lager von Lauriacum kam, heftig nach Christen zu forschen. Und es wurden vierzig Heilige ergriffen, die – mit vielen Folterqualen gepeinigt – ins Gefängnis geworfen wurden. Ihrem Bekenntnis folgte der selige Florian freudig nach. Als er, der in der Stadt Cetium wohnte, hörte, dass dies in Lauriacum geschah, sagte er zu den Seinen: „Ich muss nach Lauriacum zum Statthalter gehen und dort für den Namen Christi verschiedene Qualen ertragen.“"}]},{"title":"II.1 B – Florians Tod (Passio Floriani 4–8)","blocks":[{"type":"text","text":"Vor Lauriacum begegnet Florian einigen Soldaten und gesteht ihnen bereitwillig, dass er Christ ist. Er wird gefangen genommen und zum Statthalter geführt."},{"type":"text","text":"Praeses dixit ad eum: „Floriane, ut quid ista de te dicuntur? Veni, sacrifica dis, sicut et ego vel commilitones tui, ut vivas nobiscum et non cum contemptoribus puniaris secundum praecepta imperatorum.“ Beatus Florianus respondit: „Hoc ego non sum facturus; (id,) quod autem tibi praeceptum est, exerce!“ In furorem autem conversus praeses iussit eum fustibus caedi. Milites coeperunt eum caedere. Cum autem caederent eum, dicit ei praeses: „Sacrifica dis, Floriane, et libera te de tormentis!“ Beatus Florianus respondit: „Ego verum sacrificium modo offero Domino Deo meo Iesu Christo.“ Haec autem sancto viro dicente iussit eum praeses iterum caedi. Cum autem caederetur beatus Florianus, ita hilari vultu psallebat sicut in gaudio aut in laetitia magna constitutus. Tunc iniquissimus praeses iussit eum duci ad fluvium Anesum et ibi praecipitari de ponte. Beatus Florianus gaudens ita hilaris pergebat, quasi ad lavacrum duceretur. Cum autem pervenissent ad locum, ubi eum habebant proicere, ligaverunt lapidem ad collum eius. Rogabat autem beatus Florianus milites, qui eum tenebant, ut permitterent eum orare Dominum. Et oravit quasi unius horae spatium. Tunc adveniens quidam iuvenis plenus ira dixit ad milites: „Quid statis et non facitis iussionem praesidis?“ Et haec dicens praecipitavit eum de ponte in fluvium et statim oculi eius crepuerunt."},{"type":"gloss","text":"ut quid = cur; commilito, -onis m.: „Kamerad“; contemptor, -oris m.: „Verächter (der Götter)“; secundum (+ Akk.): „gemäß“; sum facturus = faciam; exercere: hier „ausführen“; in furorem conversus: „wütend geworden“; fustis, -is m.: „Knüppel“; caedere: hier „schlagen“; tormentum: „Folter“; modo: „nur“; psallere: „Psalmen singen“; sicut in … constitutus: „als ob er in … versetzt worden wäre“; iniquus: „erzürnt“; Anesus: „Enns“; quasi: „als ob“ / bei Zahlen „beinahe“; lavacrum: „Bad“; habere (+ Inf.) = debere; proicere: „herabwerfen“; orare (+ Akk.): „beten zu“; oculi crepuerunt: „die Augen wurden starr“ (= er starb)."},{"type":"task","q":"Übersetze den Text.","a":"Der Statthalter sagte zu ihm: „Florian, warum wird das über dich gesagt? Komm, opfere den Göttern, wie auch ich oder deine Kameraden, damit du mit uns lebst und nicht mit den Verächtern gemäß den Befehlen der Kaiser bestraft wirst.“ Der selige Florian antwortete: „Das werde ich nicht tun; was dir aber befohlen worden ist, das führe aus!“ Wütend geworden, befahl der Statthalter, ihn mit Knüppeln zu schlagen. Die Soldaten begannen, ihn zu schlagen. Während sie ihn schlugen, sagte der Statthalter zu ihm: „Opfere den Göttern, Florian, und befreie dich von den Qualen!“ Der selige Florian antwortete: „Ich bringe das wahre Opfer nur meinem Herrn und Gott Jesus Christus dar.“ Als der heilige Mann dies sagte, ließ ihn der Statthalter erneut schlagen. Während der selige Florian aber geschlagen wurde, sang er mit so heiterer Miene Psalmen, als ob er in Freude oder großes Glück versetzt worden wäre. Da befahl der höchst erzürnte Statthalter, ihn zum Fluss Enns zu führen und dort von der Brücke zu stürzen. Der selige Florian ging freudig und so heiter, als ob er zu einem Bad geführt würde. Als sie zu der Stelle gekommen waren, wo sie ihn hinabwerfen sollten, banden sie ihm einen Stein an den Hals. Der selige Florian bat die Soldaten, die ihn hielten, ihm zu erlauben, zum Herrn zu beten. Und er betete beinahe eine Stunde lang. Da kam ein junger Mann voll Zorn und sagte zu den Soldaten: „Was steht ihr da und führt den Befehl des Statthalters nicht aus?“ Und mit diesen Worten stürzte er ihn von der Brücke in den Fluss, und sofort wurden seine Augen starr."}]},{"title":"II.1 Arbeitsaufgaben (Florian)","blocks":[{"type":"task","q":"A: Welche zwei Aussagen stimmen mit dem Text überein? 400 Christen wurden verhaftet. – Die Christen wurden gefoltert. – Florian beschloss, nach Lauriacum zu reisen. – Florian wurde ebenfalls gefoltert.","a":"„Die Christen wurden gefoltert“ (multis suppliciis cruciati) und „Florian beschloss, nach Lauriacum zu reisen“ (Oportet me Lauriacum ambulare). Es waren 40, nicht 400 Christen; von Florians Folter erzählt Text A noch nicht."},{"type":"task","q":"B: Liste alle Imperative der ersten beiden Absätze auf.","a":"veni, sacrifica, exerce, sacrifica, libera"},{"type":"task","q":"B: Aus welchen Wörtern setzt sich sacrificium zusammen?","a":"sacer (heilig) + facere (machen) = „heilige Handlung“, Opfer"},{"type":"task","q":"B: Finde verwandte lateinische Wörter zu: a) (Bundes-)Liga b) Fakten c) Lokal d) Oblate e) Station f) Union.","a":"a) ligaverunt (ligare = binden); b) facturus/sacrifica (facere); c) locum (locus); d) offero (oblatum, von offerre); e) statis (stare); f) unius (unus)"},{"type":"task","q":"B: Haec sancto viro dicente (Z. 9) heißt: „als er dies dem heiligen Mann sagte“, „als der heilige Mann dies sagte“, „als diese zum heiligen Mann sprach“ oder „als dies vom heiligen Mann gesagt worden war“?","a":"„als der heilige Mann dies sagte“ (Ablativus absolutus, gleichzeitig)"},{"type":"task","q":"B: Belege mit einem Zitat: a) Der Statthalter möchte Florian vor dem Tod bewahren. b) Florian möchte den Göttern kein Opfer bringen. c) Florian hat keine Angst vor dem Tod.","a":"a) „Veni, sacrifica dis …, ut vivas nobiscum“ / „libera te de tormentis!“; b) „Hoc ego non sum facturus“ / „Ego verum sacrificium modo offero Domino Deo meo“; c) „Beatus Florianus gaudens ita hilaris pergebat, quasi ad lavacrum duceretur.“"}]},{"title":"Info: Christenverfolgungen und Florian","blocks":[{"type":"text","text":"Christen wurden nicht wegen ihres Glaubens an sich hingerichtet, sondern weil sie sich weigerten, den römischen Staatsgöttern oder dem Genius (Schutzgott) des Kaisers zu opfern. Die heidnischen Römer konnten den Eingottglauben der Christen nicht nachvollziehen und sahen in der Weigerung einen staatsgefährdenden Akt."},{"type":"text","text":"Florian wurde zum Schutzpatron der Feuerwehr: In Bildern erhalten Heilige Attribute, die sich auf ihr Wirken oder Martyrium beziehen. Um seinen Tod in der Enns darzustellen, gab man ihm einen Kübel Wasser in die Hand – damit hatte er ein Mittel zum Löschen von Feuer."},{"type":"text","text":"Das „Floriani-Prinzip“ ist der Wunsch, ein notwendiges Übel (z. B. eine Müllverbrennungsanlage) möge nicht einen selbst, sondern die Nachbarn treffen – nach dem scherzhaften Gebet: „Lieber heiliger Florian, schütz unser Haus, zünd's andre an!“"}]},{"title":"II.2 A – Ein Sieg gegen die Germanen mit Gottes Hilfe (Eugippius, Vita Sancti Severini 4)","blocks":[{"type":"text","text":"Ab dem Ende des 4. Jh. wurde die Lage in den Grenzgebieten immer unsicherer; germanische Stämme fielen ein und verwüsteten das Land. Die romanisierte Bevölkerung Noricums konnte sich weder auf die Verwaltung noch auf militärischen Schutz verlassen. Die „Vita Sancti Severini“ beschreibt diese Zeit: Severin, ein Mönch unbekannter Herkunft, setzte sich unermüdlich für die geplagte Bevölkerung ein."},{"type":"text","text":"Eodem tempore inopinata subreptione praedones barbari, quidquid hominum pecudumque extra muros reppererant, duxerunt captivum. Tunc plures e civibus ad virum Dei cum lacrimis confluentes inlatae calamitatis exitium rettulerunt, simul ostendentes indicia recentium rapinarum. Ille vero Mamertinum percontatus est – tunc tribunum, qui post episcopus ordinatus est –, utrum aliquos secum haberet armatos, cum quibus latrunculos sequeretur instantius. Qui respondit: „Milites quidem habeo paucissimos, sed non audeo cum tanta hostium turba confligere. Quod si tua veneratio praecipit, quamvis auxilium nobis desit armorum, credimus tamen tua nos fieri oratione victores.“ Et Dei famulus ait: „Etiam si inermes sunt tui milites, nunc ex hostibus armabuntur: Nec enim numerus aut fortitudo humana requiritur, ubi propugnator deus per omnia comprobatur.“ Exeuntes igitur in secundo miliario super rivum, qui vocatur Tiguntia, praedictos latrones inveniunt. Quibus in fugam repente conversis arma omnium sustulerunt, ceteros vero vinctos ad Dei famulum, ut praeceperat, adduxerunt captivos. Quos absolutos vinculis (et) cibo potuque refectos paucis (verbis) alloquitur: „Ite et vestris denuntiate complicibus, ne aviditate praedandi ultra huc audeant propinquare! Nam statim caelestis vindictae iudicio punientur!“"},{"type":"gloss","text":"subreptio, -onis f.: „Plünderungszug“; praedo, -onis m.: „Räuber“; captivum ducere: „als Beute wegführen“; percontari: „fragen“; post = postea; ordinare: „einsetzen (als …)“; latrunculus: „Räuber“; instantius = statim; confligere: „kämpfen“; tua veneratio: „Euer Hochwürden“; oratio: „Gebet“; requirere: „benötigen“; comprobare: passiv „sich erweisen als“; miliarium: „Meilenstein“; praedictus: „vorher erwähnt“; in fugam convertere: „in die Flucht schlagen“; captivos: „als Gefangene“; vinculis absolvere: „von den Fesseln befreien“; denuntiare: „erklären“; complex, -icis m.: „Komplize“; ultra: „weiterhin“."},{"type":"task","q":"Übersetze den Text.","a":"Zur selben Zeit führten barbarische Räuber bei einem unerwarteten Plünderungszug alles an Menschen und Vieh, was sie außerhalb der Mauern gefunden hatten, als Beute weg. Da strömten mehrere Bürger unter Tränen zum Mann Gottes, berichteten vom Unglück, das über sie gekommen war, und zeigten zugleich die Spuren der frischen Raubzüge. Er aber fragte Mamertinus – damals Tribun, der später als Bischof eingesetzt wurde –, ob er einige Bewaffnete bei sich habe, mit denen er die Räuber sofort verfolgen könne. Dieser antwortete: „Soldaten habe ich zwar sehr wenige, aber ich wage nicht, mit einer so großen Schar von Feinden zu kämpfen. Wenn Euer Hochwürden es aber befiehlt, glauben wir, obwohl uns die Hilfe der Waffen fehlt, dennoch durch dein Gebet Sieger zu werden.“ Und der Diener Gottes sagte: „Auch wenn deine Soldaten unbewaffnet sind, werden sie jetzt von den Feinden bewaffnet werden: Denn weder Zahl noch menschliche Tapferkeit ist nötig, wo sich Gott in allem als Vorkämpfer erweist.“ Als sie also hinauszogen, fanden sie beim zweiten Meilenstein am Bach, der Tiguntia heißt, die erwähnten Räuber. Nachdem diese plötzlich in die Flucht geschlagen worden waren, nahmen sie allen die Waffen ab, die Übrigen aber führten sie gefesselt, wie er befohlen hatte, als Gefangene zum Diener Gottes. Diese ließ er von den Fesseln befreien, mit Speise und Trank stärken und sprach sie mit wenigen Worten an: „Geht und erklärt euren Komplizen, dass sie es nicht wagen sollen, sich aus Beutegier weiterhin hierher zu nähern! Denn sie werden sofort durch das Urteil der himmlischen Rache bestraft werden!“"}]},{"title":"II.2 B – Severin verkündet Odoaker die Zukunft (Eugippius, Vita Sancti Severini 6 f.)","blocks":[{"type":"text","text":"Severin soll auch Wunder bewirkt haben. Als er einen schwer Gichtkranken aus dem germanischen Stamm der Rugier heilte, wurde er auch unter den Germanen bekannt."},{"type":"text","text":"Ex illo igitur tempore, quo est reddita sanitas desperato, universa Rugorum gens ad Dei famulum frequentans coepit gratulationis obsequium reddere et opem suis postulare languoribus. De aliis etiam gentibus, ad quas tanti miraculi fama pervenerat, multi Christi militem videre cupiebant. Qua devotione, etiam ante hoc factum, quidam barbari, cum ad Italiam pergerent, promerendae benedictionis causa ad eum deverterunt. Inter quos et Odovacar, qui postea regnavit Italiae, vilissimo tunc habitu iuvenis statura procerus advenerat. Qui cum se, ne humillimae tectum cellulae suo vertice contingeret, inclina(vi)sset, a viro Dei gloriosum se fore cognovit. Cui etiam valedicenti: „Vade“, inquit, „ad Italiam, vade, vilissimis nunc pellibus coopertus, sed multis cito plurima largiturus!“"},{"type":"gloss","text":"desperatus: „der Verzweifelte“; gratulationis obsequium reddere: „dankbaren Gehorsam erweisen“; languor, -oris m.: „Bedrängnis, Notlage“; devotio: „Ergebenheit“; promerere: „erhalten“; devertere: „einkehren“; regnare (+ Gen.): „herrschen über“; habitus, -us m.: „Kleidung“; statura procerus: „großgewachsen“; tectum: „Decke“; vertex, -icis m.: „Kopf“; valedicere: „sich verabschieden“; coopertus: „bedeckt“; cito = mox; plurima largiturus: „der du sehr viel schenken wirst“."},{"type":"task","q":"Übersetze den Text.","a":"Von jener Zeit an also, in der dem Verzweifelten die Gesundheit zurückgegeben worden war, begann das ganze Volk der Rugier, häufig zum Diener Gottes zu kommen, ihm dankbaren Gehorsam zu erweisen und Hilfe in ihren Nöten zu erbitten. Auch von anderen Völkern, zu denen die Kunde von einem so großen Wunder gelangt war, wollten viele den Soldaten Christi sehen. Aus dieser Ergebenheit kehrten schon vor diesem Ereignis einige Barbaren, als sie nach Italien zogen, bei ihm ein, um seinen Segen zu erhalten. Unter ihnen war auch Odoaker, der später über Italien herrschte, damals ein großgewachsener junger Mann in ganz ärmlicher Kleidung. Als er sich gebückt hatte, um mit seinem Kopf nicht an die Decke der sehr niedrigen Zelle zu stoßen, erfuhr er vom Mann Gottes, dass er berühmt sein werde. Zu ihm sagte er auch beim Abschied: „Geh nach Italien, geh – jetzt mit ganz ärmlichen Fellen bedeckt, aber bald wirst du vielen sehr viel schenken!“"}]},{"title":"II.2 Arbeitsaufgaben (Severin)","blocks":[{"type":"task","q":"A: Liste alle PPP des letzten Absatzes mit Bezugswort auf.","a":"praedictos (latrones), conversis (quibus), vinctos (ceteros), absolutos (quos), refectos (quos)"},{"type":"task","q":"A: Zerlege: a) confluentes b) inlatae c) propugnator d) refectos e) aviditate.","a":"a) con- (zusammen) + fluere (fließen) = zusammenströmend; b) in- (hinein, auf) + latum (ferre, tragen) = zugefügt; c) pro- (vor, für) + pugnare (kämpfen) + -tor (Täter) = Vorkämpfer; d) re- (wieder) + facere (machen) = wiederhergestellt, gestärkt; e) avidus (gierig) + -tas (Eigenschaft) = Gier"},{"type":"task","q":"A: Ergänze: a) Die Bürger kamen klagend zu Severin, weil … b) Severin bat Mamertinus darum, … c) Mamertinus wollte zuerst nicht helfen, weil … d) Die Soldaten erhielten Waffen von …","a":"a) … Räuber Menschen und Vieh außerhalb der Mauern als Beute weggeführt hatten. b) … die Räuber mit Bewaffneten sofort zu verfolgen. c) … er nur sehr wenige Soldaten hatte und gegen so viele Feinde nicht zu kämpfen wagte. d) … den Feinden (den Räubern)."},{"type":"task","q":"B: Mit welchen drei Ausdrücken wird Severin bezeichnet?","a":"Dei famulus (Diener Gottes), Christi miles (Soldat Christi), vir Dei (Mann Gottes)"},{"type":"task","q":"B: Finde im zweiten Absatz eine Anapher.","a":"„Vade …, vade“ (Vade ad Italiam, vade …)"},{"type":"task","q":"B: Richtig oder falsch? a) Die Rugier erbaten Hilfe von Severin. b) Die Wundergeschichte war bis zu den Germanen gedrungen. c) Severin besuchte Odoaker. d) Odoaker verbeugte sich aus Höflichkeit vor Severin. e) Severin riet Odoaker, nach Italien zu gehen.","a":"a) richtig; b) richtig; c) falsch – Odoaker kam zu Severin; d) falsch – er bückte sich, um nicht an die niedrige Decke zu stoßen; e) richtig (Vade ad Italiam)"}]},{"title":"Info: Severin und Odoaker","blocks":[{"type":"text","text":"Severin wird gelegentlich „Apostel Noricums“ genannt: Er wirkte an mehreren Orten im Donauraum, gründete in Favianis (Mautern) ein Kloster, organisierte Hilfslieferungen von Lebensmitteln und Kleidung, verhandelte mit den Germanen, erreichte die Freilassung von Gefangenen und warnte die Bevölkerung rechtzeitig vor Gefahren. Kurz vor seinem Tod (482) sagte er voraus, dass die romanische Bevölkerung bald nach Italien zurückziehen müsse."},{"type":"text","text":"Odoaker war ein germanischer Fürst im römischen Heer. Nachdem der General Orestes den letzten rechtmäßigen weströmischen Kaiser vertrieben und seinen Sohn Romulus Augustulus zum Kaiser gemacht hatte, erhoben sich die germanischen Söldner unter Odoaker. Er tötete 476 Orestes, setzte Romulus Augustulus ab und ernannte sich zum König Italiens – das Ende des weströmischen Kaiserreiches."}]},{"title":"II.3 A – Prächtiges Wien (Piccolomini, Historia Friderici III. imperatoris)","blocks":[{"type":"text","text":"Enea Silvio Piccolomini, der spätere Papst Pius II., war einer der bedeutendsten Gelehrten des 15. Jh. Als Sekretär Kaiser Friedrichs III. lebte er einige Zeit in Wien und beschrieb die Stadt ausführlich."},{"type":"text","text":"Danubius multas et memorabiles alluit urbes, inter quas mea sententia nulla ditior, nulla populosior, nulla venustior est quam Vienna, Austrialium civitatum regionisque caput. […] Urbs autem fossatum magnum habet, inde aggerem praealtum, moenia deinde spissa et sublimia, frequentes turres et propugnacula ad bellum prompta. Aedes civium (sunt) amplae et ornatae, structura solida et firma; ubique fornices, aulae latae. Verum his aestuaria sunt, quae ab his „stubae“ vocantur. Nam hiemis asperitatem hoc domitant modo. Fenestrae undique vitreae perlucent et ostia plerumque ferrea. In his plurimae aves cantant. In domibus (est) multa et munda suppellex. Equorum iumentorumque omnis generis (sunt) capacia stabula. Altae domorum facies magnificaeque visuntur."},{"type":"gloss","text":"alluere (+ Akk.): „durch … fließen“; ditior: Komparativ zu dives; Austrialis: „österreichisch“; fossatus, -us: „Graben“; inde: hier „davor“; agger: „Wall“; spissus: „dick“; propugnaculum: „Bollwerk, Schutzmauer“; structura: „Bauweise“; fornix, -icis m.: „Gewölbe“; aestuarium: „heizbarer Raum“; supellex, -ectilis f.: „Einrichtung“; iumentum: „Zugvieh“; capax (+ Gen.): „groß genug für“; facies: hier „Fassade“."},{"type":"task","q":"Übersetze den Text.","a":"Die Donau fließt durch viele und denkwürdige Städte, unter denen meiner Meinung nach keine reicher, keine volkreicher, keine schöner ist als Wien, die Hauptstadt der österreichischen Gemeinden und des Landes. Die Stadt hat einen großen Graben, davor einen sehr hohen Wall, dann dicke und hohe Mauern, zahlreiche Türme und für den Krieg bereite Bollwerke. Die Häuser der Bürger sind geräumig und geschmückt, in solider und fester Bauweise; überall Gewölbe, weite Hallen. Sie haben aber heizbare Räume, die von ihnen „Stuben“ genannt werden. Denn auf diese Weise bezwingen sie die Härte des Winters. Überall glänzen gläserne Fenster, und die Türen sind meist aus Eisen. In ihnen singen sehr viele Vögel. In den Häusern gibt es viel und saubere Einrichtung. Für Pferde und Zugvieh jeder Art gibt es geräumige Ställe. Man sieht hohe und prächtige Fassaden der Häuser."}]},{"title":"II.3 B – Die Wiener Universität (Piccolomini)","blocks":[{"type":"text","text":"Schola quoque hic est liberalium artium ac theologiae et iuris pontificii, nova tamen et ab Urbano sexto papa concessa. Magnus studentium numerus eo perfluit ex Ungaria et Alamania. Ceterum studentes ipsi voluptati operam praebent, vini cibique avidi. Pauci emergunt docti neque sub censura tenentur, die noctuque vagantur magnasque civibus molestias inferunt."},{"type":"gloss","text":"ius pontificium: „kanonisches Recht“ (Kirchenrecht); perfluere: „zusammenströmen“; Alamania: „Süddeutschland“; operam praebere: „sich widmen“; avidus (+ Gen.): „gierig nach“; doctus emergere: „zu einem Gelehrten werden“; sub censura teneri: „kontrolliert werden“; molestias inferre: „Ärger verursachen“."},{"type":"task","q":"Übersetze den Text.","a":"Hier gibt es auch eine Schule (Universität) der freien Künste, der Theologie und des Kirchenrechts, die aber neu ist und von Papst Urban VI. genehmigt wurde. Eine große Zahl von Studenten strömt dorthin aus Ungarn und Süddeutschland zusammen. Im Übrigen widmen sich die Studenten selbst dem Vergnügen, gierig nach Wein und Essen. Wenige werden zu Gelehrten, und sie werden nicht kontrolliert, ziehen Tag und Nacht umher und verursachen den Bürgern großen Ärger."}]},{"title":"II.3 C – Die sittenlose Bevölkerung (Piccolomini)","blocks":[{"type":"text","text":"Ceterum in tanta et tam nobili civitate multa enormia sunt. Die noctuque rixae ad modum proelii geruntur; nunc artifices contra studentes, nunc curiales in artifices, nunc isti opifices adversus alios arma sumunt. Rara celebritas absque homicidio peragitur, frequentes caedes committuntur. Ubi rixa est, non sunt, qui dividant contendentes, neque magistratus neque principes custodiam, ut par esset, ad tanta mala adhibent. Omnes fere cives vinarias tabernas colunt, stubas calefaciunt, coquinam instruunt, bibulos et meretrices accersunt hisque cibi aliquid cocti gratis praebent, ut amplius bibant; sed minorem mensuram his dant. Plebs ventri dedita, vorax, quidquid hebdomada manu quaesivit, id festo die totum absumit. Lacerum et incompositum (est) vulgus; meretricum maximus numerus. Raro mulier est uno contenta viro. Vivunt praeterea sine ulla scripta lege; mores aiunt se tenere vetustos, quos saepe ad suum sensum vel adducunt vel interpretantur. Ius admodum venale est; (ii,) qui possunt, sine poena peccant."},{"type":"gloss","text":"enormis: „eigenartig“; ad modum proelii: „nach Art eines Kampfes“; curialis: „Beamter“; celebritas: „Feier“; absque = sine; non sunt, qui …: „es gibt keine Leute, die …“; custodia: „Wache“; ut par esset: „wie es sich gehören würde“; vinaria taberna: „Weinstube“; colere: „betreiben“; stuba: „Stube“; calefacere: „beheizen“; coquina: „Küche“; bibulus: „Trinker“; accersere: „anlocken“; gratis: „umsonst“; minorem mensuram dare: „zu wenig einschenken“; deditus: „ergeben“; hebdomada: „Woche“; quaerere: hier „verdienen“; lacer: „zerlumpt“; incompositus: „ungehobelt“; ad suum sensum: „nach ihrem Sinn“; adducere: „heranziehen“; admodum: „völlig“; venalis: „käuflich“."},{"type":"task","q":"Übersetze den Text.","a":"Im Übrigen gibt es in einer so großen und so vornehmen Stadt viel Eigenartiges. Tag und Nacht werden Raufereien nach Art einer Schlacht ausgetragen; bald greifen die Handwerker gegen die Studenten, bald die Beamten gegen die Handwerker, bald diese Arbeiter gegen andere zu den Waffen. Selten wird ein Fest ohne Mord gefeiert, häufig werden Morde begangen. Wo es eine Rauferei gibt, ist niemand da, der die Streitenden trennt, und weder die Behörden noch die Fürsten setzen gegen so große Übel eine Wache ein, wie es sich gehören würde. Fast alle Bürger betreiben Weinstuben, beheizen Stuben, richten eine Küche ein, locken Trinker und Dirnen an und geben ihnen umsonst etwas gekochtes Essen, damit sie mehr trinken; aber sie schenken ihnen zu wenig ein. Das Volk ist dem Bauch ergeben, gefräßig, und was es in der Woche mit der Hand verdient hat, verbraucht es am Feiertag ganz. Das Volk ist zerlumpt und ungehobelt; es gibt sehr viele Dirnen. Selten ist eine Frau mit einem Mann zufrieden. Außerdem leben sie ohne jedes geschriebene Gesetz; sie sagen, sie hielten sich an alte Sitten, die sie oft nach ihrem Sinn heranziehen oder auslegen. Das Recht ist völlig käuflich; wer kann, sündigt ohne Strafe."}]},{"title":"II.3 Arbeitsaufgaben (Wien)","blocks":[{"type":"task","q":"A: Finde eine Anapher.","a":"„nulla ditior, nulla populosior, nulla venustior“"},{"type":"task","q":"A: Finde Synonyme derselben Wortart zu: a) sublimia b) frequentes c) aedes d) modo.","a":"a) praealtum (altae); b) plurimae (multae); c) domibus (domorum); d) – (z. B. „hoc … modo“ = so; Synonym: ita/sic)"},{"type":"task","q":"B: Finde verwandte lateinische Wörter: a) Konzession b) Partei c) renovieren d) Vagabund e) Zivilisation.","a":"a) concessa (concedere); b) – (pars; im Text nicht direkt – vgl. pauci?); c) nova (novus); d) vagantur (vagari); e) civibus (civis)"},{"type":"task","q":"B: Richtig oder falsch? a) Papst Urban VI. hatte eine theologische Fakultät in Wien bewilligt. b) Zuvor waren viele Studenten nach Ungarn gegangen. c) Die Studenten sind vergnügungssüchtig. d) Die Studenten belästigen die Bürger.","a":"a) richtig; b) falsch – die Studenten kommen aus Ungarn nach Wien; c) richtig (voluptati operam praebent); d) richtig (molestias inferunt)"},{"type":"task","q":"C: Zerlege: a) artifices b) opifices c) homicidio d) calefaciunt.","a":"a) ars (Kunst) + facere (machen) = Handwerker; b) opus (Werk) + facere = Arbeiter; c) homo (Mensch) + caedere (töten) = Mord; d) calere (warm sein) + facere = beheizen"},{"type":"task","q":"C: Ergänze: a) Selten findet eine Feier statt, ohne dass … b) Die Betreiber von Weinstuben bieten gratis Essen an, damit … c) Bei Gesetzesübertretungen entgeht man der Strafe durch …","a":"a) … jemand ermordet wird. b) … die Gäste mehr trinken. c) … Geld (das Recht ist käuflich)."}]},{"title":"Info: Die mittelalterliche Universität","blocks":[{"type":"text","text":"Voraussetzung für ein Studium waren ausreichende Lateinkenntnisse – die Unterrichtssprache war Latein; man konnte schon mit 14 Jahren beginnen. Zuerst lernte jeder an der Artistenfakultät die sieben freien Künste (artes liberales: Grammatik, Rhetorik, Dialektik, Arithmetik, Geometrie, Astronomie, Musik); erst danach konnte man an einer der drei übrigen Fakultäten (Medizin, Jurisprudenz, Theologie) studieren. Viele begnügten sich mit dem Titel Baccalarius statt Magister. Die Universität Wien ist die zweitälteste im deutschen Sprachraum: gegründet 1365 von Herzog Rudolf IV. (daher Alma mater Rudolphina), 17 Jahre nach Prag."}]},{"title":"II.4 Lateinische Inschriften – Besonderheiten","blocks":[{"type":"text","text":"Auf vielen Gebäuden Österreichs findest du lateinische Inschriften. Ihre Besonderheiten:"},{"type":"list","items":["Majuskeln (Großbuchstaben); U und V werden einheitlich als V geschrieben.","Wortabstände und Satzzeichen können fehlen; manchmal trennen hochgestellte Punkte die Wörter.","Ligaturen (Buchstabenverschmelzungen) zur Platzersparnis, z. B. Æ, Œ.","Oft fehlt das Prädikat, z. B. bei Weiheinschriften: zum Dativ ist „dedicatum est“ („… ist gewidmet“) zu ergänzen.","Größer geschriebene Buchstaben, die auch Zahlzeichen sind, ergeben zusammengezählt das Entstehungsjahr (Chronogramm).","Häufige Abkürzungen."]},{"type":"table","headers":["Abkürzung","Bedeutung"],"rows":[["A. D.","anno Domini"],["AVG. / AVGG.","Augustus / Augusti"],["AVST.","Austria"],["D.","divus / die / dux"],["D. O. M.","Deo optimo maximo"],["F.","filius"],["IMP.","imperator"],["P. P.","pater patriae"],["P. M.","pontifex maximus"],["POS.","posuit"],["-Q.","-que"],["ROM.","Romanorum / Romanus"],["S. / SS.","sanctus / sancti"]]}]},{"title":"II.4 A – Kuppel der Hofburg (Wien, Michaelerplatz)","blocks":[{"type":"text","text":"FRANCISCVS · IOSEPHVS · I · VETVS · PALATII · OPVS · A · CAROLO · VI · INCHOATVM · A · MARIA · THERESIA · ET · IOSEPHO · II · CONTINVATVM · PERFECIT · A · D · MDCCCXCIII"},{"type":"gloss","text":"vetus, -eris: „alt“; palatium: „Palast“; inchoare: „beginnen“; continuare: „fortsetzen“; perficere: „vollenden“."},{"type":"task","q":"Wer begann den Bau, wer setzte ihn fort, wer vollendete ihn – und wann?","a":"Franz Joseph I. vollendete im Jahr des Herrn 1893 (MDCCCXCIII) das alte Werk des Palastes, das von Karl VI. begonnen und von Maria Theresia und Joseph II. fortgesetzt worden war."}]},{"title":"II.4 B – Anna-Säule (Innsbruck, Maria-Theresien-Straße)","blocks":[{"type":"text","text":"Auf der Südseite der Säule steht ein Spottgedicht auf die Bayern und die mit ihnen verbündeten Franzosen, die im Spanischen Erbfolgekrieg (1701–1714) in Tirol einfielen und am Annatag (26. Juli) von den Tiroler Truppen vertrieben wurden. Als Dank wurde die Anna-Säule errichtet."},{"type":"text","text":"VENIT LEO, VIDIT GALLUS, NON VICIT. FUGIT VERO, ERUPIT EVASIT UTERQUE. CUR ITA? UNUS EXTERRUIT FUGAVITQUE EQUES NOBILIS CAPADOX, HUIUS PATRIAE PATRONUS, SINGULARIS GEORGIUS."},{"type":"gloss","text":"leo, -onis: „der Löwe“ (die Bayern, deren Wappentier der Löwe ist); gallus: „der Hahn“ (die Franzosen); erumpere, erupi: „davonstürmen“; Capadox: „aus Kappadokien“; Georgius: der heilige Georg, damals Schutzpatron Tirols."},{"type":"task","q":"Übersetze und beantworte: An welchen Spruch erinnern die ersten Zeilen? Nenne ein Asyndeton, ein Trikolon und eine Klimax. Worauf wird der Sieg der Tiroler zurückgeführt?","a":"Der Löwe kam, der Hahn sah, (aber) er siegte nicht. Er floh vielmehr, beide stürmten davon und entkamen. Warum so? Ein einziger hat sie erschreckt und in die Flucht geschlagen: der edle Reiter aus Kappadokien, der Schutzpatron dieses Landes, der einzigartige Georg. – Die Zeilen erinnern an Cäsars „Veni, vidi, vici“. Asyndeton/Trikolon: „venit …, vidit …, non vicit“ bzw. „fugit, erupit, evasit“; Klimax: „fugit – erupit – evasit“ (Steigerung der Flucht). Der Sieg wird dem heiligen Georg (Schutzpatron Tirols) zugeschrieben."}]},{"title":"II.4 C – Nationalbibliothek (Wien, Josefsplatz)","blocks":[{"type":"text","text":"CAROLVS AVSTRIVS D(IVI) LEOPOLDI AVG(VSTI) F(ILIVS) AVG(VSTVS) ROM(ANORVM) IMP(ERATOR) P(ATER) P(ATRIAE) BELLO VBIQVE CONFECTO INSTAVRANDIS FOVENDISQVE LITERIS AVITAM BIBLIOTHECAM INGENTI LIBRORVM COPIA AVCTAM AMPLIS EXSTRVCTIS AEDIBVS PVBLICO COMMODO PATERE IVSSIT CIƆIƆCCXXVI"},{"type":"gloss","text":"Austrius: „österreichisch“; conficere: „beenden“; instaurandis fovendisque lit(t)eris: „zur Erneuerung und Pflege der Wissenschaften“; avitus: „großväterlich, ererbt“; amplus: „weitläufig“; exstruere: „errichten“; aedes, -ium f. Pl.: „Haus“; commodum: „Wohl“; patere: „offenstehen“; CIƆ = M; IƆ = D."},{"type":"task","q":"Welche (Ehren-)Titel trägt Karl, und wann eröffnete er die Bibliothek?","a":"Karl VI. von Österreich, Sohn des vergöttlichten Kaisers Leopold, erhabener Kaiser der Römer, Vater des Vaterlandes, ließ nach Beendigung des Krieges überall zur Erneuerung und Pflege der Wissenschaften die großväterliche Bibliothek, vermehrt durch eine gewaltige Menge an Büchern, in einem weitläufig errichteten Gebäude zum öffentlichen Wohl offenstehen – im Jahr 1726. Titel: Augustus, Romanorum imperator, pater patriae."}]},{"title":"II.4 D – Statue im Burggarten (Wien)","blocks":[{"type":"text","text":"DIVI FRANCISCI I. ROM. IMP. STATVAE FRANCISCVS I. AVST. IMP. AVI OPTI(MI) MAXIMI MEMORIAM VENERATVS HVNC LOCVM OPTAVIT VT IN SVORVM CONSPECTV SEMPER ESSET CIƆ IƆ CCC XIX"},{"type":"gloss","text":"statuae: Dativobjekt zu optavit; avus: „Großvater“; opti = optimi; veneratus (+ Akk.): „… ehrend“; optare: „wünschen“; conspectus, -us: „Anblick“."},{"type":"task","q":"Wen zeigt die Statue, wer ließ sie aufstellen, wann – und warum steht sie im Burggarten?","a":"Sie zeigt den vergöttlichten Kaiser Franz I. (Stephan von Lothringen), Kaiser der Römer. Franz I., Kaiser von Österreich, ließ sie 1819 aufstellen, um das Andenken an seinen besten und größten Großvater zu ehren. Er wünschte für die Statue diesen Ort, damit sie immer im Blickfeld der Seinen sei."}]},{"title":"II.4 E – Goldenes Dachl (Innsbruck)","blocks":[{"type":"text","text":"Das „Goldene Dachl“ ist eigentlich der „Neue Hof“, Residenz der Tiroler Landesfürsten im 15. Jh. Den Prunkerker mit 2657 vergoldeten Kupferschindeln ließ Kaiser Maximilian I. (1459–1519) anlässlich seiner Hochzeit mit Bianca Maria Sforza errichten; er wurde 1500 fertiggestellt. Auf dem Torbogen steht:"},{"type":"text","text":"RESTAVROR POST HORRENDOS CONTINVO ANO ET VLTRA PERPESSOS TERRÆ MOTVS"},{"type":"gloss","text":"restaurare: „renovieren“; continuus: „durchgehend, ganz“; ano = anno; ultra: „darüber hinaus“; perpessos: „die ich erdulden musste“; motus, -us: „Bewegung“."},{"type":"task","q":"Wer spricht hier? In welchem Jahr fand die Restaurierung statt (Chronogramm)? Wo gibt es eine Ligatur? Was bedeutet „Bella gerant alii, tu, felix Austria, nube!“?","a":"Das Gebäude selbst spricht: „Ich werde restauriert nach schrecklichen Erdbeben, die ich ein ganzes Jahr lang und darüber hinaus erdulden musste.“ Chronogramm: V + D + C + I + V + V + L + M + V = 5 + 500 + 100 + 1 + 5 + 5 + 50 + 1000 + 5 = 1671. Ligatur: Æ in TERRÆ. Der Spruch heißt: „Kriege mögen andere führen – du, glückliches Österreich, heirate!“ (Heiratspolitik der Habsburger)."}]},{"title":"II.4 F – Schweizertor (Wien, In der Burg)","blocks":[{"type":"text","text":"FERDINAN(DVS) ROM(ANORVM) GERMAN(IAE) HVNGAR(IAE) BOEM(IAE) ZC REX INFA(NS) HISP(ANIARVM) ARC(HI)DVX AVSTR(IAE) DVX BVRGVND(IAE) ZC ANNO MDLII"},{"type":"gloss","text":"ZC = etc.; infa = infans: „Infant“ (= Prinz); archi = archidux: „Erzherzog“."},{"type":"task","q":"Wann wurde der Bau beendet und welche Titel Ferdinands werden genannt? Schreibe den Text ohne Abkürzungen.","a":"Ferdinandus, Romanorum, Germaniae, Hungariae, Bohemiae et cetera rex, infans Hispaniarum, archidux Austriae, dux Burgundiae et cetera, anno 1552. – Ferdinand I.: König der Römer, Deutschlands, Ungarns, Böhmens usw., Infant (Prinz) von Spanien, Erzherzog von Österreich, Herzog von Burgund usw.; vollendet 1552."}]},{"title":"III.1 A – Die Erschaffung des Menschen (Genesis 2,7–25, Vulgata)","blocks":[{"type":"text","text":"Im ersten Buch des Alten Testaments, der Genesis („Entstehung“), wird die Erschaffung der Welt durch Gott beschrieben. Am sechsten Tag erschafft Gott den Menschen:"},{"type":"text","text":"Tunc formavit Dominus Deus hominem pulverem de humo et inspiravit in nares eius spiraculum vitae, et factus est homo in animam viventem. Et plantavit autem Dominus Deus paradisum in Eden ad orientem, in quo posuit hominem, quem formaverat. Produxitque Dominus Deus de humo omne lignum, pulchrum visu et ad vescendum suave, lignum etiam vitae in medio paradisi lignumque scientiae boni et mali. Tulit ergo Dominus Deus hominem et posuit eum in paradiso Eden, ut operaretur et custodiret illum; praecepitque Dominus Deus homini dicens: „Ex omni ligno paradisi comede; de ligno autem scientiae boni et mali ne comedas! In quocumque enim die comederis ex eo, morte morieris.“ Dixit quoque Dominus Deus: „Non est bonum esse hominem solum! Faciam ei adiutorium similem sui.“ (Gott formt aus dem Ackerboden die Tiere und Vögel; der Mensch benennt sie, findet aber kein Wesen, das ihm entspricht.) Inmisit ergo Dominus Deus soporem in hominem. Cumque obdormivisset, tulit unam de costis eius et replevit carnem pro ea; et aedificavit Dominus Deus costam, quam tulerat de homine, in mulierem et adduxit eam ad hominem. Dixitque homo: „Haec nunc (est) os ex ossibus meis et caro de carne mea! Haec vocabitur virago, quoniam de viro sumpta est haec.“ Quam ob rem relinquet vir patrem suum et matrem et adhaerebit uxori suae; et erunt in carne una. Erant autem uterque nudi, homo scilicet et uxor eius, et non erubescebant."},{"type":"gloss","text":"pulverem: „aus Staub“; inspirare: „einhauchen“; nares, -ium f.: „Nase“; spiraculum: „Atem“; in animam: „zu einem Wesen“; plantare: „anlegen“; ad orientem: „im Osten“; producere: „wachsen lassen“; lignum: „Baum“; visu: „anzusehen“; vesci: „essen“; operari: „bebauen“; comedere, comedi: „essen“; comederis: Futur II, als Präsens übersetzt; adiutorium: „Hilfe, Helfer“; sopor: „Schlaf“; obdormiscere: „einschlafen“; costa: „Rippe“; aedificare in: „formen zu“; virago: „Männin“; adhaerere (+ Dat.): „sich binden an“; uterque: hier „beide“; scilicet: „nämlich“; erubescere: „sich schämen“."},{"type":"task","q":"Übersetze den Text.","a":"Da formte Gott der Herr den Menschen aus Staub vom Erdboden und blies in seine Nase den Atem des Lebens, und so wurde der Mensch zu einem lebendigen Wesen. Gott der Herr legte im Osten in Eden einen Garten an und setzte dorthin den Menschen, den er geformt hatte. Und Gott der Herr ließ aus dem Erdboden allerlei Bäume wachsen, schön anzusehen und gut zu essen, in der Mitte des Gartens aber den Baum des Lebens und den Baum der Erkenntnis von Gut und Böse. Gott der Herr nahm also den Menschen und setzte ihn in den Garten Eden, damit er ihn bebaue und hüte; und Gott der Herr gebot dem Menschen: „Von allen Bäumen des Gartens darfst du essen; vom Baum der Erkenntnis von Gut und Böse aber iss nicht! Denn an dem Tag, an dem du davon isst, wirst du sterben.“ Und Gott der Herr sprach: „Es ist nicht gut, dass der Mensch allein ist! Ich will ihm eine Hilfe machen, die ihm entspricht.“ Da ließ Gott der Herr einen tiefen Schlaf auf den Menschen fallen. Als er eingeschlafen war, nahm er eine seiner Rippen und füllte ihre Stelle mit Fleisch; und Gott der Herr formte die Rippe, die er vom Menschen genommen hatte, zu einer Frau und führte sie zum Menschen. Und der Mensch sprach: „Diese endlich ist Bein von meinem Bein und Fleisch von meinem Fleisch! Sie soll Männin heißen, denn vom Mann ist sie genommen.“ Darum verlässt der Mann Vater und Mutter und bindet sich an seine Frau, und sie werden ein Fleisch. Beide aber waren nackt, der Mensch und seine Frau, und sie schämten sich nicht."}]},{"title":"III.1 B – Eva wird von der Schlange verführt (Genesis 3,1–7)","blocks":[{"type":"text","text":"Et serpens erat callidior cunctis animantibus terrae, quae fecerat Dominus Deus. Qui dixit ad mulierem: „Verene praecepit vobis Deus, ut non comederetis de omni ligno paradisi?“ Cui respondit mulier: „De fructu lignorum, quae sunt in paradiso, vescimur. De fructu vero ligni, quod est in medio paradisi, praecepit nobis Deus, ne comederemus et ne tangeremus illud, ne moriamur.“ Dixit autem serpens ad mulierem: „Nequaquam morte moriemini! Scit enim Deus, quod, in quocumque die comederitis ex eo, aperientur oculi vestri et eritis sicut Deus, scientes bonum et malum.“ Vidit igitur mulier, quod bonum esset lignum ad vescendum et pulchrum oculis et desiderabile esset lignum ad intellegendum; et tulit de fructu illius et comedit deditque viro suo secum, qui comedit. Et aperti sunt oculi amborum, cumque cognovissent esse se nudos, consuerunt folia ficus et fecerunt sibi perizomata."},{"type":"gloss","text":"callidus: „schlau“; animantibus = animalibus (Vergleichsablativ); qui: bezieht sich auf serpens; vere: „tatsächlich“; nequaquam: „keineswegs“; esset: Konjunktiv drückt Evas Meinung aus („sei“); desiderabilis: „verlockend“; consuere: „zusammenflechten“; ficus, -us f.: „Feigenbaum“; perizoma, -atis n.: „Schurz“."},{"type":"task","q":"Übersetze den Text.","a":"Die Schlange aber war schlauer als alle Tiere der Erde, die Gott der Herr gemacht hatte. Sie sagte zur Frau: „Hat Gott euch tatsächlich verboten, von allen Bäumen des Gartens zu essen?“ Die Frau antwortete ihr: „Von den Früchten der Bäume im Garten essen wir. Von der Frucht des Baumes aber, der in der Mitte des Gartens steht, hat Gott uns geboten, nicht zu essen und ihn nicht zu berühren, damit wir nicht sterben.“ Die Schlange aber sagte zur Frau: „Keineswegs werdet ihr sterben! Gott weiß nämlich, dass euch an dem Tag, an dem ihr davon esst, die Augen aufgehen und ihr wie Gott sein werdet, erkennend Gut und Böse.“ Da sah die Frau, dass der Baum gut zu essen sei, eine Augenweide und verlockend, weil er klug machte; und sie nahm von seiner Frucht, aß und gab auch ihrem Mann, der bei ihr war, und er aß. Da gingen beiden die Augen auf, und als sie erkannten, dass sie nackt waren, flochten sie Feigenblätter zusammen und machten sich Schurze."}]},{"title":"III.1 Arbeitsaufgaben (Adam und Eva)","blocks":[{"type":"task","q":"A: Liste die Konjunktive im dritten Absatz auf und übersetze sie.","a":"operaretur, custodiret (ut … damit er bebaue und hüte); ne comedas („iss nicht!“, Prohibitiv)"},{"type":"task","q":"A: Zerlege: a) inmisit b) adduxit c) adhaerebit.","a":"a) in- (hinein) + mittere (schicken) = ließ fallen; b) ad- (hin) + ducere (führen) = führte hin; c) ad- (an) + haerere (hängen) = wird sich binden an"},{"type":"task","q":"A: Finde Gegenbegriffe derselben Wortart zu a) vitae b) boni.","a":"a) morte (mors); b) mali (malum)"},{"type":"task","q":"A: Welche zwei Aussagen stimmen? Gott lässt den Menschen einen Garten anlegen. – Der Mensch soll den Garten bebauen und bewachen. – Gott verbietet dem Menschen, von den Bäumen des Paradieses zu essen. – Gott formte die Frau aus einem Knochen des Mannes. – Die Frau schämt sich, weil sie nackt ist.","a":"„Der Mensch soll den Garten bebauen und bewachen“ und „Gott formte die Frau aus einem Knochen (einer Rippe) des Mannes“."},{"type":"task","q":"B: Welche Verbformen mit passiver Endung sind Deponentia?","a":"Deponentia: vescimur, moriamur, moriemini (morte moriemini), (vescendum). Echtes Passiv: aperientur, aperti sunt."},{"type":"task","q":"B: cum(que) cognovissent heißt: „als sie erkannt hatten“, „als sie erkannten“, „als sie erkannt hätten“ oder „als erkannt worden war“?","a":"„als sie erkannt hatten“ (cum + Konj. Plusquamperfekt = vorzeitig)"}]},{"title":"Info: Die Bibel","blocks":[{"type":"text","text":"Das Alte Testament entstand ab dem 9. Jh. v. Chr. auf Hebräisch, im 3. Jh. v. Chr. wurde es ins Griechische übersetzt. Das Neue Testament wurde gleich griechisch verfasst. Den größten Einfluss im Abendland hatte die lateinische Übersetzung, die Vulgata, vom Kirchenvater Hieronymus (Ende 4. Jh.). Adam bedeutet hebräisch „Mensch“ (lat. homo), Eva „Leben“; „Paradies“ heißt ursprünglich nur „Garten“. Dass die verbotene Frucht im Mittelalter ein Apfel wurde, liegt wohl am Latein: malum heißt „das Schlechte“, aber auch „Apfel“."}]},{"title":"III.2 A – Joseph wird Opfer einer Verleumdung (Genesis 39,7–20)","blocks":[{"type":"text","text":"Joseph, einer der zwölf Söhne Jakobs, verfügt über die Gabe der Traumdeutung und wird Lieblingssohn seines Vaters. Seine Brüder verkaufen ihn an Sklavenhändler, die ihn nach Ägypten bringen. Dort gelangt er in den Besitz des Potiphar, des Oberaufsehers der Leibwache des Pharaos, der ihm die Aufsicht über sein Haus überlässt. Eines Tages gerät Joseph durch Potiphars Frau in Gefahr:"},{"type":"text","text":"Post haec ergo iniecit uxor domini eius oculos suos in Ioseph et ait: „Dormi mecum!“ Qui nequaquam adquiescens dixit ad eam: „Ecce dominus meus omnibus mihi traditis non curat de ulla re in domo sua, nec quisquam maior est in domo hac quam ego, et nihil mihi subtraxit praeter te, quae uxor eius es. Quomodo ergo possum malum hoc magnum facere et peccare in Deum?“ Huiuscemodi verbis per singulos dies et mulier molesta erat adulescenti et ille recusabat stuprum. Accidit autem quadam die, ut intraret Ioseph domum et opus suum absque arbitris faceret. Illa adprehensa lacinia vestimenti eius dixit: „Dormi mecum!“ Qui relicto in manu illius pallio fugit et egressus est foras. Cumque vidisset illum mulier vestem reliquisse in manibus suis et fugisse foras, vocavit homines domus suae et ait ad eos: „En, Putiphar introduxit virum, ut illuderet nobis! Ingressus est ad me, ut coiret mecum. Cumque ego succlama(vi)ssem et audi(vi)sset vocem meam, reliquit pallium, quod tenebam, et fugit foras.“ Retentum pallium ostendit marito revertenti domum et secundum haec verba locuta est: „Ingressus est ad me servus Hebraeus, quem adduxisti, ut illuderet mihi! Cumque vidisset me clamare, reliquit pallium et fugit foras.“ Dominus his verbis auditis iratus est valde tradiditque Ioseph in carcerem, ubi vincti regis custodiebantur. Et erat ibi clausus."},{"type":"gloss","text":"adquiescere: „einverstanden sein“; omnia: „alle Besitztümer“; subtrahere: „vorenthalten“; malum: „Untat“; peccare in: „sündigen gegen“; huiuscemodi = eiusmodi; stuprum: „Ehebruch“; absque arbitris: „ohne Zeugen“; lacinia: „Zipfel“; pallium: „Mantel“; foras: „hinaus“; en: „seht!“; illudere (+ Dat.): „verspotten“; succlamare: „um Hilfe schreien“; secundum (+ Akk.): „etwa“; Hebraeus: „hebräisch, jüdisch“; vinctus: „Gefangener“."},{"type":"task","q":"Übersetze den Text.","a":"Danach warf die Frau seines Herrn ihre Augen auf Joseph und sagte: „Schlaf mit mir!“ Er war keineswegs einverstanden und sagte zu ihr: „Sieh, mein Herr kümmert sich, da er mir alle Besitztümer übergeben hat, um nichts in seinem Haus, und niemand in diesem Haus ist größer als ich, und nichts hat er mir vorenthalten außer dir, die du seine Frau bist. Wie könnte ich also diese große Untat begehen und gegen Gott sündigen?“ Mit Worten dieser Art belästigte die Frau den jungen Mann Tag für Tag, und er verweigerte den Ehebruch. Eines Tages geschah es, dass Joseph ins Haus kam und ohne Zeugen seine Arbeit tat. Sie packte einen Zipfel seines Gewandes und sagte: „Schlaf mit mir!“ Er ließ den Mantel in ihrer Hand zurück, floh und ging hinaus. Als die Frau sah, dass er das Gewand in ihren Händen zurückgelassen hatte und hinausgeflohen war, rief sie die Leute ihres Hauses und sagte zu ihnen: „Seht, Potiphar hat einen Mann hereingebracht, um uns zu verspotten! Er kam zu mir herein, um mit mir zu schlafen. Als ich um Hilfe schrie und er meine Stimme hörte, ließ er den Mantel, den ich festhielt, zurück und floh hinaus.“ Den zurückbehaltenen Mantel zeigte sie ihrem Mann, als er nach Hause kam, und sprach etwa diese Worte: „Der hebräische Sklave, den du hergebracht hast, ist zu mir hereingekommen, um mich zu verspotten! Als er sah, dass ich schrie, ließ er den Mantel zurück und floh hinaus.“ Als der Herr diese Worte gehört hatte, wurde er sehr zornig und warf Joseph ins Gefängnis, wo die Gefangenen des Königs bewacht wurden. Und er war dort eingeschlossen."}]},{"title":"III.2 B – Joseph deutet den Traum des Pharao (Genesis 41,26–30)","blocks":[{"type":"text","text":"Nach zwei Jahren im Gefängnis bittet ihn der Pharao, einen Traum zu deuten: Sieben wohlgenährte und sieben magere Kühe stiegen nacheinander aus dem Nil, und die mageren fraßen die fetten auf."},{"type":"text","text":"Respondit Ioseph somnium regis: „Septem boves pulchrae sunt septem ubertatis anni; septem quoque boves tenues atque macilentae, quae ascenderunt post eas, septem anni sunt venturae famis. Qui hoc ordine complebuntur: Ecce septem anni venient fertilitatis magnae in universa terra Aegypti; quos sequentur septem anni alii tantae sterilitatis, ut oblivioni tradatur cuncta retro abundantia: Consumptura est enim fames omnem terram.“"},{"type":"gloss","text":"respondere: hier „deuten“; ubertas, -atis f.: „Überfluss“; macilentus: „abgemagert“; ordo, -inis m.: „Reihenfolge“; oblivioni tradi: „in Vergessenheit geraten“; cuncta = tota; retro: „vorig, vorangegangen“; consumptura est = consumet."},{"type":"task","q":"Übersetze den Text.","a":"Joseph deutete den Traum des Königs: „Die sieben schönen Kühe sind sieben Jahre des Überflusses; die sieben dünnen und abgemagerten Kühe, die nach ihnen heraufstiegen, sind sieben Jahre der kommenden Hungersnot. Sie werden sich in dieser Reihenfolge erfüllen: Sieh, es werden sieben Jahre großer Fruchtbarkeit im ganzen Land Ägypten kommen; ihnen werden sieben andere Jahre so großer Unfruchtbarkeit folgen, dass der ganze vorangegangene Überfluss in Vergessenheit gerät: Denn der Hunger wird das ganze Land verzehren.“"}]},{"title":"III.2 Arbeitsaufgaben (Joseph)","blocks":[{"type":"task","q":"A: Liste die Ablativi absoluti in Z. 1–10 auf.","a":"omnibus mihi traditis; illa adprehensa lacinia (adprehensa lacinia); relicto … pallio"},{"type":"task","q":"A: Zerlege: a) iniecit b) vestimenti c) retentum d) adduxisti.","a":"a) in- (auf, hinein) + iacere (werfen) = warf auf; b) vestire (kleiden) + -mentum (Mittel) = Kleidungsstück, Gewand; c) re- (zurück) + tenere (halten) = zurückbehalten; d) ad- (hin) + ducere (führen) = hast hergebracht"},{"type":"task","q":"A: Nenne vier Begriffe aus dem Wortfeld „sich fortbewegen“ (Z. 8–15).","a":"intraret, fugit, egressus est, ingressus est (introduxit, reliquisse, fugisse)"},{"type":"task","q":"B: Finde zwei Gegensatzpaare derselben Wortart.","a":"ubertatis – famis (Überfluss – Hunger); fertilitatis – sterilitatis (Fruchtbarkeit – Unfruchtbarkeit); pulchrae – tenues (schön – dünn)"},{"type":"task","q":"B: Synonyme zu a) ubertatis b) universa?","a":"a) abundantia (fertilitatis); b) omnem (cuncta)"},{"type":"task","q":"B: sequentur (Z. 5) heißt „sie folgen“, „sie sollen folgen“, „sie werden verfolgt“ oder „sie werden folgen“?","a":"„sie werden folgen“ (Futur des Deponens sequi)"},{"type":"task","q":"B: Richtig oder falsch? a) Die sieben schönen Kühe stehen für sieben „fette“ Jahre. b) Zuerst erlebt Ägypten sieben schlechte, dann sieben gute Jahre. c) Der Überfluss wird niemals in Vergessenheit geraten. d) Der Durst wird ganz Ägypten plagen.","a":"a) richtig; b) falsch – zuerst gute, dann schlechte; c) falsch – er gerät in Vergessenheit; d) falsch – der Hunger (fames)"}]},{"title":"Info: Traumdeutung","blocks":[{"type":"text","text":"Bei den Ägyptern spielte die Traumdeutung eine besondere Rolle: Man glaubte, die Seele trete im Traum in Kontakt mit den Göttern und erhalte Informationen über die Zukunft. Traumdeuter studierten mehrere Jahre, genossen hohes Ansehen und wurden auch von fremden Herrschern um Rat gefragt. Die Joseph-Geschichte wurde sogar zum Musical: „Joseph and the Amazing Technicolor Dreamcoat“ (Andrew Lloyd Webber, 1968)."}]},{"title":"III.3 A – Zwei Frauen streiten um ein Kind (1 Könige 3,16–22)","blocks":[{"type":"text","text":"Salomon gilt nach Saul und David als dritter König des israelitischen Königreiches (ca. 965–926 v. Chr.) und soll den ersten Tempel in Jerusalem erbaut haben. Berühmt wurde er für seine Weisheit und Gerechtigkeit – wie in diesem „Mutterschaftsstreit“:"},{"type":"text","text":"Tunc venerunt duae mulieres meretrices ad regem steteruntque coram eo. Quarum una ait: „Obsecro, mi domine, ego et mulier haec habitabamus in domo una et peperi apud eam in domo. Tertia vero die, postquam ego peperi, peperit et haec et eramus simul nullusque alius in domo nobiscum exceptis nobis duabus. Mortuus est autem filius mulieris huius nocte, dormiens quippe oppressit eum. Et consurgens intempesta nocte silentio tulit filium meum de latere meo et collocavit in sinu suo; suum autem filium, qui erat mortuus, posuit in sinu meo. Cumque surrexissem mane, ut darem lac filio meo, apparuit mortuus; quem diligentius intuens clara luce deprehendi non esse meum, quem genueram.“ Responditque altera mulier: „Non est ita, sed filius meus vivit, tuus autem mortuus est!“ E contrario illa dicebat: „Mentiris! Filius quippe tuus mortuus est, meus autem vivit.“ Atque in hunc modum contendebant coram rege."},{"type":"gloss","text":"mulier meretrix: „Dirne“; coram eo = ad eum; parere, peperi: „gebären“; obsecro: „ich bitte“; quippe: „nämlich“; opprimere: „erdrücken“; intempestus: „tief, dunkel“; latus, -eris n.: „Seite“; sinus, -us: „Brust, Schoß“; mane: „morgens“; intuens = spectans; deprehendere: „erkennen“; e contrario: „andererseits“; in hunc modum = hoc modo; coram rege = ad regem."},{"type":"task","q":"Übersetze den Text.","a":"Da kamen zwei Dirnen zum König und traten vor ihn. Die eine von ihnen sagte: „Ich bitte dich, mein Herr, ich und diese Frau wohnten in einem Haus, und ich habe bei ihr im Haus ein Kind geboren. Am dritten Tag, nachdem ich geboren hatte, gebar auch diese, und wir waren zusammen, und niemand sonst war bei uns im Haus außer uns beiden. Der Sohn dieser Frau aber starb in der Nacht, denn sie hatte ihn im Schlaf erdrückt. Und sie stand in tiefer Nacht in aller Stille auf, nahm meinen Sohn von meiner Seite und legte ihn an ihre Brust; ihren Sohn aber, der tot war, legte sie an meine Brust. Als ich am Morgen aufgestanden war, um meinem Sohn Milch zu geben, zeigte sich, dass er tot war; als ich ihn aber im hellen Licht genauer ansah, erkannte ich, dass es nicht meiner war, den ich geboren hatte.“ Die andere Frau antwortete: „So ist es nicht, sondern mein Sohn lebt, deiner aber ist tot!“ Die andere dagegen sagte: „Du lügst! Dein Sohn ist nämlich tot, meiner aber lebt.“ Und auf diese Weise stritten sie vor dem König."}]},{"title":"III.3 B – Die „Salomonische Entscheidung“ (1 Könige 3,23–28)","blocks":[{"type":"text","text":"Da sich die Frauen nicht einigen können, wessen Kind am Leben geblieben ist, soll der König gerecht entscheiden:"},{"type":"text","text":"Dixit ergo rex: „Afferte mihi gladium!“ Cumque attulissent gladium coram rege, „Dividite“ inquit, „infantem vivum in duas partes et date dimidiam partem uni et dimidiam partem alteri!“ Dixit autem mulier, cuius filius erat vivus, ad regem: „Obsecro, date illi infantem vivum et nolite interficere eum!“ E contrario illa dicebat: „Nec tibi nec mihi sit; dividatur!“ Respondens rex ait: „Date huic infantem vivum, et non occidetur; haec est mater eius!“ Audivit itaque omnis Israel iudicium, quod iudica(vi)sset rex; et timuerunt regem videntes sapientiam Dei esse in eo ad faciendum iudicium."},{"type":"gloss","text":"coram rege = ad regem; dimidius: „halb“; illi: gemeint ist die andere Frau; iudica(vi)sset: Konjunktiv bleibt unübersetzt."},{"type":"task","q":"Übersetze den Text.","a":"Da sagte der König: „Bringt mir ein Schwert!“ Als sie das Schwert vor den König gebracht hatten, sagte er: „Teilt das lebende Kind in zwei Teile und gebt die eine Hälfte der einen und die andere Hälfte der anderen!“ Da sagte die Frau, deren Sohn lebte, zum König: „Ich bitte dich, gebt jener das lebende Kind und tötet es nicht!“ Die andere dagegen sagte: „Weder dir noch mir soll es gehören; es soll geteilt werden!“ Der König antwortete: „Gebt dieser das lebende Kind, und es soll nicht getötet werden; sie ist seine Mutter!“ Ganz Israel hörte vom Urteil, das der König gefällt hatte; und sie fürchteten den König, weil sie sahen, dass die Weisheit Gottes in ihm war, um Recht zu sprechen."},{"type":"note","text":"Gerechtigkeit (iustitia) galt als eine der wichtigsten Herrschertugenden. Kaiser Franz I. (1768–1835) wählte den Wahlspruch IUSTITIA REGNORUM FUNDAMENTUM („Gerechtigkeit ist das Fundament der Staaten“) – er steht noch heute auf dem Äußeren Burgtor am Wiener Ring."}]},{"title":"III.3 Arbeitsaufgaben (Salomon)","blocks":[{"type":"task","q":"A: Finde verwandte lateinische Wörter: a) Alternative b) bilateral c) dominieren d) Laktose e) Station f) Union.","a":"a) altera (alter); b) latere (latus, Seite); c) domine (dominus); d) lac (Milch); e) steterunt (stare); f) una (unus)"},{"type":"task","q":"A: Finde a) einen Chiasmus, b) einen Parallelismus.","a":"a) „filius meus vivit, tuus autem mortuus est“ – „filius tuus mortuus est, meus autem vivit“ (Abfolge ABBA über beide Aussagen); b) „tulit filium meum … et collocavit in sinu suo; suum autem filium … posuit in sinu meo“"},{"type":"task","q":"A: Synonyme zu a) peperi b) collocavit?","a":"a) genueram (gignere); b) posuit (ponere)"},{"type":"task","q":"B: dividatur (Z. 6) heißt „er teilt“, „es soll geteilt werden“, „es wird geteilt“ oder „es wird geteilt werden“?","a":"„es soll geteilt werden“ (Konjunktiv Präsens passiv, Iussiv)"},{"type":"task","q":"B: Antonyme zu a) uni b) tibi?","a":"a) alteri; b) mihi"},{"type":"task","q":"B: Richtig oder falsch? a) Salomon möchte selbst mit einem Schwert die Kinder zerteilen. b) Die echte Mutter ist bereit, auf ihr Kind zu verzichten. c) Der König trifft zwei verschiedene Urteile. d) Das Volk Israel erkennt in Salomons Entscheidung die Weisheit Gottes.","a":"a) falsch – er lässt das Schwert bringen und befiehlt anderen zu teilen (und es geht nur um ein Kind); b) richtig; c) falsch – es gibt ein Urteil (die Teilung war nur eine Probe); d) richtig"}]},{"title":"Info: Salomons Weisheit und die iustitia","blocks":[{"type":"text","text":"Laut Bibel sagte Gott Salomon im Traum einen Wunsch zu. Salomon wünschte sich nicht langes Leben, Reichtum oder Siege, sondern sapientia, um gerecht regieren zu können. Weil Gott diese Wahl gefiel, schenkte er ihm auch das Übrige dazu. Die Gerechtigkeit zählt seit der Antike zu den vier Kardinaltugenden. Wahlsprüche österreichischer Herrscher: Ferdinand I.: „Fiat iustitia aut pereat mundus“; Ferdinand III.: „Iustitia et pietate“; Maria Theresia: „Iustitia et clementia“; Franz II./I.: „Iustitia regnorum fundamentum“."}]},{"title":"III.4 A – Georgs Kampf mit dem Drachen (Legenda Aurea, Georgius)","blocks":[{"type":"text","text":"Georg lebte im 3. Jh. in Kleinasien und diente im römischen Heer. Berühmt wurde er durch seinen Kampf gegen einen Drachen, der in einem See nahe der Stadt Silena (Libyen) haust. Ihm müssen täglich zwei Schafe gebracht werden; als sie ausgehen, auch Menschen, die das Los bestimmt. Eines Tages trifft das Los die Tochter des Königs."},{"type":"text","text":"Tunc rex cum lacrimis dixit: „Utinam, filia mea, ego ante te mortuus essem, quam te sic amisissem!“ Tunc illa procidit ad pedes patris petens ab eo benedictionem suam. Quam cum pater cum lacrimis benedixisset, ad lacum processit. Quam ut beatus Georgius casu transiens plorantem vidit, eam, quid haberet, interrogavit. Et illa: „Bone iuvenis, velociter equum ascende et fuge, ne mecum pariter moriaris!“ Cui Georgius: „Noli timere, filia, sed dic mihi: Quid hic praestolaris omni plebe spectante?“ Cum ergo totum ei exposuisset, ait Georgius: „Filia, noli timere, quia in Christi nomine te iuvabo.“ Dum haec loquerentur, ecce draco veniens caput de lacu levavit. Tunc puella tremefacta dixit: „Fuge, bone domine, fuge velociter!“ Tunc Georgius equum ascendens et cruce se muniens draconem contra se advenientem audaciter aggreditur et graviter vulneravit et ad terram deiecit; dixitque puellae: „Proice zonam tuam in collum draconis nihil dubitans, filia.“ Quod cum fecisset, sequebatur eam velut mansuetissima canis. Cum ergo eum in civitatem duceret, populi hoc videntes per montes et colles fugere coeperunt dicentes: „Vae nobis, quia iam omnes peribimus!“ Tunc beatus Georgius innuit iis dicens: „Nolite timere, ad hoc enim me misit Dominus ad vos, ut a poenis vos liberarem draconis. Tantummodo in Christum credite et unusquisque vestrum baptizetur et draconem istum occidam.“"},{"type":"gloss","text":"quam: hier „als dass“; procidere: „niederfallen“; procedere: „aufbrechen“; plorare = flere; pariter: „auf gleiche Weise“; praestolari: „(bereit) stehen“; exponere: „erklären“; dum (+ Konj.) = cum (+ Konj.); levare: „erheben“; tremefactus: „zitternd“; munire: „schützen“; deicere: „niederwerfen“; proicere: „werfen“; zona: „Gürtel“; nihil: hier „nicht“; mansuetus: „zahm“; populi: hier = homines; vae: „wehe“; perire = interire; innuere: „zunicken“; tantummodo: „nur“; baptizare: „taufen“."},{"type":"task","q":"Übersetze den Text.","a":"Da sagte der König unter Tränen: „Wäre ich doch, meine Tochter, vor dir gestorben, statt dich so zu verlieren!“ Da fiel sie ihrem Vater zu Füßen und bat ihn um seinen Segen. Als der Vater sie unter Tränen gesegnet hatte, brach sie zum See auf. Als der heilige Georg, der zufällig vorbeikam, sie weinen sah, fragte er sie, was sie habe. Und sie: „Guter junger Mann, steig schnell aufs Pferd und flieh, damit du nicht ebenso mit mir stirbst!“ Georg zu ihr: „Fürchte dich nicht, Tochter, sondern sag mir: Was stehst du hier, während das ganze Volk zuschaut?“ Als sie ihm alles erklärt hatte, sagte Georg: „Tochter, fürchte dich nicht, denn im Namen Christi werde ich dir helfen.“ Während sie dies sprachen, siehe, da kam der Drache und erhob den Kopf aus dem See. Da sagte das Mädchen zitternd: „Flieh, guter Herr, flieh schnell!“ Da stieg Georg aufs Pferd, schützte sich mit dem Kreuz, griff den Drachen, der auf ihn zukam, kühn an, verwundete ihn schwer und warf ihn zu Boden; und er sagte zum Mädchen: „Wirf deinen Gürtel um den Hals des Drachen, ohne zu zögern, Tochter.“ Als sie das getan hatte, folgte er ihr wie ein ganz zahmer Hund. Als sie ihn in die Stadt führte, begannen die Menschen, die das sahen, über Berge und Hügel zu fliehen und riefen: „Wehe uns, denn jetzt werden wir alle sterben!“ Da nickte ihnen der heilige Georg zu und sagte: „Fürchtet euch nicht, denn dazu hat mich der Herr zu euch geschickt, dass ich euch von den Qualen des Drachen befreie. Glaubt nur an Christus, und jeder von euch soll sich taufen lassen, dann werde ich diesen Drachen töten.“"}]},{"title":"III.4 B – Franziskus spricht mit den Vögeln (Legenda Aurea; Thomas von Celano, Vita Francisci 21)","blocks":[{"type":"text","text":"Einer der bekanntesten Heiligen ist Franziskus (1182–1226) – durch sein Bekenntnis zur Armut, seinen Dienst an den Schwachen und seine Verbundenheit mit den Tieren."},{"type":"text","text":"Franciscus, servus et amicus Altissimi, in civitate Assisii ortus et negotiator effectus fere usque ad vicesimum aetatis suae annum tempus suum vane vivendo consumpsit. Quem Dominus infirmitatis flagello corripuit et in virum alterum subito transformavit. […] Cum quandam avium multitudinem reperisset et eas velut rationis participes saluta(vi)sset, dixit: „Fratres mei volucres, multum debetis laudare creatorem vestrum, qui plumis vos induit, pennas ad volandum tribuit, aeris puritatem concessit et sine vestra sollicitudine vos gubernavit!“ Aves autem coeperunt versus eum extendere colla, protendere alas, aperire rostra et in illum attente respicere. Ille vero per medium earum transiens tunica tangebat easdem nec tamen aliqua (avis) de loco est mota, donec licentia data omnes simul avolaverunt."},{"type":"gloss","text":"Altissimus = Deus; ortus = natus; negotiator effectus: „nachdem er Kaufmann geworden war“; vanus: „inhaltslos“ (= sündhaft); infirmitas: „Krankheit“; corripere: „schlagen, bestrafen“; rationis particeps: „vernunftbegabt“; volucris, -is f.: „Vogel“; pluma: „Feder“; penna: „Flügel“; concedere: „bewirken, gewähren“; versus (+ Akk.): „zu … hin“; rostrum: „Schnabel“; respicere = spectare; mota est: „bewegte sich“."},{"type":"task","q":"Übersetze den Text.","a":"Franziskus, Diener und Freund des Höchsten, in der Stadt Assisi geboren, verbrachte, nachdem er Kaufmann geworden war, seine Zeit fast bis zu seinem zwanzigsten Lebensjahr mit einem leeren (sündhaften) Leben. Ihn strafte der Herr mit der Geißel der Krankheit und verwandelte ihn plötzlich in einen anderen Mann. […] Als er einmal eine große Menge Vögel gefunden und sie wie vernunftbegabte Wesen gegrüßt hatte, sagte er: „Meine Brüder Vögel, ihr müsst euren Schöpfer sehr loben, der euch mit Federn bekleidet, euch Flügel zum Fliegen gegeben, euch die Reinheit der Luft gewährt und euch ohne eure Sorge gelenkt hat!“ Die Vögel aber begannen, die Hälse zu ihm hin zu strecken, die Flügel auszubreiten, die Schnäbel zu öffnen und ihn aufmerksam anzuschauen. Er aber ging mitten durch sie hindurch und berührte sie mit seiner Kutte, und doch bewegte sich kein Vogel von der Stelle, bis sie, nachdem er die Erlaubnis gegeben hatte, alle zugleich davonflogen."}]},{"title":"III.4 Arbeitsaufgaben (Georg und Franziskus)","blocks":[{"type":"task","q":"A: Liste die Konjunktive der ersten beiden Absätze auf und bestimme sie.","a":"mortuus essem, amisissem (Irrealis/Wunsch der Vergangenheit: „wäre ich doch gestorben, statt dich zu verlieren“); benedixisset (cum + Konj. Plqpf.: „als er gesegnet hatte“); haberet (indirekter Fragesatz: „was sie habe“); ne moriaris (Finalsatz: „damit du nicht stirbst“); exposuisset (cum: „als sie erklärt hatte“)"},{"type":"task","q":"A: Finde eine Alliteration (1. Absatz) und eine Anapher (3. Absatz).","a":"Alliteration: „procidit ad pedes patris petens“ (p-Laute); Anapher: „Fuge, bone domine, fuge velociter!“"},{"type":"task","q":"A: Worauf beziehen sich a) eam (Z. 5) b) eum (Z. 15) c) hoc (Z. 16) d) iis (Z. 18)?","a":"a) die Königstochter; b) den Drachen; c) dass das Mädchen den Drachen in die Stadt führt; d) die fliehenden Menschen (populi)"},{"type":"task","q":"Info-Frage: Für welche Heiligen sind typisch: a) umgedrehtes Kreuz b) X-förmiges Kreuz c) brennendes Haus d) Banner mit dem österreichischen Wappen e) Grillrost?","a":"a) Petrus (kopfüber gekreuzigt); b) Andreas; c) Florian; d) Leopold (Landespatron Österreichs); e) Laurentius"},{"type":"task","q":"B: Nenne drei Wörter aus der Wortfamilie volare.","a":"volucres, volandum, avolaverunt"},{"type":"task","q":"B: Zerlege: a) creatorem b) puritatem c) sollicitudine d) transiens.","a":"a) creare (erschaffen) + -tor (Täter) = Schöpfer; b) purus (rein) + -tas (Eigenschaft) = Reinheit; c) sollicitus (besorgt) + -tudo (Eigenschaft) = Sorge; d) trans- (hinüber, hindurch) + ire (gehen) = hindurchgehend"},{"type":"task","q":"B: Ergänze: Franziskus war von Beruf … Bis zu seinem … Lebensjahr führte er ein … Leben. Durch eine … machte ihn Gott zu … Er sprach zu einer Menge von …, die er als seine … anredete, und forderte sie auf, … Sie entfernten sich erst, als …","a":"Kaufmann – zwanzigsten – leeres (sündhaftes) – Krankheit – einem anderen Menschen – Vögeln – Brüder – ihren Schöpfer zu loben – er ihnen die Erlaubnis gegeben hatte."}]},{"title":"Info: Heiligen-Attribute","blocks":[{"type":"text","text":"Der hl. Georg starb Anfang des 4. Jh. in der Christenverfolgung unter Diokletian (284–305) als Märtyrer. Die Legende vom Drachentöter entstand erst im Mittelalter – seither wird er als Ritter mit Lanze dargestellt. Heilige erkennt man (wie antike Götter) nicht an den Gesichtszügen, sondern an ihren Attributen (typischen Gegenständen)."}]},{"title":"III.5 A – Das Martyrium des hl. Sebastian (Legenda Aurea, Sebastianus)","blocks":[{"type":"text","text":"Sebastian diente im 3. Jh. im römischen Heer, stand bei Kaiser Diokletian in hohem Ansehen und befehligte einen Teil des Heeres. Heimlich war er Christ und half verfolgten Christen. Eines Tages erfuhr ein anderer General davon."},{"type":"text","text":"Post hoc praefectus Diocletiano imperatori de Sebastiano suggessit. Quem ad se vocans dixit: „Ego te inter primos in palatio meo semper habui et tu contra salutem meam in deorum iniuriam hactenus latuisti.“ Cui Sebastianus: „Pro salute tua Christum semper colui et pro statu Romani imperii Deum, qui in caelis est, semper adoravi.“ Tunc Diocletianus iussit eum in medium campum ligari et a militibus sagittari; qui ita eum sagittis impleverunt, ut quasi hericius videretur, et aestimantes illum mortuum abierunt. Qui intra paucos dies liberatus – stans super gradum palatii – imperatores venientes de malis, quae Christianis inferebant, dure redarguit. Tunc imperator tamdiu eum fustigari iussit, donec spiritum exhalaret. Fecitque corpus eius in cloacam proici, ne a Christianis pro martyre coleretur. Sanctus autem Sebastianus sequente nocte sanctae Luciae apparuit et corpus ei revelavit et praecepit, ut illud iuxta vestigia apostolorum sepeliret. Quod et factum est. Passus autem est sub Diocletiano et Maximiano imperatoribus."},{"type":"gloss","text":"praefectus: „General“; suggerere = narrare; in iniuriam (+ Gen.): „zum Frevel gegen“; latere: „im Verborgenen leben“; status, -us: „Bestand“; in medium campum = medio in campo; ligare: „anbinden“; sagittare: „mit Pfeilen beschießen“; hericius: „Igel“; aestimare = putare; liberatus: hier „geheilt“; gradus, -us: „Treppe“; imperatores: Diokletian und Maximian; malum: „Übel, Leid“; redarguere: „anklagen“; fustigare: „verprügeln“; facere (+ ACI) = iubere; iuxta vestigia: „bei den Spuren“ (= Katakomben); pati: hier „den Märtyrertod erleiden“."},{"type":"task","q":"Übersetze den Text.","a":"Danach berichtete ein General dem Kaiser Diokletian über Sebastian. Dieser rief ihn zu sich und sagte: „Ich habe dich in meinem Palast immer zu den Ersten gezählt, und du hast bis jetzt im Verborgenen gegen mein Wohl und zum Frevel gegen die Götter gelebt.“ Sebastian antwortete ihm: „Für dein Wohl habe ich immer Christus verehrt und für den Bestand des römischen Reiches immer Gott angebetet, der im Himmel ist.“ Da ließ Diokletian ihn mitten auf einem Feld anbinden und von Soldaten mit Pfeilen beschießen; diese bedeckten ihn so mit Pfeilen, dass er fast wie ein Igel aussah, und gingen weg, weil sie ihn für tot hielten. Innerhalb weniger Tage geheilt, stand er auf der Treppe des Palastes und klagte die Kaiser, als sie kamen, wegen der Übel, die sie den Christen zufügten, hart an. Da ließ der Kaiser ihn so lange prügeln, bis er den Geist aushauchte. Und er ließ seinen Leichnam in eine Kloake werfen, damit er nicht von den Christen als Märtyrer verehrt würde. Der heilige Sebastian aber erschien in der folgenden Nacht der heiligen Lucia, zeigte ihr den Leichnam und trug ihr auf, ihn bei den Spuren der Apostel zu begraben. Und das geschah auch. Er erlitt aber den Märtyrertod unter den Kaisern Diokletian und Maximian."}]},{"title":"III.5 B – Hilfe gegen die Pest (Paulus Diaconus, Historia Langobardorum 6,5)","blocks":[{"type":"text","text":"Sebastian wurde auch in Österreich einer der meistverehrten Heiligen: Seit dem frühen Mittelalter gilt er als Schutzpatron gegen die Pest. Erstmals bewährte er sich während einer Pestepidemie in Italien im Jahr 680."},{"type":"text","text":"Secuta est gravissima pestis tribus mensibus; tantaque fuit multitudo morientium, ut etiam parentes cum filiis atque fratres cum sororibus, bini per feretra positi, apud urbem Romam ad sepulchra ducerentur. Pari etiam modo haec pestilentia Ticinum quoque depopulata est, ita ut, cunctis civibus per iuga montium fugientibus, in foro et per plateas civitatis herbae et frutecta nascerentur. Tunc cuidam per revelationem dictum est, quod pestis ipsa prius non quiesceret, quam in basilica beati Petri, quae „ad Vincula“ dicitur, sancti Sebastiani martyris altarium poneretur. Factumque est, et delatis ab urbe Roma beati Sebastiani martyris reliquiis mox ut in iam dicta basilica altarium constitutum est, pestis ipsa quievit."},{"type":"gloss","text":"bini: „je zwei“; per feretra: „auf Totenbahren“; Ticinum: „Pavia“; depopulari: „entvölkern“; iugum montium: „Gebirgskamm“; platea: „Platz“; frutectum: „Gebüsch“; nasci: hier „wachsen“; revelatio: „Offenbarung“; ad vincula: „in Ketten“ (Name nach der Haft des Petrus); deferre = portare; mox ut: „sobald“."},{"type":"task","q":"Übersetze den Text.","a":"Es folgte eine sehr schwere Pest drei Monate lang; und die Menge der Sterbenden war so groß, dass sogar Eltern mit ihren Kindern und Brüder mit ihren Schwestern, je zwei auf Totenbahren gelegt, in Rom zu den Gräbern gebracht wurden. Auf gleiche Weise entvölkerte diese Seuche auch Pavia, so dass, während alle Bürger über die Gebirgskämme flohen, auf dem Forum und auf den Plätzen der Stadt Gras und Gebüsch wuchsen. Da wurde jemandem durch eine Offenbarung gesagt, dass die Pest nicht eher aufhören werde, als bis in der Basilika des seligen Petrus, die „in Ketten“ genannt wird, ein Altar des heiligen Märtyrers Sebastian errichtet werde. Und so geschah es: Nachdem die Reliquien des seligen Märtyrers Sebastian aus der Stadt Rom gebracht worden waren, hörte die Pest auf, sobald in der genannten Basilika der Altar errichtet worden war."}]},{"title":"III.5 Arbeitsaufgaben (Sebastian)","blocks":[{"type":"task","q":"A: Finde im ersten Absatz zwei Gegensatzpaare derselben Wortart.","a":"Christum/Deum – deorum (der eine Gott – die Götter); in caelis – (in palatio) bzw. salutem meam – iniuriam"},{"type":"task","q":"A: Bringe in die richtige Reihenfolge: Sebastian stirbt. – Die Soldaten schießen Pfeile auf Sebastian. – Sebastian kritisiert die Kaiser wegen der Christenverfolgungen. – Sebastian wird zum Kaiser gerufen. – Sebastian erscheint der heiligen Lucia. – Sebastian wird begraben. – Sebastian wird verprügelt.","a":"1. Sebastian wird zum Kaiser gerufen. 2. Die Soldaten schießen Pfeile auf ihn. 3. Er kritisiert die Kaiser wegen der Christenverfolgungen. 4. Er wird verprügelt. 5. Er stirbt. 6. Er erscheint der heiligen Lucia. 7. Er wird begraben."},{"type":"task","q":"B: Nenne vier Begriffe aus dem Wortfeld „Familie“.","a":"parentes, filiis, fratres, sororibus"},{"type":"task","q":"B: Synonyme zu a) pestis b) beati?","a":"a) pestilentia; b) sancti"},{"type":"task","q":"B: Richtig oder falsch? a) Pavia wurde von der Pest heimgesucht. b) Alle Bürger flüchteten aufs
