<style>

.bar{height:6px;border-radius:3px;background:rgba(118,118,128,.2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--green)}

.badge{text-align:center;font-size:12px}.badge .c{width:48px;height:48px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(118,118,128,.15)}
.badge.on .c{background:linear-gradient(135deg,#f0a63a,#e2711d)}.badge:not(.on){opacity:.5}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);border-radius:18px 18px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:24px 22px calc(24px + var(--safe-bottom))}
.center{text-align:center}

.noxo{margin:0 -16px;padding:0 16px;overflow-x:hidden;overflow-x:clip}
.hidecell{border:0;border-radius:6px;background:rgba(118,118,128,.18);min-width:60px;padding:4px 8px;cursor:pointer;font-style:normal}
.search{position:sticky;top:calc(var(--top-h) / var(--z));z-index:3;margin:0 -16px;padding:6px 16px 10px;background:var(--bg);display:flex;gap:8px;align-items:center}
.search .field{position:relative;flex:1}
.search input{padding-right:36px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:rgba(118,118,128,.25);color:var(--bg);width:22px;height:22px;border-radius:50%;font-size:13px;line-height:22px;padding:0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:15;box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer;max-width:90vw;text-align:center}
.ver{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.changes h3{margin:16px 0 4px;font-size:17px}.changes ul{margin:4px 0;padding-left:20px}.changes li{margin:3px 0}

.letters{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}.letters .btn{min-height:32px;min-width:32px;padding:2px 6px}

<body>
<div id="top"><div class="side"><button id="back" hidden>‹ Zurück</button></div><h1 id="title"></h1><div class="side"></div></div>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="modal-root"></div>
<script>
"use strict";
const LESSONS = /*__DATA__*/;
const ICON = "/*__ICON180__*/";
const APP_VERSION = "/*__VERSION__*/";
const CHANGELOG = /*__CHANGELOG__*/;
const ANHANG = /*__ANHANG__*/;

// ---------- Daten ----------
const ALL = [];
for (const l of LESSONS) for (const v of l.vocab) { v.lesson = l.number; v.id = l.number + "|" + v.la; ALL.push(v); }
const UNITS = [...new Set(LESSONS.map(l => l.unit))];
const NUMS = LESSONS.map(l => l.number);
const byNum = n => LESSONS.find(l => l.number === n);
const lessonsIn = (a, b) => LESSONS.filter(l => l.number >= Math.min(a, b) && l.number <= Math.max(a, b));
const vocabIn = (a, b) => lessonsIn(a, b).flatMap(l => l.vocab);
const headLa = v => { let s = v.la; const i = s.indexOf(" ("); if (i >= 0) s = s.slice(0, i); s = s.replace(/ (m|f|n)\.$/, ""); return s.trim(); };
const speakable = v => headLa(v).replace(/\//g, " ").replace(/–/g, " ");
const hasStem = v => v.pos === "Verb" && v.forms.includes(",");
// Formen (Genitiv/Stammformen): "show" = immer sichtbar, "reveal" = erst beim Aufdecken, "hide" = ausgeblendet.
// "Formen mitlernen": Formen gehören zur Antwort -> vorne versteckt, werden extra abgefragt.
const realForms = v => !!v.forms && !v.forms.startsWith("(") && !/Frage/.test(v.forms);
const fMode = () => P.s.forms || "show";
const fFront = v => (fMode() === "show" && !P.s.learnForms) ? v.forms : "";
const fBack = v => (P.s.learnForms || fMode() !== "hide") ? v.forms : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = () => Math.random() < 0.5;

// ---------- Speicher ----------
const KEY = "mir-progress-v1";
const DEFAULTS = { items: {}, days: {}, tests: [], highscores: {}, starred: [],
  s: { typing: false, tolerant: true, goal: 30, from: 1, to: 5, pos: "Alle", dir: "laDe", count: 20, onboarded: false, sound: true,
       forms: "show", learnForms: false, theme: "system", zoom: 1, rate: 0.85, autoSpeak: false, lastVersion: "", nagAt: 0 } };
const KEY_BAK = KEY + "-bak", SCHEMA = 2;
const num = (x, d = 0) => (typeof x === "number" && isFinite(x) ? x : d);
// Prüft und bereinigt gespeicherte oder importierte Daten (nie blind vertrauen).
function sanitize(d) {
  const o = structuredClone(DEFAULTS); let fixed = 0;
  if (!d || typeof d !== "object") return { P: o, fixed: 0, ok: false };
  if (d.s && typeof d.s === "object") for (const k of Object.keys(DEFAULTS.s)) if (typeof d.s[k] === typeof DEFAULTS.s[k]) o.s[k] = d.s[k]; else if (k in d.s) fixed++;
  o.s.goal = Math.min(200, Math.max(10, Math.round(num(o.s.goal, 30))));
  if (!["show", "reveal", "hide"].includes(o.s.forms)) o.s.forms = "show";
  if (d.items && typeof d.items === "object") for (const [id, it] of Object.entries(d.items)) {
    if (!it || typeof it !== "object") { fixed++; continue; }
    const x = { box: Math.min(5, Math.max(0, Math.round(num(it.box)))), right: Math.max(0, Math.round(num(it.right))), wrong: Math.max(0, Math.round(num(it.wrong))) };
    if (num(it.lastSeen)) x.lastSeen = it.lastSeen; if (num(it.lastWrong)) x.lastWrong = it.lastWrong;
    if (x.box && !x.lastSeen) x.lastSeen = Date.now();
    if (x.box !== it.box || x.right !== it.right || x.wrong !== it.wrong) fixed++;
    o.items[id] = x;
  }
  if (d.days && typeof d.days === "object") for (const [k, n] of Object.entries(d.days)) { if (/^\d{4}-\d\d-\d\d$/.test(k) && num(n) > 0) o.days[k] = Math.round(n); else fixed++; }
  if (Array.isArray(d.tests)) o.tests = d.tests.filter(t => t && typeof t === "object" && num(t.total) > 0 && num(t.date));
  if (d.highscores && typeof d.highscores === "object") for (const [k, n] of Object.entries(d.highscores)) if (num(n) > 0) o.highscores[k] = n;
  if (Array.isArray(d.starred)) o.starred = [...new Set(d.starred.filter(x => typeof x === "string"))];
  o.lastBackup = num(d.lastBackup); o.v = SCHEMA;
  return { P: o, fixed, ok: true };
}
// Führt zwei Stände zusammen (jeweils das Bessere / Neuere gewinnt).
function mergeData(a, b) {
  const o = structuredClone(a);
  for (const [id, it] of Object.entries(b.items)) { const c = o.items[id]; if (!c || num(it.lastSeen) > num(c.lastSeen)) o.items[id] = { ...it, right: Math.max(it.right, c ? c.right : 0), wrong: Math.max(it.wrong, c ? c.wrong : 0) }; else { c.right = Math.max(c.right, it.right); c.wrong = Math.max(c.wrong, it.wrong); } }
  for (const [k, n] of Object.entries(b.days)) o.days[k] = Math.max(o.days[k] || 0, n);
  const seen = new Set(o.tests.map(t => t.date)); b.tests.forEach(t => { if (!seen.has(t.date)) o.tests.push(t); }); o.tests.sort((x, y) => y.date - x.date);
  for (const [k, n] of Object.entries(b.highscores)) o.highscores[k] = Math.max(o.highscores[k] || 0, n);
  o.starred = [...new Set([...o.starred, ...b.starred])]; o.lastBackup = Math.max(o.lastBackup || 0, b.lastBackup || 0);
  return o;
}
let P, loadInfo = { fixed: 0, recovered: false, corrupt: false };
function loadStored() {
  for (const [key, rec] of [[KEY, false], [KEY_BAK, true]]) {
    let raw = null; try { raw = localStorage.getItem(key); } catch (e) {}
    if (!raw) continue;
    try { const r = sanitize(JSON.parse(raw)); if (r.ok) { loadInfo = { fixed: r.fixed, recovered: rec, corrupt: false }; return r.P; } } catch (e) {}
    loadInfo.corrupt = true;
  }
  return structuredClone(DEFAULTS);
}
P = loadStored();
let saveFailed = false, lastSaved = 0, lastBakDay = "";
function save() {
  try {
    P.v = SCHEMA; const txt = JSON.stringify(P);
    const today = dayKey(new Date());
    if (lastBakDay !== today) { // einmal pro Tag den letzten guten Stand als Sicherheitskopie behalten
      lastBakDay = today; const prev = localStorage.getItem(KEY); if (prev && prev.length > 20) localStorage.setItem(KEY_BAK, prev);
    }
    localStorage.setItem(KEY, txt); lastSaved = Date.now();
    if (saveFailed) { saveFailed = false; toast("Speichern funktioniert wieder ✅"); }
    return true;
  } catch (e) {
    if (!saveFailed) { saveFailed = true; toast("⚠️ Fortschritt konnte nicht gespeichert werden! Bitte unter Einstellungen → Backup sichern.", null, 6000); }
    return false;
  }
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
window.addEventListener("pagehide", () => save());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") save(); });
// Zweites Fenster/Tab: Änderungen übernehmen statt überschreiben
window.addEventListener("storage", e => { if (e.key === KEY && e.newValue) { try { const r = sanitize(JSON.parse(e.newValue)); if (r.ok) { P = r.P; drawTabs(); render(); } } catch (x) {} } });

const dayKey = d => { const z = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); };
const INTERVAL = { 1: 0, 2: 1, 3: 3, 4: 7, 5: 14 };
const st = v => P.items[v.id] || { box: 0, right: 0, wrong: 0 };
const box = v => st(v).box || 0;
function countActivity() {
  const k = dayKey(new Date()), before = P.days[k] || 0; P.days[k] = before + 1; save(); updateBadge();
  if (before + 1 === P.s.goal) toast("Tagesziel erreicht! 🎉 " + P.s.goal + " Fragen", null, 3500);
}
function record(v, ok) {
  const s = Object.assign({ box: 0, right: 0, wrong: 0 }, P.items[v.id]);
  const due = !s.box || !s.lastSeen || Date.now() - s.lastSeen >= INTERVAL[s.box] * 864e5 - 36e5;
  if (ok) { s.right++; if (due) { s.box = Math.min(Math.max(s.box, 1) + 1, 5); s.lastSeen = Date.now(); } } else { s.wrong++; s.box = 1; s.lastSeen = s.lastWrong = Date.now(); }
  P.items[v.id] = s; countActivity();
}
const isDue = v => { const s = st(v); if (!s.box || !s.lastSeen) return false; return Date.now() - s.lastSeen >= INTERVAL[s.box] * 864e5 - 36e5; };
const dueCount = () => ALL.filter(isDue).length;
const dueItems = () => [...shuffle(ALL.filter(isDue)), ...ALL.filter(v => !box(v)).slice(0, 10)].slice(0, 40);
const mistakes = items => items.filter(v => { const s = st(v); return s.wrong > 0 && s.box <= 2; });
const mastered = items => items.length ? items.filter(v => box(v) >= 4).length / items.length : 0;

    return push(title, el => flashView(el, it, cfg.dir)); }
  if (m === "tables") return push(title, el => tablesView(el, lessonsIn(cfg.from, cfg.to)));
  if (m === "exam") return push("Schularbeit", el => examSetup(el, cfg));
  if (m === "aform") return push(title, anhangFormen);
  const ls = lessonsIn(cfg.from, cfg.to); let qs;
  switch (m) {
    case "mc": qs = withForms(limited(cfg, shuffle(pool)).map(v => qVocab(v, pool, cfg.dir)), pool); break;
    case "tf": qs = limited(cfg, shuffle(pool)).map(v => qTrueFalse(v, pool)); break;
    case "listen": qs = withForms(limited(cfg, shuffle(pool)).map(v => qListen(v, pool)), pool); break;
    case "forms": qs = limited(cfg, shuffle(pool).map(v => qForms(v, pool)).filter(Boolean)); break;
    case "blitz": qs = [...shuffle(pool), ...shuffle(pool)].slice(0, 200).map(v => qVocab(v, pool, cfg.dir)); break;
    case "stem": qs = limited(cfg, shuffle(pool).map(v => qStem(v, pool)).filter(Boolean)); break;
    case "foreign": qs = limited(cfg, shuffle(pool).map(v => qForeign(v, pool)).filter(Boolean)); break;
    case "fid": qs = limited(cfg, shuffle(qIdentify(ls))); break;
    case "fbuild": qs = limited(cfg, shuffle(qBuild(ls))); break;
    case "stembook": { const lo = Math.min(cfg.from, cfg.to), hi = Math.max(cfg.from, cfg.to), sp = ANHANG.stems.filter(x => x.lesson >= lo && x.lesson <= hi);
      qs = limited(cfg, shuffle(sp).map(x => { const q = qStemBook(x, sp.length >= 4 ? sp : ANHANG.stems); const v = stemItem(x); if (v) { q.item = v; q.onlyWrong = true; } return q; })); break; }
    case "affix": qs = limited(cfg, shuffle(qAffix())); break;
    case "figure": qs = limited(cfg, shuffle(qFigure())); break;
    case "proverb": qs = limited(cfg, shuffle(ANHANG.proverbs).map(qProverb)); break;
  }
  if (!qs || !qs.length) return empty("In diesem Bereich gibt es dafür keine passenden Inhalte.");
  push(title, el => quizView(el, qs, { time: m === "blitz" ? 60 : 0, auto: m === "blitz", speak: m === "listen", hs: m === "blitz" ? "blitz-" + cfg.from + "-" + cfg.to : null }));
}

// ---------- Quiz ----------
function quizView(el, questions, o) {
  let deck = questions, i = 0, chosen = null, answered = [], left = o.time || 0, done = false, retry = false, timer = null, rec = false;
  const correct = () => answered.filter(a => a.ok).length;
  if (o.time) timer = setInterval(() => { if (done) return clearInterval(timer); if (!el.isConnected) return; left--; if (left <= 0) finish(); else { const t = el.querySelector("#tleft"); if (t) t.textContent = left + " s"; } }, 1000);
  el.cleanup = () => clearInterval(timer);
  function draw() {
    if (done || i >= deck.length) return result();
    const q = deck[i];
    el.innerHTML = `<div class="qhead"><span>${o.time ? `⏱ <b id="tleft">${left} s</b>` : `Frage ${i + 1} / ${deck.length}`}</span><span style="color:var(--green)">✔ ${correct()}</span></div>
      <div class="card">${q.cat ? `<div class="cat">${esc(q.cat.toUpperCase())}</div>` : ""}
      <div class="prompt ${q.prompt.length > 40 ? "long" : ""}">${esc(q.prompt)}</div>
      ${q.hint ? `<div class="hint">${esc(q.hint)}</div>` : ""}
      ${q.speak ? `<div style="margin-top:10px"><button class="btn" id="say">🔊 Anhören</button></div>` : ""}
      ${chosen !== null && q.expl ? `<div class="expl">${esc(q.expl)}</div>` : ""}</div>
      <div class="opts">${q.options.map((t, k) => `<button class="opt ${chosen === null ? "" : k === q.correct ? "right" : k === chosen ? "wrong" : "dim"}" data-k="${k}" ${chosen !== null ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>
      ${chosen !== null && !o.auto ? `<button class="btn primary full" id="next" style="margin-top:14px">${i + 1 < deck.length ? "Weiter" : "Fertig"}</button>` : ""}`;
    const say = el.querySelector("#say"); if (say) say.onclick = () => speakLatin(q.speak);
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
    const nx = el.querySelector("#next"); if (nx) nx.onclick = next;
  }
  function pick(k) {
    if (chosen !== null) return; const q = deck[i]; chosen = k; const ok = k === q.correct; buzz(ok);
    answered.push({ q, k, ok }); if (q.item) { if (q.onlyWrong && ok) countActivity(); else record(q.item, ok); } else countActivity();
    draw(); if (o.auto) setTimeout(next, ok ? 350 : 900);
  }
  function next() { if (done) return; chosen = null; i++; if (i >= deck.length) finish(); else { draw(); autoSay(); } }
  function autoSay() { const q = deck[i]; if ((o.speak || P.s.autoSpeak) && q && q.speak) setTimeout(() => { if (!done && el.isConnected) speakLatin(q.speak); }, 300); }
  function finish() {
    if (done) return; done = true; clearInterval(timer);
    if (o.hs && !retry && correct() > (P.highscores[o.hs] || 0)) { P.highscores[o.hs] = correct(); rec = true; save(); }
    if (o.exam && !retry) { const t = deck.length; P.tests.unshift({ date: Date.now(), range: o.exam, correct: correct(), total: t, grade: grade(correct(), t) }); save(); }
    result();
  }
  function result() {
    const total = o.exam ? deck.length : answered.length, g = grade(correct(), total), wrong = answered.filter(a => !a.ok);
    el.innerHTML = `<div class="card"><div style="font-size:50px">${o.exam ? "🎓" : "🏅"}</div><h2 style="margin:6px 0">${correct()} von ${total} richtig</h2>
      ${o.exam ? `<div class="hl">Note: ${g} – ${GRADE[g]}</div>` : ""}${rec ? `<div class="hl">🏆 Neuer Rekord!</div>` : ""}</div>
      ${wrong.length ? `<div class="ghead" style="margin-top:20px">Fehler (${wrong.length})</div><div class="group">${wrong.map(a => `<div class="row"><div class="grow">
        <div class="hl">${esc(a.q.prompt === "🔊" ? a.q.expl : a.q.prompt)}</div>${a.q.hint && a.q.prompt !== "🔊" ? `<div class="sub">${esc(a.q.hint)}</div>` : ""}
        <div style="color:var(--green)">Richtig: ${esc(a.q.options[a.q.correct])}</div><div class="sub" style="color:var(--red)">Deine Antwort: ${esc(a.q.options[a.k])}</div></div></div>`).join("")}</div>
        <button class="btn primary full" id="retry">Fehler nochmal üben</button>` : ""}
      <button class="btn full" id="fin" style="margin-top:10px">Fertig</button>`;
    const r = el.querySelector("#retry"); if (r) r.onclick = () => { deck = shuffle(wrong.map(a => a.q)); i = 0; chosen = null; answered = []; done = false; retry = true; rec = false; if (o.time && !o.exam) { left = o.time; timer = setInterval(() => { if (done) return clearInterval(timer); if (!el.isConnected) return; left--; if (left <= 0) finish(); else { const t = el.querySelector("#tleft"); if (t) t.textContent = left + " s"; } }, 1000); } else { o = Object.assign({}, o, { time: 0 }); } draw(); autoSay(); };
    el.querySelector("#fin").onclick = pop;
  }
  draw(); autoSay();
}

// ---------- Karteikarten ----------
// Falsch beantwortete Karten kommen nur EINMAL später wieder (nach ca. 8 Karten); nur die erste Antwort zählt fürs Lernfach.
function flashView(el, items, dir) {
  el.classList.add("noxo");
  let queue = shuffle(items).sort((a, b) => box(a) - box(b)), revealed = false, d = resolveDir(dir), busy = false, fresh = true;
  const first = new Map(), requeued = new Set();
  const knew = () => [...first.values()].filter(Boolean).length;
  function result() {
    const missed = items.filter(c => first.get(c.id) === false);
    el.innerHTML = `<div class="card" style="margin-top:20px"><div style="font-size:50px">${missed.length ? "💪" : "✅"}</div><h2 style="margin:6px 0">Geschafft!</h2><p>${knew()} von ${first.size} gleich gewusst</p></div>
      ${missed.length ? `<div class="ghead" style="margin-top:20px">Noch nicht sicher (${missed.length})</div><div class="group">${missed.map(c => `<div class="row"><div class="grow"><div class="hl">${esc(c.la)}</div><div class="sub">${esc(c.de)}</div></div></div>`).join("")}</div>
      <button class="btn primary full" id="again">Diese ${missed.length} nochmal üben</button>` : ""}
      <button class="btn full" id="fin" style="margin-top:10px">Fertig</button>`;
    el.querySelector("#fin").onclick = pop;
    const ag = el.querySelector("#again");
    if (ag) ag.onclick = () => { items = missed; queue = shuffle(missed); first.clear(); requeued.clear(); revealed = false; fresh = true; window.scrollTo(0, 0); draw(); autoSay(); };
  }
  function draw() {
    const c = queue[0];
    if (!c) return result();
    const front = d === "laDe", retry = first.has(c.id), enter = fresh; fresh = false;
    el.innerHTML = `<div class="sub center" style="margin-bottom:10px">Noch ${queue.length} Karten · wische → gewusst, ← nicht gewusst</div>
      <div class="card flash ${enter ? "enter" : ""}" id="fc" style="min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:10px">
        <div class="tint" id="tint"></div>
        ${retry ? `<div class="tiny" style="color:var(--orange);font-weight:700">↺ WIEDERHOLUNG</div>` : ""}
        <div class="prompt">${esc(front ? c.la : c.de)}</div>${front && fFront(c) ? `<div class="sub">${esc(c.forms)}</div>` : ""}
        ${revealed ? `<hr style="border:0;border-top:.5px solid var(--line);width:100%"><div style="font-size:22px">${esc(front ? c.de : c.la)}</div>${front && !fFront(c) && fBack(c) ? `<div class="sub" style="font-size:19px;color:var(--text)">${esc(c.forms)}</div>` : ""}${!front && fBack(c) ? `<div class="sub">${esc(c.forms)}</div>` : ""}${c.note ? `<div class="expl">${esc(c.note)}</div>` : ""}` : `<div class="tiny">${P.s.learnForms && front && realForms(c) ? "Bedeutung und Formen überlegen, dann aufdecken" : "Tippen zum Aufdecken"}</div>`}
        <div><button class="btn" id="say">🔊</button> <button class="btn" id="star" style="color:var(--orange)">${isStar(c) ? "★" : "☆"}</button></div>
        <div class="tiny">Lektion ${c.lesson} · Box ${box(c)}</div></div>
      ${revealed ? `<div class="btns"><button class="btn red" id="no">✗ Nicht gewusst</button><button class="btn green" id="yes">✓ Gewusst</button></div>` : `<button class="btn primary full" id="rev" style="margin-top:14px">Aufdecken</button>`}`;
    const fc = el.querySelector("#fc"), tint = el.querySelector("#tint");
    let sx = 0, sy = 0, dx = 0, lock = null, raf = 0, moved = false;
    fc.onclick = e => { if (moved) { moved = false; return; } if (e.target.closest("button")) return; if (!revealed) { revealed = true; draw(); } };
    el.querySelector("#say").onclick = () => speakLatin(speakable(c));
    el.querySelector("#star").onclick = () => { toggleStar(c); draw(); };
    const rv = el.querySelector("#rev"); if (rv) rv.onclick = () => { revealed = true; draw(); };
    const y = el.querySelector("#yes"); if (y) { y.onclick = () => fly(true); el.querySelector("#no").onclick = () => fly(false); }
    const paint = () => { raf = 0; fc.style.transform = `translate3d(${dx}px,0,0) rotate(${dx / 22}deg)`; tint.className = "tint " + (dx > 0 ? "yes" : "no"); tint.style.opacity = Math.min(1, Math.abs(dx) / 140); };
    function snapBack() { dx = 0; fc.style.transition = "transform .22s cubic-bezier(.2,.8,.2,1)"; fc.style.transform = ""; tint.style.transition = "opacity .2s"; tint.style.opacity = 0; }
    function fly(ok) {
      if (busy) return; busy = true; if (raf) { cancelAnimationFrame(raf); raf = 0; }
      const off = (ok ? 1 : -1) * Math.round(innerWidth);
      fc.style.transition = "transform .2s ease-in, opacity .2s"; fc.style.transform = `translate3d(${off}px,0,0) rotate(${ok ? 18 : -18}deg)`; fc.style.opacity = 0;
      tint.className = "tint " + (ok ? "yes" : "no"); tint.style.opacity = 1;
      setTimeout(() => ans(ok), 190);
    }
    fc.addEventListener("touchstart", e => { if (busy || e.touches.length !== 1) return; sx = e.touches[0].clientX; sy = e.touches[0].clientY; lock = null; dx = 0; moved = false; fc.style.transition = "none"; tint.style.transition = "none"; }, { passive: true });
    fc.addEventListener("touchmove", e => {
      if (!revealed || busy) return;
      const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
      if (!lock) { if (Math.abs(mx) < 8 && Math.abs(my) < 8) return; lock = Math.abs(mx) > Math.abs(my) ? "x" : "y"; }
      if (lock !== "x") return;
      moved = true; if (e.cancelable) e.preventDefault(); dx = mx; if (!raf) raf = requestAnimationFrame(paint);
    }, { passive: false });
    fc.addEventListener("touchend", () => { if (lock !== "x") { lock = null; return; } lock = null; if (raf) { cancelAnimationFrame(raf); raf = 0; } Math.abs(dx) > 90 ? fly(dx > 0) : snapBack(); });
    fc.addEventListener("touchcancel", () => { if (lock === "x") { lock = null; if (raf) { cancelAnimationFrame(raf); raf = 0; } snapBack(); } });
  }
  function autoSay() { if (P.s.autoSpeak && queue[0] && d === "laDe") setTimeout(() => { if (el.isConnected) speakLatin(speakable(queue[0])); }, 250); }
  function ans(ok) {
    const c = queue.shift(); buzz(ok);
    if (!first.has(c.id)) { first.set(c.id, ok); record(c, ok); }
    if (!ok && !requeued.has(c.id)) { requeued.add(c.id); queue.splice(Math.min(8, queue.length), 0, c); }
    revealed = false; busy = false; fresh = true; d = resolveDir(dir); draw(); autoSay();
  }
  draw(); autoSay();
}

// ---------- Eintippen ----------
function typingView(el, items, dir) {
  let queue = shuffle(items), res = null, d = resolveDir(dir), last = "";
  const first = new Map(), requeued = new Set();
  const right = () => [...first.values()].filter(Boolean).length;
  function draw() {
    const v = queue[0];
    if (!v) { el.innerHTML = `<div class="card" style="margin-top:20px"><div style="font-size:50px">⌨️</div><h2>${right()} von ${first.size} gleich richtig</h2><button class="btn primary" id="fin">Fertig</button></div>`; el.querySelector("#fin").onclick = pop; return; }
    el.innerHTML = `<div class="sub center" style="margin-bottom:10px">Noch ${queue.length} · ${right()}/${first.size} richtig${first.has(v.id) ? ' · <span style="color:var(--orange)">↺ Wiederholung</span>' : ""}</div>
      <div class="card"><div class="prompt">${esc(d === "laDe" ? v.la : v.de)}</div>${d === "laDe" && fFront(v) ? `<div class="sub">${esc(v.forms)}</div>` : ""}
      <div class="tiny" style="margin-top:6px">${d === "laDe" ? "Deutsche Bedeutung eintippen" : "Lateinisches Wort eintippen"}</div></div>
      <form id="f" style="margin-top:14px"><input type="text" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort" ${res !== null ? "disabled" : ""} value="${esc(last)}"></form>
      ${res !== null ? `<div class="card" style="margin-top:12px"><div class="hl" style="color:var(${res ? "--green" : "--red"})">${res ? "Richtig! ✅" : "Leider falsch ❌"}</div><div>${esc(v.la)} = ${esc(v.de)}</div>${fBack(v) ? `<div class="sub">${esc(v.forms)}</div>` : ""}</div>
        <div class="btns">${res ? "" : `<button class="btn" id="ovr">Doch gewusst</button>`}<button class="btn primary" id="nx">Weiter</button></div>`
        : `<div class="btns"><button class="btn" id="idk">Weiß nicht</button><button class="btn primary" id="chk">Prüfen</button></div>`}`;
    const inp = el.querySelector("#inp");
    el.querySelector("#f").onsubmit = e => { e.preventDefault(); res === null ? check() : next(); };
    if (res === null) { setTimeout(() => inp.focus(), 50); el.querySelector("#chk").onclick = check; el.querySelector("#idk").onclick = () => { inp.value = ""; check(); }; }
    else { el.querySelector("#nx").onclick = next; const o = el.querySelector("#ovr"); if (o) o.onclick = () => { if (!requeued.has(v.id)) { first.set(v.id, true); record(v, true); } res = true; draw(); }; }
  }
  // Nur die erste Antwort zählt fürs Lernfach; falsche Wörter kommen einmal später wieder
  function check() { const v = queue[0], val = el.querySelector("#inp").value; last = val; res = checkAnswer(val, d === "laDe" ? v.de : headLa(v)); buzz(res); if (!first.has(v.id)) { first.set(v.id, res); record(v, res); } draw(); }
  function next() { const v = queue.shift(); if (res === false && !requeued.has(v.id)) { requeued.add(v.id); queue.splice(Math.min(8, queue.length), 0, v); } res = null; last = ""; d = resolveDir(dir); draw(); }
  draw();
}

// ---------- Zuordnen ----------
function matchView(el, items) {
  let remaining = shuffle(items), round = [], L = [], R = [], sel = null, mistakesSet = new Set(), sec = 0, done = false;
  const timer = setInterval(() => { if (done) return clearInterval(timer); if (!el.isConnected) return; sec++; const t = el.querySelector("#sec"); if (t) t.textContent = sec + " s"; }, 1000);
  el.cleanup = () => clearInterval(timer);
  function nextRound() { const used = new Set(), rest = []; round = [];
    for (const v of remaining) { if (round.length < 6 && !used.has(v.de)) { used.add(v.de); round.push(v); } else rest.push(v); }
    remaining = rest; if (!round.length) { done = true; return draw(); } L = shuffle(round); R = shuffle(round); draw(); }
  function draw() {
    if (done) { el.innerHTML = `<div class="card" style="margin-top:20px"><div style="font-size:50px">🧩</div><h2>Alle Paare gefunden!</h2><p>Zeit: ${sec} s · Fehler: ${mistakesSet.size}</p><button class="btn primary" id="fin">Fertig</button></div>`; el.querySelector("#fin").onclick = pop; return; }
    el.innerHTML = `<div class="qhead"><span>⏱ <b id="sec">${sec} s</b></span><span>Noch ${remaining.length + round.length} Paare</span></div>
      <div class="mgrid"><div style="display:flex;flex-direction:column;gap:8px">${L.map(v => `<button class="tile ${round.includes(v) ? "" : "gone"} ${sel === v ? "sel" : ""}" data-l="${esc(v.id)}">${esc(v.la)}</button>`).join("")}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${R.map(v => `<button class="tile ${round.includes(v) ? "" : "gone"}" data-r="${esc(v.id)}">${esc(v.de)}</button>`).join("")}</div></div>`;
    el.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { sel = round.find(v => v.id === b.dataset.l); draw(); });
    el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
      if (!sel) return; const v = round.find(x => x.id === b.dataset.r);
      if (v === sel) { buzz(true); record(v, !mistakesSet.has(v.id)); round = round.filter(x => x !== v); sel = null; if (!round.length) nextRound(); else draw(); }
      else { buzz(false); mistakesSet.add(sel.id); b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 400); }
    });
  }
  nextRound();
}

// ---------- Tabellen ----------
function tablesView(el, lessons) {
  const tabs = []; for (const l of lessons) for (const s of l.grammar) for (const b of s.blocks) if (b.type === "table") tabs.push({ t: (typeof l.number === "number" ? "L" + l.number + ": " : "") + s.title, b });
  el.innerHTML = tabs.length ? `<div class="group">${tabs.map((x, k) => `<div class="row link" data-k="${k}"><div class="grow"><div class="hl">${esc(x.t)}</div><div class="sub">${esc((x.b.headers || []).filter(Boolean).join(" · "))}</div></div></div>`).join("")}</div>` : `<p>Keine Tabellen in diesem Bereich.</p>`;
  el.querySelectorAll("[data-k]").forEach(r => r.onclick = () => { const x = tabs[+r.dataset.k]; push(x.t, e => hiddenTable(e, x.b)); });
}
function hiddenTable(el, b) {
  const shown = new Set();
  function draw() {
    el.innerHTML = `<p class="sub">Tippe auf ein Feld, um es aufzudecken. Sag die Form vorher laut!</p>
      <div class="tblwrap"><table><tr>${(b.headers || []).map(h => `<th>${esc(h)}</th>`).join("")}</tr>
      ${(b.rows || []).map((r, ri) => `<tr>${r.map((c, ci) => ci === 0 || shown.has(ri + "-" + ci) ? `<td>${esc(c)}</td>` : `<td><button class="hidecell" data-c="${ri}-${ci}">?</button></td>`).join("")}</tr>`).join("")}</table></div>
      <div class="btns"><button class="btn" id="all">Alle aufdecken</button><button class="btn" id="hide">Neu verdecken</button></div>`;
    el.querySelectorAll("[data-c]").forEach(x => x.onclick = () => { shown.add(x.dataset.c); countActivity(); draw(); });
    el.querySelector("#all").onclick = () => { (b.rows || []).forEach((r, ri) => r.forEach((_, ci) => shown.add(ri + "-" + ci))); draw(); };
    el.querySelector("#hide").onclick = () => { shown.clear(); draw(); };
  }
  draw();
}

// ---------- Schularbeit ----------
function examSetup(el, cfg) {
  let n = 20, min = 0;
  function draw() {
    el.innerHTML = `<div class="group"><div class="row"><div>Ein gemischter Test aus Vokabeln (beide Richtungen), Richtig/Falsch, Stammformen und Formen aus den Grammatik-Tabellen von <b>${rangeLabel(cfg)}</b>.</div></div></div>
      <div class="ghead">Fragen</div><div class="seg">${[10, 20, 30, 50].map(x => `<button data-n="${x}" class="${x === n ? "on" : ""}">${x}</button>`).join("")}</div>
      <div class="ghead" style="margin-top:14px">Zeitlimit</div><div class="seg">${[0, 5, 10, 20, 45].map(x => `<button data-m="${x}" class="${x === min ? "on" : ""}">${x ? x + " min" : "Aus"}</button>`).join("")}</div>
      <button class="btn primary full" id="go" style="margin-top:18px">Schularbeit starten</button>
      ${P.tests.length ? `<div class="ghead" style="margin-top:22px">Letzte Ergebnisse</div><div class="group">${P.tests.slice(0, 5).map(t => `<div class="row"><div class="grow">${esc(t.range)}</div><div class="sub">${t.correct}/${t.total} · Note ${t.grade}</div></div>`).join("")}</div>` : ""}`;
    el.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { n = +b.dataset.n; draw(); });
    el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => { min = +b.dataset.m; draw(); });
    el.querySelector("#go").onclick = () => { const qs = qExam(cfg, n); if (!qs.length) return; replace("Schularbeit", e => quizView(e, qs, { time: min * 60, exam: rangeLabel(cfg) })); };
  }
  draw();

function current() { const s = stacks[tab]; return s[s.length - 1]; }
const titleEl = document.getElementById("title");

function push(title, fn) { current().scroll = window.scrollY; stacks[tab].push({ title, fn }); render(); }

// ---------- Suchen ----------
let searchQuery = "";
const fold = x => String(x || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/ß/g, "ss");
function searchTab(el) {
  el.innerHTML = `<div class="search"><div class="field"><input type="search" id="q" placeholder="Latein oder Deutsch suchen" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"><button class="clear" id="clr" aria-label="Suche leeren" hidden>✕</button></div></div><div id="res"></div>`;
  const q = el.querySelector("#q"), res = el.querySelector("#res"), clr = el.querySelector("#clr");
  q.value = searchQuery;
  const secText = s => fold(s.blocks.map(b => [b.text || "", ...(b.items || []), ...(b.rows || []).flat()].join(" ")).join(" "));
  function run() {
    searchQuery = q.value; clr.hidden = !q.value;
    const t = fold(q.value.trim());
    const all = t.length >= 2 ? ALL.filter(v => [v.la, v.de, v.forms, v.note].some(x => fold(x).includes(t))) : [];
    // Treffer am Wortanfang zuerst
    all.sort((a, b) => (fold(b.la).startsWith(t) || fold(b.de).startsWith(t)) - (fold(a.la).startsWith(t) || fold(a.de).startsWith(t)));
    const hits = all.slice(0, 100);
    const gh = []; for (const l of LESSONS) for (const s of l.grammar) if (!t || fold(s.title).includes(t) || secText(s).includes(t)) gh.push([l, s]);
    for (const a of ANHANG.sections) for (const s of a.grammar) if (t && (fold(s.title).includes(t) || secText(s).includes(t))) gh.push([{ number: "Anhang", title: a.title }, s]);
    res.innerHTML = (hits.length ? `<div class="ghead">Vokabeln (${all.length > 100 ? "100 von " + all.length : all.length})</div><div class="group">${hits.map((v, k) => vocabRow(v, false, k, true)).join("")}</div>` : (t.length >= 2 ? `<p class="sub">Keine Vokabeln gefunden.</p>` : ""))
      + (gh.length ? `<div class="ghead">${t ? "Grammatik (" + gh.length + ")" : "Grammatik-Register"}</div><div class="group">${gh.map(([l, s], k) => `<div class="row link" data-g="${k}"><span class="pill">${typeof l.number === "number" ? "L" + l.number : "Anhang"}</span><div class="grow">${esc(s.title)}</div></div>`).join("")}</div>` : (t ? `<p class="sub">Keine Grammatik gefunden.</p>` : ""));
    bindVocabRows(res, hits);
    res.querySelectorAll("[data-g]").forEach(r => r.onclick = () => { const [l, s] = gh[+r.dataset.g]; push(lname(l), e => { e.innerHTML = grammarHTML([s]); }); });
  }
  q.oninput = run;
  q.onkeydown = e => { if (e.key === "Enter") q.blur(); };
  clr.onclick = () => { q.value = ""; run(); q.focus(); };
  run();
}

    <div class="ghead">Fällig in den nächsten Tagen</div><div class="group"><div class="bars">${fc.map(([l, n]) => `<div>${n}<span class="b" style="height:${Math.max(4, n / fmx * 80)}px"></span>${l}</div>`).join("")}</div></div>
    <div class="ghead">Letzte 12 Wochen</div><div class="group"><div class="heat">${heat}</div></div>
    <div class="ghead">Gesamt</div><div class="group">${[["Vokabeln im Buch", ALL.length], ["Schon geübt", seen], ["Sitzen (Box 4–5)", m], ["Beantwortete Fragen", totalAnswered()]].map(([a, b]) => `<div class="row"><div class="grow">${a}</div><div class="sub">${b}</div></div>`).join("")}</div>
    <div class="ghead">Fortschritt pro Lektion</div><div class="group">${LESSONS.map(l => `<div class="row" style="display:block"><div style="display:flex"><span class="grow">${l.number}. ${esc(l.title)}</span><span class="sub">${Math.round(mastered(l.vocab) * 100)} %</span></div><div class="bar" style="margin-top:4px"><i style="width:${mastered(l.vocab) * 100}%"></i></div></div>`).join("")}</div>
    ${hard.length ? `<div class="ghead">Schwierigste Wörter</div><div class="group">${hard.map(v => `<div class="row"><div class="grow"><div class="hl">${esc(v.la)}</div><div class="sub">${esc(v.de)}</div></div><span style="color:var(--red)">✗ ${st(v).wrong}</span></div>`).join("")}</div>` : ""}
    ${P.tests.length ? `<div class="ghead">Schularbeiten</div><div class="group">${P.tests.slice(0, 20).map(t => `<div class="row"><div class="grow">${esc(t.range)}<div class="sub">${new Date(t.date).toLocaleString("de-AT", { dateStyle: "medium", timeStyle: "short" })}</div></div><span>${t.correct}/${t.total}</span><b style="margin-left:10px">${t.grade}</b></div>`).join("")}</div>` : ""}
    ${Object.keys(P.highscores).length ? `<div class="ghead">Rekorde Blitzrunde</div><div class="group">${Object.entries(P.highscores).sort().map(([k, v]) => `<div class="row"><div class="grow">${k.replace("blitz-", "Lektion ").replace("-", "–")}</div><div class="sub">${v}</div></div>`).join("")}</div>` : ""}`;
}
function badgesHTML() {
  const m = ALL.filter(v => box(v) >= 4).length, ans = totalAnswered(), ls = longestStreak();
  const rng = (a, b) => lessonsIn(a, b).every(l => mastered(l.vocab) >= .8);
  const best = Math.max(0, ...Object.values(P.highscores)), bestGrade = Math.min(9, ...P.tests.map(t => t.grade));
  const B = [["🚩", "Medias in res", "Erste Frage beantwortet", ans >= 1], ["🚶", "Fleißig", "500 Fragen", ans >= 500], ["🏃", "Marathon", "2000 Fragen", ans >= 2000],
    ["🔥", "Funke", "3 Tage in Folge", ls >= 3], ["🔥", "Feuer", "7 Tage in Folge", ls >= 7], ["☀️", "Sol invictus", "30 Tage in Folge", ls >= 30],
    ["📕", "Lektion gemeistert", "Alle Vokabeln einer Lektion sitzen", LESSONS.some(l => mastered(l.vocab) >= .999)],
    ["💯", "Centurio", "100 Vokabeln sitzen", m >= 100], ["👑", "Imperator", "500 Vokabeln sitzen", m >= 500],
    ["🏛️", "Halbzeit", "Lektion 1–15 zu 80 %", rng(1, 15)], ["🌿", "Veni, vidi, vici", "Alle 30 Lektionen zu 80 %", rng(1, 30)],
    ["🎓", "Summa cum laude", "Schularbeit mit Note 1", bestGrade === 1], ["⚡", "Blitzmerker", "30 richtige in einer Blitzrunde", best >= 30]];
  return `<div class="tiny" style="padding:12px 14px 0">${B.filter(b => b[3]).length} von ${B.length} freigeschaltet</div><div class="badges">${B.map(([i, t, d, on]) => `<div class="badge ${on ? "on" : ""}"><div class="c">${i}</div><b>${t}</b><div class="tiny">${d}</div></div>`).join("")}</div>`;
}

// ---------- Einstellungen ----------
function settingsTab(el) {
  const s = P.s;
  const segBtns = (id, list, val) => `<div class="seg" id="${id}">${list.map(([k, l]) => `<button data-v="${k}" class="${String(val) === String(k) ? "on" : ""}">${l}</button>`).join("")}</div>`;
  el.innerHTML = `<div class="ghead">Darstellung</div><div class="group"><div class="row" style="display:block">
      <div class="sub">Design</div>${segBtns("theme", [["system", "Automatisch"], ["light", "Hell"], ["dark", "Dunkel"]], s.theme)}
      <div class="sub" style="margin-top:6px">Textgröße</div>${segBtns("zoom", [[0.9, "Klein"], [1, "Normal"], [1.12, "Groß"], [1.25, "Sehr groß"]], s.zoom)}</div></div>
    <div class="ghead">Aussprache</div><div class="group"><div class="row" style="display:block">
      <div class="sub">Sprechtempo</div>${segBtns("rate", [[0.65, "Langsam"], [0.85, "Normal"], [1.05, "Schnell"]], s.rate)}</div>
      <label class="row"><div class="grow">Wörter automatisch vorlesen</div><input type="checkbox" id="auto" ${s.autoSpeak ? "checked" : ""}></label>
      <div class="row link" id="test"><div class="grow">Probe anhören: „Salve, discipuli!“</div></div></div>
    <div class="gfoot">Vorlesen nutzt die italienische Stimme deines Geräts – die klingt dem Schullatein am ähnlichsten.</div>
    <div class="ghead">Formen</div><div class="group"><div class="row" style="display:block">${formsHTML()}</div></div>
    <div class="gfoot">„Formen mitlernen“: Karteikarten zeigen vorne nur das Wort. Multiple Choice und Hör-Modus fragen nach der Bedeutung noch die Formen ab. Mit „Formen lernen“ im Üben-Tab übst du nur die Formen.</div>
    <div class="ghead">Üben</div><div class="group">
      <label class="row"><div class="grow">Eintippen-Modus anzeigen</div><input type="checkbox" id="typ" ${s.typing ? "checked" : ""}></label>
      ${s.typing ? `<label class="row"><div class="grow">Tolerante Prüfung</div><input type="checkbox" id="tol" ${s.tolerant ? "checked" : ""}></label>` : ""}
      <label class="row"><div class="grow">Vibration (Android)</div><input type="checkbox" id="snd" ${s.sound ? "checked" : ""}></label></div>
    <div class="gfoot">Standardmäßig wird alles durch Antippen geübt. Tolerant: kleine Tippfehler und eine von mehreren Bedeutungen zählen als richtig.</div>
    <div class="ghead">Tagesziel</div><div class="group"><div class="row"><div class="grow">${s.goal} Fragen pro Tag</div><button class="btn" id="gm">−</button><button class="btn" id="gp">+</button></div></div>
    <div class="ghead">Auf den Home-Bildschirm</div><div class="group"><div class="row" style="display:block">
      <b>iPhone (Safari):</b> Teilen-Knopf <span class="pill">⬆︎</span> → „Zum Home-Bildschirm“.<br><b>Android (Chrome):</b> Menü ⋮ → „App installieren“ bzw. „Zum Startbildschirm hinzufügen“.<br><span class="sub">Dann startet die App im Vollbild mit eigenem Icon.</span></div></div>
    <div class="ghead">Backup</div><div class="group">
      <div class="row link" id="exp"><div class="grow">Fortschritt sichern (Text kopieren)</div></div>
      <div class="row link" id="imp"><div class="grow">Fortschritt wiederherstellen</div></div>
      <div class="row link" id="health"><div class="grow">Datenstatus &amp; Reparatur</div><div class="sub">${saveFailed ? "⚠️" : "✅"}</div></div></div>
    <div class="gfoot">Der Fortschritt wird nur in diesem Browser gespeichert. ${P.lastBackup ? "Letzte Sicherung: " + new Date(P.lastBackup).toLocaleDateString("de-AT") + "." : "Du hast noch keine Sicherung gemacht."} Sichere ihn ab und zu, z. B. in einer Notiz.</div>
    <div class="group"><div class="row link" id="reset" style="color:var(--red)"><div class="grow">Gesamten Fortschritt löschen</div></div></div>
    <div class="ghead">Über</div><div class="group">
      <div class="row"><div class="grow">Version</div><div class="sub">${APP_VERSION}</div></div>
      <div class="row link" id="news"><div class="grow">Was ist neu?</div></div>
      <div class="row link" id="upd"><div class="grow">Nach Updates suchen</div></div></div>
    <div class="sub center">Lern-App zum Lateinbuch „Medias in Res!“ (Lektion 1–30). Nur für den privaten Gebrauch.</div>`;
  el.querySelectorAll("#theme [data-v]").forEach(b => b.onclick = () => { s.theme = b.dataset.v; applyLook(); re(); });
  el.querySelectorAll("#zoom [data-v]").forEach(b => b.onclick = () => { s.zoom = +b.dataset.v; applyLook(); re(); });
  el.querySelectorAll("#rate [data-v]").forEach(b => b.onclick = () => { s.rate = +b.dataset.v; save(); speakLatin("Salve"); render(); });
  el.querySelector("#auto").onchange = e => { s.autoSpeak = e.target.checked; save(); };
  el.querySelector("#test").onclick = () => speakLatin("Salve, discipuli!");
  el.querySelector("#news").onclick = () => whatsNew(null);
  el.querySelector("#upd").onclick = checkUpdate;
  const re = () => { save(); current().scroll = window.scrollY; render(); };
  bindForms(el, re);
  el.querySelector("#typ").onchange = e => { s.typing = e.target.checked; re(); };
  const tol = el.querySelector("#tol"); if (tol) tol.onchange = e => { s.tolerant = e.target.checked; re(); };
  el.querySelector("#snd").onchange = e => { s.sound = e.target.checked; re(); };
  el.querySelector("#gm").onclick = () => { s.goal = Math.max(10, s.goal - 10); re(); };
  el.querySelector("#gp").onclick = () => { s.goal = Math.min(200, s.goal + 10); re(); };
  el.querySelector("#exp").onclick = () => push("Fortschritt sichern", e => {
    const txt = JSON.stringify(P);
    e.innerHTML = `<p class="sub">Kopiere diesen Text und bewahre ihn auf (z. B. in Notizen).</p><textarea id="t" rows="10" style="width:100%" readonly>${esc(txt)}</textarea>
      <div class="btns"><button class="btn primary" id="cp">Kopieren</button><a class="btn" id="dl" download="MediasInRes-Fortschritt.json">Als Datei</a></div><p id="m" class="sub"></p>`;
    const dl = e.querySelector("#dl");
    if (/claude/.test(location.host) || window.self !== window.top) dl.remove();
    else try { dl.href = URL.createObjectURL(new Blob([txt], { type: "application/json" })); } catch (x) {}
    const done = () => { P.lastBackup = Date.now(); save(); };
    const dl2 = e.querySelector("#dl"); if (dl2) dl2.onclick = done;
    e.querySelector("#cp").onclick = async () => { try { await navigator.clipboard.writeText(txt); done(); e.querySelector("#m").textContent = "Kopiert ✅"; } catch (x) { const t = e.querySelector("#t"); t.focus(); t.select(); done(); e.querySelector("#m").textContent = "Text ist markiert – jetzt kopieren."; } };
  });
  el.querySelector("#imp").onclick = () => push("Wiederherstellen", e => {
    e.innerHTML = `<p class="sub">Füge den gesicherten Text ein oder wähle die Datei.</p><textarea id="t" rows="8" style="width:100%"></textarea>
      <input type="file" id="f" accept=".json,application/json,text/plain" style="margin:10px 0"><button class="btn primary full" id="go">Wiederherstellen</button><p id="m" class="sub"></p>`;
    e.querySelector("#f").onchange = ev => { const f = ev.target.files[0]; if (f) f.text().then(t => e.querySelector("#t").value = t); };
    e.querySelector("#go").onclick = () => {
      const m = e.querySelector("#m"); let r;
      try { r = sanitize(JSON.parse(e.querySelector("#t").value)); if (!r.ok || !(Object.keys(r.P.items).length || Object.keys(r.P.days).length)) throw 0; }
      catch (x) { m.textContent = "Der Text konnte nicht gelesen werden – ist das wirklich ein Backup?"; return; }
      const n = Object.keys(r.P.items).length, d = Object.keys(r.P.days).length, tot = Object.values(r.P.days).reduce((a, b) => a + b, 0);
      sheet(`<h2 style="margin-top:0">Backup gefunden</h2><p class="sub">${n} geübte Wörter, ${d} Lerntage, ${tot} beantwortete Fragen.${r.fixed ? " (" + r.fixed + " fehlerhafte Einträge wurden repariert.)" : ""}</p>
        <p class="sub"><b>Zusammenführen</b> behält deinen jetzigen Stand und ergänzt das Backup (jeweils das Bessere gewinnt). <b>Ersetzen</b> überschreibt alles.</p>
        <div class="btns"><button class="btn" id="c">Abbrechen</button><button class="btn" id="mg">Zusammenführen</button><button class="btn red" id="rp">Ersetzen</button></div>`,
        (rt, close) => {
          const fin = msg => { close(); save(); m.textContent = msg; drawTabs(); };
          rt.querySelector("#c").onclick = close;
          rt.querySelector("#mg").onclick = () => { const keep = P.s; P = mergeData(P, r.P); P.s = keep; fin("Zusammengeführt ✅"); };
          rt.querySelector("#rp").onclick = () => { try { localStorage.setItem(KEY_BAK, JSON.stringify(P)); } catch (x) {} P = r.P; fin("Fortschritt wiederhergestellt ✅"); };
        });
    };
  });
  el.querySelector("#health").onclick = () => push("Datenstatus", dataHealth);
  el.querySelector("#reset").onclick = () => confirmSheet("Wirklich alles löschen?", "Dein gesamter Lernfortschritt geht verloren.", "Löschen", () => { const keep = P.s; P = structuredClone(DEFAULTS); P.s = keep; save(); render(); });
}

// ---------- Datenstatus ----------
function dataHealth(e) {
  const ids = new Set(ALL.map(v => v.id)), orphans = Object.keys(P.items).filter(id => !ids.has(id)), starOrph = P.starred.filter(id => !ids.has(id));
  let size = 0; try { size = (localStorage.getItem(KEY) || "").length; } catch (x) {}
  const bak = (() => { try { return !!localStorage.getItem(KEY_BAK); } catch (x) { return false; } })();
  const rows = [["Gespeichert", saveFailed ? "⚠️ Fehler" : (lastSaved ? "✅ " + new Date(lastSaved).toLocaleTimeString("de-AT", { timeStyle: "short" }) : "✅ bereit")],
    ["Geübte Wörter", Object.keys(P.items).length + " von " + ALL.length], ["Lerntage", Object.keys(P.days).length], ["Merkliste", P.starred.length], ["Schularbeiten", P.tests.length],
    ["Datengröße", (size / 1024).toFixed(1) + " KB"], ["Sicherheitskopie", bak ? "vorhanden" : "noch nicht"],
    ["Dauerhafter Speicher", "…"], ["Verwaiste Einträge", orphans.length + starOrph.length]];
  e.innerHTML = `<div class="group">${rows.map(([a, b], i) => `<div class="row"><div class="grow">${a}</div><div class="sub" id="r${i}">${b}</div></div>`).join("")}</div>
    <div class="btns"><button class="btn primary full" id="fix">Daten prüfen &amp; reparieren</button></div>${bak ? `<div class="btns"><button class="btn full" id="rst">Sicherheitskopie zurückspielen</button></div>` : ""}<p id="m" class="sub"></p>
    <p class="tiny">iPhone-Tipp: Als App auf dem Home-Bildschirm bleibt der Speicher stabiler als im Safari-Tab. iOS kann Daten von Webseiten, die lange nicht geöffnet wurden, löschen – darum ab und zu ein Backup machen.</p>`;
  try { navigator.storage.persisted().then(p => { e.querySelector("#r7").textContent = p ? "✅ ja" : "nicht zugesagt"; }).catch(() => {}); } catch (x) { e.querySelector("#r7").textContent = "unbekannt"; }
  e.querySelector("#fix").onclick = () => {
    const r = sanitize(P); const keep = Object.keys(P.items).length; P = mergeData(structuredClone(DEFAULTS), r.P); P.s = r.P.s; P.lastBackup = r.P.lastBackup;
    const n = r.fixed; save(); e.querySelector("#m").textContent = n ? n + " fehlerhafte Einträge repariert ✅" : "Alles in Ordnung ✅ (" + keep + " Wörter geprüft)";
  };
  const rs = e.querySelector("#rst"); if (rs) rs.onclick = () => confirmSheet("Sicherheitskopie zurückspielen?", "Dein jetziger Stand wird durch die automatische Kopie vom letzten Lerntag ersetzt.", "Zurückspielen", () => {
    try { const r = sanitize(JSON.parse(localStorage.getItem(KEY_BAK))); if (r.ok) { P = r.P; save(); e.querySelector("#m").textContent = "Zurückgespielt ✅"; drawTabs(); } } catch (x) { e.querySelector("#m").textContent = "Kopie nicht lesbar."; } });
}
function backupNag() {
  const ans = totalAnswered(), last = P.lastBackup || 0;
  if (ans >= 100 && Date.now() - last > 14 * 864e5 && Date.now() - (P.s.nagAt || 0) > 3 * 864e5) {
    P.s.nagAt = Date.now(); save();
    toast("💾 Zeit für ein Backup – tippen", () => { switchTab && switchTab("settings"); }, 6000);
  }
}

// ---------- Dialoge ----------
function sheet(html, bind) { const r = document.getElementById("modal-root"); r.innerHTML = `<div class="modal"><div class="sheet">${html}</div></div>`; bind(r, () => r.innerHTML = ""); }
function confirmSheet(t, d, ok, fn) { sheet(`<h2 style="margin-top:0">${esc(t)}</h2><p class="sub">${esc(d)}</p><div class="btns"><button class="btn" id="c">Abbrechen</button><button class="btn red" id="o">${esc(ok)}</button></div>`,
  (r, close) => { r.querySelector("#c").onclick = close; r.querySelector("#o").onclick = () => { close(); fn(); }; }); }
function toast(msg, onTap, ms) {
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  t.onclick = () => { t.remove(); if (onTap) onTap(); };
  if (ms) setTimeout(() => t.remove(), ms);
}
const verNum = v => String(v || "0").split(".").map(Number).reduce((a, x) => a * 1000 + (x || 0), 0);
function whatsNew(since) {
  const list = CHANGELOG.filter(c => !since || verNum(c.v) > verNum(since));
  sheet(`<h2 style="margin-top:0">Was ist neu? ✨</h2><div class="changes">${list.slice(0, since ? 99 : 6).map(c => `<h3>Version ${esc(c.v)}${c.date ? ` <span class="sub">· ${esc(c.date)}</span>` : ""}</h3><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`).join("")}</div>
    <button class="btn primary full" id="ok" style="margin-top:16px">Super!</button>`, (r, close) => r.querySelector("#ok").onclick = close);
}
function applyLook() {
  const r = document.documentElement;
  if (P.s.theme === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", P.s.theme);
  r.style.setProperty("--z", P.s.zoom || 1);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(r).getPropertyValue("--bg").trim() === "#000" ? "#000000" : "#7a1a20";
}
let swReg = null;
async function checkUpdate() {
  if (!swReg) { location.reload(); return; }
  toast("Suche nach Updates …", null, 1500);
  try { await swReg.update(); } catch (e) {}
  setTimeout(() => { if (!swReg.installing && !swReg.waiting) toast("Du hast die neueste Version (" + APP_VERSION + ") ✅", null, 2500); }, 1600);
}
function onboarding() {
  sheet(`<div class="center"><img src="${ICON}" alt="" style="width:84px;height:84px;border-radius:19px"><h1 style="margin:10px 0 4px">Salve! 👋</h1><p>Alles aus „Medias in Res!“ – Lektion 1 bis 30 – zum Lernen und Wiederholen.</p></div>
    ${[["📖", "Lektionen", "Vokabeln und Grammatik jeder Lektion."], ["🧠", "Üben", "Wähle z. B. Lektion 5–10: Karteikarten, Quiz, Hören, Formen oder Schularbeit."], ["📅", "Täglich wiederholen", "Die App merkt sich, was du kannst, und zeigt fällige Wörter."], ["📲", "Wie eine App", "iPhone: Teilen ⬆︎ → „Zum Home-Bildschirm“. Android: Menü ⋮ → „App installieren“."]]
      .map(([i, t, d]) => `<div style="display:flex;gap:14px;margin:14px 0"><div style="font-size:26px">${i}</div><div><b>${t}</b><div class="sub">${d}</div></div></div>`).join("")}
    <button class="btn primary full" id="go">Los geht’s – medias in res!</button>`, (r, close) => r.querySelector("#go").onclick = () => { P.s.onboarded = true; save(); close(); });
}

// ---------- Start ----------
applyLook();
render();
if (!P.s.onboarded) { onboarding(); P.s.lastVersion = APP_VERSION; save(); }
else if (P.s.lastVersion !== APP_VERSION) { const prev = P.s.lastVersion; P.s.lastVersion = APP_VERSION; save(); whatsNew(prev || "1.0.0"); }
if (loadInfo.recovered) toast("Dein Fortschritt wurde aus der Sicherheitskopie wiederhergestellt ♻️", null, 5000); else if (loadInfo.corrupt) toast("Gespeicherte Daten waren beschädigt – neu gestartet.", null, 5000);
backupNag();
try { if (speechSynthesis) speechSynthesis.getVoices(); } catch (e) {}
if ("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.host)) {
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").then(r => {
    swReg = r;
    // Beim Zurückkehren in die App nach Updates schauen
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") r.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController) { hadController = true; return; }
    toast("Neue Version verfügbar – tippen zum Aktualisieren 🔄", () => location.reload());
  });
}
</script>
</body>
</html>
